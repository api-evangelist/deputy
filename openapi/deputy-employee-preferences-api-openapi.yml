openapi: 3.2.0
info:
  title: Deputy V2 Employee Preferences API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employee Preferences
paths:
  /management/v2/employee/{id}/preferences:
    get:
      operationId: EmployeePreferencesV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePreferencesListResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Employee Preferences
      summary: List
      description: List.
components:
  schemas:
    v2modelEmployeePreferences:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Preferences ID
        key:
          type: string
          title: Preferences key
        value:
          type: string
          title: Preferences value
        createdById:
          type: string
          format: int64
          title: Preferences createdById
        createdAt:
          type: string
          format: date-time
          title: Timestamp of when the Preferences was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp of when the Preferences was last modified
      title: Employee Preferences
    EmployeePreferencesListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelEmployeePreferences'
        nextCursor:
          type: string
      title: Get list of employee preferences response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
