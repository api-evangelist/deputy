openapi: 3.2.0
info:
  title: Deputy V1 Resource Public Holiday API
  version: 1.0.0
  description: 'Generated, comprehensive reference for Deputy''s legacy V1 `/resource/{Object}` API.


    V1 is in maintenance mode — new integrations should prefer the V2 API. This spec covers the reflection-based routing pattern declared in `deputy-webapp/app/api/v1/routers/ResourceRouter.php`, enumerated over every ORM class registered in `DeputecApplication::$arrSystems` in `app/prepend.inc.php`.


    Resources support create/update/delete only if they also appear in `$arrSystemsAPIEditable` — read-only resources expose GET / QUERY / INFO / PREDICT / HISTORY only.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: PublicHoliday
  description: Operations on the PublicHoliday resource
