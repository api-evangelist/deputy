openapi: 3.2.0
info:
  title: Deputy V2 Leave Config API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Config
paths:
  /management/v2/leave-config:
    get:
      summary: Get leave config
      operationId: LeaveConfigV2Controller_GetLeaveConfig
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveConfigGetLeaveConfigResponse'
      tags:
      - Leave Config
      description: Get leave config.
    patch:
      summary: Set leave config
      operationId: LeaveConfigV2Controller_SetLeaveConfig
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveConfigSetLeaveConfigResponse'
      tags:
      - Leave Config
      description: Set leave config.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveConfigSetLeaveConfigRequest'
components:
  schemas:
    LeaveConfigSetLeaveConfigResponse:
      type: object
      properties:
        success:
          type: boolean
        config:
          $ref: '#/components/schemas/v2modelLeaveConfig'
      title: Set leave config response
    LeaveConfigSetLeaveConfigRequest:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/v2modelLeaveConfig'
        updateMask:
          type: string
          title: Fields to patch
      title: Set leave config request
    v2modelLeaveConfig:
      type: object
      properties:
        leaveManagementEnabled:
          type: boolean
        perEmployeeEntitlementsEnabled:
          type: boolean
        perEmployeeStandardDayEnabled:
          type: boolean
      title: Leave Config
    LeaveConfigGetLeaveConfigResponse:
      type: object
      properties:
        success:
          type: boolean
        config:
          $ref: '#/components/schemas/v2modelLeaveConfig'
      title: Get leaveConfig response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
