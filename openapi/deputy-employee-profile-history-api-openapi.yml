openapi: 3.2.0
info:
  title: Deputy V2 Employee Profile History API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employee Profile History
paths:
  /management/v2/employee/{employeeId}/history:
    get:
      summary: Retrieve Employee Profile History by Employee ID
      operationId: EmployeeProfileHistoryV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileHistoryGetResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Employee Profile History
      security:
      - APIToken: []
      description: Retrieve Employee Profile History by Employee ID.
components:
  schemas:
    EmployeeProfileHistoryGetResponse:
      type: object
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeProfileHistoryProfileHistoryChange'
        success:
          type: boolean
        message:
          type: string
        creators:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeProfileHistoryProfileHistoryCreator'
    EmployeeProfileHistoryProfileHistoryChange:
      type: object
      properties:
        field:
          type: string
        oldValue:
          type: string
        newValue:
          type: string
        resource:
          type: string
        resourceId:
          type: integer
          format: int32
        creatorId:
          type: integer
          format: int32
        timestamp:
          type: string
          format: int64
    EmployeeProfileHistoryProfileHistoryCreator:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
