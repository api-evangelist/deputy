openapi: 3.2.0
info:
  title: Deputy V2 Employment Condition API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employment Condition
paths:
  /management/v2/employment-conditions:
    get:
      summary: Retrieve list of employment conditions
      operationId: EmploymentConditionV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentConditionListResponse'
      tags:
      - Employment Condition
      description: Retrieve list of employment conditions.
  /management/v2/employment-conditions/{id}:
    get:
      summary: Retrieve employment condition by given Id
      operationId: EmploymentConditionV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentConditionGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Employment Condition
      description: Retrieve employment condition by given Id.
components:
  schemas:
    modelEmploymentBasis:
      type: string
      enum:
      - UNKNOWN_BASIS
      - INDIVIDUAL
      - LABOUR_HIRE
      default: UNKNOWN_BASIS
    EmploymentConditionGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelEmploymentCondition'
      title: Get employment condition response
    v2employee_contractsmodelEmploymentType:
      type: string
      enum:
      - UNKNOWN_TYPE
      - FULL_TIME
      - PART_TIME
      - CASUAL
      default: UNKNOWN_TYPE
    EmploymentConditionListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelEmploymentCondition'
      title: Get list of employment conditions response
    v2employee_contractsmodelEmploymentCategory:
      type: string
      enum:
      - UNKNOWN_CATEGORY
      - PERMANENT
      - TEMPORARY
      default: UNKNOWN_CATEGORY
    v2modelEmploymentCondition:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Employment Condition ID
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        awardLevel:
          type: string
          title: AwardLevel
        basis:
          $ref: '#/components/schemas/modelEmploymentBasis'
          title: Basis
        category:
          $ref: '#/components/schemas/v2employee_contractsmodelEmploymentCategory'
          title: Category
        period:
          type: integer
          format: int32
          title: Employment Period
        type:
          $ref: '#/components/schemas/v2employee_contractsmodelEmploymentType'
          title: Type
        probationaryPeriod:
          type: integer
          format: int32
          title: Probationary Period
        workingDaysPerPeriod:
          type: number
          format: float
          title: Working Days Per Period
        usualStartTime:
          type: string
          title: Usual Start Time
        usualFinishTime:
          type: string
          title: Usual Finish Time
        usualMealBreakTime:
          type: string
          title: Usual Meal break
        averageHoursPerDay:
          type: number
          format: float
          title: Average Hours Per Day
        minHoursPerDay:
          type: number
          format: float
          title: Minimum Hours Per Day
        minHoursForLeave:
          type: number
          format: float
          title: Minimum Hours For Leave
        createdById:
          type: integer
          format: int32
          title: Creator
        createdAt:
          type: string
          format: date-time
          title: Timestamp when this condition was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp when this condition was modified
      title: Employment Condition
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
