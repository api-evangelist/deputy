openapi: 3.2.0
info:
  title: Deputy V2 Labor Model Rule API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Labor Model Rule
paths:
  /v2/labor-model/location/{locationId}/jobs:pending:
    get:
      summary: Get pending labor model run jobs
      operationId: LaborModelV2Controller_getLaborModelPendingJobs
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborModelRunJobResponse'
      parameters:
      - name: locationId
        description: location id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Labor Model Rule
      description: Get pending labor model run jobs.
  /v2/labor-model/location/{locationId}/rules:
    get:
      summary: Get all Labor Model Rules
      operationId: LaborModelV2Controller_getLaborModelRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborModelRuleGetResponse'
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Labor Model Rule
      description: Get all Labor Model Rules.
    post:
      summary: Create a New Labor Model Rule
      operationId: LaborModelV2Controller_createLaborModelRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborModelRuleCreateResponse'
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Labor Model Rule
      description: Create a New Labor Model Rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaborModelRuleCreateRequest'
  /v2/labor-model/location/{locationId}/rules/{laborModelId}:
    delete:
      summary: Delete a Labor Model Rule
      operationId: LaborModelV2Controller_deleteLaborModelRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborModelRuleDeleteResponse'
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: laborModelId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Labor Model Rule
      description: Delete a Labor Model Rule.
    put:
      summary: Edit an Existing Labor Model Rule
      operationId: LaborModelV2Controller_editLaborModelRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborModelRuleEditResponse'
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: laborModelId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Labor Model Rule
      description: Edit an Existing Labor Model Rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaborModelRuleEditRequest'
  /v2/labor-model/location/{locationId}/rules:bulkDelete:
    post:
      summary: Bulk Delete labor model rules
      operationId: LaborModelV2Controller_deleteLaborModelRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborModelRuleBulkDeleteResponse'
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Labor Model Rule
      description: Bulk Delete labor model rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaborModelRuleBulkDeleteRequest'
  /v2/labor-model/location/{locationId}/rules:copy:
    post:
      summary: Bulk copy labor model rules from one location to many locations
      operationId: LaborModelV2Controller_copyLaborModelRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborModelRuleCopyToLocationsResponse'
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Labor Model Rule
      description: Bulk copy labor model rules from one location to many locations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaborModelRuleCopyToLocationsRequest'
  /v2/labor-model/location/{locationId}/run:
    post:
      summary: Run labor model for start and end timestamp
      operationId: LaborModelV2Controller_runLaborModel
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborModelRunResponse'
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Labor Model Rule
      description: Run labor model for start and end timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaborModelRunRequest'
components:
  schemas:
    LaborModelRunJobJobs:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/LaborModelRunJobJob'
          title: list of jobs
    LaborModelRuleEditResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelLaborModelRuleResponse'
    LaborModelRuleBulkDeleteRequest:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        laborModelIds:
          type: array
          items:
            type: integer
            format: int32
    LaborModelRunJobResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/LaborModelRunJobJobs'
    LaborModelRuleCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelLaborModelRuleResponse'
    modelLaborModelRuleResponse:
      type: object
      properties:
        id:
          type: string
        area:
          type: integer
          format: int32
        metric:
          type: string
        metricValueType:
          type: string
        metricAmount:
          type: number
          format: double
        laborAmount:
          type: integer
          format: int32
        minLabor:
          type: integer
          format: int32
        maxLabor:
          type: integer
          format: int32
        coverage:
          type: integer
          format: int32
        steps:
          type: array
          items:
            $ref: '#/components/schemas/modelStep'
        maxMetricAmount:
          type: number
          format: double
        timeframe:
          type: integer
          format: int32
        useBuffers:
          type: boolean
        buffers:
          $ref: '#/components/schemas/modelBuffer'
        subMetric:
          type: string
        task:
          $ref: '#/components/schemas/modelTaskResponse'
    modelTaskRepeat:
      type: object
      properties:
        frequency:
          type: string
        days:
          type: array
          items:
            type: string
    LaborModelRuleCreateRequest:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelLaborModelRuleRequest'
    modelBuffer:
      type: object
      properties:
        open:
          $ref: '#/components/schemas/modelBufferDetail'
        close:
          $ref: '#/components/schemas/modelBufferDetail'
    LaborModelRunResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelLaborModelResult'
    LaborModelRunJobJob:
      type: object
      properties:
        startDate:
          type: string
          title: start date param for the job format YYYY-MM-DD
        endDate:
          type: string
          title: end date param for the job format YYYY-MM-DD
        metric:
          type: string
          title: metric param for the job
    LaborModelRuleDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
    LaborModelRuleGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelLaborModelRuleResponse'
    LaborModelRuleEditRequest:
      type: object
      properties:
        laborModelId:
          type: string
        locationId:
          type: integer
          format: int32
        data:
          $ref: '#/components/schemas/modelLaborModelRuleRequest'
    LaborModelRuleCopyToLocationsResponse:
      type: object
      properties:
        success:
          type: boolean
    modelTaskRequest:
      type: object
      properties:
        taskId:
          type: integer
          format: int32
        taskGroupType:
          type: string
    modelLaborModelRuleRequest:
      type: object
      properties:
        id:
          type: string
        area:
          type: integer
          format: int32
        metric:
          type: string
        metricValueType:
          type: string
        metricAmount:
          type: number
          format: double
        laborAmount:
          type: integer
          format: int32
        minLabor:
          type: integer
          format: int32
        maxLabor:
          type: integer
          format: int32
        coverage:
          type: integer
          format: int32
        steps:
          type: array
          items:
            $ref: '#/components/schemas/modelStep'
        maxMetricAmount:
          type: number
          format: double
        timeframe:
          type: integer
          format: int32
        useBuffers:
          type: boolean
        buffers:
          $ref: '#/components/schemas/modelBuffer'
        subMetric:
          type: string
        task:
          $ref: '#/components/schemas/modelTaskRequest'
    LaborModelRunRequest:
      type: object
      properties:
        start:
          type: string
          format: int64
        end:
          type: string
          format: int64
        locationId:
          type: integer
          format: int32
    modelTaskResponse:
      type: object
      properties:
        taskId:
          type: integer
          format: int32
        taskGroupType:
          type: string
        taskGroupName:
          type: string
        start:
          type: string
        end:
          type: string
        repeat:
          $ref: '#/components/schemas/modelTaskRepeat'
        estimatedHours:
          type: integer
          format: int32
        estimatedMinutes:
          type: integer
          format: int32
    modelStaffByDay:
      type: object
      properties:
        date:
          type: string
          format: date-time
          title: Date for the day
        staffByArea:
          type: array
          items:
            $ref: '#/components/schemas/modelStaffByArea'
          title: Staff By Area
      title: Staff By Date
    modelStaffByArea:
      type: object
      properties:
        area:
          type: integer
          format: int32
          title: Area staff is added to
        hours:
          type: integer
          format: int32
          title: Number of staff hours
        minutes:
          type: integer
          format: int32
          title: Number of staff minutes
      title: Staff By Area
    LaborModelRuleBulkDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
    modelBufferDetail:
      type: object
      properties:
        hours:
          type: integer
          format: int32
        minutes:
          type: integer
          format: int32
        direction:
          type: string
    modelStep:
      type: object
      properties:
        from:
          type: number
          format: double
        to:
          type: number
          format: double
        laborAmount:
          type: integer
          format: int32
    LaborModelRuleCopyToLocationsRequest:
      type: object
      properties:
        override:
          type: boolean
        locationId:
          type: integer
          format: int32
        locations:
          type: array
          items:
            type: integer
            format: int32
        laborModelIds:
          type: array
          items:
            type: integer
            format: int32
    modelLaborModelResult:
      type: object
      properties:
        hours:
          type: integer
          format: int32
          title: Total hours across all areas
        minutes:
          type: integer
          format: int32
          title: Total minutes in addition to the hours
        start:
          type: string
          format: int64
          title: Time from which the requirements start
        end:
          type: string
          format: int64
          title: Time at which the requirements end
        staffByDay:
          type: array
          items:
            $ref: '#/components/schemas/modelStaffByDay'
          title: Breakdown of Staff requirements by day during the time-period
      title: Labor Model Result
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
