openapi: 3.2.0
info:
  title: Deputy Employees API
  version: '1.0'
  description: 'Operations tagged Employees across 2 of this provider''s published API definitions: deputy-deputy-openapi.yml, deputy-v2-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{install}.{geo}.deputy.com/api
  variables:
    install:
      default: ''
    geo:
      default: ''
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
tags:
- name: Employees
paths:
  /v1/supervise/employee:
    get:
      tags:
      - Employees
      summary: Get details for all employees
      operationId: Getdetailsforallemployees
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    post:
      tags:
      - Employees
      summary: Add an employee
      operationId: Addanemployee
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AddanemployeeRequest'
              - example:
                  strFirstName: John
                  strLastName: Doe
                  intCompanyId: 1
                  intGender: 2
                  strCountryCode: AR
                  strDob: '1971-01-01T00:00:00.000Z'
                  strStartDate: '2022-01-01T00:00:00.000Z'
                  strMobilePhone: '0441234567'
                  strPayrollId: '1234'
                  fltWeekDayRate: 30
            example:
              strFirstName: John
              strLastName: Doe
              intCompanyId: 1
              intGender: 2
              strCountryCode: AR
              strDob: '1971-01-01T00:00:00.000Z'
              strStartDate: '2022-01-01T00:00:00.000Z'
              strMobilePhone: '0441234567'
              strPayrollId: '1234'
              fltWeekDayRate: 30
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/employee/{employeeid}:
    get:
      tags:
      - Employees
      summary: Get details for a employee by id
      operationId: Getdetailsforaemployeebyid
      parameters:
      - name: employeeid
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/employee/{employeeid}/activate:
    post:
      tags:
      - Employees
      summary: Re-activate a terminated employee
      operationId: Re-activateaterminatedemployee
      parameters:
      - name: employeeid
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/employee/{employeeid}/assoc/{locationid}:
    post:
      tags:
      - Employees
      summary: Add a location against an employee
      operationId: Addalocationagainstanemployee
      parameters:
      - name: employeeid
        in: path
        description: The employee id record
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      - name: locationid
        in: path
        description: The id of the location being associated with
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AddlocationagainstemployeeRequest'
              - example:
                  intAgreementId: 1
                  blnSetPrimary: false
            example:
              intAgreementId: 1
              blnSetPrimary: false
        required: true
      responses:
        '200':
          description: The request was successfully completed and the JSON response contains the Employee object.
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/employee/{employeeid}/delete:
    post:
      tags:
      - Employees
      summary: Delete an employees account in Deputy
      operationId: DeleteanemployeesaccountinDeputy
      parameters:
      - name: employeeid
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/employee/{employeeid}/invite:
    post:
      tags:
      - Employees
      summary: Invite employee to Deputy
      operationId: InviteemployeetoDeputy
      parameters:
      - name: employeeid
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/employee/{employeeid}/setAwardFromLibrary:
    post:
      tags:
      - Employees
      summary: Set award for employee
      operationId: Setawardforemployee
      parameters:
      - name: employeeid
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/SetawardforemployeeRequest'
              - example:
                  strCountryCode: au
                  strAwardCode: casual-2021-11-01-aea-2
            example:
              strCountryCode: au
              strAwardCode: casual-2021-11-01-aea-2
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/employee/{employeeid}/terminate:
    post:
      tags:
      - Employees
      summary: Terminate an employee
      operationId: Terminateanemployee
      parameters:
      - name: employeeid
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/employee/{employeeid}/unassoc/{locationid}:
    post:
      tags:
      - Employees
      summary: Remove a location from an employee
      operationId: Removealocationfromanemployee
      parameters:
      - name: employeeid
        in: path
        description: The employee id record
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      - name: locationid
        in: path
        description: The id of the location being associated with
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/employee/{id}:
    post:
      tags:
      - Employees
      summary: Update an existing employee
      operationId: Updateanexistingemployee
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/UpdateanexistingemployeeRequest'
              - example:
                  Phone: 0212345678
            example:
              Phone: 0212345678
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /management/v2/employees:
    get:
      summary: Retrieve list of employees
      operationId: EmployeesV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesListResponse'
      parameters:
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
      - name: fieldMask
        description: Fields to fetch in the response.
        in: query
        required: false
        schema:
          type: string
      - name: externalLinkId
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Employees
      description: Retrieve list of employees.
      security:
      - ApiToken: []
    post:
      summary: Create an employee setup
      operationId: EmployeesV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesCreateResponse'
      tags:
      - Employees
      description: Create an employee setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeesCreateRequest'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /management/v2/employees/{id}:
    get:
      summary: Retrieve employee by given Id
      operationId: EmployeesV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: fieldMask
        description: Fields to fetch in the response.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Employees
      description: Retrieve employee by given Id.
      security:
      - ApiToken: []
    patch:
      summary: Patch an employee setup
      operationId: EmployeesV2Controller_patch
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesPatchResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Employees
      description: Patch an employee setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeesPatchRequest'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /management/v2/employees:bulk:
    post:
      summary: Create a bunch of employee setups
      operationId: EmployeesV2Controller_createBulk
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesCreateBulkResponse'
      tags:
      - Employees
      description: Create a bunch of employee setups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeesCreateBulkRequest'
      security:
      - ApiToken: []
    patch:
      summary: Patch an employee setup
      operationId: EmployeesV2Controller_patchBulk
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesPatchBulkResponse'
      tags:
      - Employees
      description: Patch an employee setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeesPatchBulkRequest'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /management/v2/employees:validate-emails:
    post:
      summary: Validate emails
      operationId: EmployeesV2Controller_validateEmails
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesValidateEmailsResponse'
      tags:
      - Employees
      security:
      - APIToken: []
      description: Validate emails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeesValidateEmailsRequest'
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
components:
  schemas:
    UpdateanexistingemployeeRequest:
      title: UpdateanexistingemployeeRequest
      required:
      - Phone
      type: object
      properties:
        Phone:
          type: string
    SetawardforemployeeRequest:
      title: SetawardforemployeeRequest
      required:
      - strCountryCode
      - strAwardCode
      type: object
      properties:
        strCountryCode:
          type: string
          description: Country code for the award. Can be find in the awards library list
        strAwardCode:
          type: string
          description: The award code for the library award to apply.
        arrAgreementId:
          type: array
          items:
            type: integer
            description: All record ids of employment agreements to be updated with this request. If not included all agreements for the employee will be updated.
    AddlocationagainstemployeeRequest:
      title: AddlocationagainstemployeeRequest
      type: object
      properties:
        intAgreementId:
          type: integer
          format: int32
          description: Identifier of an EmployeeAgreement to assign if it exists for the given Employee. Omit this to create a new agreement
        blnSetPrimary:
          type: boolean
          description: Sets the Employees Primary Location & Employee Workplace to that of the provided Company Id. Omit this to keep existing allocations
    AddanemployeeRequest:
      title: AddanemployeeRequest
      required:
      - strFirstName
      - strLastName
      - intCompanyId
      type: object
      properties:
        strFirstName:
          type: string
          description: First name of employee
        strLastName:
          type: string
          description: Last name of employee
        intCompanyId:
          type: integer
          format: int32
          description: Record id of location to add employee to
        intGender:
          type: integer
          format: int32
          description: 0 - Prefer not to say, 1 - Male, 2 - Female, 3 - Non-Binary
        strCountryCode:
          type: string
          description: The country code for the employees address. This can be found in country resource API
        strDob:
          type: string
        strStartDate:
          type: string
          description: Employee start date. YYYY-MM-DD
        strMobilePhone:
          type: string
          description: Employee mobile phone number
        strPayrollId:
          type: string
          description: Payroll id to set for the employee
        fltWeekDayRate:
          type: integer
          format: int32
    rpcLocalizedMessage:
      type: object
      properties:
        locale:
          type: string
          title: 'The locale used following the specification defined at

            https://www.rfc-editor.org/rfc/bcp/bcp47.txt.

            Examples are: "en-US", "fr-CH", "es-MX"'
        message:
          type: string
          description: The localized error message in the above locale.
      description: 'Provides a localized error message that is safe to return to the user

        which can be attached to an RPC error.'
    modelWorkplaceLocationOptions:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Location Id of employee
        name:
          type: string
          title: Location of employee
      title: LocationOptions is a wrapper to implement optional oneof
    tenantemployeev2modelContact:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: '[read-only] Contact Id'
        phone1:
          type: string
          title: Phone Number
        phone2:
          type: string
          title: Phone Number
        phone3:
          type: string
          title: Phone Number
        fax:
          type: string
          title: Fax Number
        phone1Type:
          type: string
          title: Phone Number Type
        phone2Type:
          type: string
          title: Phone Number Type
        phone3Type:
          type: string
          title: Phone Number Type
        primaryPhone:
          type: string
          format: int64
          title: Set if the phone details is primary
        email1:
          type: string
          title: Email Address
        email1Type:
          type: string
          title: Email Address
        email2Type:
          type: string
          title: Email Address
        email2:
          type: string
          title: Email Address
        primaryEmail:
          type: string
          format: int64
          title: Set if the email is primary
        im1:
          type: string
          title: Instant messenger ID
        im2:
          type: string
          title: Instant messenger ID
        im1Type:
          type: string
          title: Instant messenger ID
        im2Type:
          type: string
          title: Instant messenger ID
        web:
          type: string
          title: Website
        notes:
          type: string
          title: Notes
        saved:
          type: boolean
          title: Set if it is saved
        createdAt:
          type: string
          format: date-time
          title: '[read-only] Timestamp when the contact was created'
        modifiedAt:
          type: string
          format: date-time
          title: '[read-only] Timestamp when the contact was modified'
      title: Employee Contact
    rpcResourceInfo:
      type: object
      properties:
        resourceType:
          type: string
          description: 'A name for the type of resource being accessed, e.g. "sql table",

            "cloud storage bucket", "file", "Google calendar"; or the type URL

            of the resource: e.g. "type.googleapis.com/google.pubsub.v1.Topic".'
        resourceName:
          type: string
          description: 'The name of the resource being accessed.  For example, a shared calendar

            name: "example.com_4fghdhgsrgh@group.calendar.google.com", if the current

            error is

            [google.rpc.Code.PERMISSION_DENIED][google.rpc.Code.PERMISSION_DENIED].'
        owner:
          type: string
          description: 'The owner of the resource (optional).

            For example, "user:<owner email>" or "project:<Google developer project

            id>".'
        description:
          type: string
          description: 'Describes what error is encountered when accessing this resource.

            For example, updating a cloud project may require the `writer` permission

            on the developer console project.'
      description: Describes the resource that is being accessed.
    errorsError:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: The status code, which should be an enum value of [google.rpc.Code].
        message:
          type: string
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.'
        details:
          type: array
          items:
            $ref: '#/components/schemas/errorsErrorDetail'
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
    EmployeesCreateBulkResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: array
          items:
            $ref: '#/components/schemas/EmployeesRequestOutcome'
      title: Create an employee setup response
    EmployeesListResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: array
          items:
            $ref: '#/components/schemas/EmployeesRequestOutcome'
        nextCursor:
          type: string
      title: Get list of employees response
    modelPronounsType:
      type: string
      enum:
      - NOT_SPECIFIED
      - HE_HIM
      - SHE_HER
      - THEY_THEM
      - CUSTOM
      default: NOT_SPECIFIED
    EmployeeRolePrivilege:
      type: object
      properties:
        name:
          type: string
    modelTrainingRecord:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Training ID
        module:
          type: string
          format: int64
          title: Training module ID
        trainingDate:
          type: string
          title: Training date
        expiryDate:
          type: string
          title: Training expiry date
        isActive:
          type: boolean
          title: Training status (active/inactive)
        comment:
          type: string
          title: Training comment
        createdAt:
          type: string
          format: date-time
          title: Timestamp when the Training record was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp when the Training record was modified
      title: Training profile
    FieldDataFileFieldData:
      type: object
      properties:
        value:
          type: integer
          format: int32
    AgreementOverridePayRules:
      type: object
      properties:
        payRuleId:
          type: string
        hourlyRate:
          type: number
          format: double
      title: OverridePayRules that applied to contract
    modelCustomFieldData:
      type: object
      properties:
        apiName:
          type: string
        data:
          $ref: '#/components/schemas/CustomFieldDataFieldData'
      title: Workplace
    AgreementContractOptions:
      type: object
      properties:
        id:
          type: string
          format: int64
        name:
          type: string
        contractEmploymentType:
          type: string
          format: int64
        countryCode:
          type: string
          title: Country code of Contract
        awardCode:
          type: string
          title: Award code of Contract
        overridePayRules:
          type: array
          items:
            $ref: '#/components/schemas/AgreementOverridePayRules'
          title: PayRuleOverrides applied to contract
      title: ContractOptions is a wrapper to implement optional oneof
    rpcQuotaFailureViolation:
      type: object
      properties:
        subject:
          type: string
          description: 'The subject on which the quota check failed.

            For example, "clientip:<ip address of client>" or "project:<Google

            developer project id>".'
        description:
          type: string
          description: 'A description of how the quota check failed. Clients can use this

            description to find more about the quota configuration in the service''s

            public documentation, or find the relevant quota limit to adjust through

            developer console.


            For example: "Service disabled" or "Daily Limit for read operations

            exceeded".'
        apiService:
          type: string
          description: 'The API Service from which the `QuotaFailure.Violation` orginates. In

            some cases, Quota issues originate from an API Service other than the one

            that was called. In other words, a dependency of the called API Service

            could be the cause of the `QuotaFailure`, and this field would have the

            dependency API service name.


            For example, if the called API is Kubernetes Engine API

            (container.googleapis.com), and a quota violation occurs in the

            Kubernetes Engine API itself, this field would be

            "container.googleapis.com". On the other hand, if the quota violation

            occurs when the Kubernetes Engine API creates VMs in the Compute Engine

            API (compute.googleapis.com), this field would be

            "compute.googleapis.com".'
        quotaMetric:
          type: string
          description: 'The metric of the violated quota. A quota metric is a named counter to

            measure usage, such as API requests or CPUs. When an activity occurs in a

            service, such as Virtual Machine allocation, one or more quota metrics

            may be affected.


            For example, "compute.googleapis.com/cpus_per_vm_family",

            "storage.googleapis.com/internet_egress_bandwidth".'
        quotaId:
          type: string
          description: 'The id of the violated quota. Also know as "limit name", this is the

            unique identifier of a quota in the context of an API service.


            For example, "CPUS-PER-VM-FAMILY-per-project-region".'
        quotaDimensions:
          type: object
          additionalProperties:
            type: string
          description: "The dimensions of the violated quota. Every non-global quota is enforced\non a set of dimensions. While quota metric defines what to count, the\ndimensions specify for what aspects the counter should be increased.\n\nFor example, the quota \"CPUs per region per VM family\" enforces a limit\non the metric \"compute.googleapis.com/cpus_per_vm_family\" on dimensions\n\"region\" and \"vm_family\". And if the violation occurred in region\n\"us-central1\" and for VM family \"n1\", the quota_dimensions would be,\n\n{\n  \"region\": \"us-central1\",\n  \"vm_family\": \"n1\",\n}\n\nWhen a quota is enforced globally, the quota_dimensions would always be\nempty."
        quotaValue:
          type: string
          format: int64
          description: 'The enforced quota value at the time of the `QuotaFailure`.


            For example, if the enforced quota value at the time of the

            `QuotaFailure` on the number of CPUs is "10", then the value of this

            field would reflect this quantity.'
        futureQuotaValue:
          type: string
          format: int64
          description: 'The new quota value being rolled out at the time of the violation. At the

            completion of the rollout, this value will be enforced in place of

            quota_value. If no rollout is in progress at the time of the violation,

            this field is not set.


            For example, if at the time of the violation a rollout is in progress

            changing the number of CPUs quota from 10 to 20, 20 would be the value of

            this field.'
      description: 'A message type used to describe a single quota violation.  For example, a

        daily quota or a custom quota that was exceeded.'
