openapi: 3.2.0
info:
  title: Deputy V2 Communication API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Communication
paths:
  /communication/v2/chat/employees:get-shift-status:
    post:
      summary: Get Employees Shift Status
      description: Get the shift status of employees - uses a POST request because it expects eventually a large payload that might be too large for a GET request
      operationId: ChatEmployeeShiftStatusV2Controller_getEmployeesShiftStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesShiftStatusGetStatusesResponse'
      tags:
      - Communication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeesShiftStatusGetStatusesRequestData'
components:
  schemas:
    modelEmployeeShiftStatus:
      type: object
      properties:
        employeeId:
          type: string
          title: Employee ID as string
        status:
          $ref: '#/components/schemas/EmployeeShiftStatusEmployeeShiftStatusValues'
          title: Indicates if the employee is currently on shift
      title: Represents the shift status of an employee
    EmployeeShiftStatusEmployeeShiftStatusValues:
      type: string
      enum:
      - STATUS_UNKNOWN
      - ON_SHIFT
      - OFF_SHIFT
      - ON_BREAK
      - ON_LEAVE
      default: STATUS_UNKNOWN
      title: "- STATUS_UNKNOWN: Default value, should not be used\n - ON_SHIFT: Employee is currently on shift\n - OFF_SHIFT: Employee is currently off shift\n - ON_BREAK: Employee is currently on break\n - ON_LEAVE: Employee is currently on leave"
    EmployeesShiftStatusGetStatusesRequestData:
      type: object
      properties:
        employeeIds:
          type: array
          items:
            type: string
      title: List of employee IDs to get shift statuses for
    EmployeesShiftStatusGetStatusesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelEmployeeShiftStatus'
          title: Response data
      title: Represents the response object displayed to the client
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
