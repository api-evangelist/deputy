openapi: 3.2.0
info:
  title: Deputy V2 Onboarding Dashboard API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Onboarding Dashboard
paths:
  /onboarding/v2/dashboard:
    get:
      operationId: OnboardingDashboardV2Controller_GetOnboardingDashboard
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingDashboardGetOnboardingDashboardResponse'
      tags:
      - Onboarding Dashboard
      summary: Get onboarding dashboard
      description: Get onboarding dashboard.
  /onboarding/v2/dashboard/tasks/{key}:
    put:
      operationId: OnboardingDashboardV2Controller_UpdateOnboardingDashboard
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingDashboardUpdateOnboardingDashboardResponse'
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      tags:
      - Onboarding Dashboard
      summary: Update onboarding dashboard
      description: Update onboarding dashboard.
components:
  schemas:
    OnboardingDashboardGetOnboardingDashboardResponse:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/modelOnboardingDashboardType'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/modelModule'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/modelRoute'
    modelModule:
      type: object
      properties:
        key:
          type: string
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/modelTask'
        userTasks:
          type: array
          items:
            $ref: '#/components/schemas/modelTask'
    modelOnboardingDashboardType:
      type: string
      enum:
      - SETUP
      - GET_STARTED
      default: SETUP
    modelRouteDisplay:
      type: string
      enum:
      - EXPANDED
      - COLLAPSED
      - HIDDEN
      default: EXPANDED
    OnboardingDashboardUpdateOnboardingDashboardResponse:
      type: object
      properties:
        key:
          type: string
        status:
          $ref: '#/components/schemas/modelTaskStatus'
    modelTaskStatus:
      type: string
      enum:
      - ACTIVE
      - DONE
      - DISMISSED
      default: ACTIVE
    modelRoute:
      type: object
      properties:
        key:
          type: string
        display:
          $ref: '#/components/schemas/modelRouteDisplay'
    modelTask:
      type: object
      properties:
        key:
          type: string
        status:
          $ref: '#/components/schemas/modelTaskStatus'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
