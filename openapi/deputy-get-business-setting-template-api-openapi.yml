openapi: 3.2.0
info:
  title: Deputy V2 Get Business Setting Template API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Get Business Setting Template
paths:
  /business-setting/v2/template/{group}/{embedChannel}:
    get:
      operationId: BusinessSettingV2Controller_getTemplate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSettingTemplateResponse'
      parameters:
      - name: group
        in: path
        required: true
        schema:
          type: string
      - name: embedChannel
        in: path
        required: true
        schema:
          type: string
      tags:
      - Get Business Setting Template
      summary: Get template
      description: Get template.
components:
  schemas:
    modelTemplate:
      type: object
      properties:
        configKey:
          type: string
        isVisible:
          type: boolean
        paywall:
          $ref: '#/components/schemas/TemplateSettingPaywall'
        featureKey:
          type: string
    BusinessSettingSettingGroup:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        configKey:
          type: string
        templates:
          type: array
          items:
            $ref: '#/components/schemas/modelTemplate'
    TemplateSettingPaywall:
      type: object
      properties:
        id:
          type: string
          title: ID of the plan or add-on required (string to support add-on IDs)
        type:
          $ref: '#/components/schemas/SettingPaywallSettingPaywallType'
          title: Type of paywall (PLAN or ADD-ON)
        name:
          type: string
          title: Display name of the plan or add-on
        cta:
          $ref: '#/components/schemas/SettingPaywallSettingPaywallCta'
          title: What should be the action of the paywall CTA
      title: Paywall information for features that require upgrade
    SettingPaywallSettingPaywallCta:
      type: string
      enum:
      - HIDDEN
      - CONTACT_SALES
      - SELF_SERVE
      default: HIDDEN
    SettingPaywallSettingPaywallType:
      type: string
      enum:
      - PLAN
      - ADD_ON
      default: PLAN
    BusinessSettingTemplateResponse:
      type: object
      properties:
        success:
          type: boolean
        groups:
          type: array
          items:
            $ref: '#/components/schemas/BusinessSettingSettingGroup'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
