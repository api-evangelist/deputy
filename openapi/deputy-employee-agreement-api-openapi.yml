openapi: 3.2.0
info:
  title: Deputy V2 Employee Agreement API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employee Agreement
paths:
  /management/v2/employee-agreements:
    get:
      summary: Retrieve list of employee agreements
      operationId: EmployeeAgreementV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAgreementListResponse'
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Employee Agreement
      description: Retrieve list of employee agreements.
    post:
      summary: Create an employee agreement
      operationId: EmployeeAgreementV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAgreementCreateResponse'
      tags:
      - Employee Agreement
      description: Create an employee agreement.
  /management/v2/employee-agreements/{id}:
    get:
      summary: Retrieve employee agreement by given Id
      operationId: EmployeeAgreementV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAgreementGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Employee Agreement
      description: Retrieve employee agreement by given Id.
    delete:
      summary: Delete employee agreement by given Id
      operationId: EmployeeAgreementV2Controller_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAgreementDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Employee Agreement
      description: Delete employee agreement by given Id.
    put:
      summary: Update employee agreement by given Id
      operationId: EmployeeAgreementV2Controller_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAgreementUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Employee Agreement
      description: Update employee agreement by given Id.
components:
  schemas:
    EmployeeAgreementGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelEmployeeAgreement'
      title: Get an employee agreement response
    EmployeeAgreementCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelEmployeeAgreement'
      title: Create an employee agreement response
    v2modelEmployeeAgreement:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Employee agreement ID
        employeeId:
          type: integer
          format: int32
          title: Employee ID
        payPointId:
          type: integer
          format: int32
          title: Location ID which acts as the pay point
        isActive:
          type: boolean
          title: Is employment agreement is currently active
        startAt:
          type: string
          title: Start date of employment agreement
        endAt:
          type: string
          title: End date of employment agreement
        employmentContractId:
          type: integer
          format: int32
          title: Employment contract ID
        payRuleId:
          type: integer
          format: int32
          title: Pay rule ID
        payPeriodId:
          type: integer
          format: int32
          title: Pay period ID
        employeeAgreementHistoryId:
          type: integer
          format: int32
          title: Employee history ID
        createdById:
          type: integer
          format: int32
          title: Employee ID who created the employee agreement
        createdAt:
          type: string
          format: date-time
          title: Timestamp of when the employee agreement was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp of when the employee agreement was last modified
        payCalendarId:
          type: integer
          format: int32
          title: Pay calendar ID
        effectiveDate:
          type: string
          title: Effective date of the employee agreement
      title: Employee Agreement
    EmployeeAgreementDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      title: Delete an employee agreement response
    EmployeeAgreementUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelEmployeeAgreement'
      title: Update an employee agreement response
    EmployeeAgreementListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelEmployeeAgreement'
        nextCursor:
          type: string
      title: Get list of employee agreement response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
