components:
  schemas:
    LeaveRules:
      type: object
      properties:
        Id:
          type: integer
        SvcLeavePolicyId:
          type: string
          maxLength: 64
        Name:
          type: string
          maxLength: 64
        Type:
          type: string
          maxLength: 16
        Description:
          type: string
        MaxAllowedAnnually:
          type: number
          format: double
        PaidLeave:
          type: boolean
        AnnualRollOver:
          type: boolean
        Visible:
          type: boolean
        UnitType:
          type: integer
        ResetType:
          type: integer
        ResetSchedule:
          type: integer
        ResetValue:
          type: number
          format: double
        PayoutOnTermination:
          type: boolean
        EntitlementAfterMonth:
          type: integer
        ExportType:
          type: integer
        PayrollCategory:
          type: string
          maxLength: 64
        CalcType:
          type: integer
        Calc:
          type: string
        F00:
          type: string
        F01:
          type: string
        F02:
          type: string
        F03:
          type: string
        F04:
          type: string
        F05:
          type: string
        F06:
          type: string
        F07:
          type: string
        F08:
          type: string
        F09:
          type: string
        Creator:
          type: integer
        Created:
          type: string
          format: date-time
        Modified:
          type: string
        ResetScheduleObject:
          type: object
      required:
      - Id
      - Name
      - Type
      - Modified
    QueryRequest:
      type: object
      description: V1 Resource search payload. All fields optional; an empty body returns the first page of results.
      properties:
        search:
          type: object
          description: Map of search clauses keyed by an arbitrary id (e.g. `s1`, `s2`). Each clause filters one field.
          additionalProperties:
            type: object
            required:
            - field
            - data
            - type
            properties:
              field:
                type: string
                description: Field name to filter on (e.g. `Id`, `Employee`).
              data:
                description: Comparison value. Type depends on the field.
              type:
                type: string
                description: Comparison operator.
                enum:
                - eq
                - ne
                - gt
                - lt
                - ge
                - le
                - is
                - is not
                - in
                - not in
                - starts
                - contains
        sort:
          type: object
          description: Map of field name → `asc` or `desc`.
          additionalProperties:
            type: string
            enum:
            - asc
            - desc
        start:
          type: integer
          minimum: 0
          default: 0
          description: Pagination offset (0-indexed).
        max:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: Max records per page (server caps at 500).
        join:
          type: array
          items:
            type: string
          description: Related ORMs to expand inline (e.g. `["EmployeeObject"]`).
      example:
        search:
          s1:
            field: Id
            data: 1
            type: ge
        max: 100
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token or Deputy Permanent Token.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://once.deputy.com/my/oauth/login
          tokenUrl: https://once.deputy.com/my/oauth/access_token
          scopes:
            longlife_refresh_token: Extended session
