openapi: 3.2.0
info:
  title: Deputy V2 Leave Extension API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Extension
paths:
  /management/v2/leave-extension:soft-delete:
    post:
      operationId: LeaveExtensionV2Controller_softDeleteLeaveExtensions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveExtensionSoftDeletedLeaveExtensionsResponse'
      tags:
      - Leave Extension
      summary: Soft delete leave extensions
      description: Soft delete leave extensions.
components:
  schemas:
    LeaveExtensionSoftDeletedLeaveExtensionsResponse:
      type: object
      properties:
        success:
          type: boolean
        hasActiveExtensions:
          type: boolean
      title: SoftDeletedLeaveExtension response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
