openapi: 3.2.0
info:
  title: Deputy V2 Business Details API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Business Details
paths:
  /business/v2/details:
    get:
      summary: Get the business general details
      operationId: BusinessV2Controller_GetDetails
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetailsGetBusinessDetailsResponse'
      tags:
      - Business Details
      description: Get the business general details.
    put:
      summary: Update business general details
      operationId: BusinessV2Controller_UpdateDetails
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetailsUpdateBusinessDetailsResponse'
      tags:
      - Business Details
      description: Update business general details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelBusinessDetails'
components:
  schemas:
    BusinessDetailsUpdateBusinessDetailsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelBusinessDetails'
    BusinessDetailsGetBusinessDetailsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelBusinessDetails'
    v2modelBusinessDetails:
      type: object
      properties:
        name:
          type: string
          title: Business name
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
