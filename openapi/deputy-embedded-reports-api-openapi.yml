openapi: 3.2.0
info:
  title: Deputy V2 Embedded Reports API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Embedded Reports
paths:
  /management/v2/reports/embed:
    get:
      summary: List available Embedded reports
      operationId: EmbeddedReportsV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsListResponse'
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Embedded Reports
      description: List available Embedded reports.
  /management/v2/reports/embed/classic:
    get:
      operationId: EmbeddedReportsV2Controller_listClassicReports
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsListClassicReportsResponse'
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Embedded Reports
      summary: List classic reports
      description: List classic reports.
  /management/v2/reports/embed/copy-workbook:
    post:
      summary: Copy an existing workbook
      operationId: EmbeddedReportsV2Controller_copyWorkbook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsCopyWorkbookResponse'
      tags:
      - Embedded Reports
      description: Copy an existing workbook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedReportsCopyWorkbookRequest'
  /management/v2/reports/embed/create-workbook:
    post:
      summary: Create a new workbook
      operationId: EmbeddedReportsV2Controller_createWorkbook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsCreateWorkbookResponse'
      tags:
      - Embedded Reports
      description: Create a new workbook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedReportsCreateWorkbookRequest'
  /management/v2/reports/embed/downgrade-sigma-member-license:bulk:
    post:
      summary: Downgrade all Sigma team member licenses associated with a Deputy tenant
      operationId: EmbeddedReportsV2Controller_downgradeSigmaMemberLicenseBulk
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsDowngradeSigmaMemberLicenseBulkResponse'
      tags:
      - Embedded Reports
      description: Downgrade all Sigma team member licenses associated with a Deputy tenant.
  /management/v2/reports/embed/generate-url:
    post:
      summary: Generate embed URL for a given workbook
      operationId: EmbeddedReportsV2Controller_generateEmbedUrlForWorkbook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsGenerateURLResponse'
      tags:
      - Embedded Reports
      description: Generate embed URL for a given workbook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedReportsGenerateURLRequest'
  /management/v2/reports/embed/get-users-by-permission:
    post:
      summary: Get the list of users who has the given permission
      operationId: EmbeddedReportsV2Controller_getUsersByPermission
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsGetUsersByPermissionResponse'
      tags:
      - Embedded Reports
      description: Get the list of users who has the given permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedReportsGetUsersByPermissionRequest'
  /management/v2/reports/embed/home-folder-workbooks:
    get:
      summary: List available workbooks under embed user home folder
      operationId: EmbeddedReportsV2Controller_listHomeFolderWorkbooks
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsListHomeFolderWorkbooksResponse'
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Embedded Reports
      description: List available workbooks under embed user home folder.
  /management/v2/reports/embed/rename-workbook:
    post:
      summary: Rename home folder workbook
      operationId: EmbeddedReportsV2Controller_renameHomeFolderWorkbook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsRenameHomeFolderWorkbookResponse'
      tags:
      - Embedded Reports
      description: Rename home folder workbook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedReportsRenameHomeFolderWorkbookRequest'
  /management/v2/reports/embed/share-workbook:
    post:
      summary: Create or update grants to the workbook
      operationId: EmbeddedReportsV2Controller_shareWorkbook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsShareWorkbookResponse'
      tags:
      - Embedded Reports
      description: Create or update grants to the workbook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedReportsShareWorkbookRequest'
  /management/v2/reports/embed/tenant-onboarding:
    post:
      summary: Provision a Sigma Workspace and Team for a Deputy Tenant
      operationId: EmbeddedReportsV2Controller_provisionTenantOnSigma
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsProvisionTenantToSigmaResponse'
      tags:
      - Embedded Reports
      description: Provision a Sigma Workspace and Team for a Deputy Tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelSigmaTenantData'
  /management/v2/reports/embed/update-tenant:
    post:
      summary: Update tenant data on Sigma
      operationId: EmbeddedReportsV2Controller_updateTenantDataOnSigma
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsUpdateTenantDataOnSigmaResponse'
      tags:
      - Embedded Reports
      description: Update tenant data on Sigma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedReportsUpdateTenantDataOnSigmaRequest'
  /management/v2/reports/embed/workbook/shared-with-me:
    get:
      summary: List all workbooks that have been shared with me
      operationId: EmbeddedReportsV2Controller_listSharedWithMeWorkbooks
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsListSharedWithMeWorkbooksResponse'
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Embedded Reports
      description: List all workbooks that have been shared with me.
  /management/v2/reports/embed/workbook/{id}:
    delete:
      summary: Delete a workbook
      operationId: EmbeddedReportsV2Controller_deleteWorkbook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsDeleteWorkbookResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Embedded Reports
      description: Delete a workbook.
  /management/v2/reports/embed/workbook/{id}/shared-with:
    get:
      summary: List shared status of team and users
      operationId: EmbeddedReportsV2Controller_listSharedWithStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsListSharedWithStatusResponse'
      parameters:
      - name: id
        description: Workbook ID
        in: path
        required: true
        schema:
          type: string
      tags:
      - Embedded Reports
      description: List shared status of team and users.
  /management/v2/reports/embed/workbook/{id}:remove-shared-access:
    post:
      summary: Remove shared access to the workbook
      operationId: EmbeddedReportsV2Controller_removeSharedWorkbookAccess
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddedReportsRemoveSharedWorkbookAccessResponse'
      parameters:
      - name: id
        description: Workbook ID
        in: path
        required: true
        schema:
          type: string
      tags:
      - Embedded Reports
      description: Remove shared access to the workbook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddedReportsRemoveSharedWorkbookAccessRequest'
components:
  schemas:
    modelCreateWorkbookRequestData:
      type: object
      properties:
        name:
          type: string
          title: name for the workbook
        description:
          type: string
          title: description for the workbook
    modelGetUsersByPermissionResponseData:
      type: object
      properties:
        userUuid:
          type: string
          title: Deputy user UUID
        displayName:
          type: string
          title: Deputy user's display name
        canManage:
          type: boolean
          title: has user manage permission
    EmbeddedReportsRemoveSharedWorkbookAccessResponse:
      type: object
      properties:
        success:
          type: boolean
    EmbeddedReportsDeleteWorkbookResponse:
      type: object
      properties:
        success:
          type: boolean
    modelUserGrantRequestData:
      type: object
      properties:
        userUuid:
          type: string
          title: Deputy User UUID to map Sigma member ID
        workbookPermission:
          type: string
          title: Workbook permission that will be assigned to this user
    EmbeddedReportsRenameHomeFolderWorkbookRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/modelRenameHomeFolderWorkbookRequestData'
    EmbeddedReportsShareWorkbookRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/modelShareWorkbookRequestData'
    modelSharedWithMeData:
      type: object
      properties:
        workbooks:
          type: array
          items:
            $ref: '#/components/schemas/modelWorkbooks'
          title: Workbooks that have been shared with the user
    modelSigmaTenantData:
      type: object
      properties:
        hostname:
          type: string
          title: Hostname of the tenant, which will be used to name the Sigma team add workspace
        description:
          type: string
          title: Description for the Sigma team
    EmbeddedReportsGenerateURLResponse:
      type: object
      properties:
        success:
          type: boolean
        embedUrl:
          type: string
        isUserMigrated:
          type: boolean
    modelUpdateTenantDataOnSigmaResponseData:
      type: object
      properties:
        teamId:
          type: string
          title: The Sigma team ID
        name:
          type: string
          title: The Sigma team name
        createdBy:
          type: string
          title: The unique identifier, memberId, of the organization member who created the Sigma team
        updatedBy:
          type: string
          title: The unique identifier, memberId, of the organization member who last made changes to the Sigma team
        createdAt:
          type: string
          format: date-time
          title: The timestamp at which the Sigma team was created
        updatedAt:
          type: string
          format: date-time
          title: The timestamp at which the Sigma team was last updated
    modelCreateWorkbookResponseData:
      type: object
      properties:
        workbookId:
          type: string
          title: The workbook ID
        name:
          type: string
          title: The workbook name
        workbookUrlId:
          type: string
          title: The workbook's URL ID
    modelShareWorkbookRequestData:
      type: object
      properties:
        workbookId:
          type: string
          title: Workbook ID user wants to give grant
        userGrantRequestData:
          type: array
          items:
            $ref: '#/components/schemas/modelUserGrantRequestData'
          title: Data for user grant request
        teamWorkbookPermission:
          type: string
          title: Workbook permission that will be assigned to the team. If this is empty, team does not have any access to the workbook
        isCustomWorkbook:
          type: boolean
          title: Identifies if the workbook is custom workbook
    EmbeddedReportsListSharedWithStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelListSharedWithStatusResponseData'
    modelClassicReportsData:
      type: object
      properties:
        category:
          type: string
          title: Report category for side nav
        reports:
          type: array
          items:
            $ref: '#/components/schemas/modelClassicReports'
          title: List of all available classic reports
    EmbeddedReportsCreateWorkbookRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/modelCreateWorkbookRequestData'
    modelProvisionTenantToSigmaResponseData:
      type: object
      properties:
        teamId:
          type: string
          title: The team’s unique identifier
        createdBy:
          type: string
          title: The unique identifier, memberId, of the organization member who created the team
        updatedBy:
          type: string
          title: The unique identifier, memberId, of the organization member who last made changes to the team
        createdAt:
          type: string
          format: date-time
          title: The timestamp at which the team was created
        updatedAt:
          type: string
          format: date-time
          title: The timestamp at which the team was last updated
        name:
          type: string
          title: The team name
        description:
          type: string
          title: A description of the team
        visibility:
          type: string
          title: The team’s visibility setting
        isArchived:
          type: boolean
          title: True if the team is archived
        members:
          type: array
          items:
            type: string
          title: A list of unique identifiers (memberId) for all organization members assigned to the team
    EmbeddedReportsCopyWorkbookResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelCopyWorkbookResponseData'
    modelRenameHomeFolderWorkbookRequestData:
      type: object
      properties:
        workbookId:
          type: string
          title: The workbook ID
        name:
          type: string
          title: Workbook name to be assigned
    v2modelData:
      type: object
      properties:
        category:
          type: string
          title: Report categories
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/modelWorkspaces'
          title: Workspaces
    modelCopyWorkbookResponseData:
      type: object
      properties:
        workbookId:
          type: string
          title: The workbook ID
        workbookUrlId:
          type: string
          title: The workbook's URL ID
        name:
          type: string
          title: The workbook name
    modelGetUsersByPermissionRequestData:
      type: object
      properties:
        permission:
          type: string
          title: Deputy permission
    EmbeddedReportsGenerateURLRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/modelEmbedPayload'
    EmbeddedReportsUpdateTenantDataOnSigmaResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelUpdateTenantDataOnSigmaResponseData'
    EmbeddedReportsGetUsersByPermissionResponse:
      type: object
      properties:
        success:
          type: boolean
        users:
          type: array
          items:
            $ref: '#/components/schemas/modelGetUsersByPermissionResponseData'
    EmbeddedReportsCopyWorkbookRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/modelCopyWorkbookRequestData'
    EmbeddedReportsRemoveSharedWorkbookAccessRequest:
      type: object
      properties:
        id:
          type: string
          title: Workbook ID
        data:
          $ref: '#/components/schemas/modelRemoveSharedWorkbookAccessRequestData'
    modelCopyWorkbookRequestData:
      type: object
      properties:
        workbookId:
          type: string
          title: The ID of workbook being copied
        name:
          type: string
          title: Name for the copied workbook
    EmbeddedReportsCreateWorkbookResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelCreateWorkbookResponseData'
    modelWorkbookOwner:
      type: object
      properties:
        userUuid:
          type: string
          title: Deputy user UUID
        displayName:
          type: string
          title: Deputy users' display name
    modelWorkbooks:
      type: object
      properties:
        workbookId:
          type: string
          title: Workbook IDs
        name:
          type: string
          title: Workbook names
        workbookUrlId:
          type: string
          title: Workbook URL IDs
        path:
          type: string
          title: Workbook paths
        ownerId:
          type: string
          title: Workbook ownerId
        isArchived:
          type: boolean
          title: Workbook isArchived
        permission:
          type: string
          title: Workbook permission, this is usually edit or view
    EmbeddedReportsListClassicReportsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelClassicReportsData'
    EmbeddedReportsUpdateTenantDataOnSigmaRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/modelUpdateTenantDataOnSigmaRequestData'
    EmbeddedReportsDowngradeSigmaMemberLicenseBulkResponse:
      type: object
      properties:
        success:
          type: boolean
    modelClassicReports:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: DB primary key - required for report execution
        deputecId:
          type: string
          title: Business identifier - required for routing
        name:
          type: string
          title: Reports name
    EmbeddedReportsListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelData'
    EmbeddedReportsListSharedWithMeWorkbooksResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelSharedWithMeData'
          title: Workbooks that have been shared with me
    modelSharedUsers:
      type: object
      properties:
        userUuid:
          type: string
          title: Deputy user UUID
        displayName:
          type: string
          title: Deputy users' display name
        workbookPermission:
          type: string
          title: Workbook permission that is assigned to this user
    modelWorkspaces:
      type: object
      properties:
        name:
          type: string
          title: Workspace names
        workspaceId:
          type: string
          title: Workspace IDs
        workbooks:
          type: array
          items:
            $ref: '#/components/schemas/modelWorkbooks'
          title: Workbooks
    modelListSharedWithStatusResponseData:
      type: object
      properties:
        workbookOwner:
          $ref: '#/components/schemas/modelWorkbookOwner'
          title: Workbook owner's detail
        teamWorkbookPermission:
          type: string
          title: Workbook permission that is assigned to the team
        users:
          type: array
          items:
            $ref: '#/components/schemas/modelSharedUsers'
          title: List of users who have access to this workbook
    EmbeddedReportsGetUsersByPermissionRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/modelGetUsersByPermissionRequestData'
    modelEmbedPayload:
      type: object
      properties:
        workbookId:
          type: string
          title: Workbook ID
        workbookUrlId:
          type: string
          title: Workbook URL ID
        action:
          type: string
          title: Report action (view, edit, etc)
        isCustomWorkbook:
          type: boolean
          title: Identifies if the workbook is custom workbook
    modelUpdateTenantDataOnSigmaRequestData:
      type: object
      properties:
        oldName:
          type: string
          title: Old name before update, which is used for workspace name
        newName:
          type: string
          title: New name to be updated, this will be the new workspace name
        description:
          type: string
          title: Description for the Sigma team
    modelRemoveSharedWorkbookAccessRequestData:
      type: object
      properties:
        userUuid:
          type: string
          title: Deputy user UUID
        removeTeamAccess:
          type: boolean
          title: If this request is for removing team access
    modelHomeFolderData:
      type: object
      properties:
        workbooks:
          type: array
          items:
            $ref: '#/components/schemas/modelWorkbooks'
          title: Workspaces
    EmbeddedReportsProvisionTenantToSigmaResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelProvisionTenantToSigmaResponseData'
    EmbeddedReportsListHomeFolderWorkbooksResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelHomeFolderData'
          title: Workbooks from the home folder
    EmbeddedReportsRenameHomeFolderWorkbookResponse:
      type: object
      properties:
        success:
          type: boolean
    EmbeddedReportsShareWorkbookResponse:
      type: object
      properties:
        success:
          type: boolean
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
