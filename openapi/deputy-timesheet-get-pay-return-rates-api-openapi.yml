openapi: 3.2.0
info:
  title: Deputy V2 Timesheet Get Pay Return Rates API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Timesheet Get Pay Return Rates
paths:
  /tsa/v2/timesheets/{id}:get-pay-return-rates:
    post:
      summary: Get Pay Return Rates
      description: Get the pay return rates for a specific timesheet.
      operationId: TsaV2Controller_getPayReturnRates
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaGetPayReturnRatesResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Get Pay Return Rates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPayReturnRatesRequestPayReturnRatesRequestBody'
components:
  schemas:
    GetPayReturnRatesRequestPayReturnRatesRequestBody:
      type: object
      properties:
        setProperties:
          $ref: '#/components/schemas/TsaTimesheetPropertyRequest'
        setPayReturns:
          $ref: '#/components/schemas/TsaTimesheetPayReturnOverrideRequest'
    modelTimesheetBreak:
      type: object
      properties:
        duration:
          type: integer
          format: int32
        startTimeOffset:
          type: integer
          format: int32
        breakType:
          $ref: '#/components/schemas/tenanttsav2modelBreakType'
    GetPayReturnRatesResponsePayReturnRatesResponseBody:
      type: object
      properties:
        rateByPayRuleId:
          type: object
          additionalProperties:
            type: number
            format: float
    TsaGetPayReturnRatesResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GetPayReturnRatesResponsePayReturnRatesResponseBody'
        success:
          type: boolean
    modelPayReturnOverride:
      type: object
      properties:
        payRuleId:
          type: integer
          format: int32
        value:
          type: number
          format: float
    TsaTimesheetPropertyRequest:
      type: object
      properties:
        startTime:
          type: string
          format: int64
          description: unix epoch timestamp, seconds
        endTime:
          type: string
          format: int64
          description: unix epoch timestamp, seconds
        operationalUnitId:
          type: integer
          format: int32
          description: operational unit (area) ID
        setBreaks:
          $ref: '#/components/schemas/TsaTimesheetBreaksRequest'
        employeeId:
          type: integer
          format: int32
        leaveRuleId:
          type: integer
          format: int32
          description: leave rule (leave type) ID
        employeeComment:
          type: string
          description: employee comment for the timesheet
    tenanttsav2modelBreakType:
      type: string
      enum:
      - NO_TYPE
      - MEAL_BREAK
      - REST_BREAK
      default: NO_TYPE
    TsaTimesheetBreaksRequest:
      type: object
      properties:
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/modelTimesheetBreak'
          description: passing an empty array here will delete all breaks for the timesheet.
        totalDurationMealBreak:
          type: integer
          format: int32
          description: total duration of meal break in minutes
    TsaTimesheetPayReturnOverrideRequest:
      type: object
      properties:
        payReturnOverrides:
          type: array
          items:
            $ref: '#/components/schemas/modelPayReturnOverride'
          description: passing an empty array here will cause an approval with no pay returns.
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
