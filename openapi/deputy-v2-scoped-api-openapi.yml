openapi: 3.0.0
info:
  title: Deputy V2 Scoped API
  version: '1.0'
  description: '


    Scoped-OAuth API. These endpoints require a specific OAuth scope (e.g. HR export) and are NOT callable with a standard Deputy access token. Request the appropriate scope during your OAuth flow.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
paths:
  /hr/v2/employees/{employeeId}/onboarding/export:
    get:
      operationId: HrExportV2Controller_exportHrData
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrExportExportHrDataResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Hr
      security:
      - OAuth2ScopedAuthenticator: []
      summary: Export HR data
      description: Export HR data.
  /hr/v2/employees/{employeeId}/pay-details/export:
    get:
      operationId: HrExportV2Controller_exportHrPayDetailsData
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrExportExportHrPayDetailsDataResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Hr
      security:
      - OAuth2ScopedAuthenticator: []
      summary: Export HR pay details data
      description: Export HR pay details data.
  /hr/v2/onboarding/bulk-export:
    get:
      operationId: HrExportV2Controller_exportHrBulkData
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrExportExportHrBulkDataResponse'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Hr
      security:
      - OAuth2ScopedAuthenticator: []
      summary: Export HR bulk data
      description: Export HR bulk data.
  /management/v2/auth/user-info:
    get:
      summary: Retrieve user info
      operationId: UserInfoV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoGetResponse'
      tags:
      - User info
      security:
      - OAuth2ScopedAuthenticator: []
      description: Retrieve user info.
components:
  schemas:
    UserInfoGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelUserInfo'
    v2modelUserInfo:
      type: object
      properties:
        userId:
          type: string
          title: User ID
        employeeId:
          type: string
          format: int64
          title: Employee ID
        tenantId:
          type: string
          title: Tenant ID
        email:
          type: string
          title: User's email
        firstName:
          type: string
          title: User's first name
        lastName:
          type: string
          title: User's last name
    HrExportExportHrDataResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
    HrExportExportHrPayDetailsDataResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
    HrExportExportHrBulkDataResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
        cursor:
          type: integer
          format: int32
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
