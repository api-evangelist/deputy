openapi: 3.2.0
info:
  title: Deputy V2 Account Stats API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Account Stats
paths:
  /v2/account-stats/pay-calendar-coverage:
    get:
      summary: Get pay calendar coverage stats for the current tenant
      operationId: AccountStatsV2Controller_getPayCalendarCoverage
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatsGetPayCalendarCoverageResponse'
      tags:
      - Account Stats
      security:
      - APIToken: []
      description: Get pay calendar coverage stats for the current tenant.
  /v2/account-stats/pay-rate-coverage:
    get:
      summary: Get pay rate coverage stats for the current tenant
      operationId: AccountStatsV2Controller_getPayRateCoverage
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatsGetPayRateCoverageResponse'
      tags:
      - Account Stats
      security:
      - APIToken: []
      description: Get pay rate coverage stats for the current tenant.
components:
  schemas:
    AccountStatsGetPayRateCoverageResponseData:
      type: object
      properties:
        employeesWithPayRates:
          type: integer
          format: int32
        totalActiveEmployees:
          type: integer
          format: int32
    AccountStatsGetPayCalendarCoverageResponseData:
      type: object
      properties:
        employeesWithPayCalendar:
          type: integer
          format: int32
        totalActiveEmployees:
          type: integer
          format: int32
    AccountStatsGetPayCalendarCoverageResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AccountStatsGetPayCalendarCoverageResponseData'
    AccountStatsGetPayRateCoverageResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AccountStatsGetPayRateCoverageResponseData'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
