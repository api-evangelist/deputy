openapi: 3.2.0
info:
  title: Deputy V2 NEW - Shift Suggestions API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: NEW - Shift Suggestions
paths:
  /management/v2/shifts:suggestEmployees:
    post:
      summary: Suggest employees for a shift
      description: Suggest employees for a shift. This is a synchronous API that returns a list of employees who are either recommended or not recommended taking into account hard constraints such as overlapping shifts and soft constraints such as unavailability, leave, not trained, not preferred, stressed, and onboarding status. The request must include required fields such as start/end times, employee and area. If the list is greater than 100, a cursor will be returned to paginate the remaining results. Optional filters can be provided to filter the employees considered for the shift.
      operationId: ShiftSuggestionV2Controller_suggestEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSuggestionResponse'
      tags:
      - NEW - Shift Suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftSuggestionRequestData'
components:
  schemas:
    ShiftSuggestionRequestChildShift:
      type: object
      properties:
        area:
          type: integer
          format: int32
        start:
          type: string
          title: format YYYY-MM-DDTHH:MM:SS+HH:MM
        end:
          type: string
          title: format YYYY-MM-DDTHH:MM:SS+HH:MM
    ResponseHardConstraint:
      type: string
      enum:
      - OVERLAPPING
      default: OVERLAPPING
      title: '- OVERLAPPING: Employee has overlapping shifts'
    ShiftSuggestionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ShiftSuggestionResponseData'
        metadata:
          $ref: '#/components/schemas/ShiftSuggestionResponseMetadata'
    ResponseRecommendedStatus:
      type: string
      enum:
      - NOT_RECOMMENDED_HARD
      - NOT_RECOMMENDED_SOFT
      - RECOMMENDED
      default: NOT_RECOMMENDED_HARD
      title: "- NOT_RECOMMENDED_HARD: Not recommended due to failing hard constraints\n - NOT_RECOMMENDED_SOFT: Not recommended due to failing soft constraints\n - RECOMMENDED: Recommended after satisfying all constraints"
    ShiftSuggestionResponseMetadata:
      type: object
      properties:
        nextCursor:
          type: string
          title: Cursor for pagination
    ShiftSuggestionRequestData:
      type: object
      properties:
        area:
          type: integer
          format: int32
        start:
          type: string
          title: format YYYY-MM-DDTHH:MM:SS+HH:MM
        end:
          type: string
          title: format YYYY-MM-DDTHH:MM:SS+HH:MM
        mealbreakDuration:
          type: integer
          format: int32
          title: mealbreak duration is any number of minutes to exclude from total time of the shift
        children:
          type: array
          items:
            $ref: '#/components/schemas/ShiftSuggestionRequestChildShift'
          title: optional child shift structure for microscheduling
        filters:
          $ref: '#/components/schemas/RequestFilters'
          title: filter the list of employees considered for suggestion
        shiftId:
          type: integer
          format: int32
          title: 'optional shift ID to identify an existing shift being edited

            when provided, the assigned employee''s overlap with this shift is excluded'
        cursor:
          type: string
          title: pagination
        limit:
          type: integer
          format: int32
    RequestFilters:
      type: object
      properties:
        employeeName:
          type: string
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
    ResponseSoftConstraint:
      type: string
      enum:
      - UNAVAILABLE
      - ON_LEAVE
      - NOT_TRAINED
      - NOT_PREFERRED
      - STRESSED
      - VIOLATES_SCHEDULE_RULE
      - ONBOARDING
      default: UNAVAILABLE
      title: "- UNAVAILABLE: Employee is unavailable\n - ON_LEAVE: Employee is on leave\n - NOT_TRAINED: Employee is not trained\n - NOT_PREFERRED: Employee is not preferred\n - STRESSED: Employee is stressed\n - VIOLATES_SCHEDULE_RULE: Employee cannot take the shift because it would violate a schedule rule\n - ONBOARDING: Employee is onboarding"
    ResponseSuggestedEmployee:
      type: object
      properties:
        id:
          type: integer
          format: int32
        displayName:
          type: string
        photoUrl:
          type: string
        recommendedStatus:
          $ref: '#/components/schemas/ResponseRecommendedStatus'
          title: Recommended status
        failedHardConstraints:
          type: array
          items:
            $ref: '#/components/schemas/ResponseHardConstraint'
          title: Hard constraints for the employee (non-overridable)
        failedSoftConstraints:
          type: array
          items:
            $ref: '#/components/schemas/ResponseSoftConstraint'
          title: Soft constraints for the employee (overridable)
        wage:
          type: string
          title: Wages for current period to 2 decimal places
        hoursScheduled:
          type: string
          title: Hours scheduled for current period to 2 decimal places
    ShiftSuggestionResponseData:
      type: object
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/ResponseSuggestedEmployee'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
