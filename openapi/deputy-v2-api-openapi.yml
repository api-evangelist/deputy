  /management/v2/employees-profile:
    get:
      summary: Retrieve list of employee profile
      description: Supports searching by name, company, active status, role, and other fields using the filters parameter.
      operationId: EmployeeProfileV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileListResponse'
      parameters:
      - name: filters
        description: "Filter employees by field values. Format: filters[]={fieldName}:{value}\nMultiple filters can be combined. Use the 'op' parameter to specify AND (default) or OR operation.\n\nAND filter example (default): \n```\nGET /api/management/v2/employees-profile?filters[]=active:1&filters[]=company:10\n```\nReturns active employees from company 10 (both conditions must match)\n\nOR filter example: \n```\nGET /api/management/v2/employees-profile?filters[]=role:5&filters[]=role:6&op=OR\n```\nReturns employees with role 5 OR 6 (either condition matches)\n\nAvailable filterable fields:\n- id: Employee ID\n- company: Company ID\n- first_name: Employee first name\n- last_name: Employee last name\n- display_name: Employee display name\n- gender: Gender\n- user_id: User ID\n- active: Active status (boolean: use 1 for true, 0 for false)\n- termination_date: Termination date\n- position: Position\n- role: Role ID"
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        description: "Controls how multiple filters are combined. Default is AND (all filters must match).\nValid values: \"AND\", \"OR\"\n- AND: All filter conditions must match (default behavior)\n- OR: Any filter condition can match. Example with AND (default):\n\n```\nGET /api/management/v2/employees-profile?filters[]=active:1&filters[]=company:10\n```\n\nExample with OR: \n\n```\nGET /api/management/v2/employees-profile?filters[]=role:5&filters[]=role:6&op=OR\n```"
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        description: 'Pagination cursor from a previous response. Base64 encoded value that points to the position in the result set for the next page.

          Use this value in subsequent requests to fetch the next page of results.'
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: Maximum number of employee profiles to return in a single response. Used for pagination.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: orderBy
        description: Field name to sort results by. The field name can be mapped through a column mapper if needed.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Employee Profile
