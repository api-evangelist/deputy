            schema:
              $ref: '#/components/schemas/ScheduleShiftBulkPatchRequest'
  /management/v2/shifts:bulkUpdate:
    post:
      summary: Bulk update shifts (asynchronous)
      description: Updates multiple shifts in bulk with field-level updates. Only fields specified in the fieldMasks array will be updated. This is an asynchronous API that returns immediately with an operation ID in the response metadata.operation.id field. Use the operation ID to poll the /operations/v2/operations/{id} endpoint to check completion status. The operation processes updates in the background.
      operationId: ScheduleShiftV2Controller_bulkUpdate
