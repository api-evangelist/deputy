      operationId: ScheduleShiftV2Controller_aggregatedList
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftAggregatedListResponse'
      parameters:
      - name: start
        description: Filters shifts starting at/after start e.g. 2023-03-11T13:45:00, default -7 days from today.
        in: query
        required: false
        schema:
          type: string
      - name: end
        description: Filters shift starting before end exclusively e.g. 2023-03-11T18:45:00, default today at 00:00:00.
        in: query
        required: false
        schema:
          type: string
      - name: employee
        description: Filters shifts for an employee ID.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: timesheet
        description: Filters shifts for matched or unmatched timesheet.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: published
        description: "Filters shifts for published status.\n\n - NOT_SPECIFIED: Not specified\n - TRUE: Published\n - ALL: Both published and unpublished\n - FALSE: Unpublished only"
        in: query
        required: false
        schema:
          type: string
          enum:
          - NOT_SPECIFIED
          - 'TRUE'
          - ALL
          - 'FALSE'
          default: NOT_SPECIFIED
      - name: frequency
        description: Aggregation frequency.
        in: query
        required: false
        schema:
          type: string
          enum:
          - DAILY
          - WEEKLY
          default: DAILY
      - name: omitEmptyPeriod
        description: Omit empty periods in response array.
        in: query
        required: false
        schema:
          type: boolean
      - name: expandMetadata
        description: If true, includes additional metadata such as custom field definitions and more.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Shifts
      description: Retrieve an aggregated list of shifts.
