openapi: 3.0.0
info:
  title: Deputy V2 API
  version: '1.0'
  description: '


    Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
paths:
  /access-management/v2/privilege-hierarchy:
    get:
      operationId: AccessManagementV2Controller_GetPrivilegeHierarchy
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementGetPrivilegeHierarchyResponse'
      tags:
      - Access Management Privilege Hierarchy
      security:
      - APIToken: []
      summary: Get privilege hierarchy
      description: Get privilege hierarchy.
  /access-management/v2/roles:
    get:
      summary: List all available roles
      operationId: AccessManagementV2Controller_ListRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementListRoleResponse'
      tags:
      - Access Management Role
      security:
      - APIToken: []
      description: List all available roles.
    post:
      summary: Create a new role
      operationId: AccessManagementV2Controller_CreateRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementCreateRoleResponse'
      tags:
      - Access Management Role
      security:
      - APIToken: []
      description: Create a new role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessManagementCreateRoleRequest'
  /access-management/v2/roles/{roleId}:
    delete:
      operationId: AccessManagementV2Controller_DeleteRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementDeleteRoleResponse'
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Access Management Role
      security:
      - APIToken: []
      summary: Delete role
      description: Delete role.
    put:
      operationId: AccessManagementV2Controller_UpdateRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2AccessManagementUpdateRoleResponse'
      parameters:
      - name: roleId
        description: Role ID (required)
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Access Management Role
      security:
      - APIToken: []
      summary: Update role
      description: Update role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2AccessManagementUpdateRoleRequest'
    get:
      operationId: AccessManagementV2Controller_GetEmployeeRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementGetEmployeeRoleResponse'
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: int64
      tags:
      - Access Management Employee Role
      security:
      - APIToken: []
      summary: Get employee role
      description: Get employee role.
  /access-management/v2/roles/{roleId}/employees:
    get:
      summary: Get team members by role
      operationId: AccessManagementV2Controller_ListEmployeeByRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementListEmployeeByRoleResponse'
      parameters:
      - name: roleId
        description: Role ID
        in: path
        required: true
        schema:
          type: string
          format: int64
      - name: displayName
        description: Optional search by display name.
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: 'Optional limit for pagination (default: 20, limit: 100).'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: offset
        description: 'Optional offset for pagination (default: 0).'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Access Management Employee
      security:
      - APIToken: []
      description: Get team members by role.
  /access-management/v2/roles/{roleId}/history:
    get:
      operationId: AccessManagementV2Controller_ListEmployeeRoleHistory
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
