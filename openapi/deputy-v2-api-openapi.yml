      summary: List employee role history
      description: List employee role history.
  /agent/schedule/v2/late:
    get:
      summary: Get employees who are currently late or were late in the given time range.
      description: 'Note: This endpoint processes a maximum of 1000 rosters per request to ensure

        reliable performance. For businesses with more shifts in the given time range,

        use shorter time ranges or filter by specific locations to ensure all late

        employees are captured.'
      operationId: ScheduleAgentV2Controller_getLate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleAgentGetLateResponse'
      parameters:
      - name: startDate
        description: Start date (Y-m-d format, e.g., "2024-01-15"). Required. Must be on or before 'endDate'.
        in: query
        required: false
        schema:
          type: string
      - name: endDate
        description: End date (Y-m-d format, e.g., "2024-01-16"). Required. Must be on or after 'startDate'.
        in: query
        required: false
        schema:
          type: string
      - name: locationIds
        description: Optional - if empty, uses all locations the user has access to.
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: cursor
        description: Pagination cursor for retrieving subsequent pages.
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: Results per page (default 50, max 250).
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Schedule Agent
  /agent/schedule/v2/shifts:upsert:
    post:
      summary: Batch create or update shifts
      description: Creates or updates multiple shifts in a single request. Maximum 500 items per request. Each item is processed independently - partial failures are allowed. Use id=0 or omit id for creates, provide id for updates. Set async=true to process asynchronously and poll via /api/operations/v2/operations/{id}.
      operationId: ScheduleAgentV2Controller_upsertShifts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleAgentUpsertShiftsResponse'
      parameters:
      - name: async
        description: 'When true, process the request asynchronously. Returns immediately with

          operationId and pending count. Use /api/operations/v2/operations/{id} to poll for results.'
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Schedule Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleAgentUpsertShiftsRequestUpsertData'
  /ai-assistant/v2/settings:
    get:
