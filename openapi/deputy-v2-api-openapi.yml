      description: Describes additional debugging info.
    rpcErrorInfo:
      type: object
      properties:
        reason:
          type: string
          description: 'The reason of the error. This is a constant value that identifies the

            proximate cause of the error. Error reasons are unique within a particular

            domain of errors. This should be at most 63 characters and match a

            regular expression of `[A-Z][A-Z0-9_]+[A-Z0-9]`, which represents

            UPPER_SNAKE_CASE.'
        domain:
          type: string
          description: 'The logical grouping to which the "reason" belongs. The error domain

            is typically the registered service name of the tool or product that

            generates the error. Example: "pubsub.googleapis.com". If the error is

            generated by some common infrastructure, the error domain must be a

            globally unique value that identifies the infrastructure. For Google API

            infrastructure, the error domain is "googleapis.com".'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Additional structured details about this error.


            Keys must match a regular expression of `[a-z][a-zA-Z0-9-_]+` but should

            ideally be lowerCamelCase. Also, they must be limited to 64 characters in

            length. When identifying the current value of an exceeded limit, the units

            should be contained in the key, not the value.  For example, rather than

            `{"instanceLimit": "100/request"}`, should be returned as,

            `{"instanceLimitPerRequest": "100"}`, if the client exceeds the number of

            instances that can be created in a single (batch) request.'
      description: "Describes the cause of the error with structured details.\n\nExample of an error when contacting the \"pubsub.googleapis.com\" API when it\nis not enabled:\n\n    { \"reason\": \"API_DISABLED\"\n      \"domain\": \"googleapis.com\"\n      \"metadata\": {\n        \"resource\": \"projects/123\",\n        \"service\": \"pubsub.googleapis.com\"\n      }\n    }\n\nThis response indicates that the pubsub.googleapis.com API is not enabled.\n\nExample of an error that is returned when attempting to create a Spanner\ninstance in a region that is out of stock:\n\n    { \"reason\": \"STOCKOUT\"\n      \"domain\": \"spanner.googleapis.com\",\n      \"metadata\": {\n        \"availableRegions\": \"us-central1,us-east2\"\n      }\n    }"
    rpcHelp:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/HelpLink'
          description: URL(s) pointing to additional information on handling the current error.
      description: 'Provides links to documentation or for performing an out of band action.


        For example, if a quota check failed with an error indicating the calling

        project hasn''t enabled the accessed service, this can contain a URL pointing

        directly to the right place in the developer console to flip the bit.'
    rpcLocalizedMessage:
      type: object
      properties:
        locale:
          type: string
          title: 'The locale used following the specification defined at

            https://www.rfc-editor.org/rfc/bcp/bcp47.txt.

            Examples are: "en-US", "fr-CH", "es-MX"'
        message:
          type: string
          description: The localized error message in the above locale.
      description: 'Provides a localized error message that is safe to return to the user

        which can be attached to an RPC error.'
    rpcPreconditionFailure:
      type: object
      properties:
        violations:
          type: array
          items:
            $ref: '#/components/schemas/rpcPreconditionFailureViolation'
          description: Describes all precondition violations.
      description: 'Describes what preconditions have failed.


        For example, if an RPC failed because it required the Terms of Service to be

        acknowledged, it could list the terms of service violation in the

        PreconditionFailure message.'
    rpcPreconditionFailureViolation:
      type: object
      properties:
        type:
          type: string
          description: 'The type of PreconditionFailure. We recommend using a service-specific

            enum type to define the supported precondition violation subjects. For

            example, "TOS" for "Terms of Service violation".'
        subject:
          type: string
          description: 'The subject, relative to the type, that failed.

            For example, "google.com/cloud" relative to the "TOS" type would indicate

            which terms of service is being referenced.'
        description:
          type: string
          description: 'A description of how the precondition failed. Developers can use this

            description to understand how to fix the failure.


            For example: "Terms of service not accepted".'
      description: A message type used to describe a single precondition failure.
    rpcQuotaFailure:
      type: object
      properties:
        violations:
          type: array
          items:
            $ref: '#/components/schemas/rpcQuotaFailureViolation'
          description: Describes all quota violations.
      description: 'Describes how a quota check failed.


        For example if a daily limit was exceeded for the calling project,

        a service could respond with a QuotaFailure detail containing the project

        id and the description of the quota limit that was exceeded.  If the

        calling project hasn''t enabled the service in the developer console, then

        a service could respond with the project id and set `service_disabled`

        to true.


        Also see RetryInfo and Help types for other details about handling a

        quota failure.'
    rpcQuotaFailureViolation:
      type: object
      properties:
        subject:
          type: string
          description: 'The subject on which the quota check failed.

            For example, "clientip:<ip address of client>" or "project:<Google

            developer project id>".'
        description:
          type: string
          description: 'A description of how the quota check failed. Clients can use this

            description to find more about the quota configuration in the service''s

            public documentation, or find the relevant quota limit to adjust through

            developer console.


            For example: "Service disabled" or "Daily Limit for read operations

            exceeded".'
        apiService:
          type: string
          description: 'The API Service from which the `QuotaFailure.Violation` orginates. In

            some cases, Quota issues originate from an API Service other than the one

            that was called. In other words, a dependency of the called API Service

            could be the cause of the `QuotaFailure`, and this field would have the

            dependency API service name.


            For example, if the called API is Kubernetes Engine API

            (container.googleapis.com), and a quota violation occurs in the

            Kubernetes Engine API itself, this field would be

            "container.googleapis.com". On the other hand, if the quota violation

            occurs when the Kubernetes Engine API creates VMs in the Compute Engine

            API (compute.googleapis.com), this field would be

            "compute.googleapis.com".'
        quotaMetric:
          type: string
          description: 'The metric of the violated quota. A quota metric is a named counter to

            measure usage, such as API requests or CPUs. When an activity occurs in a

            service, such as Virtual Machine allocation, one or more quota metrics

            may be affected.


            For example, "compute.googleapis.com/cpus_per_vm_family",

            "storage.googleapis.com/internet_egress_bandwidth".'
        quotaId:
          type: string
          description: 'The id of the violated quota. Also know as "limit name", this is the

            unique identifier of a quota in the context of an API service.


            For example, "CPUS-PER-VM-FAMILY-per-project-region".'
        quotaDimensions:
          type: object
          additionalProperties:
            type: string
          description: "The dimensions of the violated quota. Every non-global quota is enforced\non a set of dimensions. While quota metric defines what to count, the\ndimensions specify for what aspects the counter should be increased.\n\nFor example, the quota \"CPUs per region per VM family\" enforces a limit\non the metric \"compute.googleapis.com/cpus_per_vm_family\" on dimensions\n\"region\" and \"vm_family\". And if the violation occurred in region\n\"us-central1\" and for VM family \"n1\", the quota_dimensions would be,\n\n{\n  \"region\": \"us-central1\",\n  \"vm_family\": \"n1\",\n}\n\nWhen a quota is enforced globally, the quota_dimensions would always be\nempty."
        quotaValue:
          type: string
          format: int64
          description: 'The enforced quota value at the time of the `QuotaFailure`.


            For example, if the enforced quota value at the time of the

            `QuotaFailure` on the number of CPUs is "10", then the value of this

            field would reflect this quantity.'
        futureQuotaValue:
          type: string
          format: int64
          description: 'The new quota value being rolled out at the time of the violation. At the

            completion of the rollout, this value will be enforced in place of

            quota_value. If no rollout is in progress at the time of the violation,

            this field is not set.


            For example, if at the time of the violation a rollout is in progress

            changing the number of CPUs quota from 10 to 20, 20 would be the value of

            this field.'
      description: 'A message type used to describe a single quota violation.  For example, a

        daily quota or a custom quota that was exceeded.'
    rpcRequestInfo:
      type: object
      properties:
        requestId:
          type: string
          description: 'An opaque string that should only be interpreted by the service generating

            it. For example, it can be used to identify requests in the service''s logs.'
        servingData:
          type: string
          description: 'Any data that was used to serve this request. For example, an encrypted

            stack trace that can be sent back to the service provider for debugging.'
      description: 'Contains metadata about the request that clients can attach when filing a bug

        or providing other forms of feedback.'
    rpcResourceInfo:
      type: object
      properties:
        resourceType:
          type: string
          description: 'A name for the type of resource being accessed, e.g. "sql table",

            "cloud storage bucket", "file", "Google calendar"; or the type URL

            of the resource: e.g. "type.googleapis.com/google.pubsub.v1.Topic".'
        resourceName:
          type: string
          description: 'The name of the resource being accessed.  For example, a shared calendar

            name: "example.com_4fghdhgsrgh@group.calendar.google.com", if the current

            error is

            [google.rpc.Code.PERMISSION_DENIED][google.rpc.Code.PERMISSION_DENIED].'
        owner:
          type: string
          description: 'The owner of the resource (optional).

            For example, "user:<owner email>" or "project:<Google developer project

            id>".'
        description:
          type: string
          description: 'Describes what error is encountered when accessing this resource.

            For example, updating a cloud project may require the `writer` permission

            on the developer console project.'
      description: Describes the resource that is being accessed.
    rpcRetryInfo:
      type: object
      properties:
        retryDelay:
          type: string
          description: Clients should wait at least this long between retrying the same request.
      description: 'Describes when the clients can retry a failed request. Clients could ignore

        the recommendation here or retry when this information is missing from error

        responses.


        It''s always recommended that clients should use exponential backoff when

        retrying.


        Clients should wait until `retry_delay` amount of time has passed since

        receiving the error response before retrying.  If retrying requests also

        fail, clients should use an exponential backoff scheme to gradually increase

        the delay between retries based on `retry_delay`, until either a maximum

        number of retries have been reached or a maximum retry delay cap has been

        reached.'
