    BadRequestFieldViolation:
      type: object
      properties:
        field:
          type: string
          description: "A path that leads to a field in the request body. The value will be a\nsequence of dot-separated identifiers that identify a protocol buffer\nfield.\n\nConsider the following:\n\n    message CreateContactRequest {\n      message EmailAddress {\n        enum Type {\n          TYPE_UNSPECIFIED = 0;\n          HOME = 1;\n          WORK = 2;\n        }\n\n        optional string email = 1;\n        repeated EmailType type = 2;\n      }\n\n      string full_name = 1;\n      repeated EmailAddress email_addresses = 2;\n    }\n\nIn this example, in proto `field` could take one of the following values:\n\n* `full_name` for a violation in the `full_name` value\n* `email_addresses[1].email` for a violation in the `email` field of the\n  first `email_addresses` message\n* `email_addresses[3].type[2]` for a violation in the second `type`\n  value in the third `email_addresses` message.\n\nIn JSON, the same values are represented as:\n\n* `fullName` for a violation in the `fullName`\
            \ value\n* `emailAddresses[1].email` for a violation in the `email` field of the\n  first `emailAddresses` message\n* `emailAddresses[3].type[2]` for a violation in the second `type`\n  value in the third `emailAddresses` message."
        description:
          type: string
          description: A description of why the request element is bad.
        reason:
          type: string
          description: 'The reason of the field-level error. This is a constant value that

            identifies the proximate cause of the field-level error. It should

            uniquely identify the type of the FieldViolation within the scope of the

            google.rpc.ErrorInfo.domain. This should be at most 63

            characters and match a regular expression of `[A-Z][A-Z0-9_]+[A-Z0-9]`,

            which represents UPPER_SNAKE_CASE.'
        localizedMessage:
          $ref: '#/components/schemas/rpcLocalizedMessage'
          description: 'Provides a localized error message for field-level errors that is safe to

            return to the API consumer.'
      description: A message type used to describe a single bad request field.
