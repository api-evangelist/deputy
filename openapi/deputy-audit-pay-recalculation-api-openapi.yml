openapi: 3.2.0
info:
  title: Deputy V2 Audit Pay Recalculation API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Audit Pay Recalculation
paths:
  /audit/v2/pay-recalculation:
    post:
      summary: Recalculate audit pay returns
      operationId: AuditPayRecalculationV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPayRecalculationPayRecalculationResponse'
      tags:
      - Audit Pay Recalculation
      description: Recalculate audit pay returns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditPayRecalculationPayRecalculationRequest'
components:
  schemas:
    modelPayRecalculation:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
          title: Id of the employee
        startDate:
          type: string
          format: date-time
          title: Start date of the calculation period
        endDate:
          type: string
          format: date-time
          title: End date of the calculation period
        awardOverride:
          type: string
          title: Award code used to recalculate pay returns (optional)
        contractOverride:
          type: integer
          format: int32
          title: Contract Id used to recalculate pay returns (optional)
        basePayRate:
          type: number
          format: float
          title: Base pay rate to be used for calculation when override is provided
        awardSourceList:
          type: string
          title: award source list is either file or db
    modelTimesheetDetails:
      type: object
      properties:
        timesheetId:
          type: integer
          format: int32
          title: Associated timesheet Id
        timesheetDate:
          type: string
          title: Timesheet start date in Y-m-d
        timesheetStartTime:
          type: string
          title: Timesheet start time in Y-m-d H:i
        timesheetEndTime:
          type: string
          title: Timesheet end time in Y-m-d H:i
        timesheetMealBreak:
          type: string
          title: Timesheet meal break in H:i
        timesheetTotalTime:
          type: string
          title: Timesheet total time
        timesheetCost:
          type: string
          title: Timesheet cost
        originalPayReturns:
          type: array
          items:
            $ref: '#/components/schemas/tenantauditv2modelPayReturn'
        calculatedPayReturns:
          type: array
          items:
            $ref: '#/components/schemas/tenantauditv2modelPayReturn'
        payrollId:
          type: string
          title: Agreement payroll Id
    AuditPayRecalculationPayRecalculationResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelTimesheetDetails'
      title: Audit pay recalculation response
    AuditPayRecalculationPayRecalculationRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/modelPayRecalculation'
      title: Audit pay recalculation request
    tenantauditv2modelPayReturn:
      type: object
      properties:
        payRuleTitle:
          type: string
          title: Associated pay rule title
        value:
          type: string
          title: Timesheet pay return value
        cost:
          type: string
          title: Timesheet pay return cost
        overridden:
          type: boolean
          title: Indicates whether the pay return was overridden
        overrideComment:
          type: string
          title: Comment detailing reason for override
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
