openapi: 3.2.0
info:
  title: Deputy V2 Leave Non Working Days API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Non Working Days
paths:
  /management/v2/leave-non-working-days:
    get:
      summary: Get non working days to given company id and date range
      operationId: LeaveNonWorkingDaysV2Controller_getLeaveNonWorkingDays
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveNonWorkingDaysGetLeaveNonWorkingDaysResponse'
      parameters:
      - name: locationId
        in: query
        required: false
        schema:
          type: string
      - name: startDate
        description: startDate uses YYYY-MM-DD format.
        in: query
        required: false
        schema:
          type: string
      - name: endDate
        description: endDate uses YYYY-MM-DD format.
        in: query
        required: false
        schema:
          type: string
      - name: employeeId
        in: query
        required: false
        schema:
          type: string
      tags:
      - Leave Non Working Days
      description: Get non working days to given company id and date range.
components:
  schemas:
    LeaveNonWorkingDaysGetLeaveNonWorkingDaysResponse:
      type: object
      properties:
        success:
          type: boolean
        nonWorkingDays:
          type: array
          items:
            type: string
          title: nonWorkingDays uses YYYY-MM-DD format
        error:
          type: string
      title: GetLeaveNonWorkingDays response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
