          items:
            type: string
          description: ''
        strWorkplaceCode:
          type: string
        strPayrollExportCode:
          type: string
        blnIsWorkplace:
          type: integer
          format: int32
        blnIsPayrollEntity:
          type: integer
          format: int32
    End:
      title: End
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int32
    AddleaveforaemployeeRequest:
      title: AddleaveforaemployeeRequest
      required:
      - Status
      - Employee
      - DateStart
      - DateEnd
      - ApprovalComment
      - ActionOverlappingRosters
      type: object
      properties:
        Status:
          type: integer
          format: int32
          description: 0 - Awaiting approval, 1 - approved, 2 - Declined, 3 - Cancelled
        Employee:
          type: integer
          format: int32
          description: Employee id record
        DateStart:
          type: string
          description: Start date of the leave
        DateEnd:
          type: string
          description: End date of the leave
        ApprovalComment:
          type: string
          description: Any comment left regarding approval of leave
        ActionOverlappingRosters:
          type: integer
          format: int32
    Start:
      title: Start
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int32
    CreateamemoRequest:
      title: CreateamemoRequest
      required:
      - strContent
      - intCompany
      type: object
      properties:
        strContent:
          type: string
          description: Text to include in memo
        intCompany:
          type: integer
          format: int32
          description: Location ID record
        blnRequireConfirm:
          type: integer
          format: int32
          description: 0 No, 1 Yes
        arrAssignedCompanyIds:
          type: array
          items:
            type: integer
            format: int32
            description: Array of Location ID records
        arrAssignedUserIds:
          type: array
          items:
            type: integer
            format: int32
            description: Array of User IDs (Not employee ids) to get the memo
    Recurrence:
      title: Recurrence
      required:
      - FREQ
      - INTERVAL
      - BYDAY
      type: object
      properties:
        FREQ:
          type: string
        INTERVAL:
          type: integer
          format: int32
        BYDAY:
          type: string
  securitySchemes:
    httpBearer:
      type: http
      scheme: bearer
