openapi: 3.2.0
info:
  title: Deputy V1 Resource Employment Condition API
  version: 1.0.0
  description: 'Generated, comprehensive reference for Deputy''s legacy V1 `/resource/{Object}` API.


    V1 is in maintenance mode — new integrations should prefer the V2 API. This spec covers the reflection-based routing pattern declared in `deputy-webapp/app/api/v1/routers/ResourceRouter.php`, enumerated over every ORM class registered in `DeputecApplication::$arrSystems` in `app/prepend.inc.php`.


    Resources support create/update/delete only if they also appear in `$arrSystemsAPIEditable` — read-only resources expose GET / QUERY / INFO / PREDICT / HISTORY only.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: EmploymentCondition
  description: Operations on the EmploymentCondition resource
paths:
  /resource/EmploymentCondition:
    get:
      tags:
      - EmploymentCondition
      summary: List EmploymentCondition records
      description: Returns EmploymentCondition records the authenticated caller is permitted to see. For large tables prefer POST /QUERY with pagination.
      operationId: listEmploymentCondition
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmploymentCondition'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentCondition/INFO:
    get:
      tags:
      - EmploymentCondition
      summary: Get field metadata for EmploymentCondition
      description: Returns the field list, types, and associations for this resource. Useful when building integrations that need to know which fields are queryable.
      operationId: infoEmploymentCondition
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentCondition/QUERY:
    post:
      tags:
      - EmploymentCondition
      summary: Search EmploymentCondition
      description: 'Flexible search endpoint. Body supports `search`, `sort`, `start`, `max`, and `join` clauses. Example: `{"search": {"s1": {"field": "Id", "data": 1, "type": "eq"}}}`.'
      operationId: searchEmploymentCondition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmploymentCondition'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentCondition/PREDICT:
    post:
      tags:
      - EmploymentCondition
      summary: Predict-match a EmploymentCondition record
      description: Returns the closest matching existing record for a partial payload. Used by upsert-style integrations to find an existing row before creating.
      operationId: predictEmploymentCondition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentCondition'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentCondition'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentCondition/{id}:
    get:
      tags:
      - EmploymentCondition
      summary: Get a EmploymentCondition by id
      operationId: getEmploymentConditionById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Numeric id of the resource
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentCondition'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentCondition/{id}/HISTORY:
    get:
      tags:
      - EmploymentCondition
      summary: Get change history for a EmploymentCondition
      operationId: historyEmploymentCondition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Numeric id of the resource
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmploymentCondition'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentCondition/{id}/HISTORY/travel/{timestamp}:
    get:
      tags:
      - EmploymentCondition
      summary: Get a EmploymentCondition as it existed at a prior time
      operationId: historyEmploymentConditionTravel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Numeric id of the resource
      - name: timestamp
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Unix epoch seconds
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentCondition'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentCondition/{id}/COMMENTS:
    get:
      tags:
      - EmploymentCondition
      summary: List comments on a EmploymentCondition
      operationId: getCommentsEmploymentCondition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Numeric id of the resource
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Id:
                      type: integer
                    Comment:
                      type: string
                    Creator:
                      type: integer
                    Created:
                      type: string
                      format: date-time
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
    post:
      tags:
      - EmploymentCondition
      summary: Add a comment to a EmploymentCondition
      operationId: addCommentEmploymentCondition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Numeric id of the resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Comment:
                  type: string
              required:
              - Comment
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentCondition/{id}/COMMENTS/{commentId}:
    delete:
      tags:
      - EmploymentCondition
      summary: Delete a comment on a EmploymentCondition
      operationId: deleteCommentEmploymentCondition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Numeric id of the resource
      - name: commentId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
components:
  schemas:
    EmploymentCondition:
      type: object
      properties:
        Id:
          type: integer
        Name:
          type: string
          maxLength: 255
        Description:
          type: string
        AwardLevel:
          type: string
          maxLength: 255
        EmploymentBasis:
          type: integer
        EmploymentCategory:
          type: integer
        EmploymentPeriod:
          type: integer
        EmploymentStatus:
          type: integer
        ProbationaryPeriod:
          type: integer
        WorkingDaysPerPeriod:
          type: number
          format: double
        UsualStartTime:
          type: string
          format: date-time
        UsualFinishTime:
          type: string
          format: date-time
        UsualMealbreak:
          type: string
          format: date-time
        AvgHoursPerDay:
          type: number
          format: double
        MinHoursPerDay:
          type: number
          format: double
        MinHoursForLeave:
          type: number
          format: double
        Creator:
          type: integer
        Created:
          type: string
          format: date-time
        Modified:
          type: string
      required:
      - Id
      - Name
      - WorkingDaysPerPeriod
      - Modified
    QueryRequest:
      type: object
      description: V1 Resource search payload. All fields optional; an empty body returns the first page of results.
      properties:
        search:
          type: object
          description: Map of search clauses keyed by an arbitrary id (e.g. `s1`, `s2`). Each clause filters one field.
          additionalProperties:
            type: object
            required:
            - field
            - data
            - type
            properties:
              field:
                type: string
                description: Field name to filter on (e.g. `Id`, `Employee`).
              data:
                description: Comparison value. Type depends on the field.
              type:
                type: string
                description: Comparison operator.
                enum:
                - eq
                - ne
                - gt
                - lt
                - ge
                - le
                - is
                - is not
                - in
                - not in
                - starts
                - contains
        sort:
          type: object
          description: Map of field name → `asc` or `desc`.
          additionalProperties:
            type: string
            enum:
            - asc
            - desc
        start:
          type: integer
          minimum: 0
          default: 0
          description: Pagination offset (0-indexed).
        max:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: Max records per page (server caps at 500).
        join:
          type: array
          items:
            type: string
          description: Related ORMs to expand inline (e.g. `["EmployeeObject"]`).
      example:
        search:
          s1:
            field: Id
            data: 1
            type: ge
        max: 100
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token or Deputy Permanent Token.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://once.deputy.com/my/oauth/login
          tokenUrl: https://once.deputy.com/my/oauth/access_token
          scopes:
            longlife_refresh_token: Extended session
