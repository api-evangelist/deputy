openapi: 3.2.0
info:
  title: Deputy V2 File API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: File
paths:
  /v2/file/upload:
    post:
      summary: create a file
      operationId: FileV2Controller_createFile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFileResponse'
      tags:
      - File
      description: create a file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileRequestCreateFileRequestBody'
components:
  schemas:
    CreateFileResponseCreateFileResponseBody:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/modelFile'
        filePreviews:
          type: array
          items:
            $ref: '#/components/schemas/modelFilePreview'
    CreateFileResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CreateFileResponseCreateFileResponseBody'
    modelFile:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        type:
          type: string
        size:
          type: integer
          format: int32
        session:
          type: integer
          format: int32
        linkId:
          type: string
        tags:
          type: string
        tempId:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        downloadLink:
          type: string
        previewLink:
          type: string
        p5050Link:
          type: string
        dynamicLink:
          type: string
        creator:
          type: integer
          format: int32
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
    CreateFileRequestCreateFileRequestBody:
      type: object
      properties:
        type:
          type: string
        data:
          type: string
        name:
          type: string
        size:
          type: integer
          format: int32
        preview:
          type: boolean
    modelFilePreview:
      type: object
      properties:
        id:
          type: integer
          format: int32
        fileId:
          type: integer
          format: int32
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        link:
          type: string
        secureLink:
          type: string
        creator:
          type: integer
          format: int32
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
