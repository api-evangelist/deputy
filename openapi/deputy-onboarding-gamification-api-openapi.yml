openapi: 3.2.0
info:
  title: Deputy V2 Onboarding Gamification API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Onboarding Gamification
paths:
  /onboarding/v2/gamification/status:
    get:
      summary: Get the gamification status and the details of available gamification tasks
      operationId: OnboardingGamificationV2Controller_GetGamificationStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingGamificationGetGamificationStatusResponse'
      tags:
      - Onboarding Gamification
      description: Get the gamification status and the details of available gamification tasks.
  /onboarding/v2/gamification/tasks/{taskName}/complete:
    post:
      summary: Manually complete a gamification task.
      operationId: OnboardingGamificationV2Controller_CompleteGamificationTask
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingGamificationCompleteGamificationTaskResponse'
      parameters:
      - name: taskName
        in: path
        required: true
        schema:
          type: string
          enum:
          - BUSINESS_NAME
          - SCHEDULING_RULES
          - INVITE_EMPLOYEE
          - PUBLISH_ROSTER
          - APPROVE_TIMESHEET
          - MOBILE_NUMBER
          - EXPLORE_ECOSYSTEM
          - BOOK_DEMO
          - PAID
      tags:
      - Onboarding Gamification
      description: Manually complete a gamification task. If the task is already completed before, we still return a successful response but nothing will change in the BE state.
components:
  schemas:
    modelGamificationStatus:
      type: object
      properties:
        isGamificationEnabled:
          type: boolean
          description: Whether the gamification feature is enabled for this trial. Will be false if the install is not in trial.
        trialDaysLeft:
          type: integer
          format: int32
          title: The amount of trial days left before this trial expires
        trialEndDate:
          type: string
          format: date-time
          title: The trial end date
        signupPlatform:
          $ref: '#/components/schemas/modelSignupPlatform'
          title: The platform that this installation was first signed up from
      title: The gamification status for a trial business
    modelGamificationTask:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/modelGamificationTaskName'
          title: The gamification task name
        isCompleted:
          type: boolean
          title: Whether the task has been completed or not
        trialDaysGiven:
          type: integer
          format: int32
          title: Number of trial days given when the task is completed
        sortOrder:
          type: integer
          format: int32
          description: Sort order for displaying the task in FE. May vary depending on the trial signup intent.
        completedAt:
          type: string
          format: date-time
          title: The time when the task was completed
      title: Details of a single gamification task
    OnboardingGamificationGetGamificationStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelGamificationInfo'
    modelGamificationTaskName:
      type: string
      enum:
      - BUSINESS_NAME
      - SCHEDULING_RULES
      - INVITE_EMPLOYEE
      - PUBLISH_ROSTER
      - APPROVE_TIMESHEET
      - MOBILE_NUMBER
      - EXPLORE_ECOSYSTEM
      - BOOK_DEMO
      - PAID
      default: BUSINESS_NAME
      title: Valid gamification tasks
    modelGamificationInfo:
      type: object
      properties:
        gamificationStatus:
          $ref: '#/components/schemas/modelGamificationStatus'
          description: General gamification status, trial end date and remaining days etc.
        gamificationTasks:
          type: array
          items:
            $ref: '#/components/schemas/modelGamificationTask'
          title: Array of all available gamification tasks and their respective status
      title: All gamification-related information of a trial business
    modelSignupPlatform:
      type: string
      enum:
      - WEB
      - MOBILE_APP
      - API
      default: WEB
      title: Platforms that an install can be signed up from
    OnboardingGamificationCompleteGamificationTaskResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelGamificationInfo'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
