openapi: 3.2.0
info:
  title: Deputy V2 Reaction API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Reaction
paths:
  /management/v2/reaction:
    post:
      summary: Create a new reaction
      operationId: ReactionV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionCreateResponse'
      tags:
      - Reaction
      description: Create a new reaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelReaction'
  /management/v2/reaction/{id}:
    delete:
      summary: Delete an existing reaction
      operationId: ReactionV2Controller_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Reaction
      description: Delete an existing reaction.
components:
  schemas:
    ReactionDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
    v2modelReaction:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Reaction ID
        orm:
          type: string
          title: Reaction orm
        recId:
          type: string
          format: int64
          title: Reaction rec_id
        reaction:
          type: string
          format: int64
          title: Reaction reaction
        creator:
          type: string
          format: int64
          title: Reaction creator
        created:
          type: string
          format: date-time
          title: Timestamp of when the Reaction was created
        modified:
          type: string
          format: date-time
          title: Timestamp of when the Reaction was last modified
      title: Reaction
    ReactionCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelReaction'
      title: Create Reaction response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
