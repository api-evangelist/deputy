openapi: 3.2.0
info:
  title: Deputy V1 My Feed API
  version: 1.0.0
  description: 'Generated reference for Deputy''s legacy V1 `/supervise/` (supervisor-level operations) and `/my/` (authenticated-employee operations) endpoints.


    Enumerated statically from router classes under `deputy-webapp/app/api/v1/routers/Super*Router.php` and `My*Router.php`. V1 is in maintenance mode — new integrations should prefer V2.


    This spec covers only the `/my/*` routes. The sibling family is in a separate ReadMe spec.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
tags:
- name: Feed
  description: V1 /my/feed/* endpoints
paths:
  /my/feed/range/{start}/to/{end}:
    get:
      tags:
      - Feed
      summary: GET Feed / :end
      operationId: my_feed__range_start_to_end_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: start
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9]{2,4}\-[0-9]{1,2}\-[0-9]{1,2}'
      - name: end
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9]{2,4}\-[0-9]{1,2}\-[0-9]{1,2}'
  /my/feed/single/{date}:
    get:
      tags:
      - Feed
      summary: GET Feed / :date)?
      operationId: my_feed__single_date__get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9]{2,4}\-[0-9]{1,2}\-[0-9]{1,2}'
  /my/feed/summary/{start}/to/{end}:
    get:
      tags:
      - Feed
      summary: GET Feed / :end
      operationId: my_feed__summary_start_to_end_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: start
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9]{2,4}\-[0-9]{1,2}\-[0-9]{1,2}'
      - name: end
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9]{2,4}\-[0-9]{1,2}\-[0-9]{1,2}'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token or Deputy Permanent Token.
x-provenance:
  method: harvested
  publisher: Deputy
  source: https://developer.deputy.com/openapi/deputy-v1-my-api.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
