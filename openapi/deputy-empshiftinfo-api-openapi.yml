openapi: 3.2.0
info:
  title: Deputy V1 Supervise Empshiftinfo API
  version: 1.0.0
  description: 'Generated reference for Deputy''s legacy V1 `/supervise/` (supervisor-level operations) and `/my/` (authenticated-employee operations) endpoints.


    Enumerated statically from router classes under `deputy-webapp/app/api/v1/routers/Super*Router.php` and `My*Router.php`. V1 is in maintenance mode — new integrations should prefer V2.


    This spec covers only the `/supervise/*` routes. The sibling family is in a separate ReadMe spec.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
tags:
- name: Empshiftinfo
  description: V1 /supervise/empshiftinfo/* endpoints
paths:
  /supervise/empshiftinfo/{intEmpId}/{blnAllCompany}:
    get:
      tags:
      - Empshiftinfo
      summary: GET Empshiftinfo / :blnAllCompany)?
      operationId: supervise_empshiftinfo__intempid_blnallcompany__get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: intEmpId
        in: path
        required: true
        schema:
          type: integer
          pattern: \d+
      - name: blnAllCompany
        in: path
        required: true
        schema:
          type: string
          pattern: (true|false)
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token or Deputy Permanent Token.
