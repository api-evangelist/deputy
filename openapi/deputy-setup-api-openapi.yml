      tags:
      - Setup
      summary: GET Setup / :action
      operationId: my_setup__gamingfy_action_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          pattern: (list|decline)
    post:
      tags:
      - Setup
      summary: POST Setup / :action
      operationId: my_setup__gamingfy_action_post
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          pattern: (list|decline)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
