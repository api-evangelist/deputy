openapi: 3.2.0
info:
  title: Deputy V1 My Setup API
  version: 1.0.0
  description: 'Generated reference for Deputy''s legacy V1 `/supervise/` (supervisor-level operations) and `/my/` (authenticated-employee operations) endpoints.


    Enumerated statically from router classes under `deputy-webapp/app/api/v1/routers/Super*Router.php` and `My*Router.php`. V1 is in maintenance mode — new integrations should prefer V2.


    This spec covers only the `/my/*` routes. The sibling family is in a separate ReadMe spec.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
tags:
- name: Setup
  description: V1 /my/setup/* endpoints
paths:
  /my/setup:
    get:
      tags:
      - Setup
      summary: List or get Setup
      operationId: my_setup__get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
  /my/setup/addNewWorkplace:
    post:
      tags:
      - Setup
      summary: POST Setup / addNewWorkplace
      operationId: my_setup__addnewworkplace_post
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /my/setup/apps:
