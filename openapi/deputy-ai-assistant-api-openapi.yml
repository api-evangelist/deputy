openapi: 3.2.0
info:
  title: Deputy V2 AI Assistant API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: AI Assistant
paths:
  /ai-assistant/v2/settings:
    get:
      operationId: AIAssistantV2Controller_getSettings
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsGetSettingsResponse'
      tags:
      - AI Assistant
      summary: Get settings
      description: Get settings.
components:
  schemas:
    SettingsGetSettingsData:
      type: object
      properties:
        showDeputyAi:
          type: boolean
    SettingsGetSettingsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/SettingsGetSettingsData'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
