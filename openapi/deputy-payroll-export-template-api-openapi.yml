openapi: 3.2.0
info:
  title: Deputy V2 Payroll Export Template API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Payroll Export Template
paths:
  /management/v2/payroll-export-templates:
    get:
      summary: Get all Templates
      operationId: PayrollExportTemplatesV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollExportTemplatesListResponse'
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Payroll Export Template
      description: Get all Templates.
    post:
      summary: Create a new Template
      operationId: PayrollExportTemplatesV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollExportTemplatesCreateResponse'
      tags:
      - Payroll Export Template
      description: Create a new Template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelPayrollExportTemplates'
  /management/v2/payroll-export-templates/{id}:
    get:
      summary: Get a Template with given ID
      operationId: PayrollExportTemplatesV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollExportTemplatesGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Payroll Export Template
      description: Get a Template with given ID.
    delete:
      summary: Delete a Template
      operationId: PayrollExportTemplatesV2Controller_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollExportTemplatesDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Payroll Export Template
      description: Delete a Template.
    put:
      summary: Update a Template
      operationId: PayrollExportTemplatesV2Controller_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollExportTemplatesUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Payroll Export Template
      description: Update a Template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelPayrollExportTemplates'
components:
  schemas:
    PayrollExportTemplatesCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelPayrollExportTemplates'
      title: Create Template response
    modelTemplateType:
      type: string
      enum:
      - TYPE_UNKNOWN
      - DEPUTY_TEMPLATE
      - CUSTOMER_TEMPLATE
      default: TYPE_UNKNOWN
    PayrollExportTemplatesUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelPayrollExportTemplates'
      title: Update Template response
    v2modelPayrollExportTemplates:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Template ID
        label:
          type: string
          title: Template label (name)
        data:
          type: string
          title: Template data
        type:
          $ref: '#/components/schemas/modelTemplateType'
          title: Template type
        scriptId:
          type: integer
          format: int32
          title: Template associated script ID
        createdById:
          type: integer
          format: int32
          title: Template creator ID
        createdAt:
          type: string
          format: date-time
          title: Timestamp when the Template was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp when the Template was modified
      title: Payroll Export Templates
    PayrollExportTemplatesListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelPayrollExportTemplates'
        nextCursor:
          type: string
      title: Get all Templates response
    PayrollExportTemplatesGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelPayrollExportTemplates'
      title: Get Template response
    PayrollExportTemplatesDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      title: Delete Template response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
