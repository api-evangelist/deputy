openapi: 3.2.0
info:
  title: Deputy V2 Custom Fields API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Custom Fields
paths:
  /management/v2/custom-fields:
    get:
      summary: Retrieve custom fields data
      operationId: CustomFieldsV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldsGetResponse'
      parameters:
      - name: recordType
        description: Record type.
        in: query
        required: false
        schema:
          type: string
          enum:
          - ROSTER
          - TIMESHEET
          - EMPLOYEE
          default: ROSTER
      - name: areas
        description: List of area ids.
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      tags:
      - Custom Fields
      description: Retrieve custom fields data.
  /management/v2/custom-fields/all-by-record-type:
    get:
      operationId: CustomFieldsV2Controller_getCustomFieldsByRecordType
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldsGetResponse'
      parameters:
      - name: recordType
        description: Record type.
        in: query
        required: false
        schema:
          type: string
          enum:
          - ROSTER
          - TIMESHEET
          - EMPLOYEE
          default: ROSTER
      tags:
      - Custom Fields
      summary: Get custom fields by record type
      description: Get custom fields by record type.
components:
  schemas:
    CustomFieldsGetResponse:
      type: object
      properties:
        success:
          type: boolean
          title: successful response
        data:
          type: array
          items:
            $ref: '#/components/schemas/tenantcustom_fieldsv2modelCustomField'
          title: a list of custom fields
    tenantcustom_fieldsv2modelCustomField:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Custom Field ID
        recordType:
          $ref: '#/components/schemas/modelRecordType'
          title: recordType (one of ROSTER or TIMESHEET or EMPLOYEE)
        title:
          type: string
          title: title (formerly name)
        identifier:
          type: string
          title: identifier (formerly apiName)
        dataField:
          type: string
          title: data field (formerly deputyField)
        sortOrder:
          type: integer
          format: int32
          title: ranking sort order
        defaultValue:
          type: string
          title: default value (formerly default)
        type:
          type: integer
          format: int32
          title: type
        displayTiming:
          type: integer
          format: int32
          title: display timing
        conditionalRules:
          type: string
          title: conditional rules
        action:
          type: integer
          format: int32
          title: action
        published:
          type: boolean
          title: published
        valueList:
          type: array
          items:
            type: string
          title: value list for custom fields that can have multiple values
        visible:
          type: boolean
          title: visible
        triggerScript:
          type: integer
          format: int32
          title: script to trigger custom field value
        validation:
          type: array
          items:
            type: string
          title: validation
        helptext:
          type: string
          title: helptext
        areas:
          type: array
          items:
            type: integer
            format: int32
          title: area ids this custom field applies to
        creator:
          type: integer
          format: int32
          title: creator
        createdAt:
          type: string
          title: date the custom field was created, format ISO8601 eg 2012-12-18T13:45:00+01:00
        modifiedAt:
          type: string
          title: date the custom field was modified, format ISO8601 eg 2012-12-18T13:45:00+01:00
        employeeVisible:
          type: boolean
      title: CustomField
    modelRecordType:
      type: string
      enum:
      - ROSTER
      - TIMESHEET
      - EMPLOYEE
      default: ROSTER
      title: RecordType (formerly System)
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
