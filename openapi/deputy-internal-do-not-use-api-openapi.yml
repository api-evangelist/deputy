openapi: 3.2.0
info:
  title: Deputy V2 Internal - Do not use API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Internal - Do not use
paths:
  /v2/flag-record/{key}:toggle:
    put:
      summary: Toggle a Flag Record with provided key and tag, only for internal use
      description: (Internal use only) Toggles a flag record with provided key and tag.
      operationId: FlagRecordV2Controller_toggleByTag
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagRecordToggleByTagResponse'
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      tags:
      - Internal - Do not use
  /management/v2/shifts/micro-scheduling:toggle:
    post:
      summary: Toggle micro scheduling
      description: (Internal use only) Toggles the micro scheduling for the business.
      operationId: ScheduleShiftV2Controller_toggleMicroScheduling
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftToggleMicroSchedulingResponse'
      tags:
      - Internal - Do not use
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftToggleMicroSchedulingRequestData'
components:
  schemas:
    ScheduleShiftToggleMicroSchedulingRequestData:
      type: object
      properties:
        enable:
          type: boolean
    FlagRecordToggleByTagResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
    ScheduleShiftToggleMicroSchedulingResponse:
      type: object
      properties:
        success:
          type: boolean
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
