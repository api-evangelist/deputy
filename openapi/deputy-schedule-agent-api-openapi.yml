openapi: 3.2.0
info:
  title: Deputy V2 Schedule Agent API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Schedule Agent
paths:
  /agent/schedule/v2/late:
    get:
      summary: Get employees who are currently late or were late in the given time range
      description: 'Note: This endpoint processes a maximum of 1000 rosters per request to ensure

        reliable performance. For businesses with more shifts in the given time range,

        use shorter time ranges or filter by specific locations to ensure all late

        employees are captured.'
      operationId: ScheduleAgentV2Controller_getLate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleAgentGetLateResponse'
      parameters:
      - name: startDate
        description: Start date (Y-m-d format, e.g., "2024-01-15"). Required. Must be on or before 'endDate'.
        in: query
        required: false
        schema:
          type: string
      - name: endDate
        description: End date (Y-m-d format, e.g., "2024-01-16"). Required. Must be on or after 'startDate'.
        in: query
        required: false
        schema:
          type: string
      - name: locationIds
        description: Optional - if empty, uses all locations the user has access to.
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: cursor
        description: Pagination cursor for retrieving subsequent pages.
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: Results per page (default 50, max 250).
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Schedule Agent
  /agent/schedule/v2/shifts:upsert:
    post:
      summary: Batch create or update shifts
      description: Creates or updates multiple shifts in a single request. Maximum 500 items per request. Each item is processed independently - partial failures are allowed. Use id=0 or omit id for creates, provide id for updates. Set async=true to process asynchronously and poll via /api/operations/v2/operations/{id}.
      operationId: ScheduleAgentV2Controller_upsertShifts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleAgentUpsertShiftsResponse'
      parameters:
      - name: async
        description: 'When true, process the request asynchronously. Returns immediately with

          operationId and pending count. Use /api/operations/v2/operations/{id} to poll for results.'
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Schedule Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleAgentUpsertShiftsRequestUpsertData'
components:
  schemas:
    ScheduleAgentGetLateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleAgentLateEntry'
        metadata:
          $ref: '#/components/schemas/ScheduleAgentMetadata'
      title: Response for getLate endpoint
    ScheduleAgentMetadata:
      type: object
      properties:
        nextCursor:
          type: string
      title: Metadata for pagination
    ScheduleAgentUpsertShiftsResponse:
      type: object
      properties:
        success:
          type: boolean
          title: Overall success - true if at least one item succeeded
        data:
          type: array
          items:
            $ref: '#/components/schemas/UpsertShiftsResponseUpsertResult'
          title: Per-item results in same order as request
        metadata:
          $ref: '#/components/schemas/ScheduleAgentUpsertShiftsResponseMetadata'
          title: Metadata about the upsert operation
      description: Response from upsert shifts. Synchronous and asynchronous modes.
    UpsertShiftsResponseUpsertResult:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: The shift ID (new for creates, existing for updates)
        success:
          type: boolean
          title: Whether this item succeeded
        errorCode:
          type: string
          title: Error code if failed (empty if succeeded)
        errorMessage:
          type: string
          title: Error message if failed (empty if succeeded)
        index:
          type: integer
          format: int32
          title: Index of the item in the request (for correlation)
        created:
          type: boolean
          title: Whether this was a create (true) or update (false)
    tenantsharedv2modelCustomField:
      type: object
      properties:
        id:
          type: string
          format: int64
        booleanField:
          $ref: '#/components/schemas/modelBooleanField'
        stringField:
          $ref: '#/components/schemas/modelStringField'
        listField:
          $ref: '#/components/schemas/modelListField'
        multiListField:
          $ref: '#/components/schemas/modelMultiListField'
        fileField:
          $ref: '#/components/schemas/modelFileField'
          title: file id
        employeeVisible:
          type: boolean
    modelMultiListField:
      type: object
      properties:
        value:
          type: array
          items:
            type: string
    ScheduleAgentUpsertShiftsRequestUpsertItem:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Shift ID for updates. Omit or use 0 for create operations.
        areaId:
          type: integer
          format: int32
          title: Area ID where shift is allocated (required for create)
        date:
          type: string
          title: Shift date (Y-m-d format, e.g., "2024-01-15") (required for create)
        start:
          type: string
          title: Shift start time (HH:MM format, e.g., "09:00") (required for create)
        end:
          type: string
          title: Shift end time (HH:MM format, e.g., "17:00") (required for create)
        employeeId:
          type: integer
          format: int32
          title: Employee ID to assign (0 for unassigned/open shift)
        note:
          type: string
          title: Notes or comments regarding the shift
        isOpen:
          type: boolean
          title: 'Whether shift is open (default: false)'
        isApprovalRequired:
          type: boolean
          title: 'Whether approval is required for this shift. Must also be open = true (default: false)'
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleAgentUpsertShiftBreak'
          title: Break slots within the shift
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/tenantsharedv2modelCustomField'
          title: Custom field values
        children:
          type: array
          items:
            $ref: '#/components/schemas/UpsertShiftsRequestChildItem'
          title: Child shifts (for microscheduling)
        updateFields:
          type: array
          items:
            type: string
          description: 'REQUIRED for update operations (id > 0). Specifies which fields to modify;

            fields not listed retain their existing values. Omitting this field on an

            update returns a 400 validation error. Ignored for create operations (id = 0).

            Valid values: "areaId", "date", "start", "end", "employeeId", "note",

            "isOpen", "isApprovalRequired", "breaks", "customFields", "children",

            "breakDuration", "publish".'
        breakDuration:
          type: integer
          format: int32
          description: 'Meal break duration in minutes. Cannot be used together with breaks.

            0 = clear/remove meal break, >0 = set meal break to N minutes.'
        publish:
          type: boolean
          title: 'Whether shift should be published (default: false)'
    ScheduleAgentUpsertShiftBreak:
      type: object
      properties:
        start:
          type: string
          title: Break start time (HH:MM format, e.g., "12:00")
        end:
          type: string
          title: Break end time (HH:MM format, e.g., "12:30")
        type:
          $ref: '#/components/schemas/ScheduleAgentUpsertShiftBreakType'
          title: Break Type determines break category
        typeLabel:
          type: string
          title: Break type label/name from config
      title: Break slot within a shift
    ScheduleAgentShiftInfo:
      type: object
      properties:
        id:
          type: integer
          format: int32
        startTime:
          type: string
        endTime:
          type: string
        areaId:
          type: integer
          format: int32
        areaName:
          type: string
        locationId:
          type: integer
          format: int32
        locationName:
          type: string
    modelListField:
      type: object
      properties:
        value:
          type: string
    ScheduleAgentUpsertShiftsResponseMetadata:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/MetadataSummary'
          title: Summary counts for the operation
        operationId:
          type: string
          description: 'Operation ID for async requests. Use /api/operations/v2/operations/{id} to poll for results.

            Empty for synchronous requests.'
    modelFileField:
      type: object
      properties:
        value:
          type: integer
          format: int32
    UpsertShiftsRequestChildItem:
      type: object
      properties:
        areaId:
          type: integer
          format: int32
          title: Area ID where child shift is allocated (required)
        start:
          type: string
          title: Child shift start time (HH:MM format, e.g., "13:00") (required)
        end:
          type: string
          title: Child shift end time (HH:MM format, e.g., "17:00") (required)
      title: Child shift for split shift scenarios
    ScheduleAgentUpsertShiftsRequestUpsertData:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleAgentUpsertShiftsRequestUpsertItem'
          description: Array of shifts to create or update. Maximum 500 items.
        override:
          type: boolean
          description: 'When true, bypasses soft validation warnings (untrained, on leave, unavailable).

            Hard validation errors (overlapping shifts, permission denied) are NOT overridable.'
    ScheduleAgentLateStatus:
      type: string
      enum:
      - UNKNOWN
      - CURRENTLY_LATE
      - LATE
      default: UNKNOWN
    modelStringField:
      type: object
      properties:
        value:
          type: string
    ScheduleAgentUpsertShiftBreakType:
      type: string
      enum:
      - UNKNOWN_BREAK_TYPE
      - MEAL
      - REST
      default: UNKNOWN_BREAK_TYPE
      title: Type of break
    ScheduleAgentLateEntry:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
        employeeName:
          type: string
        shift:
          $ref: '#/components/schemas/ScheduleAgentShiftInfo'
        timesheet:
          $ref: '#/components/schemas/ScheduleAgentTimesheetInfo'
        minutesLate:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ScheduleAgentLateStatus'
    modelBooleanField:
      type: object
      properties:
        value:
          type: boolean
          default: 'false'
    MetadataSummary:
      type: object
      properties:
        total:
          type: integer
          format: int32
          title: Total number of items processed
        succeeded:
          type: integer
          format: int32
          title: Number of items that succeeded
        failed:
          type: integer
          format: int32
          title: Number of items that failed
        pending:
          type: integer
          format: int32
          title: Number of items pending processing (async mode only, 0 for sync)
    ScheduleAgentTimesheetInfo:
      type: object
      properties:
        id:
          type: integer
          format: int32
        startTime:
          type: string
        endTime:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
