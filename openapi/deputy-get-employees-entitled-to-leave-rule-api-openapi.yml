openapi: 3.2.0
info:
  title: Deputy V2 Get Employees Entitled To Leave rule API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Get Employees Entitled To Leave rule
paths:
  /management/v2/leave-entitlements/leave-rules/{leaveRuleId}:
    get:
      summary: Get employees by entitled leave rule
      operationId: LeaveEntitlementsV2Controller_GetEntitledEmployeesByLeaveRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveEntitlementsGetEntitledEmployeesByLeaveRuleResponse'
      parameters:
      - name: leaveRuleId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Get Employees Entitled To Leave rule
      description: Get employees by entitled leave rule.
components:
  schemas:
    LeaveEntitlementsGetEntitledEmployeesByLeaveRuleResponse:
      type: object
      properties:
        success:
          type: boolean
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
