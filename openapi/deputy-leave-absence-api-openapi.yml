openapi: 3.2.0
info:
  title: Deputy V2 Leave Absence API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Absence
paths:
  /management/v2/leave-absence/validate:
    post:
      summary: Validate employee leave absences
      operationId: LeaveAbsenceV2Controller_validateLeaveAbsence
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveAbsenceValidateLeaveAbsenceResponse'
      tags:
      - Leave Absence
      description: Validate employee leave absences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveAbsenceValidateLeaveAbsenceRequest'
components:
  schemas:
    LeaveAbsenceValidateLeaveAbsenceResponse:
      type: object
      properties:
        success:
          type: boolean
        warnings:
          $ref: '#/components/schemas/modelLeaveAbsenceWarnings'
    v2modelUnit:
      type: string
      enum:
      - UNIT_UNKNOWN
      - UNIT_HOUR
      - UNIT_DAY
      default: UNIT_UNKNOWN
    modelBalanceLimitWarning:
      type: object
      properties:
        leaveRuleId:
          type: string
        leaveRuleName:
          type: string
        leaveRuleUnit:
          $ref: '#/components/schemas/v2modelUnit'
        threshold:
          type: number
          format: double
        exceededAmount:
          type: number
          format: double
    v2modelLeaveAbsence:
      type: object
      properties:
        leaveRuleId:
          type: integer
          format: int32
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    modelAffectedDate:
      type: object
      properties:
        date:
          type: string
          title: yyyy-mm-dd
        employeesOnLeaveCount:
          type: integer
          format: int32
          title: people already on leave that day
    modelLeaveAbsenceWarnings:
      type: object
      properties:
        balanceLimits:
          type: array
          items:
            $ref: '#/components/schemas/modelBalanceLimitWarning'
        concurrentLeaveCaps:
          $ref: '#/components/schemas/modelConcurrentLeaveCapWarning'
    LeaveAbsenceValidateLeaveAbsenceRequest:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
        absences:
          type: array
          items:
            $ref: '#/components/schemas/v2modelLeaveAbsence'
    modelConcurrentLeaveCapWarning:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        locationName:
          type: string
        maxConcurrentLeave:
          type: integer
          format: int32
        affectedDates:
          type: array
          items:
            $ref: '#/components/schemas/modelAffectedDate'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
