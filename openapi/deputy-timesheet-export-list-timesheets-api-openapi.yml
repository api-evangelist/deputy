openapi: 3.2.0
info:
  title: Deputy V2 Timesheet Export List Timesheets API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Timesheet Export List Timesheets
paths:
  /management/v2/timesheet-export/{exportId}/timesheets:
    get:
      summary: Retrieve list of timesheets by export id
      operationId: TimesheetsV2Controller_listByExportId
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsListExportedTimesheetsResponse'
      parameters:
      - name: exportId
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      tags:
      - Timesheet Export List Timesheets
      description: Retrieve list of timesheets by export id.
components:
  schemas:
    tenanttimesheetv2modelTimesheet:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Timesheets ID
        employeeId:
          type: integer
          format: int32
          title: Employee ID
        employeeHistoryId:
          type: integer
          format: int32
          title: Employee History ID
        employeeAgreementId:
          type: integer
          format: int32
          title: Employee Agreement ID
        start:
          type: string
          format: date-time
          title: Timesheets start time
        end:
          type: string
          format: date-time
          title: Timesheets end time
        mealBreak:
          type: number
          format: float
          title: Meal Break in minutes
        mealBreakSlots:
          type: array
          items:
            $ref: '#/components/schemas/modelBreak'
          title: Break Slots
        slots:
          type: string
          title: Slot
        totalTime:
          type: number
          format: float
          title: Total Time
        totalTimeInvoiced:
          type: number
          format: float
          title: Total Time Invoiced
        cost:
          type: number
          format: float
          title: Cost
        shiftId:
          type: integer
          format: int32
          title: Shift ID
        comments:
          type: array
          items:
            type: string
          title: Timesheet Comments
        isDisputed:
          type: boolean
          title: Is Disputed
        isTimeApproved:
          type: boolean
          title: Is Time Approved
        approvedById:
          type: integer
          format: int32
          title: Approver ID
        isDiscarded:
          type: boolean
          title: Is Discarded
        validationFlag:
          $ref: '#/components/schemas/modelValidationFlag'
          title: Validation Flag
        areaId:
          type: integer
          format: int32
          title: Area ID
        isInProgress:
          type: boolean
          title: Is In Progress
        isLeave:
          type: boolean
          title: Is Leave
        leaveId:
          type: integer
          format: int32
          title: Leave ID
        leaveRuleId:
          type: integer
          format: int32
          title: Leave Rule ID
        isInvoiced:
          type: boolean
          title: Is Invoiced
        invoiceComment:
          type: string
          title: Invoice Comment
        isPayRuleApproved:
          type: boolean
          title: Is Pay Rule Approved
        isExported:
          type: boolean
          title: Is Exported
        stagingId:
          type: integer
          format: int32
          title: Staging ID
        isPayStaged:
          type: boolean
          title: Is Pay Staged
        payCycleId:
          type: integer
          format: int32
          title: Pay Cycle ID
        fileId:
          type: integer
          format: int32
          title: File ID
        customFieldDataId:
          type: integer
          format: int32
          title: Custom Field Data
        isRealTime:
          type: boolean
          title: Is Real Time
        isAutoProcessed:
          type: boolean
          title: Is Auto Processed
        isAutoRounded:
          type: boolean
          title: Is Auto Rounded
        isAutoTimeApproved:
          type: boolean
          title: Is Auto Time Approved
        isAutoPayRuleApproved:
          type: boolean
          title: Is Auto Pay Rule Approved
        parentId:
          type: integer
          format: int32
          title: Parent ID if it is a child timesheet
        children:
          type: array
          items:
            $ref: '#/components/schemas/modelChildTimesheet'
          title: child timesheets
        employeeComment:
          type: string
          title: employee comment
        areaName:
          type: string
          title: Area name
        locationId:
          type: integer
          format: int32
          title: Location ID
        locationName:
          type: string
          title: Location name
        createdById:
          type: integer
          format: int32
          title: Employee ID of who created the Timesheets
        createdAt:
          type: string
          format: date-time
          title: Timestamp when the Timesheet was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp when the Timesheet was modified
        payReturns:
          type: array
          items:
            $ref: '#/components/schemas/modelTimesheetPayReturn'
          title: Timesheet Pay Returns
        startTimeLocalized:
          type: string
          title: 'Timesheet start time localized. Format: ISO8601 eg 2012-12-18T13:45:00+01:00'
        endTimeLocalized:
          type: string
          title: 'Timesheet end time localized. Format: ISO8601 eg 2012-12-18T13:45:00+01:00'
      title: Timesheet model
    modelChildTimesheet:
      type: object
      properties:
        start:
          type: string
          title: child shift start time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        end:
          type: string
          title: child shift end time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        areaId:
          type: integer
          format: int32
        id:
          type: integer
          format: int32
        areaName:
          type: string
          title: Area name
        locationId:
          type: integer
          format: int32
          title: Location ID
        locationName:
          type: string
          title: Location name
    modelCustomFieldAnswer:
      type: object
      properties:
        identifier:
          type: string
          title: the unique identifier of the custom field (api_name)
        system:
          $ref: '#/components/schemas/CustomFieldAnswerSystem'
          title: type of the custom field, i.e. "TIMESHEET" or "EMPLOYEE"
        configs:
          type: array
          items:
            $ref: '#/components/schemas/modelCustomFieldAnswerConfig'
          title: configuration for the custom field answer, i.e. operation and acceptable answers
        type:
          $ref: '#/components/schemas/modelCustomFieldAnswerType'
          title: type of the custom field, e.g. list, boolean, number, text
        action:
          $ref: '#/components/schemas/modelCustomFieldAnswerAction'
          title: specific action we would like to perform when checking the pay rule against the question/answer; Unspecified means it's the default filtering action
    TimesheetsMetadata:
      type: object
      properties:
        nextCursor:
          type: string
    TimesheetsListExportedTimesheetsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/tenanttimesheetv2modelTimesheet'
        payRules:
          type: array
          items:
            $ref: '#/components/schemas/tenantcompliancev2modelPayRule'
        metadata:
          $ref: '#/components/schemas/TimesheetsMetadata'
    modelBreakState:
      type: string
      enum:
      - NOT_START
      - IN_PROGRESS
      - FINISHED
      - DURATION_ONLY
      - DURATION_FINISHED
      default: NOT_START
      title: Break States
    modelTrainingRequirement:
      type: object
      properties:
        module:
          type: string
          format: int64
    PayRuleRemunerationBy:
      type: string
      enum:
      - REMUNERATION_BY_UNKNOWN
      - REMUNERATION_BY_BASE
      - REMUNERATION_BY_SHIFT_LOADING
      - REMUNERATION_BY_PERIOD_LOADING
      default: REMUNERATION_BY_UNKNOWN
    modelCustomFieldAnswerAction:
      type: string
      enum:
      - UNSPECIFIED_ACTION
      - FILTER
      - TOIL_ACCRUAL
      default: UNSPECIFIED_ACTION
      title: "- UNSPECIFIED_ACTION: default is filter action, same as FILTER\n - FILTER: filter pay rule according to the CustomFieldAnswer setup\n - TOIL_ACCRUAL: convert Overtime to TimeOffInLieu when calculating shift cost"
    modelLoadingLimit:
      type: object
      properties:
        limitType:
          type: string
        limitPer:
          type: string
        customPeriod:
          type: string
        minValue:
          type: number
          format: float
        maxValue:
          type: number
          format: float
    FilterShiftSchedulingType:
      type: string
      enum:
      - UNSPECIFIED
      - SCHEDULED_ONLY
      - UNSCHEDULED_ONLY
      default: UNSPECIFIED
    modelValidationFlag:
      type: string
      enum:
      - VALIDATION_FLAG_NONE
      - VALIDATION_FLAG_GENERIC_ERROR
      - VALIDATION_FLAG_DIFFERS_FROM_ROSTER
      - VALIDATION_FLAG_SHORTER_THAN_ROSTER
      - VALIDATION_FLAG_LONGER_THAN_ROSTER
      - VALIDATION_FLAG_NO_MEALBREAK
      - VALIDATION_FLAG_SHORTER_MEALBREAK
      - VALIDATION_FLAG_LONGER_MEALBREAK
      - VALIDATION_FLAG_LATE_MEALBREAK
      - VALIDATION_FLAG_INSUFFICIENT_MEALBREAK
      - VALIDATION_FLAG_OUTSIDE_GEO_BOUNDARIES
      - VALIDATION_FLAG_SHIFT_PLAN_ISSUES
      - VALIDATION_FLAG_NO_START_PHOTO
      - VALIDATION_FLAG_NO_END_PHOTO
      - VALIDATION_FLAG_PHOTO_DOES_NOT_MATCH
      - VALIDATION_FLAG_CLOSED_BY_SYSTEM
      - VALIDATION_FLAG_SHORTER_REST_BREAK
      - VALIDATION_FLAG_SHORTER_MEAL_BREAK
      - VALIDATION_FLAG_MISSED_SCHEDULE_BREAK
      - VALIDATION_FLAG_ATTESTATION_PREVENT_CLOCK_IN
      - VALIDATION_FLAG_ATTESTATION_NOTIFY_MANAGER
      default: VALIDATION_FLAG_NONE
    v2modelFilter:
      type: object
      properties:
        customFieldAnswers:
          type: array
          items:
            $ref: '#/components/schemas/modelCustomFieldAnswer'
        recurrenceRule:
          type: string
        shiftSchedulingType:
          $ref: '#/components/schemas/FilterShiftSchedulingType'
        shiftStartTimeRange:
          type: string
        shiftEndTimeRange:
          type: string
        rRulePublicHolidayInclusion:
          $ref: '#/components/schemas/FilterRRulePublicHolidayInclusionType'
          title: Determines recurrence rule is applicable on public holiday (recurrenceRule AND public holiday condition should be met)
        particularDate:
          type: string
        applyOncePerDay:
          type: boolean
        areaNames:
          type: array
          items:
            type: string
        trainingRequirements:
          type: array
          items:
            $ref: '#/components/schemas/modelTrainingRequirement'
    tenantsharedv2modelBreakType:
      type: string
      enum:
      - MEAL_BREAK
      - REST_BREAK
      default: MEAL_BREAK
      title: Break Type
    modelBreak:
      type: object
      properties:
        slotType:
          $ref: '#/components/schemas/modelSlotType'
          title: type of slot
        start:
          type: integer
          format: int32
          title: can start break after seconds passed after shift start
        end:
          type: integer
          format: int32
          title: can end break after seconds passed after shift start
        state:
          $ref: '#/components/schemas/modelBreakState'
          title: Break state
        canStartEarly:
          type: boolean
          title: '[Deprecated] can employee start break early, override shift template'
        canEndEarly:
          type: boolean
          title: '[Deprecated] can employee end break early, override shift template'
        isMandatory:
          type: boolean
          title: '[Deprecated] is it mandatory to take this break, override shift template'
        type:
          $ref: '#/components/schemas/tenantsharedv2modelBreakType'
          title: type of break
        typeLabel:
          type: string
          title: break type name in config
        startDateTime:
          type: string
          title: format ISO8601 eg 2024-06-25T13:45:00+01:00
        endDateTime:
          type: string
          title: format ISO8601 eg 2024-06-25T13:45:00+01:00
    PayRulePayPortionRule:
      type: string
      enum:
      - PAY_PORTION_RULE_UNKNOWN
      - PAY_PORTION_RULE_GREATER
      - PAY_PORTION_RULE_EXACT
      - PAY_PORTION_RULE_FULL
      default: PAY_PORTION_RULE_UNKNOWN
    CustomFieldAnswerSystem:
      type: string
      enum:
      - UNSPECIFIED
      - TIMESHEET
      - EMPLOYEE
      - ROSTER
      default: UNSPECIFIED
    modelSlotType:
      type: string
      enum:
      - BREAK
      - WORK
      - CUSTOM
      default: BREAK
      title: Type of Slot
    modelPayConfig:
      type: object
      properties:
        roundUpHours:
          type: boolean
        loadingLimit:
          $ref: '#/components/schemas/modelLoadingLimit'
        classificationReference:
          type: string
    FilterRRulePublicHolidayInclusionType:
      type: string
      enum:
      - PH_INCLUSION_UNSPECIFIED
      - PH_ONLY
      - NON_PH_ONLY
      default: PH_INCLUSION_UNSPECIFIED
    PayRuleRemunerationType:
      type: string
      enum:
      - REMUNERATION_TYPE_UNKNOWN
      - REMUNERATION_TYPE_HOURLY
      - REMUNERATION_TYPE_MULTIPLIER
      - REMUNERATION_TYPE_UNIT
      - REMUNERATION_TYPE_SALARY
      default: REMUNERATION_TYPE_UNKNOWN
    modelTimesheetPayReturn:
      type: object
      properties:
        id:
          type: integer
          format: int32
        payRuleId:
          type: integer
          format: int32
        value:
          type: number
          format: float
        cost:
          type: number
          format: float
        overridden:
          type: boolean
        overrideComment:
          type: string
        toilValue:
          type: number
          format: float
        toilMultiplier:
          type: number
          format: float
    modelPayRuleRateType:
      type: string
      enum:
      - RATE_TYPE_UNKNOWN
      - RATE_TYPE_ORDINARY
      - RATE_TYPE_OVERTIME
      - RATE_TYPE_PENALTY
      - RATE_TYPE_NON_PAYABLE
      default: RATE_TYPE_UNKNOWN
    modelCustomFieldAnswerConfig:
      type: object
      properties:
        operation:
          type: string
          title: one of eq, neq, gt, lt, gte, lte, in, nin
        values:
          type: array
          items:
            type: string
    modelCustomFieldAnswerType:
      type: string
      enum:
      - TYPE_UNSPECIFIED
      - TYPE_LIST
      - TYPE_BOOL
      - TYPE_NUMBER
      - TYPE_TEXT
      - TYPE_BOOL_YES_COMMENT
      - TYPE_BOOL_NO_COMMENT
      default: TYPE_UNSPECIFIED
    tenantcompliancev2modelPayRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        value:
          type: number
          format: double
        remunerationBy:
          $ref: '#/components/schemas/PayRuleRemunerationBy'
        remunerationType:
          $ref: '#/components/schemas/PayRuleRemunerationType'
        isExported:
          type: boolean
        payrollCategory:
          type: string
        payPortionRule:
          $ref: '#/components/schemas/PayRulePayPortionRule'
        rateType:
          $ref: '#/components/schemas/modelPayRuleRateType'
        comment:
          type: string
        operationalUnitIds:
          type: array
          items:
            type: integer
            format: int64
        calculationRuleId:
          type: string
        calculationTypeId:
          type: string
        filter:
          $ref: '#/components/schemas/v2modelFilter'
        localContext:
          type: string
        rateTag:
          type: string
        payConfig:
          $ref: '#/components/schemas/modelPayConfig'
        levelIds:
          type: array
          items:
            type: integer
            format: int64
        levelAssnType:
          type: integer
          format: int64
        stpClass:
          type: string
        stpCode:
          type: string
        toilMultiplier:
          type: number
          format: double
          title: the Multiplier Rate that indicates how much TimeOffInLieu an hour of Overtime converts to
        leaveRuleId:
          type: integer
          format: int64
          title: the id of leave rule which TOIL Accrual goes to when TOIL is set up to convert OT to TOIL, only used with toilMultiplier
        payrollTaxCode:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
