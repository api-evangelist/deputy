openapi: 3.2.0
info:
  title: Deputy V2 Product Add Ons API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: ProductAddOns
paths:
  /v2/subscriptions/product/add-on:
    get:
      summary: Get all add on products details
      operationId: ProductAddOnsV2Controller_GetAddOnProducts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAddOnsGetAddOnProductsResponse'
      tags:
      - ProductAddOns
      description: Get all add on products details.
    post:
      operationId: ProductAddOnsV2Controller_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAddOnsSubscribeAddOnProductResponse'
      tags:
      - ProductAddOns
      summary: Update
      description: Update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductAddOnsSubscribeAddOnProductRequestData'
components:
  schemas:
    ProductAddOnsGetAddOnProductsResponse:
      type: object
      properties:
        success:
          type: boolean
        productAddOns:
          type: array
          items:
            $ref: '#/components/schemas/modelAddOnProductInfo'
        availableProductAddOns:
          type: array
          items:
            $ref: '#/components/schemas/modelAvailableAddOnProductInfo'
      title: GetAddOnProductsResponse
    modelAddOnProductInfo:
      type: object
      properties:
        planIdentifier:
          type: string
        trialAvailable:
          type: boolean
        status:
          type: string
        trialStartDate:
          type: string
          format: date-time
        trialEndDate:
          type: string
          format: date-time
        terminationDate:
          type: string
          format: date-time
        canAccess:
          type: boolean
          description: 'pre-computed value for checking whether AddOn product

            can be accessible via Tenant.'
        parentAddOn:
          type: string
          title: The parent add-on identifier that groups related add-ons together (e.g. 'hr' groups 'hr-suite-standard' and 'hr-suite-annual')
        equivalentPaymentFrequencyPlans:
          type: object
          additionalProperties:
            type: string
          title: Maps payment frequencies (e.g. 'monthly', 'annual') to their corresponding plan identifiers for equivalent add-ons
    ProductAddOnsSubscribeAddOnProductResponse:
      type: object
      properties:
        success:
          type: boolean
      title: SubscribeAddOnProduct response
    modelAvailableAddOnProductInfo:
      type: object
      properties:
        name:
          type: string
        identifier:
          type: string
        trialDays:
          type: integer
          format: int32
        prices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/modelCountryPrices'
    modelPlanPrices:
      type: object
      properties:
        price:
          type: number
          format: double
        priceInactive:
          type: number
          format: double
        period:
          type: string
    ProductAddOnsSubscribeAddOnProductRequestData:
      type: object
      properties:
        productIdentifier:
          type: string
        isTrial:
          type: boolean
        promoCode:
          type: string
          title: Promo code to apply to the add-on product
    modelCountryPrices:
      type: object
      properties:
        plans:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/modelPlanPrices'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
