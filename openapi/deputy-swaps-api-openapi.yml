          items:
            type: integer
            format: int32
        targetShiftIds:
          type: array
          items:
            type: integer
            format: int32
        role:
          $ref: '#/components/schemas/v2modelRole'
        trial:
          type: boolean
        override:
          type: boolean
    v2GetPendingSwapShiftsResponse:
      type: object
      properties:
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/tenantschedulev2modelShift'
    v2modelChildShift:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Shift ID
        start:
          type: string
          title: Shift start time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        end:
          type: string
          title: Shift end time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        cost:
          type: number
          format: float
          title: Shift total cost
        area:
          type: integer
          format: int32
          title: Area Id where shift is allocated
        canEdit:
          type: boolean
          title: Can edit this shift
        parentId:
          type: integer
          format: int32
          title: Shift parent id
        isOpen:
          type: boolean
          title: If shift is open or not
        approvalRequired:
          type: boolean
          title: If approval is required or not
        isPublished:
          type: boolean
          title: If shift is published or not
        confirmationStatus:
          $ref: '#/components/schemas/modelConfirmationStatus'
          title: Child shift confirmation status
        confirmedByWhom:
          type: integer
          format: int32
          title: Employee who confirmed the child shift
        confirmedAt:
          type: string
          title: Shift confirmation time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        creator:
          type: integer
          format: int32
          title: Employee ID who created shift
        createdAt:
          type: string
          title: When the shift was created, format ISO8601 eg 2012-12-18T13:45:00+01:00
        modifiedAt:
          type: string
          title: When the shift was modified, format ISO8601 eg 2012-12-18T13:45:00+01:00
        warning:
          type: string
        warningOverrideComment:
          type: string
        areaName:
          type: string
          title: Area name
        location:
          type: integer
          format: int32
          title: Location Id
        locationName:
          type: string
          title: Location name
      title: Child Shift
    ShiftSwapSwapRecommendationRequestData:
      type: object
      properties:
        shiftIds:
          type: array
          items:
            type: integer
            format: int32
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
        limit:
          type: integer
          format: int32
        cursor:
          type: string
        expandMetadata:
          type: boolean
          title: whether to expand metadata in response to include locations, areas, and employee profiles
    modelBooleanField:
      type: object
      properties:
        value:
          type: boolean
          default: 'false'
    ShiftSwapSwapRecommendationResponseMetadata:
