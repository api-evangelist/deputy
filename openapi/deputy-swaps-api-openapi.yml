        locations:
          type: array
          items:
            $ref: '#/components/schemas/ShiftSwapSwapRecommendationResponseMetadataLocation'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/ShiftSwapSwapRecommendationResponseMetadataArea'
        employeeProfiles:
          type: array
          items:
            $ref: '#/components/schemas/ShiftSwapSwapRecommendationResponseMetadataEmployeeProfile'
    modelSwapStatus:
      type: string
      enum:
      - SWAP_STATUS_NOT_REQUIRED
      - SWAP_STATUS_PENDING_OUT
      - SWAP_STATUS_PENDING_IN
      - SWAP_STATUS_PENDING_IN_OUT
      - SWAP_STATUS_PENDING_APPROVAL
      - SWAP_STATUS_APPROVED
      - SWAP_STATUS_CANCELLED
      - SWAP_STATUS_DECLINED
      default: SWAP_STATUS_NOT_REQUIRED
    modelViolatedRules:
      type: object
      properties:
        ruleCode:
          type: string
        warning:
          $ref: '#/components/schemas/modelViolatedRulesWarning'
        ruleConfigs:
          type: array
          items:
            $ref: '#/components/schemas/modelViolatedRulesRuleConfig'
    ShiftSwapSwapConfirmResponseData:
      type: object
      properties:
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/tenantschedulev2modelShift'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SwapConfirmResponseErrors'
        swapCost:
          type: number
          format: float
          title: swap cost after swap is greater than before, swapCost is negative
    modelViolatedRulesOperation:
      type: string
      enum:
      - NOT_SPECIFIED
      - GREATER_THAN
      - LESS_THAN
      - GREATER_THAN_OR_EQUAL
      - LESS_THAN_OR_EQUAL
      - EQUAL
      - NOT_EQUAL
      default: NOT_SPECIFIED
    tenantsharedv2modelBreakType:
      type: string
      enum:
      - MEAL_BREAK
      - REST_BREAK
      default: MEAL_BREAK
      title: Break Type
    tenantschedulev2modelShift:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Shift ID
        start:
          type: string
          title: Shift start time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        end:
          type: string
          title: Shift end time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        mealbreakDuration:
          type: number
          format: float
          title: Shift mealbreak stored in minutes
        mealbreakSlots:
          type: array
          items:
            $ref: '#/components/schemas/modelBreak'
          title: Shift break slots
        duration:
          type: number
          format: float
          title: Total hours of shift works excluding mealbreak
        cost:
          type: number
          format: float
          title: Shift total cost
        area:
          type: integer
          format: int32
          title: Area Id where shift is allocated
        employee:
          type: integer
          format: int32
          title: Employee ID the shift is assigned
        note:
          type: string
          title: Notes or comments regarding the shift
        warning:
          type: string
          title: Warning message
        warningOverrideComment:
          type: string
          title: Details once warning message is overridden
        isPublished:
          type: boolean
          title: If shift is published or not
        timesheet:
          type: integer
          format: int32
          title: Timesheet ID connected to the shift
        isOpen:
          type: boolean
          title: If shift is open or not
        approvalRequired:
          type: boolean
          title: If approval is required or not
        confirmationStatus:
          $ref: '#/components/schemas/modelConfirmationStatus'
          title: Shift confirmation status
        confirmationNote:
          type: string
          title: Message displayed on confirmation
        confirmedByWhom:
          type: integer
          format: int32
          title: Employee who confirmed the shift
        confirmedAt:
          type: string
          title: Shift confirmation time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        swapStatus:
          $ref: '#/components/schemas/modelSwapStatus'
          title: Shift swap status once shift is opened for swap
        swapApprovedBy:
          type: integer
          format: int32
          title: Shift Swap Manager ID
        shiftTemplate:
          type: integer
          format: int32
          title: Shift Template ID
        children:
          type: array
          items:
            $ref: '#/components/schemas/v2modelChildShift'
          title: Child Shifts
        canEdit:
          type: boolean
          title: Can edit this shift
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/tenantsharedv2modelCustomField'
          title: Custom Fields
        customFieldData:
          type: integer
          format: int32
          title: Custom Field Data ID
        creator:
          type: integer
          format: int32
          title: Employee ID who created shift
        createdAt:
          type: string
          title: When the shift was created, format ISO8601 eg 2012-12-18T13:45:00+01:00
        modifiedAt:
          type: string
          title: When the shift was modified, format ISO8601 eg 2012-12-18T13:45:00+01:00
        consentChangesets:
          type: array
          items:
            $ref: '#/components/schemas/modelShiftConsentChangeset'
          title: Consent changeset data
        areaName:
          type: string
          title: Area name
        location:
          type: integer
          format: int32
          title: Location Id
        locationName:
          type: string
          title: Location name
      title: Shift
    ShiftSwapSwapPendingResponseMetadataArea:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        locationId:
          type: integer
          format: int32
    ConsentConsentRecordType:
      type: string
      enum:
      - SHIFT
      - TIMESHEET
      - REGULAR_SCHEDULE
      default: SHIFT
    ShiftSwapSwapDeclineRequestData:
      type: object
      properties:
        sourceShiftIds:
          type: array
          items:
            type: integer
            format: int32
        targetShiftIds:
          type: array
          items:
            type: integer
            format: int32
        message:
          type: string
        role:
          $ref: '#/components/schemas/v2modelRole'
    ShiftSwapSwapPendingResponseMetadata:
      type: object
      properties:
        nextCursor:
          type: string
        locations:
          type: array
          items:
            $ref: '#/components/schemas/ShiftSwapSwapPendingResponseMetadataLocation'
        areas:
          type: array
          items:
            $ref: '#/components/schemas/ShiftSwapSwapPendingResponseMetadataArea'
        employeeProfiles:
          type: array
          items:
