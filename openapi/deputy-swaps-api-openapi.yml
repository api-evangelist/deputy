openapi: 3.2.0
info:
  title: Deputy V2 Swaps API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Swaps
paths:
  /management/v2/shifts/swap/pending-approvals:
    post:
      summary: Get pending approval shift swaps
      description: Retrieves shift swaps that are pending approval. Returns swap requests sorted by source shift start time and ID in ascending order. Supports filtering by location mode and pagination. Can return count-only results for performance. Includes metadata with location, area, and employee profile information.
      operationId: ShiftSwapV2Controller_getPendingApproval
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSwapSwapPendingResponse'
      parameters:
      - name: countOnly
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftSwapSwapPendingApprovalRequestData'
  /management/v2/shifts/swap:confirm:
    post:
      summary: Confirm shift swaps
      description: Confirms and executes shift swaps between source and target shifts. Swaps the employees between the specified shifts. The trial parameter allows testing the swap without committing. The override parameter bypasses validation rules. Returns the updated shifts and any errors encountered. The swapCost field indicates the cost difference after the swap (negative if cost increased).
      operationId: ShiftSwapV2Controller_confirm
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSwapSwapConfirmResponse'
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftSwapSwapConfirmRequestData'
  /management/v2/shifts/swap:decline:
    post:
      summary: Decline shift swaps
      description: Declines shift swap requests. Cancels pending swap requests between source and target shifts. The role parameter is to signify the API caller's intent, caller can behave as a manager or employee. Returns the updated shifts after the decline operation completes.
      operationId: ShiftSwapV2Controller_decline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSwapSwapDeclineResponse'
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftSwapSwapDeclineRequestData'
  /management/v2/shifts/swap:recommendation:
    post:
      summary: Get shift swap recommendations
      description: Retrieves recommended shift swaps for the specified shifts. Returns potential swap partners that would allow employees to exchange shifts. Supports filtering by employee IDs and pagination. Can include expanded metadata with location, area, and employee profile information.
      operationId: ShiftSwapV2Controller_recommend
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSwapSwapRecommendationResponse'
      tags:
      - Swaps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftSwapSwapRecommendationRequestData'
  /management/v2/shifts/{shiftId}/swap/pending:
    get:
      summary: Get pending swap details
      description: Retrieves detailed information about pending swap requests for a specific shift. Returns swap requests involving the specified shift, including source and target shift details, creator information, messages, and status.
      operationId: ShiftSwapV2Controller_getPendingDetails
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSwapSwapPendingResponse'
      parameters:
      - name: shiftId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Swaps
  /me/v2/shifts/swap:pending:
    get:
      operationId: MeV2Controller_getPendingSwapShifts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2GetPendingSwapShiftsResponse'
      parameters:
      - name: start
        description: format YYYY-MM-DD.
        in: query
        required: false
        schema:
          type: string
      - name: end
        description: format YYYY-MM-DD.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Swaps
      summary: Get pending swap shifts
      description: Get pending swap shifts.
components:
  schemas:
    ShiftSwapSwapPendingResponseMetadataEmployeeProfile:
      type: object
      properties:
        id:
          type: integer
          format: int32
        displayName:
          type: string
        photoUrl:
          type: string
        userId:
          type: integer
          format: int32
    ShiftSwapSwapRecommendationResponseData:
      type: object
      properties:
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/tenantschedulev2modelShift'
    ShiftSwapSwapPendingApprovalRequestData:
      type: object
      properties:
        locationMode:
          $ref: '#/components/schemas/LocationMode'
        locationIds:
          type: array
          items:
            type: integer
            format: int32
          title: this is required when locationMode is SELECTED
        cursor:
          type: string
        limit:
          type: integer
          format: int32
          title: default to 10
    ConsentConsentStatus:
      type: string
      enum:
      - PENDING
      - ACCEPTED
      - DECLINED
      - CANCELLED
      - OVERRIDDEN_ACCEPTED
      default: PENDING
    modelViolatedRulesWarning:
      type: object
      properties:
        message:
          type: string
    modelSlotType:
      type: string
      enum:
      - BREAK
      - WORK
      - CUSTOM
      default: BREAK
      title: Type of Slot
    ShiftSwapSwapPendingResponseMetadataLocation:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    ShiftSwapSwapRecommendationResponseMetadataArea:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        locationId:
          type: integer
          format: int32
    modelConfirmationStatus:
      type: string
      enum:
      - ROSTER_CONFIRMATION_NOT_REQUIRED
      - ROSTER_CONFIRMATION_REQUIRED
      - ROSTER_CONFIRMATION_DONE
      - ROSTER_CONFIRMATION_DECLINED
      default: ROSTER_CONFIRMATION_NOT_REQUIRED
    modelConsent:
      type: object
      properties:
        id:
          type: string
        recordId:
          type: string
        recordType:
          $ref: '#/components/schemas/ConsentConsentRecordType'
        transactionId:
          type: string
        employeeId:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ConsentConsentStatus'
        description:
          type: string
        metadata:
          $ref: '#/components/schemas/modelShiftTypeConsentMetadata'
        creator:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    ShiftConsentChangesetShiftConsentChangesetData:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
        approvalRequired:
          type: boolean
        cost:
          type: number
          format: float
        date:
          type: string
        employee:
          type: integer
          format: int32
        mealbreakSlotsUnpaidMinutes:
          type: number
          format: float
        mealbreakSlots:
          type: array
          items:
            $ref: '#/components/schemas/modelBreak'
        isOpen:
          type: boolean
        area:
          type: integer
          format: int32
        duration:
          type: number
          format: float
        location:
          type: integer
          format: int32
    ShiftSwapSwapPendingResponseData:
      type: object
      properties:
        id:
          type: integer
          format: int32
        sourceShift:
          $ref: '#/components/schemas/tenantschedulev2modelShift'
        targetShift:
          $ref: '#/components/schemas/tenantschedulev2modelShift'
        creatorId:
          type: integer
          format: int32
        targetEmployeeId:
          type: integer
          format: int32
        requestMessage:
          type: string
        responseMessage:
          type: string
        status:
          type: string
        createdAt:
          type: string
        modifiedAt:
          type: string
      title: data will be sorted by source shift start time and ID in ascending order
    ShiftConsentChangesetShiftConsentAction:
      type: string
      enum:
      - CREATE
      - MODIFY
      - DELETE
      default: CREATE
    LocationMode:
      type: string
      enum:
      - ALL
      - SELECTED
      default: ALL
      description: "LocationMode specifies how location filtering should be applied.\n\n - ALL: Include all locations accessible by the current user (no filtering)\n - SELECTED: Filter to only selected locations (requires locationIds to be provided)"
    ShiftConsentChangesetShiftConsentStatus:
      type: string
      enum:
      - PENDING
      - ACTIONED
      - AUTO_ACTIONED
      default: PENDING
    ShiftSwapSwapRecommendationResponseMetadataEmployeeProfile:
      type: object
      properties:
        id:
          type: integer
          format: int32
        displayName:
          type: string
        photoUrl:
          type: string
    SwapConfirmResponseErrors:
      type: object
      properties:
        shiftId:
          type: integer
          format: int32
        messages:
          type: array
          items:
            type: string
        canOverride:
          type: boolean
    ShiftSwapSwapConfirmRequestData:
      type: object
      properties:
        sourceShiftIds:
