      title: Break States
    ShiftSwapSwapPendingResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShiftSwapSwapPendingResponseData'
        metadata:
          $ref: '#/components/schemas/ShiftSwapSwapPendingResponseMetadata'
    modelShiftTypeConsentMetadata:
      type: object
      properties:
        comment:
          type: string
        extras:
          type: object
          additionalProperties:
            type: string
    ShiftSwapSwapRecommendationResponseMetadataLocation:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    modelMultiListField:
      type: object
      properties:
        value:
          type: array
          items:
            type: string
    modelShiftConsentChangeset:
      type: object
      properties:
        id:
          type: integer
          format: int32
        shiftId:
          type: integer
          format: int32
        consentTransactionId:
          type: string
        action:
          $ref: '#/components/schemas/ShiftConsentChangesetShiftConsentAction'
        status:
          $ref: '#/components/schemas/ShiftConsentChangesetShiftConsentStatus'
        newData:
          $ref: '#/components/schemas/ShiftConsentChangesetShiftConsentChangesetData'
        oldData:
          $ref: '#/components/schemas/ShiftConsentChangesetShiftConsentChangesetData'
        violatedRules:
          type: array
          items:
            $ref: '#/components/schemas/modelViolatedRules'
        creator:
          type: integer
          format: int32
        createdAt:
          type: string
        modifiedAt:
          type: string
        consents:
          type: array
          items:
            $ref: '#/components/schemas/modelConsent'
    modelViolatedRulesRuleConfig:
      type: object
      properties:
        field:
          type: string
          title: What field of roster is triggering the consent
        operation:
          $ref: '#/components/schemas/modelViolatedRulesOperation'
          title: What operation is used for the consent checking
        value:
          type: string
          title: The value of what is compared
        gap:
          type: integer
          format: int32
          title: How many days different between the shifts
        space:
          type: integer
          format: int32
          title: The duration from the next or previous shift to the current shift in seconds
    modelBreak:
      type: object
      properties:
        slotType:
          $ref: '#/components/schemas/modelSlotType'
          title: type of slot
        start:
          type: integer
          format: int32
          title: can start break after seconds passed after shift start
        end:
          type: integer
          format: int32
          title: can end break after seconds passed after shift start
        state:
          $ref: '#/components/schemas/modelBreakState'
          title: Break state
        canStartEarly:
          type: boolean
          title: '[Deprecated] can employee start break early, override shift template'
        canEndEarly:
          type: boolean
          title: '[Deprecated] can employee end break early, override shift template'
        isMandatory:
          type: boolean
          title: '[Deprecated] is it mandatory to take this break, override shift template'
        type:
          $ref: '#/components/schemas/tenantsharedv2modelBreakType'
          title: type of break
        typeLabel:
          type: string
          title: break type name in config
        startDateTime:
          type: string
          title: format ISO8601 eg 2024-06-25T13:45:00+01:00
        endDateTime:
          type: string
          title: format ISO8601 eg 2024-06-25T13:45:00+01:00
    modelListField:
      type: object
      properties:
        value:
          type: string
    ShiftSwapSwapConfirmResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ShiftSwapSwapConfirmResponseData'
    modelFileField:
      type: object
      properties:
        value:
          type: integer
          format: int32
    v2modelRole:
      type: string
      enum:
      - EMPLOYEE
      - MANAGER
      default: EMPLOYEE
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
