openapi: 3.2.0
info:
  title: Deputy V2 Session History API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Session History
paths:
  /v2/system-logs/session-history:
    get:
      summary: List session history records
      operationId: SessionHistoryV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistoryListResponse'
      parameters:
      - name: startTime
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: endTime
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: userId
        in: query
        required: false
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: recordType
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Session History
      description: List session history records.
components:
  schemas:
    SessionHistoryListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelSessionHistoryRecord'
        nextCursor:
          type: string
      title: List session history a.k.a system log response
    modelSessionInfo:
      type: object
      properties:
        sessionId:
          type: string
          title: a reference to the id in deputec_session table
        ip:
          type: string
        host:
          type: string
        agent:
          type: string
        sessionStart:
          type: string
          format: date-time
        loginViaPortal:
          type: boolean
    modelSessionHistoryRecord:
      type: object
      properties:
        userId:
          type: string
          format: int64
        actionTime:
          type: string
          format: date-time
        desc:
          type: string
        url:
          type: string
        action:
          type: string
        recordType:
          type: string
        recordId:
          type: string
        sessionInfo:
          $ref: '#/components/schemas/modelSessionInfo'
        ksuid:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
