openapi: 3.2.0
info:
  title: Deputy V2 Pay Comparison API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Pay Comparison
paths:
  /v2/pay-comparison/cancel-reports:
    post:
      summary: Cancel Pay Comparison reports
      description: Cancels one or more reports while they are in the `PENDING` state. Additional results will not be calculated and the Excel spreadsheet will not be created. Reports which can't be found are ignored. Reports which are not `PENDING` are ignored.
      operationId: PayComparisonController_cancelReports
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayComparisonGenericReportResponse'
      tags:
      - Pay Comparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayComparisonCancelReportsRequest'
  /v2/pay-comparison/delete-reports:
    post:
      summary: Delete Pay Comparison reports
      operationId: PayComparisonController_deleteReports
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayComparisonGenericReportResponse'
      tags:
      - Pay Comparison
      description: Delete Pay Comparison reports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayComparisonDeleteReportsRequest'
  /v2/pay-comparison/download-reports:
    post:
      summary: Download Pay Comparison reports
      operationId: PayComparisonController_downloadReport
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayComparisonDownloadReportResponse'
      tags:
      - Pay Comparison
      description: Download Pay Comparison reports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayComparisonDownloadReportRequest'
  /v2/pay-comparison/get-employees:
    post:
      summary: Gets Pay Comparison Employees
      description: Returns a list of employees matching the criteria. It is better to use the new `employeeQuery` field, which can match against contract ID and employee ID. **NB:** It is impossible to retrieve an employee if they have no contract.
      operationId: PayComparisonController_getEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayComparisonGetEmployeesResponse'
      tags:
      - Pay Comparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayComparisonGetEmployeesRequest'
  /v2/pay-comparison/get-reports:
    post:
      summary: Find a list of Pay Comparison reports
      operationId: PayComparisonController_findReports
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayComparisonGetReportResponse'
      tags:
      - Pay Comparison
      description: Find a list of Pay Comparison reports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayComparisonReportFilter'
  /v2/pay-comparison/resubmit-reports:
    post:
      summary: Resubmit Pay Comparison reports
      operationId: PayComparisonController_resubmitReports
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayComparisonResubmitReportResponse'
      tags:
      - Pay Comparison
      description: Resubmit Pay Comparison reports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayComparisonResubmitReportRequest'
  /v2/pay-comparison/submit-report:
    post:
      summary: Submit a Pay Comparison report
      description: Use this endpoint to submit a new pay comparison report. Note that you may specify `comparisonContractId` or `awardOverride` but not both. If specifying `awardOverride`, you must also specify `baseRateOverride`. `baseRateOverride` must not be specified with `comparisonContractId`.
      operationId: PayComparisonController_submitReport
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayComparisonSubmitReportResponse'
      tags:
      - Pay Comparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayComparisonSubmitReportRequest'
components:
  schemas:
    PayComparisonReportStatus:
      type: string
      enum:
      - NO_STATUS
      - PENDING
      - DONE
      - FAILED
      - CANCELLED
      default: NO_STATUS
    PayComparisonCancelReportsRequest:
      type: object
      properties:
        reportIds:
          type: array
          items:
            type: string
    PayComparisonDownloadReportRequest:
      type: object
      properties:
        reportIds:
          type: array
          items:
            type: string
    PayComparisonSubmitReportResponse:
      type: object
      properties:
        report:
          $ref: '#/components/schemas/PayComparisonReport'
        error:
          type: string
    PayComparisonEmployeeQueryFilter:
      type: object
      properties:
        contractIds:
          type: array
          items:
            type: integer
            format: int32
          description: Used to match employees by their contract linked by the agreement on their main location.
        includeEmployeeIds:
          type: array
          items:
            type: integer
            format: int32
          description: Employees with IDs matching this field will be added to the set of results, if they are not matched already.
        includeCompanyIds:
          type: array
          items:
            type: integer
            format: int32
          description: Employees that are associated with the Company matching any of the IDs will be added to the set of results.
        includeTrainingModuleIds:
          type: array
          items:
            type: integer
            format: int32
          description: Employees that have any of the matching TrainingModule IDs.
        includeJobPositions:
          type: array
          items:
            type: string
          description: Employees based on the given Job Positions. (Will be set to empty if install is not Enterprise).
        includeEmployeesWithNameLike:
          type: string
          description: Employees will be added to the results if they have Name matching this value. `%` can be used as a wildcard.
    PayComparisonDownloadReportResponse:
      type: object
      properties:
        downloadURLs:
          type: array
          items:
            type: string
    PayComparisonGetEmployeesResponse:
      type: object
      properties:
        employees:
          type: array
          items:
            $ref: '#/components/schemas/PayComparisonEmployee'
        totalCount:
          type: integer
          format: int32
    PayComparisonGetReportResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/PayComparisonReport'
        totalCount:
          type: integer
          format: int32
    PayComparisonEmployee:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        profilePictureURL:
          type: string
        contractId:
          type: integer
          format: int32
        payrollId:
          type: string
        mainLocation:
          type: string
        contractName:
          type: string
        basePayRate:
          type: string
    PayComparisonEmployeeFilter:
      type: object
      properties:
        limit:
          type: integer
          format: int32
          description: Limit the result set returned after applying filters.
        offset:
          type: integer
          format: int32
          description: Offset (from the first result) the result set returned after applying filters.
        contractIds:
          type: array
          items:
            type: integer
            format: int32
          description: Filter the employees based on main contract.
    PayComparisonReport:
      type: object
      properties:
        name:
          type: string
        reportId:
          type: string
        creatorEmail:
          type: string
        status:
          $ref: '#/components/schemas/PayComparisonReportStatus'
        start:
          type: string
        end:
          type: string
        employeeFilter:
          $ref: '#/components/schemas/PayComparisonEmployeeFilter'
        expectedResultCount:
          type: integer
          format: int32
          description: Count of the results which are required to be in the `DONE` status in order for the report to finish.
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
        awardOverride:
          type: string
        baseRateOverride:
          type: number
          format: float
        comparisonContractId:
          type: integer
          format: int32
        created:
          type: string
        doneResultCount:
          type: integer
          format: int32
          description: Count of the results for the report which have the `DONE` status.
        outerLimitOvertime:
          type: number
          format: float
        outerLimitPenalty:
          type: number
          format: float
        includeOuterLimitOvertime:
          type: boolean
        includeOuterLimitPenalty:
          type: boolean
        workPeriodCycle:
          $ref: '#/components/schemas/PayComparisonReportWorkPeriodCycle'
        employeeQuery:
          $ref: '#/components/schemas/PayComparisonEmployeeQuery'
    PayComparisonSubmitReportRequest:
      type: object
      properties:
        name:
          type: string
          description: A user-defined name for the report.
        creatorEmail:
          type: string
          description: The email address of the report creator. This email address will receive an email notification when the report has completed.
        start:
          type: string
          description: '`yyyy-mm-dd` start date of the report time period.'
        end:
          type: string
          description: '`yyyy-mm-dd` end date of the report time period.'
        comparisonContractId:
          type: integer
          format: int32
          description: ID of the EmploymentContract to use for comparison. Set this to empty string if using awardOverride.
        awardOverride:
          type: string
          description: Name of the award to use for comparison, e.g. `au/casual-2022-01-01-teachersa-earlychildhood-1`
        awardBaseRateOverride:
          type: number
          format: float
          description: The base hourly rate to use for comparison with an award.
        outerLimitOvertime:
          type: number
          format: float
          description: Outer limit value for overtime pay, in hours. Optional, default 0.
        outerLimitPenalty:
          type: number
          format: float
          description: Outer limit value for penalty pay, in hours. Optional, default 0.
        includeOuterLimitOvertime:
          type: boolean
          description: Whether outer limit should be used for overtime. Optional, default false.
        includeOuterLimitPenalty:
          type: boolean
          description: Whether outer limit should be used for penalty. Optional, default false.
        workPeriodCycle:
          $ref: '#/components/schemas/PayComparisonReportWorkPeriodCycle'
        employeeFilter:
          $ref: '#/components/schemas/PayComparisonEmployeeFilter'
          description: Deprecated, please use `employeeQuery`.
        employeeQuery:
          $ref: '#/components/schemas/PayComparisonEmployeeQuery'
    PayComparisonResubmitReportRequest:
      type: object
      properties:
        reportIds:
          type: array
          items:
            type: string
        startDate:
          type: string
          description: '`yyyy-mm-dd` optional start date override for the re-run reports. If provided, `endDate` must also be provided, and `startDate` must be earlier than or equal to `endDate`.'
        endDate:
          type: string
          description: '`yyyy-mm-dd` optional end date override for the re-run reports. If provided, `startDate` must also be provided, and `startDate` must be earlier than or equal to `endDate`.'
    PayComparisonGetEmployeesRequest:
      type: object
      properties:
        limit:
          type: integer
          format: int32
          description: Deprecated. Limit the result set returned after applying filters. Ignored when using `employeeQuery`.
        offset:
          type: integer
          format: int32
          description: Deprecated. Offset (from the first result) the result set returned after applying filters. Ignored when using `employeeQuery`.
        contractIds:
          type: array
          items:
            type: integer
            format: int32
          description: Deprecated. Filter the employees based on main contract. Ignored when using `employeeQuery`.
        employeeQuery:
          $ref: '#/components/schemas/PayComparisonEmployeeQuery'
    PayComparisonResubmitReportResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/PayComparisonReport'
        error:
          type: string
    PayComparisonEmployeeQuery:
      type: object
      properties:
        limit:
          type: integer
          format: int32
          description: Limit the result set returned after applying filters.
        offset:
          type: integer
          format: int32
          description: Offset (from the first result) the result set returned after applying filters.
        filter:
          $ref: '#/components/schemas/PayComparisonEmployeeQueryFilter'
    PayComparisonDeleteReportsRequest:
      type: object
      properties:
        reportIds:
          type: array
          items:
            type: string
    PayComparisonReportFilter:
      type: object
      properties:
        limit:
          type: integer
          format: int32
          description: The maximum number of results to return.
        offset:
          type: integer
          format: int32
          description: The first N results will be excluded.
        nameContains:
          type: string
          description: Filter for reports where the `name` contains a substring. Leave as empty string to match all reports.
        createdAfter:
          type: string
          description: '`yyyy-mm-dd` date to return only reports created on or after.'
        createdBefore:
          type: string
          description: '`yyyy-mm-dd` date to return only reports created before.'
    PayComparisonReportWorkPeriodCycle:
      type: object
      properties:
        cycleStart:
          type: string
          description: '`yyyy-mm-dd` date to specify the start of the cycle.'
        daysInCycle:
          type: integer
          format: int32
          description: Number of days in each cycle, e.g. Weekly = 7, Fortnightly = 14, 4-Weekly = 28.
    PayComparisonGenericReportResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
