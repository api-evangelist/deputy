openapi: 3.2.0
info:
  title: Deputy V2 Timesheet Approval API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Timesheet Approval
paths:
  /tsa/v2/config-and-permissions:
    get:
      summary: Get User Access such as Permission / Role specifically for timesheet
      description: Get user's permissions and config related to timesheet
      operationId: TsaConfigAndPermissionV2Controller_getConfigAndPermission
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaConfigAndPermissionResponse'
      parameters:
      - name: includeExportableLeaveRuleIds
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Timesheet Approval
  /tsa/v2/employees-for-status-grouping:
    post:
      summary: Get Employees for Status Grouping
      description: Get paginated list of employee IDs grouped by timesheet status for the groupByStatus feature. Employees with pending timesheets are grouped first, followed by employees with no pending timesheets.
      operationId: TsaV2Controller_getEmployeesForStatusGrouping
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaGetEmployeesForStatusGroupingResponse'
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetEmployeesForStatusGroupingRequestGetEmployeesForStatusGroupingRequestBody'
  /tsa/v2/timesheets:
    post:
      summary: Add Timesheet
      description: Create a Timesheet.
      operationId: TsaV2Controller_createTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetCreateRequestTimesheetCreateRequestBody'
  /tsa/v2/timesheets/{id}:applicable-range-summary:
    get:
      summary: Get summarise applicable range timesheet
      description: Get summarise applicable range either a payCycleId or an employeeId and dateRange.
      operationId: TsaV2Controller_getApplicableRangeSummary
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaApplicableRangeSummaryResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
  /tsa/v2/timesheets/{id}:approve:
    post:
      summary: Approve Timesheet (Pay and Time)
      description: Approve a Timesheet. Can specify overrides for pay returns.
      operationId: TsaV2Controller_approveTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaTimesheetPayApproveRequestBody'
  /tsa/v2/timesheets/{id}:approve-roster:
    post:
      summary: Approve Roster (Pay and Time)
      description: Approve a Roster (async). Can specify overrides for pay returns.
      operationId: TsaV2Controller_approveRoster
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaRosterPayApproveRequestBody'
  /tsa/v2/timesheets/{id}:approve-roster-sync:
    post:
      summary: Approve Roster Sync (Pay and Time)
      description: Approve a Roster (sync). Can specify overrides for pay returns.
      operationId: TsaV2Controller_approveRosterSync
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaSynchronousResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaRosterPayApproveRequestBody'
  /tsa/v2/timesheets/{id}:approve-sync:
    post:
      summary: Approve Timesheet Sync (Pay and Time)
      description: Approve a Timesheet. Can specify overrides for pay returns. Sync version of approveTimesheet.
      operationId: TsaV2Controller_approveTimesheetSync
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaSynchronousResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaTimesheetPayApproveRequestBody'
  /tsa/v2/timesheets/{id}:approve-time:
    post:
      summary: Approve Time for Timesheet
      description: Time-approve a Timesheet (async).
      operationId: TsaV2Controller_approveTimeTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaTimesheetTimeApproveRequestBody'
  /tsa/v2/timesheets/{id}:approve-time-roster:
    post:
      summary: Approve Time for Roster
      description: Time-approve a Roster (async).
      operationId: TsaV2Controller_approveTimeRoster
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaRosterTimeApproveRequestBody'
  /tsa/v2/timesheets/{id}:approve-time-roster-sync:
    post:
      summary: Approve Time for Roster Sync
      description: Time-approve a Roster (sync).
      operationId: TsaV2Controller_approveTimeRosterSync
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaSynchronousResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaRosterTimeApproveRequestBody'
  /tsa/v2/timesheets/{id}:approve-time-sync:
    post:
      summary: Approve Time for Timesheet Sync
      description: Time-approve a Timesheet (sync).
      operationId: TsaV2Controller_approveTimeTimesheetSync
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaSynchronousResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaTimesheetTimeApproveRequestBody'
  /tsa/v2/timesheets/{id}:discard:
    post:
      summary: Discard Timesheet
      description: Discard a Timesheet.
      operationId: TsaV2Controller_discardTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
  /tsa/v2/timesheets/{id}:discard-roster:
    post:
      summary: Discard Roster
      description: Discard a Roster.
      operationId: TsaV2Controller_discardRoster
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
  /tsa/v2/timesheets/{id}:end-shift:
    post:
      summary: End Shift
      description: End shift for a timesheet.
      operationId: TsaV2Controller_endShift
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
  /tsa/v2/timesheets/{id}:reapprove:
    post:
      summary: Reapprove Timesheet
      description: Reapprove a Timesheet.
      operationId: TsaV2Controller_reapproveTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReapproveRequestReapproveRequestBody'
  /tsa/v2/timesheets/{id}:reinstate:
    post:
      summary: Reinstate Timesheet
      description: Reinstate a discarded Timesheet.
      operationId: TsaV2Controller_reinstateTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
  /tsa/v2/timesheets/{id}:suggest-rounding:
    post:
      summary: Suggest Timesheet Rounding
      description: Suggests a timesheet rounding based on the timesheet's start, end times and mealbreak.
      operationId: TsaV2Controller_getSuggestedTimesheetRounding
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaSuggestTimesheetRoundingResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestTimesheetRoundingRequestSuggestTimesheetRoundingRequestBody'
  /tsa/v2/timesheets/{id}:unapprove:
    post:
      summary: Un-Approve Timesheet
      description: Un-approve a Timesheet.
      operationId: TsaV2Controller_unapproveTimeTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
  /tsa/v2/timesheets/{id}:unapprove-pay:
    post:
      summary: Unapprove Pay for Timesheet
      description: Unapprove Pay for a timesheet, leaving it in Time Approved state.
      operationId: TsaV2Controller_unapprovePayTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
  /tsa/v2/timesheets/{id}:update:
    post:
      summary: Update Timesheet
      description: Update a Timesheet.
      operationId: TsaV2Controller_updateTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaTimesheetUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetUpdateRequestTimesheetUpdateRequestBody'
  /tsa/v2/timesheets/{id}:validate-update:
    post:
      summary: Validate Update Timesheet
      description: Validate a timesheet update request. Runs pre-execution validation and returns structured validation errors without persisting any changes.
      operationId: TsaV2Controller_validateUpdateTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaValidateCreateTimesheetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetUpdateRequestTimesheetUpdateRequestBody'
  /tsa/v2/timesheets/{timesheetId}:get-timesheet-questions:
    post:
      summary: Get Timesheet Questions
      description: List all timesheet questions which are visible for this timesheet. Optionally override the timesheet properties.
      operationId: TsaV2Controller_getTimesheetQuestions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaGetTimesheetQuestionsResponse'
      parameters:
      - name: timesheetId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTimesheetQuestionsRequestTimesheetQuestionsRequestBody'
  /tsa/v2/timesheets:batch-approve:
    post:
      summary: Batch Approve for Timesheet (time and pay)
      description: Approve time and pay for one or more timesheets matching the criteria.
      operationId: TsaV2Controller_batchApproveTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaTimesheetBatchRequest'
  /tsa/v2/timesheets:batch-approve-time:
    post:
      summary: Batch Approve Time for Timesheet
      description: Time-approve one or more Timesheet (async). Query works as sql `AND` condition for all the query options.
      operationId: TsaV2Controller_batchApproveTimeTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaTimesheetBatchRequest'
  /tsa/v2/timesheets:batch-discard:
    post:
      summary: Batch Discard Timesheets
      description: Discard timesheets.
      operationId: TsaV2Controller_batchDiscardTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaTimesheetBatchRequest'
  /tsa/v2/timesheets:batch-reinstate:
    post:
      summary: Reinstate Timesheet Batch
      description: Reinstate discarded Timesheets.
      operationId: TsaV2Controller_batchReinstateTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      tags:
      - Timesheet Approval
  /tsa/v2/timesheets:batch-unapprove:
    post:
      summary: Batch Unapprove for Timesheets
      description: Unapprove pay and time for timesheets.
      operationId: TsaV2Controller_batchUnapproveTimeTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaTimesheetBatchRequest'
  /tsa/v2/timesheets:batch-unapprove-pay:
    post:
      summary: Batch Unapprove Pay for Timesheets
      description: Unapprove pay for timesheets, leaving them in Time Approved state.
      operationId: TsaV2Controller_batchUnapprovePayTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaTimesheetBatchRequest'
  /tsa/v2/timesheets:validate:
    post:
      summary: Validate Create Timesheet
      description: Validate a timesheet creation request. Runs pre-execution validation and returns structured validation errors without persisting any changes.
      operationId: TsaV2Controller_validateCreateTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaValidateCreateTimesheetResponse'
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetCreateRequestTimesheetCreateRequestBody'
  /tsa/v2/{parent}/comments:
    post:
      summary: Create a Timesheet comment
      description: Adds a comment for the timesheet.
      operationId: TsaV2Controller_createComment
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelComment'
      parameters:
      - name: parent
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelComment'
components:
  schemas:
    TimesheetBatchRequestApprovalStatus:
      type: string
      enum:
      - ANY
      - PENDING
      - TIME_APPROVED
      - PAY_APPROVED
      default: ANY
      title: the enum names must match TimesheetBatchQuery.php enums, e.g. ANY, PENDING, ISSUES_EXCLUDED etc
    GetEmployeesForStatusGroupingResponseGetEmployeesForStatusGroupingResponseBody:
      type: object
      properties:
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
          description: sorted list of unique employee IDs ordered by approval status and first name
        nextCursor:
          type: string
          description: cursor for next page of results, empty if no more results
    TsaAsyncResponse:
      type: object
      properties:
        success:
          type: boolean
        operationId:
          type: string
        locks:
          type: array
          items:
            $ref: '#/components/schemas/OperationLock'
    modelTimesheetBreak:
      type: object
      properties:
        duration:
          type: integer
          format: int32
        startTimeOffset:
          type: integer
          format: int32
        breakType:
          $ref: '#/components/schemas/tenanttsav2modelBreakType'
    TsaTimesheetPayApproveRequestBody:
      type: object
      properties:
        setPayReturns:
          $ref: '#/components/schemas/TsaTimesheetPayReturnOverrideRequest'
          description: omit this value to fall back to pay calculation/forecast.
        setProperties:
          $ref: '#/components/schemas/TsaTimesheetPropertyRequest'
        setAnswers:
          $ref: '#/components/schemas/TsaTimesheetQuestionSubmitAnswersRequest'
        setChildTimesheets:
          $ref: '#/components/schemas/TsaTimesheetChildrenRequest'
    ApplicableRangeSummaryResponseApplicableRangeTimesheet:
      type: object
      properties:
        id:
          type: integer
          format: int32
        startTime:
          type: string
          format: int64
        endTime:
          type: string
          format: int64
        timeApproved:
          type: boolean
        payRuleApproved:
          type: boolean
        discarded:
          type: boolean
        employeeId:
          type: integer
          format: int32
    TsaTimesheetTimeApproveRequestBody:
      type: object
      properties:
        setProperties:
          $ref: '#/components/schemas/TsaTimesheetPropertyRequest'
        setAnswers:
          $ref: '#/components/schemas/TsaTimesheetQuestionSubmitAnswersRequest'
        setChildTimesheets:
          $ref: '#/components/schemas/TsaTimesheetChildrenRequest'
    TsaTimesheetPropertyRequest:
      type: object
      properties:
        startTime:
          type: string
          format: int64
          description: unix epoch timestamp, seconds
        endTime:
          type: string
          format: int64
          description: unix epoch timestamp, seconds
        operationalUnitId:
          type: integer
          format: int32
          description: operational unit (area) ID
        setBreaks:
          $ref: '#/components/schemas/TsaTimesheetBreaksRequest'
        employeeId:
          type: integer
          format: int32
        leaveRuleId:
          type: integer
          format: int32
          description: leave rule (leave type) ID
        employeeComment:
          type: string
          description: employee comment for the timesheet
    TimesheetBatchRequestQuery:
      type: object
      properties:
        dateFrom:
          type: string
        dateTo:
          type: string
        operationalUnitIds:
          type: array
          items:
            type: integer
            format: int32
        includeAllLocations:
          type: boolean
        approvalStatus:
          $ref: '#/components/schemas/TimesheetBatchRequestApprovalStatus'
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
        includeAllEmployees:
          type: boolean
        timesheetIds:
          type: array
          items:
            type: integer
            format: int32
        includeAllTimesheets:
          type: boolean
        issueStatus:
          $ref: '#/components/schemas/TimesheetBatchRequestIssueStatus'
        rosterIds:
          type: array
          items:
            type: integer
            format: int32
    SuggestTimesheetRoundingRequestSuggestTimesheetRoundingRequestBody:
      type: object
      properties:
        operationalUnitId:
          type: integer
          format: int32
        startTime:
          type: string
          format: int64
        endTime:
          type: string
          format: int64
        mealbreak:
          type: string
        childTimesheets:
          type: array
          items:
            $ref: '#/components/schemas/TsaChildTimesheetRequest'
    tenanttsav2modelPayReturn:
      type: object
      properties:
        payRuleId:
          type: integer
          format: int32
        hours:
          type: number
          format: float
        cost:
          type: number
          format: float
    modelTimesheetQuestion:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        helptext:
          type: string
        sortOrder:
          type: integer
          format: int32
        defaultAnswer:
          type: string
        answerType:
