openapi: 3.2.0
info:
  title: Deputy V2 Leave Request API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Request
paths:
  /management/v2/leave-requests:
    get:
      summary: List all existing leave request
      operationId: LeaveRequestV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestListResponse'
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Leave Request
      description: List all existing leave request.
    post:
      summary: Create a new leave request
      operationId: LeaveRequestV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestCreateResponse'
      tags:
      - Leave Request
      description: Create a new leave request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelLeaveRequest'
  /management/v2/leave-requests/approval:validate:
    post:
      summary: Validate leave request for approval
      operationId: LeaveRequestV2Controller_validateLeaveRequestForApproval
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestValidateLeaveRequestForApprovalResponse'
      tags:
      - Leave Request
      description: Validate leave request for approval.
  /management/v2/leave-requests/upcoming:
    post:
      summary: List upcoming leave requests for an employee
      operationId: LeaveRequestV2Controller_getUpcomingLeaveForEmployee
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestGetUpcomingLeaveForEmployeeResponse'
      tags:
      - Leave Request
      description: List upcoming leave requests for an employee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestGetUpcomingLeaveForEmployeeRequest'
  /management/v2/leave-requests/{id}:
    get:
      summary: Retrieve leave request by given Id
      operationId: LeaveRequestV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Leave Request
      description: Retrieve leave request by given Id.
    delete:
      summary: Delete a leave request
      operationId: LeaveRequestV2Controller_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Leave Request
      description: Delete a leave request.
    put:
      summary: Update an existing leave request
      operationId: LeaveRequestV2Controller_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Leave Request
      description: Update an existing leave request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelLeaveRequest'
  /management/v2/leave-requests/{id}/external-id:
    patch:
      summary: Update the external ID of a leave request
      operationId: LeaveRequestV2Controller_updateExternalId
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: updateMask
        in: query
        required: false
        schema:
          type: string
      tags:
      - Leave Request
      description: Update the external ID of a leave request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelLeaveRequest'
components:
  schemas:
    LeaveRequestGetUpcomingLeaveForEmployeeRequestData:
      type: object
      properties:
        policyId:
          type: string
        startDate:
          type: string
        endDate:
          type: string
    v2modelUnit:
      type: string
      enum:
      - UNIT_UNKNOWN
      - UNIT_HOUR
      - UNIT_DAY
      default: UNIT_UNKNOWN
    modelLeaveStatus:
      type: string
      enum:
      - STATUS_AWAITING
      - STATUS_APPROVED
      - STATUS_DECLINED
      - STATUS_CANCELLED
      - STATUS_DATE_APPROVED
      - STATUS_PAY_APPROVED
      default: STATUS_AWAITING
    modelBalanceLimitWarning:
      type: object
      properties:
        leaveRuleId:
          type: string
        leaveRuleName:
          type: string
        leaveRuleUnit:
          $ref: '#/components/schemas/v2modelUnit'
        threshold:
          type: number
          format: double
        exceededAmount:
          type: number
          format: double
    LeaveRequestListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelLeaveRequest'
        nextCursor:
          type: string
      title: Get Leave response
    LeaveRequestDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      title: Delete response
    LeaveRequestValidateLeaveRequestForApprovalResponse:
      type: object
      properties:
        success:
          type: boolean
        warnings:
          $ref: '#/components/schemas/LeaveRequestApprovalValidationLeaveRequestWarnings'
      title: Validate Leave Request For Approval Response
    LeaveRequestGetUpcomingLeaveForEmployeeRequest:
      type: object
      properties:
        employeeId:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeaveRequestGetUpcomingLeaveForEmployeeRequestData'
      title: Get Upcoming Leave For Employee Request
    LeaveRequestGetUpcomingLeaveForEmployeeResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelUpcomingLeave'
      title: Get Upcoming Leave For Employee Response
    modelAffectedDate:
      type: object
      properties:
        date:
          type: string
          title: yyyy-mm-dd
        employeesOnLeaveCount:
          type: integer
          format: int32
          title: people already on leave that day
    LeaveRequestUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelLeaveRequest'
      title: Update Leave response
    modelUpcomingLeave:
      type: object
      properties:
        policyId:
          type: string
        days:
          type: number
          format: float
        hours:
          type: number
          format: float
      title: Upcoming Leave Data
    LeaveRequestGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelLeaveRequest'
      title: Get Leave response
    LeaveRequestCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelLeaveRequest'
      title: Create Leave response
    v2modelLeaveRequest:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Leave ID
        employeeId:
          type: integer
          format: int32
          title: Employee ID
        employeeHistoryId:
          type: integer
          format: int32
          title: Employee History ID
        locationId:
          type: integer
          format: int32
          title: Location ID
        leaveRuleId:
          type: integer
          format: int32
          title: Leave Rule ID
        startAt:
          type: string
          format: date-time
          title: Leave start date time
        endAt:
          type: string
          format: date-time
          title: Leave end date time
        timeApprovedBy:
          type: integer
          format: int32
          title: Date Time Range Approver ID
        payApprovedBy:
          type: integer
          format: int32
          title: Pay Approver ID
        comment:
          type: string
          title: Comment
        notifyManagerIds:
          type: array
          items:
            type: integer
            format: int32
          title: Notify Manager ID
        status:
          $ref: '#/components/schemas/modelLeaveStatus'
          title: Leave Status
        approverComment:
          type: string
          title: Approver Comment
        totalHours:
          type: number
          format: float
          title: Total Hours
        createdById:
          type: integer
          format: int32
          title: Employee ID of who created the leave request
        createdAt:
          type: string
          format: date-time
          title: Timestamp when the leave request was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp when the leave request was modified
        externalId:
          type: string
          title: ExternalId
        allDay:
          type: boolean
          title: Indicates if the leave is the full day
      title: Leave Request
    LeaveRequestApprovalValidationLeaveRequestWarnings:
      type: object
      properties:
        balanceLimits:
          type: array
          items:
            $ref: '#/components/schemas/modelBalanceLimitWarning'
        concurrentLeaveCaps:
          $ref: '#/components/schemas/modelConcurrentLeaveCapWarning'
    modelConcurrentLeaveCapWarning:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        locationName:
          type: string
        maxConcurrentLeave:
          type: integer
          format: int32
        affectedDates:
          type: array
          items:
            $ref: '#/components/schemas/modelAffectedDate'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
