openapi: 3.2.0
info:
  title: Deputy V2 Leave Feature Set API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Feature Set
paths:
  /management/v2/leave-feature-set/adoption-status:
    get:
      summary: Get adoption status
      operationId: LeaveFeatureSetV2Controller_GetAdoptionStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveFeatureSetGetAdoptionStatusResponse'
      tags:
      - Leave Feature Set
      description: Get adoption status.
    put:
      summary: Set adoption status
      operationId: LeaveFeatureSetV2Controller_SetAdoptionStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveFeatureSetSetLeaveAdoptionStatusResponse'
      tags:
      - Leave Feature Set
      description: Set adoption status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveFeatureSetSetLeaveAdoptionStatusRequest'
  /management/v2/leave-feature-set/status:
    get:
      summary: Get leave feature set status
      operationId: LeaveFeatureSetV2Controller_GetLeaveFeatureSetStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveFeatureSetGetLeaveFeatureSetStatusResponse'
      tags:
      - Leave Feature Set
      description: Get leave feature set status.
  /management/v2/leave-feature-set/suggestion-status:
    patch:
      summary: Set leave feature set suggestion status
      operationId: LeaveFeatureSetV2Controller_SetSuggestionStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveFeatureSetSetSuggestionStatusResponse'
      tags:
      - Leave Feature Set
      description: Set leave feature set suggestion status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveFeatureSetSetSuggestionStatusRequest'
components:
  schemas:
    modelLeaveFeatureSetSuggestionStatus:
      type: object
      properties:
        policyBuilderDismissed:
          type: boolean
        hrAddonDismissed:
          type: boolean
        hrAddonResubscribeDismissed:
          type: boolean
      title: Leave feature set suggestion status
    LeaveFeatureSetSetLeaveAdoptionStatusRequest:
      type: object
      properties:
        adopted:
          type: boolean
      title: Set Adoption Status request
    modelAdoptionStatus:
      type: object
      properties:
        adopted:
          type: boolean
        adoptedAt:
          type: string
          format: date-time
    LeaveFeatureSetGetLeaveFeatureSetStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          $ref: '#/components/schemas/modelLeaveFeatureSetStatus'
      title: Get leave feature set status response
    modelLeaveFeatureSetStatusLeaveFeatureSet:
      type: string
      enum:
      - UNKNOWN_SET
      - BASIC
      - FULL
      - NONE
      default: UNKNOWN_SET
      title: Leave Feature Set
    LeaveFeatureSetSetSuggestionStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/modelLeaveFeatureSetSuggestionStatus'
        updateMask:
          type: string
          title: Fields to patch
      title: Set leave feature set suggestion status request
    modelLeaveFeatureSetStatus:
      type: object
      properties:
        featureSet:
          $ref: '#/components/schemas/modelLeaveFeatureSetStatusLeaveFeatureSet'
          title: Leave Feature Set
        hrAddonEligibility:
          $ref: '#/components/schemas/LeaveFeatureSetStatusLeaveHRAddonEligibility'
          title: Leave HR Addon Eligibility
        hasHRAddon:
          type: boolean
          title: Does the feature set have a HR addon
        isHRAddonActive:
          type: boolean
          title: Is the HR addon active
        hrAddonTerminationAt:
          type: string
          format: date-time
          title: Termination timestamp of the HR addon
        canUserManageSubscription:
          type: boolean
          title: Can the user manage subscription
        suggestionStatus:
          $ref: '#/components/schemas/modelLeaveFeatureSetSuggestionStatus'
          title: Leave Feature set suggestion status
        isPolicyBuilderAdopted:
          type: boolean
          title: is the policy builder adopted
        isPolicyBuilderAdoptionRecent:
          type: boolean
          title: Was the policy builder adopted recently
        isTrial:
          type: boolean
          title: Is the account a trial
      title: Leave Feature Set Status
    LeaveFeatureSetStatusLeaveHRAddonEligibility:
      type: string
      enum:
      - UNKNOWN_ELIGIBILITY
      - NOT_REQUIRED
      - REQUIRED
      - NOT_ELIGIBLE
      default: UNKNOWN_ELIGIBILITY
      title: Leave HR Addon Eligibility
    LeaveFeatureSetGetAdoptionStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        adoption:
          $ref: '#/components/schemas/modelAdoptionStatus'
      title: Get Adoption Status response
    LeaveFeatureSetSetLeaveAdoptionStatusResponse:
      type: object
      properties:
        success:
          type: boolean
      title: Set Adoption Status response
    LeaveFeatureSetSetSuggestionStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          $ref: '#/components/schemas/modelLeaveFeatureSetSuggestionStatus'
      title: Set leave feature set suggestion status response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
