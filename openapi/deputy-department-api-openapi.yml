    servers:
    - url: https://{subdomain}.{region}.deputy.com/api/v1
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token or Deputy Permanent Token.
x-refined-from:
- deputy-openapi.json
- deputy-v1-supervise-api.json
x-readme:
  explorer-enabled: true
  proxy-enabled: true
  samples-enabled: true
