openapi: 3.2.0
info:
  title: Deputy Department API
  version: 1.0.0
  description: 'Operations tagged Department across 2 of this provider''s published API definitions: deputy-openapi.json, deputy-v1-supervise-api.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
tags:
- name: Department
  description: V1 /my/department/* endpoints
paths:
  /my/department/{intDeptId}:
    get:
      tags:
      - Department
      summary: GET Department / (:intDeptId)?
      operationId: my_department__intdeptid__get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: intDeptId
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+$
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api/v1
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
  /my/department/{intDeptId}/weather:
    get:
      tags:
      - Department
      summary: GET Department / weather
      operationId: my_department__intdeptid_weather_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: intDeptId
        in: path
        required: true
        schema:
          type: integer
          pattern: ^\d+
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api/v1
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
  /my/department/{intDeptId}/weather/{date}:
    get:
      tags:
      - Department
      summary: GET Department / :date
      operationId: my_department__intdeptid_weather_date_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: intDeptId
        in: path
        required: true
        schema:
          type: integer
          pattern: ^\d+
      - name: date
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9]{4}\-[0-9]{1,2}\-[0-9]{1,2}'
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api/v1
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
  /supervise/department:
    put:
      tags:
      - Department
      summary: Create Department
      operationId: supervise_department__put
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api/v1
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
  /supervise/department/all/{locationId}:
    post:
      tags:
      - Department
      summary: POST Department / :locationId
      operationId: supervise_department__all_locationid_post
      responses:
