openapi: 3.2.0
info:
  title: Deputy V2 Leave Balance API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Balance
paths:
  /management/v2/leave-balance:
    post:
      operationId: LeaveBalanceV2Controller_CreateLeaveBalance
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveBalanceCreateLeaveBalanceResponse'
      tags:
      - Leave Balance
      security:
      - APIToken: []
      summary: Create leave balance
      description: Create leave balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveBalanceCreateLeaveBalanceRequest'
  /management/v2/leave-balance/employees/{employeeId}/balances:
    get:
      operationId: LeaveBalanceV2Controller_ListLeaveBalancesForEmployee
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveBalanceListLeaveBalancesForEmployeeResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: onlyVisibleToEmployee
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Leave Balance
      summary: List leave balances for employee
      description: List leave balances for employee.
  /management/v2/leave-balance/employees/{employeeId}/leave-rules/{leaveRuleId}:
    get:
      operationId: LeaveBalanceV2Controller_GetLeaveBalances
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveBalanceGetLeaveBalancesResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: leaveRuleId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Leave Balance
      summary: Get leave balances
      description: Get leave balances.
components:
  schemas:
    modelLeaveBalanceForEmployeeAndLeaveRule:
      type: object
      properties:
        leaveRule:
          $ref: '#/components/schemas/modelLeaveBalanceForEmployeeAndLeaveRuleLeaveRule'
          title: The leave rule
        standardDay:
          $ref: '#/components/schemas/v2modelEmployeeStandardDay'
          title: The standard day for the employee
        isVisibleToEmployee:
          type: boolean
          title: Whether the leave balance is visible to the employee
        lastCalculatedAt:
          type: string
          format: date-time
          title: The last time the leave balance was calculated
        currentYear:
          $ref: '#/components/schemas/LeaveBalanceForEmployeeAndLeaveRuleLeaveYearBalance'
          title: The current leave year balance
        futureYears:
          type: array
          items:
            $ref: '#/components/schemas/LeaveBalanceForEmployeeAndLeaveRuleLeaveYearBalance'
          title: The leave year balances for future years
      title: The leave balance information for an employee and leave rule
    modelLeaveBalanceCreate:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
          title: Employee ID
        leaveRuleId:
          type: integer
          format: int32
          title: Leave rule ID
        amount:
          type: number
          format: double
          title: Balance amount (in hours or days according to unit)
      title: Leave Balance Create
    LeaveBalanceForEmployeeAndLeaveRuleBalanceValue:
      type: object
      properties:
        hours:
          type: number
          format: double
          title: The balance value in hours
        days:
          type: number
          format: double
          title: The balance value in days
      title: A balance value
    v2modelEmployeeStandardDay:
      type: object
      properties:
        standardDayHours:
          type: number
          format: float
          title: Employee standard day hours
        standardDayCalcMethod:
          $ref: '#/components/schemas/modelEmployeeStandardDayStandardDayCalculationMethod'
          title: Standard day hours calculation method
        defaultStandardDayHours:
          type: number
          format: float
          title: The default value for standard day hours
    LeaveBalanceCreateLeaveBalanceRequest:
      type: object
      properties:
        balance:
          $ref: '#/components/schemas/modelLeaveBalanceCreate'
    LeaveBalanceCreateLeaveBalanceResponse:
      type: object
      properties:
        success:
          type: boolean
    modelLeaveBalanceForEmployeeAndLeaveRuleUnit:
      type: string
      enum:
      - HOURS
      - DAYS
      default: HOURS
      title: Unit that the leave balance is measured in
    LeaveBalanceGetLeaveBalancesResponse:
      type: object
      properties:
        employeeId:
          type: string
        policyId:
          type: string
        leaveRuleId:
          type: string
        value:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/LeaveBalanceGetLeaveBalancesResponseUnit'
        startingHoursWorkedSinceThreshold:
          type: number
          format: double
        amountAccrued:
          type: number
          format: double
        startingAmountAccrued:
          type: number
          format: double
        hoursWorkedSinceThreshold:
          type: number
          format: double
        lastCalculatedAt:
          type: string
          format: date-time
        overriddenAt:
          type: string
          format: date-time
    LeaveBalanceGetLeaveBalancesResponseUnit:
      type: string
      enum:
      - UNIT_UNKNOWN
      - UNIT_HOUR
      - UNIT_DAY
      default: UNIT_UNKNOWN
    LeaveBalanceForEmployeeAndLeaveRuleLeaveYearBalance:
      type: object
      properties:
        yearName:
          type: string
          title: The name of the leave year
        currentBalance:
          $ref: '#/components/schemas/LeaveBalanceForEmployeeAndLeaveRuleBalanceValue'
          title: The current balance value
        upcomingLeave:
          $ref: '#/components/schemas/LeaveBalanceForEmployeeAndLeaveRuleBalanceValue'
          title: The amount of leave that has been requested and approved but not yet taken
        availableBalance:
          $ref: '#/components/schemas/LeaveBalanceForEmployeeAndLeaveRuleBalanceValue'
          title: The amount of balance that is available to be requested (current balance - upcoming leave)
      title: The balance for a given leave year
    modelEmployeeStandardDayStandardDayCalculationMethod:
      type: string
      enum:
      - UNKNOWN_METHOD
      - AGREED_HOURS
      - DEFAULT_SHIFT
      - REFERENCE_PERIOD
      - LOCATION_DEFAULT_SHIFT
      - EMPLOYMENT_CONDITION
      - PER_EMPLOYEE_STANDARD_DAY
      default: UNKNOWN_METHOD
      title: Possible calculation methods
    modelLeaveBalanceForEmployeeAndLeaveRuleLeaveRule:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Leave rule id
        name:
          type: string
          title: Leave rule name
        unit:
          $ref: '#/components/schemas/modelLeaveBalanceForEmployeeAndLeaveRuleUnit'
          title: Leave rule unit
      title: A leave rule
    LeaveBalanceListLeaveBalancesForEmployeeResponse:
      type: object
      properties:
        balances:
          type: array
          items:
            $ref: '#/components/schemas/modelLeaveBalanceForEmployeeAndLeaveRule'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
