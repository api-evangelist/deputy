openapi: 3.2.0
info:
  title: Deputy V2 Timesheet Export API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Timesheet Export
paths:
  /tsa/v2/timesheets/{id}:mark-paid:
    post:
      summary: Mark as paid
      description: Mark a single timesheet as paid.
      operationId: TsaV2Controller_markAsPaid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAsPaidSingleRequestMarkAsPaidRequestBody'
  /tsa/v2/timesheets/{id}:mark-unpaid:
    post:
      summary: Mark as unpaid
      description: Mark a single timesheet as unpaid.
      operationId: TsaV2Controller_markAsUnpaid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAsPaidSingleRequestMarkAsPaidRequestBody'
  /tsa/v2/timesheets:batch-mark-paid:
    post:
      summary: Batch mark as paid
      description: Mark multiple timesheets as paid.
      operationId: TsaV2Controller_batchMarkAsPaid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      tags:
      - Timesheet Export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAsPaidBatchRequestMarkAsPaidBatchRequestBody'
  /tsa/v2/timesheets:batch-mark-unpaid:
    post:
      summary: Batch mark as unpaid
      description: Mark multiple timesheets as unpaid.
      operationId: TsaV2Controller_batchMarkAsUnpaid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      tags:
      - Timesheet Export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAsPaidBatchRequestMarkAsPaidBatchRequestBody'
components:
  schemas:
    OperationLock:
      type: object
      properties:
        kind:
          type: string
        ids:
          type: object
          additionalProperties:
            type: boolean
    MarkAsPaidSingleRequestMarkAsPaidRequestBody:
      type: object
      properties:
        startDate:
          type: string
        endDate:
          type: string
    MarkAsPaidBatchRequestMarkAsPaidBatchRequestBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int32
        startDate:
          type: string
        endDate:
          type: string
        payCycleIds:
          type: array
          items:
            type: integer
            format: int32
    TsaAsyncResponse:
      type: object
      properties:
        success:
          type: boolean
        operationId:
          type: string
        locks:
          type: array
          items:
            $ref: '#/components/schemas/OperationLock'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
