openapi: 3.2.0
info:
  title: Deputy V2 Entitlement Remediation API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Entitlement Remediation
paths:
  /management/v2/entitlement-remediation/files/{fileKey}/download:
    get:
      operationId: LeaveEntitlementsRemediationV2Controller_getEntitlementRemediationFileDownloadLink
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveEntitlementsRemediationGetEntitlementRemediationFileDownloadLinkResponse'
      parameters:
      - name: fileKey
        in: path
        required: true
        schema:
          type: string
      tags:
      - Entitlement Remediation
      summary: Get entitlement remediation file download link
      description: Get entitlement remediation file download link.
  /management/v2/entitlement-remediation/start:
    put:
      operationId: LeaveEntitlementsRemediationV2Controller_setEntitlementRemediationActionType
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveEntitlementsRemediationSetEntitlementRemediationActionTypeResponse'
      tags:
      - Entitlement Remediation
      summary: Set entitlement remediation action type
      description: Set entitlement remediation action type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveEntitlementsRemediationEntitlementRemediationAction'
  /management/v2/entitlement-remediation/status:
    get:
      operationId: LeaveEntitlementsRemediationV2Controller_getEntitlementRemediationStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveEntitlementsRemediationGetEntitlementRemediationStatusResponse'
      tags:
      - Entitlement Remediation
      summary: Get entitlement remediation status
      description: Get entitlement remediation status.
components:
  schemas:
    v2modelBalanceRemediationType:
      type: string
      enum:
      - BALANCE_REMEDIATION_UNKNOWN
      - BALANCE_REMEDIATION_INELIGIBLE
      - BALANCE_REMEDIATION_LEAVE_ENGINE
      - BALANCE_REMEDIATION_LEGACY
      default: BALANCE_REMEDIATION_UNKNOWN
    modelLeaveEntitlementRemediationStatus:
      type: object
      properties:
        statusCode:
          $ref: '#/components/schemas/LeaveEntitlementRemediationStatusEntitlementRemediationStatusCode'
        balanceRemediationType:
          $ref: '#/components/schemas/v2modelBalanceRemediationType'
        affectedEmployeesCount:
          type: string
          format: int64
        totalRecalculatedHours:
          type: number
          format: float
        totalRecalculatedDays:
          type: number
          format: float
        totalArchivedEmployeesCount:
          type: string
          format: int64
        entitlementFileKey:
          type: string
        balanceFileKey:
          type: string
    LeaveEntitlementsRemediationEntitlementRemediationAction:
      type: object
      properties:
        actionType:
          $ref: '#/components/schemas/modelActionType'
    LeaveEntitlementsRemediationGetEntitlementRemediationStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelLeaveEntitlementRemediationStatus'
    LeaveEntitlementRemediationStatusEntitlementRemediationStatusCode:
      type: string
      enum:
      - REMEDIATION_STATUS_UNKNOWN
      - REMEDIATION_STATUS_NOT_REQUIRED
      - REMEDIATION_NOT_ELIGIBLE
      - REMEDIATION_DETAILS_SET_NOT_ELIGIBLE
      - REMEDIATION_DETAILS_SET_IN_PROGRESS
      - REMEDIATION_DETAILS_SET_ELIGIBLE
      - REMEDIATION_NOT_STARTED
      - REMEDIATION_IN_PROGRESS
      - REMEDIATION_COMPLETED
      - REMEDIATION_FAILED
      - REMEDIATION_AFFECTED_EMPLOYEES_IN_PROGRESS
      - REMEDIATION_AFFECTED_EMPLOYEES_COMPLETED
      - REMEDIATION_AFFECTED_EMPLOYEES_FAILED
      default: REMEDIATION_STATUS_UNKNOWN
    LeaveEntitlementsRemediationSetEntitlementRemediationActionTypeResponse:
      type: object
      properties:
        success:
          type: boolean
    LeaveEntitlementsRemediationGetEntitlementRemediationFileDownloadLinkResponse:
      type: object
      properties:
        success:
          type: boolean
        link:
          type: string
    modelActionType:
      type: string
      enum:
      - ACTION_TYPE_UNKNOWN
      - REVIEW_AFFECTED_EMPLOYEES
      - SELF_MANAGE
      - AUTO_FIX
      default: ACTION_TYPE_UNKNOWN
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
