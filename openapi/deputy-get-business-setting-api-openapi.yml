openapi: 3.2.0
info:
  title: Deputy V2 Get Business Setting API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Get Business Setting
paths:
  /business-setting/v2/setting:
    post:
      operationId: BusinessSettingV2Controller_getSetting
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSettingGetSettingResponse'
      tags:
      - Get Business Setting
      security:
      - APIToken: []
      summary: Get setting
      description: Get setting.
components:
  schemas:
    BusinessSettingGetSettingResponse:
      type: object
      properties:
        success:
          type: boolean
        settings:
          type: array
          items:
            $ref: '#/components/schemas/modelSetting'
    modelSetting:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        helpText:
          type: string
        displayValue:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
