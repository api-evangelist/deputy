openapi: 3.2.0
info:
  title: Deputy V2 Get a Flag Record API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Get a Flag Record
paths:
  /v2/flag-records/{key}:
    get:
      operationId: FlagRecordV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagRecordGetResponse'
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      tags:
      - Get a Flag Record
      summary: Get
      description: Get.
components:
  schemas:
    FlagRecordGetResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/FlagRecordFlagRecordRPC'
        error:
          type: string
    FlagRecordFlagRecordRPC:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
