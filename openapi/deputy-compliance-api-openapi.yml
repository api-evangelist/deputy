openapi: 3.2.0
info:
  title: Deputy V2 Compliance API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Compliance
paths:
  /management/v2/compliance/awards:
    get:
      operationId: ComplianceV2Controller_listAwards
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardListResponse'
      tags:
      - Compliance
      summary: List awards
      description: List awards.
  /management/v2/compliance/calculation-types:
    get:
      operationId: ComplianceV2Controller_getCalculationTypes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationTypeSearchResponse'
      parameters:
      - name: includeGlobal
        in: query
        required: false
        schema:
          type: boolean
      - name: country
        in: query
        required: false
        schema:
          type: string
      tags:
      - Compliance
      summary: Get calculation types
      description: Get calculation types.
  /management/v2/compliance/contract:
    get:
      operationId: ComplianceV2Controller_getContractList
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractListGetContractListResponse'
      parameters:
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: statuses
        in: query
        required: false
        schema:
          type: string
      tags:
      - Compliance
      summary: Get contract list
      description: Get contract list.
    post:
      operationId: ComplianceV2Controller_createContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCreateResponse'
      tags:
      - Compliance
      summary: Create contract
      description: Create contract.
  /management/v2/compliance/contract-config:batch-save:
    post:
      operationId: ComplianceV2Controller_batchSaveContractConfigs
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractConfigBatchSaveResponse'
      tags:
      - Compliance
      summary: Batch save contract configs
      description: Batch save contract configs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractConfigBatchSaveRequest'
  /management/v2/compliance/contract-pay-rule-ordering:
    post:
      operationId: ComplianceV2Controller_saveContractPayRuleOrder
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPayRuleOrderingResponse'
      tags:
      - Compliance
      summary: Save contract pay rule order
      description: Save contract pay rule order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractPayRuleOrderingRequest'
  /management/v2/compliance/contract/{id}:
    get:
      operationId: ComplianceV2Controller_getContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractGetByIdResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Get contract
      description: Get contract.
    put:
      operationId: ComplianceV2Controller_updateContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Compliance
      summary: Update contract
      description: Update contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUpdateDetail'
  /management/v2/compliance/contract/{id}/employees:
    get:
      operationId: ComplianceV2Controller_getEmployeesByContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractGetEmployeesByContractIdResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Get employees by contract
      description: Get employees by contract.
  /management/v2/compliance/contract:duplicate:
    post:
      operationId: ComplianceV2Controller_duplicateContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDuplicateResponse'
      tags:
      - Compliance
      summary: Duplicate contract
      description: Duplicate contract.
  /management/v2/compliance/contract:export-json:
    get:
      operationId: ComplianceV2Controller_exportContractJson
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractExportJsonResponse'
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Export contract JSON
      description: Export contract JSON.
  /management/v2/compliance/contract:import-json:
    post:
      operationId: ComplianceV2Controller_importContractJson
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractImportJsonResponse'
      tags:
      - Compliance
      summary: Import contract JSON
      description: Import contract JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractImportJsonRequest'
  /management/v2/compliance/contract:update-json:
    post:
      operationId: ComplianceV2Controller_updateContractJson
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractUpdateJsonResponse'
      tags:
      - Compliance
      summary: Update contract JSON
      description: Update contract JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUpdateJsonRequest'
  /management/v2/compliance/contracts/{contractId}/leave-rules:
    post:
      operationId: ComplianceV2Controller_associateLeaveRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRuleAssociateResponse'
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Associate leave rules
      description: Associate leave rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRuleAssociateRequest'
  /management/v2/compliance/contracts/{contractId}/leave-rules/{leaveRuleId}:
    delete:
      operationId: ComplianceV2Controller_unassociateLeaveRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRuleUnassociateResponse'
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: leaveRuleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Unassociate leave rule
      description: Unassociate leave rule.
  /management/v2/compliance/contracts/{contractId}/payrules/{payRuleId}/association:
    delete:
      operationId: ComplianceV2Controller_unassociatePayRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayRuleUnassociateResponse'
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: payRuleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Unassociate pay rule
      description: Unassociate pay rule.
  /management/v2/compliance/employee-rates:
    get:
      operationId: ComplianceV2Controller_getEmployeeRatesByContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeRateGetEmployeeRateByContractResponse'
      parameters:
      - name: contractId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: pageToken
        in: query
        required: false
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Get employee rates by contract
      description: Get employee rates by contract.
    put:
      operationId: ComplianceV2Controller_updateEmployeeRates
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeRateUpdateEmployeeRatesResponse'
      tags:
      - Compliance
      summary: Update employee rates
      description: Update employee rates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRateUpdateEmployeeRatesRequest'
  /management/v2/compliance/junior-rate:update:
    post:
      operationId: ComplianceV2Controller_updateJuniorRate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JuniorRateUpdateJuniorRateResponse'
      tags:
      - Compliance
      summary: Update junior rate
      description: Update junior rate.
  /management/v2/compliance/leave-rules:
    get:
      operationId: ComplianceV2Controller_getLeaveRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRuleListResponse'
      tags:
      - Compliance
      summary: Get leave rules
      description: Get leave rules.
  /management/v2/compliance/pay-policies:
    get:
      operationId: ComplianceV2Controller_getPayPolicies
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPolicyPayPolicySearchResponse'
      parameters:
      - name: includeGlobal
        in: query
        required: false
        schema:
          type: boolean
      - name: country
        in: query
        required: false
        schema:
          type: string
      tags:
      - Compliance
      summary: Get pay policies
      description: Get pay policies.
  /management/v2/compliance/pay-policies/{ppId}/latest-version:
    get:
      summary: Get latest pay policy version
      operationId: ComplianceV2Controller_getLatestVersion
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPolicyLatestVersionGetLatestVersionResponse'
      parameters:
      - name: ppId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Compliance
      description: Get latest pay policy version.
  /management/v2/compliance/pay-rule:batch-save:
    post:
      operationId: ComplianceV2Controller_batchSavePayRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayRuleBatchSaveResponse'
      tags:
      - Compliance
      summary: Batch save pay rules
      description: Batch save pay rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRuleBatchSaveRequest'
  /management/v2/compliance/payrules/{id}:
    delete:
      operationId: ComplianceV2Controller_deletePayRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayRuleDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Delete pay rule
      description: Delete pay rule.
components:
  schemas:
    modelPayPolicyVersion:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        country:
          type: string
        employmentType:
          $ref: '#/components/schemas/tenantcompliancev2modelEmploymentType'
        effectiveDate:
          type: string
        award:
          type: string
        subType:
          type: string
        deprecationDate:
          type: string
    EmployeeRateUpdateEmployeeRatesResponse:
      type: object
      properties:
        success:
          type: boolean
    modelCustomFieldAnswer:
      type: object
      properties:
        identifier:
          type: string
          title: the unique identifier of the custom field (api_name)
        system:
          $ref: '#/components/schemas/CustomFieldAnswerSystem'
          title: type of the custom field, i.e. "TIMESHEET" or "EMPLOYEE"
        configs:
          type: array
          items:
            $ref: '#/components/schemas/modelCustomFieldAnswerConfig'
          title: configuration for the custom field answer, i.e. operation and acceptable answers
        type:
          $ref: '#/components/schemas/modelCustomFieldAnswerType'
          title: type of the custom field, e.g. list, boolean, number, text
        action:
          $ref: '#/components/schemas/modelCustomFieldAnswerAction'
          title: specific action we would like to perform when checking the pay rule against the question/answer; Unspecified means it's the default filtering action
    ContractImportJsonResponse:
      type: object
      properties:
        success:
          type: boolean
        newContractId:
          type: integer
          format: int64
    AwardListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/tenantcompliancev2modelAward'
    ContractPayRuleOrderingRequest:
      type: object
      properties:
        contractId:
          type: integer
          format: int64
        payRuleIds:
          type: array
          items:
            type: integer
            format: int64
        confirmCustomisation:
          type: boolean
    tenantcompliancev2modelLevel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        levelKsuid:
          type: string
        levelBaseRate:
          type: string
    CalculationTypeSearchResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/compliancev2modelCalculationType'
    tenantcompliancev2modelContract:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        employmentCategory:
          $ref: '#/components/schemas/compliancev2modelEmploymentCategory'
        employmentType:
          $ref: '#/components/schemas/tenantcompliancev2modelEmploymentType'
        basePayRule:
          $ref: '#/components/schemas/tenantcompliancev2modelPayRule'
        payRules:
          type: array
          items:
            $ref: '#/components/schemas/tenantcompliancev2modelPayRule'
        configs:
          type: array
          items:
            $ref: '#/components/schemas/v2modelContractConfig'
        leaveRules:
          type: array
          items:
            $ref: '#/components/schemas/v2modelLeaveRule'
        payPolicyName:
          type: string
        levels:
          type: array
          items:
            $ref: '#/components/schemas/modelContractLevel'
        payType:
          $ref: '#/components/schemas/modelContractPayType'
        juniorRates:
          type: array
          items:
            $ref: '#/components/schemas/modelContractJuniorRate'
        standardHours:
          type: string
          description: Standard hours per day for this contract. Maps to employment condition's avgHoursPerDay. Set to 0 to unlink employment condition.
    v2modelEmployeeRate:
      type: object
      properties:
        employeeId:
          type: integer
          format: int64
        employeeName:
          type: string
        rates:
          type: array
          items:
            $ref: '#/components/schemas/modelRateDetail'
      title: EmployeeRate represents the rates of an employee linked to a specific contract, contains a list of rate details
    PayPolicyLatestVersionGetLatestVersionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelPayPolicyVersion'
      title: Get latest active version of pay policy response
    ContractUpdateJsonResponse:
      type: object
      properties:
        success:
          type: boolean
    modelContractType:
      type: string
      enum:
      - LIBRARY
      - CUSTOM
      default: LIBRARY
    modelTrainingRequirement:
      type: object
      properties:
        module:
          type: string
          format: int64
    modelContractStatus:
      type: string
      enum:
      - INACTIVE
      - ACTIVE
      - DRAFT
      default: INACTIVE
    PayRuleRemunerationBy:
      type: string
      enum:
      - REMUNERATION_BY_UNKNOWN
      - REMUNERATION_BY_BASE
      - REMUNERATION_BY_SHIFT_LOADING
      - REMUNERATION_BY_PERIOD_LOADING
      default: REMUNERATION_BY_UNKNOWN
    CalculationTypeRuleType:
      type: string
      enum:
      - RULE_TYPE_UNKNOWN
      - BASE
      - SHIFT_LOADING
      - PERIOD_LOADING
      default: RULE_TYPE_UNKNOWN
    modelCustomFieldAnswerAction:
      type: string
      enum:
      - UNSPECIFIED_ACTION
      - FILTER
      - TOIL_ACCRUAL
      default: UNSPECIFIED_ACTION
      title: "- UNSPECIFIED_ACTION: default is filter action, same as FILTER\n - FILTER: filter pay rule according to the CustomFieldAnswer setup\n - TOIL_ACCRUAL: convert Overtime to TimeOffInLieu when calculating shift cost"
    modelLoadingLimit:
      type: object
      properties:
        limitType:
          type: string
        limitPer:
          type: string
        customPeriod:
          type: string
        minValue:
          type: number
          format: float
        maxValue:
          type: number
          format: float
    v2modelLeaveRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        isPaid:
          type: boolean
        type:
          type: integer
          format: int64
    ContractGetByIdResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/tenantcompliancev2modelContract'
    CalculationTypeCalculationTypeCategory:
      type: string
      enum:
      - NONE
      - OVERTIME
      - PENALTY
      - ORDINARY
      default: NONE
    compliancev2modelEmploymentCategory:
      type: string
      enum:
      - EMPLOYMENT_CATEGORY_UNKNOWN
      - EMPLOYMENT_CATEGORY_PERMANENT
      - EMPLOYMENT_CATEGORY_TEMPORARY
      default: EMPLOYMENT_CATEGORY_UNKNOWN
    modelContractJuniorRate:
      type: object
      properties:
        id:
          type: string
          format: uint64
        contractId:
          type: string
          format: uint64
        name:
          type: string
        age:
          type: string
          format: uint64
        type:
          $ref: '#/components/schemas/modelContractJuniorRateType'
        value:
          type: string
        exportCode:
          type: string
    tenantcompliancev2modelAward:
      type: object
      properties:
        code:
          type: string
          title: code of the award
        name:
          type: string
          title: name of the award
        employmentType:
          $ref: '#/components/schemas/modelAwardEmploymentType'
          title: employment type
        contractId:
          type: string
          format: uint64
          title: the id of the existing pay policy contract
        basePayRuleId:
          type: string
          format: uint64
          title: the id of the base pay rule of the existing pay policy contract
        levels:
          type: array
          items:
            $ref: '#/components/schemas/tenantcompliancev2modelLevel'
          title: levels associated with the award
        basePayRuleCrId:
          type: string
          title: the CR ID of the base pay rule from the library pay policy
        basePayRuleRate:
          type: string
          title: the base pay rule hourly rate
      title: Award represents a library award/pay policy, or a custom pay policy created from PRB
    v2modelPayPolicy:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        country:
          type: string
        award:
          type: string
        effectiveDate:
          type: string
        employmentType:
          $ref: '#/components/schemas/tenantcompliancev2modelEmploymentType'
    compliancev2modelCalculationType:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        country:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/CalculationTypeCalculationTypeCategory'
        localContextList:
          type: array
          items:
            type: string
        supportedRuleTypes:
          type: array
          items:
            $ref: '#/components/schemas/CalculationTypeRuleType'
        systemContextList:
          type: array
          items:
            type: string
        sharedContextList:
          type: array
          items:
            type: string
    LeaveRuleListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelLeaveRule'
    EmployeeRateUpdateEmployeeRatesRequest:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelRateDetail'
    LeaveRuleAssociateResponse:
      type: object
      properties:
        success:
          type: boolean
    modelContractListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        ppid:
          type: string
        employeeCount:
          type: integer
          format: int64
        employmentType:
          $ref: '#/components/schemas/tenantcompliancev2modelEmploymentType'
        status:
          $ref: '#/components/schemas/modelContractStatus'
        type:
          $ref: '#/components/schemas/modelContractType'
    ContractPayRuleOrderingResponse:
      type: object
      properties:
        success:
          type: boolean
        requiresConfirmation:
          type: boolean
    PayRuleUnassociateResponse:
      type: object
      properties:
        success:
          type: boolean
    modelContractConfigStatus:
      type: string
      enum:
      - CONTRACT_CONFIG_STATUS_INACTIVE
      - CONTRACT_CONFIG_STATUS_ACTIVE
      - CONTRACT_CONFIG_STATUS_ARCHIVED
      default: CONTRACT_CONFIG_STATUS_INACTIVE
    PayPolicyPayPolicySearchResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelPayPolicy'
    ContractCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/tenantcompliancev2modelContract'
    FilterShiftSchedulingType:
      type: string
      enum:
      - UNSPECIFIED
      - SCHEDULED_ONLY
      - UNSCHEDULED_ONLY
      default: UNSPECIFIED
    v2modelContractConfig:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contractId:
          type: integer
          format: int64
        category:
          $ref: '#/components/schemas/modelContractConfigCategory'
        config:
          type: string
        status:
          $ref: '#/components/schemas/modelContractConfigStatus'
    JuniorRateUpdateJuniorRateResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
    ContractUpdateDetail:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        employmentCategory:
          $ref: '#/components/schemas/compliancev2modelEmploymentCategory'
        employmentType:
          $ref: '#/components/schemas/tenantcompliancev2modelEmploymentType'
        basePayRule:
