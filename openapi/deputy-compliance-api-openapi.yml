openapi: 3.2.0
info:
  title: Deputy V2 Compliance API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Compliance
paths:
  /management/v2/compliance/awards:
    get:
      operationId: ComplianceV2Controller_listAwards
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardListResponse'
      tags:
      - Compliance
      summary: List awards
      description: List awards.
  /management/v2/compliance/calculation-types:
    get:
      operationId: ComplianceV2Controller_getCalculationTypes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationTypeSearchResponse'
      parameters:
      - name: includeGlobal
        in: query
        required: false
        schema:
          type: boolean
      - name: country
        in: query
        required: false
        schema:
          type: string
      tags:
      - Compliance
      summary: Get calculation types
      description: Get calculation types.
  /management/v2/compliance/contract:
    get:
      operationId: ComplianceV2Controller_getContractList
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractListGetContractListResponse'
      parameters:
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: statuses
        in: query
        required: false
        schema:
          type: string
      tags:
      - Compliance
      summary: Get contract list
      description: Get contract list.
    post:
      operationId: ComplianceV2Controller_createContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCreateResponse'
      tags:
      - Compliance
      summary: Create contract
      description: Create contract.
  /management/v2/compliance/contract-config:batch-save:
    post:
      operationId: ComplianceV2Controller_batchSaveContractConfigs
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractConfigBatchSaveResponse'
      tags:
      - Compliance
      summary: Batch save contract configs
      description: Batch save contract configs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractConfigBatchSaveRequest'
  /management/v2/compliance/contract-pay-rule-ordering:
    post:
      operationId: ComplianceV2Controller_saveContractPayRuleOrder
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPayRuleOrderingResponse'
      tags:
      - Compliance
      summary: Save contract pay rule order
      description: Save contract pay rule order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractPayRuleOrderingRequest'
  /management/v2/compliance/contract/{id}:
    get:
      operationId: ComplianceV2Controller_getContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractGetByIdResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Get contract
      description: Get contract.
    put:
      operationId: ComplianceV2Controller_updateContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Compliance
      summary: Update contract
      description: Update contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUpdateDetail'
  /management/v2/compliance/contract/{id}/employees:
    get:
      operationId: ComplianceV2Controller_getEmployeesByContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractGetEmployeesByContractIdResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Get employees by contract
      description: Get employees by contract.
  /management/v2/compliance/contract:duplicate:
    post:
      operationId: ComplianceV2Controller_duplicateContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDuplicateResponse'
      tags:
      - Compliance
      summary: Duplicate contract
      description: Duplicate contract.
  /management/v2/compliance/contract:export-json:
    get:
      operationId: ComplianceV2Controller_exportContractJson
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractExportJsonResponse'
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Export contract JSON
      description: Export contract JSON.
  /management/v2/compliance/contract:import-json:
    post:
      operationId: ComplianceV2Controller_importContractJson
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractImportJsonResponse'
      tags:
      - Compliance
      summary: Import contract JSON
      description: Import contract JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractImportJsonRequest'
  /management/v2/compliance/contract:update-json:
    post:
      operationId: ComplianceV2Controller_updateContractJson
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractUpdateJsonResponse'
      tags:
      - Compliance
      summary: Update contract JSON
      description: Update contract JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUpdateJsonRequest'
  /management/v2/compliance/contracts/{contractId}/leave-rules:
    post:
      operationId: ComplianceV2Controller_associateLeaveRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRuleAssociateResponse'
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Associate leave rules
      description: Associate leave rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRuleAssociateRequest'
  /management/v2/compliance/contracts/{contractId}/leave-rules/{leaveRuleId}:
    delete:
      operationId: ComplianceV2Controller_unassociateLeaveRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRuleUnassociateResponse'
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: leaveRuleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Unassociate leave rule
      description: Unassociate leave rule.
  /management/v2/compliance/contracts/{contractId}/payrules/{payRuleId}/association:
    delete:
      operationId: ComplianceV2Controller_unassociatePayRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayRuleUnassociateResponse'
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: payRuleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Unassociate pay rule
      description: Unassociate pay rule.
  /management/v2/compliance/employee-rates:
    get:
      operationId: ComplianceV2Controller_getEmployeeRatesByContract
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeRateGetEmployeeRateByContractResponse'
      parameters:
      - name: contractId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: pageToken
        in: query
        required: false
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Get employee rates by contract
      description: Get employee rates by contract.
    put:
      operationId: ComplianceV2Controller_updateEmployeeRates
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeRateUpdateEmployeeRatesResponse'
      tags:
      - Compliance
      summary: Update employee rates
      description: Update employee rates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRateUpdateEmployeeRatesRequest'
  /management/v2/compliance/junior-rate:update:
    post:
      operationId: ComplianceV2Controller_updateJuniorRate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JuniorRateUpdateJuniorRateResponse'
      tags:
      - Compliance
      summary: Update junior rate
      description: Update junior rate.
  /management/v2/compliance/leave-rules:
    get:
      operationId: ComplianceV2Controller_getLeaveRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRuleListResponse'
      tags:
      - Compliance
      summary: Get leave rules
      description: Get leave rules.
  /management/v2/compliance/pay-policies:
    get:
      operationId: ComplianceV2Controller_getPayPolicies
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPolicyPayPolicySearchResponse'
      parameters:
      - name: includeGlobal
        in: query
        required: false
        schema:
          type: boolean
      - name: country
        in: query
        required: false
        schema:
          type: string
      tags:
      - Compliance
      summary: Get pay policies
      description: Get pay policies.
  /management/v2/compliance/pay-policies/{ppId}/latest-version:
    get:
      summary: Get latest pay policy version
      operationId: ComplianceV2Controller_getLatestVersion
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPolicyLatestVersionGetLatestVersionResponse'
      parameters:
      - name: ppId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Compliance
      description: Get latest pay policy version.
  /management/v2/compliance/pay-rule:batch-save:
    post:
      operationId: ComplianceV2Controller_batchSavePayRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayRuleBatchSaveResponse'
      tags:
      - Compliance
      summary: Batch save pay rules
      description: Batch save pay rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRuleBatchSaveRequest'
  /management/v2/compliance/payrules/{id}:
    delete:
      operationId: ComplianceV2Controller_deletePayRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayRuleDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Compliance
      summary: Delete pay rule
      description: Delete pay rule.
components:
  schemas:
    v2modelEmployeeRate:
      type: object
      properties:
        employeeId:
          type: integer
          format: int64
        employeeName:
          type: string
        rates:
          type: array
          items:
            $ref: '#/components/schemas/modelRateDetail'
      title: EmployeeRate represents the rates of an employee linked to a specific contract, contains a list of rate details
    modelRateDetail:
      type: object
      properties:
        agreementId:
          type: integer
          format: int64
          title: The agreement id of the rate
        contractId:
          type: integer
          format: int64
          title: the contract the base rate belongs to
        locationName:
          type: string
          title: Name of the location to which the rate belongs
        areaRateId:
          type: integer
          format: int64
          title: The area rate id of the rate. Only set when this is area rate
        areaName:
          type: string
          title: The name of the area to which the rate belongs. Only set when this is area rate
        areaId:
          type: integer
          format: int64
          title: The area id (i.e. operationalUnitId). Only set when this is area rate
        rate:
          type: number
          format: double
          title: 'The rate value.

            When retrieving rate details, if was main rate, then this is `agreement.base_rate`, or basePayRule.hourlyRate as fallback; If was area rate, then this is `area_rate.base_rate`

            When updating rate details, this is the new rate value'
      title: Rate represents the details of the employee rate, either main rate or area rate, and related location and area
    modelContractListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        ppid:
          type: string
        employeeCount:
          type: integer
          format: int64
        employmentType:
          $ref: '#/components/schemas/tenantcompliancev2modelEmploymentType'
        status:
          $ref: '#/components/schemas/modelContractStatus'
        type:
          $ref: '#/components/schemas/modelContractType'
    modelContractStatus:
      type: string
      enum:
      - INACTIVE
      - ACTIVE
      - DRAFT
      default: INACTIVE
    CalculationTypeCalculationTypeCategory:
      type: string
      enum:
      - NONE
      - OVERTIME
      - PENALTY
      - ORDINARY
      default: NONE
    LeaveRuleUnassociateResponse:
      type: object
      properties:
        success:
          type: boolean
    ContractConfigBatchSaveResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        requiresConfirmation:
          type: boolean
    CustomFieldAnswerSystem:
      type: string
      enum:
      - UNSPECIFIED
      - TIMESHEET
      - EMPLOYEE
      - ROSTER
      default: UNSPECIFIED
    PayRuleUnassociateResponse:
      type: object
      properties:
        success:
          type: boolean
    modelCustomFieldAnswerConfig:
      type: object
      properties:
        operation:
          type: string
          title: one of eq, neq, gt, lt, gte, lte, in, nin
        values:
          type: array
          items:
            type: string
    PayRulePayPortionRule:
      type: string
      enum:
      - PAY_PORTION_RULE_UNKNOWN
      - PAY_PORTION_RULE_GREATER
      - PAY_PORTION_RULE_EXACT
      - PAY_PORTION_RULE_FULL
      default: PAY_PORTION_RULE_UNKNOWN
    ContractImportJsonResponse:
      type: object
      properties:
        success:
          type: boolean
        newContractId:
          type: integer
          format: int64
    modelContractJuniorRate:
      type: object
      properties:
        id:
          type: string
          format: uint64
        contractId:
          type: string
          format: uint64
        name:
          type: string
        age:
          type: string
          format: uint64
        type:
          $ref: '#/components/schemas/modelContractJuniorRateType'
        value:
          type: string
        exportCode:
          type: string
    modelCustomFieldAnswerAction:
      type: string
      enum:
      - UNSPECIFIED_ACTION
      - FILTER
      - TOIL_ACCRUAL
      default: UNSPECIFIED_ACTION
      title: "- UNSPECIFIED_ACTION: default is filter action, same as FILTER\n - FILTER: filter pay rule according to the CustomFieldAnswer setup\n - TOIL_ACCRUAL: convert Overtime to TimeOffInLieu when calculating shift cost"
    modelEmployeeProfilePayRate:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Employee ID
        firstName:
          type: string
          title: Employee first name
        lastName:
          type: string
          title: Employee last name
        displayName:
          type: string
          title: Employee display name
        photoUrl:
          type: string
          title: Photo url
        photoFileId:
          type: string
          format: int64
          title: Photo file id
        baseRate:
          type: string
          title: Employee pay rate
        levelId:
          type: string
          title: Level Id
    ContractDuplicateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/tenantcompliancev2modelContract'
    PayRuleBatchSaveRequest:
      type: object
      properties:
        contractId:
          type: integer
          format: int32
        payRules:
          type: array
          items:
            $ref: '#/components/schemas/tenantcompliancev2modelPayRule'
        confirmCustomisation:
          type: boolean
    PayRuleBatchSaveResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        requiresConfirmation:
          type: boolean
    v2modelFilter:
      type: object
      properties:
        customFieldAnswers:
          type: array
          items:
            $ref: '#/components/schemas/modelCustomFieldAnswer'
        recurrenceRule:
          type: string
        shiftSchedulingType:
          $ref: '#/components/schemas/FilterShiftSchedulingType'
        shiftStartTimeRange:
          type: string
        shiftEndTimeRange:
          type: string
        rRulePublicHolidayInclusion:
          $ref: '#/components/schemas/FilterRRulePublicHolidayInclusionType'
          title: Determines recurrence rule is applicable on public holiday (recurrenceRule AND public holiday condition should be met)
        particularDate:
          type: string
        applyOncePerDay:
          type: boolean
        areaNames:
          type: array
          items:
            type: string
        trainingRequirements:
          type: array
          items:
            $ref: '#/components/schemas/modelTrainingRequirement'
    CalculationTypeSearchResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/compliancev2modelCalculationType'
    ContractGetEmployeesByContractIdResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelEmployeeProfilePayRate'
    PayRuleRemunerationType:
      type: string
      enum:
      - REMUNERATION_TYPE_UNKNOWN
      - REMUNERATION_TYPE_HOURLY
      - REMUNERATION_TYPE_MULTIPLIER
      - REMUNERATION_TYPE_UNIT
      - REMUNERATION_TYPE_SALARY
      default: REMUNERATION_TYPE_UNKNOWN
    modelPayConfig:
      type: object
      properties:
        roundUpHours:
          type: boolean
        loadingLimit:
          $ref: '#/components/schemas/modelLoadingLimit'
        classificationReference:
          type: string
    ContractExportJsonResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: string
    ContractCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/tenantcompliancev2modelContract'
    ContractListGetContractListResponse:
      type: object
      properties:
        success:
          type: boolean
        nextPageToken:
          type: string
        totalCount:
          type: integer
          format: int64
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelContractListItem'
    ContractConfigBatchSaveRequest:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: '#/components/schemas/v2modelContractConfig'
        confirmCustomisation:
          type: boolean
    ContractPayRuleOrderingResponse:
      type: object
      properties:
        success:
          type: boolean
        requiresConfirmation:
          type: boolean
    modelContractLevel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        levelKsuid:
          type: string
        contractId:
          type: integer
          format: int64
        baseRate:
          type: string
        crIds:
          type: array
          items:
            type: string
        exportCode:
          type: string
    modelContractPayType:
      type: string
      enum:
      - CONTRACT_PAY_TYPE_UNKNOWN
      - CONTRACT_PAY_TYPE_HOURLY
      - CONTRACT_PAY_TYPE_SALARY
      default: CONTRACT_PAY_TYPE_UNKNOWN
    tenantcompliancev2modelLevel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        levelKsuid:
          type: string
        levelBaseRate:
          type: string
    tenantcompliancev2modelAward:
      type: object
      properties:
        code:
          type: string
          title: code of the award
        name:
          type: string
          title: name of the award
        employmentType:
          $ref: '#/components/schemas/modelAwardEmploymentType'
          title: employment type
        contractId:
          type: string
          format: uint64
          title: the id of the existing pay policy contract
        basePayRuleId:
          type: string
          format: uint64
          title: the id of the base pay rule of the existing pay policy contract
        levels:
          type: array
          items:
            $ref: '#/components/schemas/tenantcompliancev2modelLevel'
          title: levels associated with the award
        basePayRuleCrId:
          type: string
          title: the CR ID of the base pay rule from the library pay policy
        basePayRuleRate:
          type: string
          title: the base pay rule hourly rate
      title: Award represents a library award/pay policy, or a custom pay policy created from PRB
    FilterShiftSchedulingType:
      type: string
      enum:
      - UNSPECIFIED
      - SCHEDULED_ONLY
      - UNSCHEDULED_ONLY
      default: UNSPECIFIED
    ContractUpdateJsonResponse:
      type: object
      properties:
        success:
          type: boolean
    v2modelLeaveRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        isPaid:
          type: boolean
        type:
          type: integer
          format: int64
    PayRuleRemunerationBy:
      type: string
      enum:
      - REMUNERATION_BY_UNKNOWN
      - REMUNERATION_BY_BASE
      - REMUNERATION_BY_SHIFT_LOADING
      - REMUNERATION_BY_PERIOD_LOADING
      default: REMUNERATION_BY_UNKNOWN
    modelPayRuleRateType:
      type: string
      enum:
      - RATE_TYPE_UNKNOWN
      - RATE_TYPE_ORDINARY
      - RATE_TYPE_OVERTIME
      - RATE_TYPE_PENALTY
      - RATE_TYPE_NON_PAYABLE
      default: RATE_TYPE_UNKNOWN
    modelCustomFieldAnswerType:
      type: string
      enum:
      - TYPE_UNSPECIFIED
      - TYPE_LIST
      - TYPE_BOOL
      - TYPE_NUMBER
      - TYPE_TEXT
      - TYPE_BOOL_YES_COMMENT
      - TYPE_BOOL_NO_COMMENT
      default: TYPE_UNSPECIFIED
    modelTrainingRequirement:
      type: object
      properties:
        module:
          type: string
          format: int64
    modelLoadingLimit:
      type: object
      properties:
        limitType:
          type: string
        limitPer:
          type: string
        customPeriod:
          type: string
        minValue:
          type: number
          format: float
        maxValue:
