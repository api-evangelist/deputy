openapi: 3.2.0
info:
  title: Deputy V2 Partner Employees API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Partner Employees
paths:
  /management/v2/employees:filterByExternalLinkIds:
    get:
      summary: Retrieve list of employees using externalLinkId
      operationId: PartnerEmployeesV2Controller_filterByExternalLinkIds
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerEmployeesListResponse'
      parameters:
      - name: externalLinkIds
        description: List of external IDs to filter by.
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: cursor
        description: Pagination cursor.
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: Maximum number of results to return.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: active
        description: Optional active filter.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Partner Employees
      security:
      - APIToken: []
      description: Retrieve list of employees using externalLinkId.
  /management/v2/employees:hasImportedEmployees:
    get:
      summary: Determine if exists employee imported from partner
      operationId: PartnerEmployeesV2Controller_hasImportedEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerEmployeesImportTrackerResponse'
      parameters:
      - name: vendor
        in: query
        required: false
        schema:
          type: string
      tags:
      - Partner Employees
      security:
      - APIToken: []
      description: Determine if exists employee imported from partner.
components:
  schemas:
    modelPartnerEmployee:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: '[read-only] Unique ID of employee'
        firstName:
          type: string
          title: First name
        lastName:
          type: string
          title: Last name
        email:
          type: string
          title: Email
        active:
          type: boolean
          title: True if employee is not archived, false if archived
        role:
          type: string
          format: int64
          title: Employee Role
        externalLinkId:
          type: string
          title: External ID in third party system
      title: PartnerEmployee represents an employee in a partner system
    PartnerEmployeesImportTrackerResponse:
      type: object
      properties:
        success:
          type: boolean
        imported:
          type: boolean
    PartnerEmployeesListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelPartnerEmployee'
        nextCursor:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
