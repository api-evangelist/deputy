openapi: 3.2.0
info:
  title: Deputy V2 Employee Data Fix API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employee Data Fix
paths:
  /management/v2/employee-data-fix/effective-date:
    post:
      summary: Set effective date for employee agreement
      operationId: EmployeeDataFixV2Controller_setEffectiveDate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDataFixDataSetEffectiveDateResponse'
      tags:
      - Employee Data Fix
      description: Set effective date for employee agreement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDataFixDataSetEffectiveDateRequest'
  /management/v2/employee-data-fix/employee-agreement-company:
    post:
      summary: Set effective date for employee agreement
      operationId: EmployeeDataFixV2Controller_syncEmployeeAgreementCompany
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDataFixDataSyncEmployeeAgreementCompanyResponse'
      tags:
      - Employee Data Fix
      description: Set effective date for employee agreement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDataFixDataSyncEmployeeAgreementCompanyRequest'
  /management/v2/employee-data-fix/workplace-agreement/sync:
    post:
      summary: endpoint to trigger syncing for workplace agreements
      operationId: EmployeeDataFixV2Controller_triggerWorkplaceAgreementSync
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDataFixDataSyncWorkplaceAgreementResponse'
      tags:
      - Employee Data Fix
      description: endpoint to trigger syncing for workplace agreements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDataFixDataSyncWorkplaceAgreementRequest'
  /management/v2/employee-data-fix/workplace-agreement/update:
    post:
      summary: manually update the workplace agreement endpoint
      operationId: EmployeeDataFixV2Controller_updateWorkplaceAgreement
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDataFixDataUpdateWorkplaceAgreementResponse'
      tags:
      - Employee Data Fix
      description: manually update the workplace agreement endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDataFixDataUpdateWorkplaceAgreementRequest'
components:
  schemas:
    EmployeeDataFixDataUpdateWorkplaceAgreementResponse:
      type: object
      properties:
        success:
          type: boolean
        updatedCount:
          type: string
          format: int64
    EmployeeDataFixDataSyncEmployeeAgreementCompanyResponse:
      type: object
      properties:
        success:
          type: boolean
    EmployeeDataFixDataSyncWorkplaceAgreementRequest:
      type: object
      properties:
        employeeIds:
          type: array
          items:
            type: string
            format: int64
      title: input/output messages for workplace agreement sync
    EmployeeDataFixDataSyncWorkplaceAgreementResponse:
      type: object
      properties:
        success:
          type: boolean
    EmployeeDataFixDataSyncEmployeeAgreementCompanyRequest:
      type: object
      properties:
        workplaceIds:
          type: array
          items:
            type: string
            format: int64
    EmployeeDataFixDataUpdateWorkplaceAgreementWorkplace:
      type: object
      properties:
        id:
          type: string
          format: int64
        oldAgreementId:
          type: string
          format: int64
        agreementId:
          type: string
          format: int64
    EmployeeDataFixDataSetEffectiveDateRequest:
      type: object
      properties:
        agreementIds:
          type: array
          items:
            type: string
            format: int64
    EmployeeDataFixDataUpdateWorkplaceAgreementRequest:
      type: object
      properties:
        workplaces:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeDataFixDataUpdateWorkplaceAgreementWorkplace'
    EmployeeDataFixDataSetEffectiveDateResponse:
      type: object
      properties:
        success:
          type: boolean
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
