openapi: 3.2.0
info:
  title: Deputy V2 Employee Sentiment API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employee Sentiment
paths:
  /v2/employee-sentiment:
    post:
      summary: Create an employee sentiment
      operationId: EmployeeSentimentV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSentimentCreateResponse'
      tags:
      - Employee Sentiment
      description: Create an employee sentiment.
  /v2/employee-sentiment/settings:
    get:
      summary: Get pulse settings
      operationId: EmployeeSentimentV2Controller_getSettings
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSentimentGetSettingsResponse'
      tags:
      - Employee Sentiment
      description: Get pulse settings.
  /v2/employee-sentiment/start/{start}/end/{end}:
    get:
      summary: Get employee sentiment aggregated data
      operationId: EmployeeSentimentV2Controller_aggregate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSentimentAggregateResponse'
      parameters:
      - name: start
        description: Start date
        in: path
        required: true
        schema:
          type: string
      - name: end
        description: End date
        in: path
        required: true
        schema:
          type: string
      - name: locationId
        description: Location ID.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: areaId
        description: Area ID.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Employee Sentiment
      description: Get employee sentiment aggregated data.
  /v2/employee-sentiment/start/{start}/end/{end}/location-id/{locationId}:
    get:
      summary: Get employee sentiment aggregated by location
      operationId: EmployeeSentimentV2Controller_aggregateLocation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSentimentAggregateResponse'
      parameters:
      - name: start
        description: Start date
        in: path
        required: true
        schema:
          type: string
      - name: end
        description: End date
        in: path
        required: true
        schema:
          type: string
      - name: locationId
        description: Location ID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: areaId
        description: Area ID.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Employee Sentiment
      description: Get employee sentiment aggregated by location.
  /v2/employee-sentiment/start/{start}/end/{end}/location-id/{locationId}/weekly:
    get:
      summary: Get weekly aggregated employee sentiment data by location
      operationId: EmployeeSentimentV2Controller_getWeeklyAggregatedLocation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSentimentGetWeeklyAggregatedResponse'
      parameters:
      - name: start
        in: path
        required: true
        schema:
          type: string
      - name: end
        in: path
        required: true
        schema:
          type: string
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Employee Sentiment
      description: Get weekly aggregated employee sentiment data by location.
  /v2/employee-sentiment/start/{start}/end/{end}/weekly:
    get:
      summary: Get weekly aggregated employee sentiment data
      operationId: EmployeeSentimentV2Controller_getWeeklyAggregated
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSentimentGetWeeklyAggregatedResponse'
      parameters:
      - name: start
        in: path
        required: true
        schema:
          type: string
      - name: end
        in: path
        required: true
        schema:
          type: string
      - name: locationId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Employee Sentiment
      description: Get weekly aggregated employee sentiment data.
  /v2/employee-sentiment:check:
    post:
      summary: Check employee sentiment eligibility
      operationId: EmployeeSentimentV2Controller_check
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSentimentCheckResponse'
      tags:
      - Employee Sentiment
      description: Check employee sentiment eligibility.
components:
  schemas:
    modelPulseSettingsScore:
      type: string
      enum:
      - UNKNOWN_SCORE
      - STRESSED
      - FRUSTRATED
      - OKAY
      - GOOD
      - HAPPY
      default: UNKNOWN_SCORE
      title: "- UNKNOWN_SCORE: not used\n - STRESSED: valid scores"
    QuestionQuestionType:
      type: string
      enum:
      - UNKNOWN_QUESTION_TYPE
      - SHORT
      - YES_NO
      - MULTIPLE
      default: UNKNOWN_QUESTION_TYPE
    EmployeeSentimentGetWeeklyAggregatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelEmployeeSentimentWeekly'
      title: Get weekly employee sentiment aggregated response
    modelPulseSettingsEmoji:
      type: object
      properties:
        icon:
          type: string
        label:
          type: string
        score:
          $ref: '#/components/schemas/modelPulseSettingsScore'
        order:
          type: integer
          format: int32
    EmployeeSentimentAggregateResponseData:
      type: object
      properties:
        start:
          type: string
          format: date-time
          title: Start time
        end:
          type: string
          format: date-time
          title: End time
        locationId:
          type: integer
          format: int32
          title: Location ID
        average:
          type: number
          format: float
          title: Average score for the period
        count:
          type: integer
          format: int32
          title: Count of the sentiments in the period
        commentsCount:
          type: integer
          format: int32
          title: Number of comments
        sentimentsByDate:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeSentimentSentimentsByDate'
          title: Score summary
        percentageChange:
          type: number
          format: float
          title: percentageChange since last 30 days
        sentimentsCount:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EmployeeSentimentSentimentCount'
          title: reaction count of each score
      title: AggregateResponse data
    modelPulseSettings:
      type: object
      properties:
        tenantId:
          type: string
        isShiftPulseFullVersion:
          type: boolean
        isShiftPulseEnabled:
          type: boolean
        emojis:
          type: array
          items:
            $ref: '#/components/schemas/modelPulseSettingsEmoji'
        customQuestions:
          type: array
          items:
            $ref: '#/components/schemas/modelQuestion'
        pulseFrequency:
          $ref: '#/components/schemas/PulseSettingsPulseFrequency'
        roleIds:
          type: array
          items:
            type: integer
            format: int32
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        areaIds:
          type: array
          items:
            type: integer
            format: int32
        createdAt:
          type: string
          format: date-time
          title: created at timestamp
        modifiedAt:
          type: string
          format: date-time
          title: last modified at timestamp
    EmployeeSentimentAggregateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/EmployeeSentimentAggregateResponseData'
      title: AggregateResponse
    modelEmployeeSentimentWeeklyAverage:
      type: object
      properties:
        start:
          type: string
        average:
          type: number
          format: float
    modelQuestion:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/QuestionQuestionType'
        question:
          type: string
        description:
          type: string
        options:
          type: array
          items:
            type: string
        isRequired:
          type: boolean
        order:
          type: integer
          format: int32
        isSelected:
          type: boolean
        isCustom:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        responses:
          type: array
          items:
            $ref: '#/components/schemas/modelQuestionResponse'
    EmployeeSentimentCheckResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/EmployeeSentimentCheckResponseData'
      title: CheckResponse
    EmployeeSentimentCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelEmployeeSentiment'
      title: Create an employee sentiment response
    modelEmployeeSentimentWeekly:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
        locationId:
          type: integer
          format: int32
        sentiments:
          type: array
          items:
            $ref: '#/components/schemas/modelEmployeeSentimentWeeklyAverage'
        comments:
          type: array
          items:
            type: string
    modelEmployeeSentimentEmoji:
      type: object
      properties:
        label:
          type: string
          title: custom label of the emoji
        order:
          type: integer
          format: int32
          title: order of the emoji
        score:
          type: integer
          format: int32
          title: integer score assigned to the emoji
        emoji:
          type: string
          title: icon assigned to the emoji
      title: Emoji
    EmployeeSentimentSentimentCount:
      type: object
      properties:
        emoji:
          type: string
          title: emoji icon of the sentiment
        label:
          type: string
          title: label of the sentiment
        count:
          type: integer
          format: int32
          title: count of the emoji sentiments
        percentage:
          type: number
          format: float
          title: percentage of the count
        order:
          type: integer
          format: int32
          title: order of the emoji
      title: SentimentsCount
    PulseSettingsPulseFrequency:
      type: string
      enum:
      - PULSE_FREQUENCY_UNKNOWN
      - PULSE_FREQUENCY_EVERY_SHIFT
      - PULSE_FREQUENCY_DAILY
      - PULSE_FREQUENCY_WEEKLY
      - PULSE_FREQUENCY_FORTNIGHTLY
      - PULSE_FREQUENCY_MONTHLY
      default: PULSE_FREQUENCY_UNKNOWN
    EmployeeSentimentCheckResponseData:
      type: object
      properties:
        eligible:
          type: boolean
          title: whether user is eligible for a pulse check
        emojis:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/modelEmployeeSentimentEmoji'
          title: emoji collection
        shiftPulseQuestion:
          type: string
          title: custom shit pulse question
    EmployeeSentimentSentiment:
      type: object
      properties:
        score:
          $ref: '#/components/schemas/modelEmployeeSentimentScore'
        comment:
          type: string
        emoji:
          type: string
      title: Sentiment
    modelQuestionResponse:
      type: object
      properties:
        answer:
          type: string
        comment:
          type: string
    EmployeeSentimentSentimentsByDate:
      type: object
      properties:
        date:
          type: string
          format: date-time
          title: Date for the day
        sentiments:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeSentimentSentiment'
          title: Sentiments for this date
      title: SentimentsByDate
    v2modelEmployeeSentiment:
      type: object
      properties:
        score:
          $ref: '#/components/schemas/modelEmployeeSentimentScore'
          title: Score
        locationId:
          type: integer
          format: int32
          title: Location ID
        comment:
          type: string
          title: Comment
        areaId:
          type: integer
          format: int32
          title: area ID
      title: Employee Sentiment
    modelEmployeeSentimentScore:
      type: string
      enum:
      - UNKNOWN_SCORE
      - STRESSED
      - FRUSTRATED
      - OKAY
      - GOOD
      - HAPPY
      default: UNKNOWN_SCORE
      description: "- UNKNOWN_SCORE: not used\n - STRESSED: valid scores"
      title: Score
    EmployeeSentimentGetSettingsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelPulseSettings'
      title: GetSettingsResponse is the response for getting shift pulse settings
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
