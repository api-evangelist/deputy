openapi: 3.2.0
info:
  title: Deputy V2 Leave Reference Period API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Reference Period
paths:
  /management/v2/leave-reference-period/calculate-average-day-hours:
    post:
      operationId: LeaveReferencePeriodV2Controller_calculateAverageDayHours
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveReferencePeriodLeaveReferencePeriodResponse'
      tags:
      - Leave Reference Period
      summary: Calculate average day hours
      description: Calculate average day hours.
components:
  schemas:
    LeaveReferencePeriodLeaveReferencePeriodResponse:
      type: object
      properties:
        success:
          type: boolean
        canCalculate:
          type: boolean
        averageHoursPerDay:
          type: number
          format: float
        calculatedAt:
          type: string
          format: date-time
        averageHoursPerWeek:
          type: number
          format: float
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
