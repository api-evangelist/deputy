openapi: 3.2.0
info:
  title: Deputy V2 Area Rate API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Area Rate
paths:
  /v2/area-rates/{employeeId}:
    get:
      summary: Retrieve area rate by given Employee Id
      operationId: AreaRateV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaRateGetResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: effectiveDate
        in: query
        required: false
        schema:
          type: string
      tags:
      - Area Rate
      description: Retrieve area rate by given Employee Id.
  /v2/area-rates:batch-save:
    post:
      summary: Batch save area rate for multiple employees
      operationId: AreaRateV2Controller_batchSave
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaRateBatchSaveResponse'
      tags:
      - Area Rate
      description: Batch save area rate for multiple employees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaRateBatchSaveRequest'
components:
  schemas:
    AreaRateBatchSaveResponse:
      type: object
      properties:
        success:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AreaRateSaveError'
      title: Batch Save Area Rate response
    tenantarea_ratev2modelPayRule:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Pay rule id
        payTitle:
          type: string
          title: Pay rule title
        hourlyRate:
          type: number
          format: double
          title: Pay rule hourly rate, e.g. 15.5 (dollars)
        isMultiplier:
          type: boolean
          title: Pay rule multiplier state
        multiplierValue:
          type: number
          format: double
          description: Pay rule multiplier value, e.g. 1.5, 2, etc.
        multiplierBaseRate:
          type: integer
          format: int32
          title: Pay rule multiplier base rate as a reference to another pay rule
        unitValue:
          type: number
          format: double
          title: Pay rule unit value
        remunerationType:
          type: integer
          format: int32
          title: Remuneration Type
        levelIds:
          type: array
          items:
            type: integer
            format: int32
          title: List of associated levels
        levelAssnType:
          type: integer
          format: int64
          title: Level assignment type
        config:
          type: string
          title: Pay rule Config
    v2modelAreaRate:
      type: object
      properties:
        areaIds:
          type: array
          items:
            type: integer
            format: int32
          title: Array of area ids
        baseRate:
          type: number
          format: double
          title: Base rate
        contractId:
          type: integer
          format: int32
          title: Contract id
        payRuleOverrides:
          type: array
          items:
            $ref: '#/components/schemas/modelPayRuleOverride'
          title: Pay Rule Overrides, i.e. <payRuleId, overrideValue>
        levelId:
          type: integer
          format: int32
          title: Level Id
        effectiveDate:
          type: string
          title: Effective date (YYYY-MM-DD format)
    AreaRateGetResponse:
      type: object
      properties:
        success:
          type: boolean
        areaRates:
          type: array
          items:
            $ref: '#/components/schemas/v2modelAreaRate'
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/tenantarea_ratev2modelContract'
      title: Get Area Rate response
    tenantarea_ratev2modelContract:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Contract id
        name:
          type: string
          title: Contract name
        payRules:
          type: array
          items:
            $ref: '#/components/schemas/tenantarea_ratev2modelPayRule'
          title: Contract pay rules
        levels:
          type: array
          items:
            $ref: '#/components/schemas/tenantarea_ratev2modelLevel'
          title: Contract levels
    AreaRateAreaRateData:
      type: object
      properties:
        areaId:
          type: integer
          format: int32
          title: Area id
        baseRate:
          type: number
          format: double
          title: Base rate can be determined by contract/level or can be directly provided
        contractId:
          type: string
          title: 'Contract id or contract code

            Contract id should be numeric, contract code should be valid ppid and include alphabetic and numeric characters only'
        levelId:
          type: string
          title: 'Level id or level code

            Level id should be numeric, level code should include alphabetic and numeric characters only'
    tenantarea_ratev2modelLevel:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Level id
        title:
          type: string
          title: Level title
        baseRate:
          type: number
          format: double
          title: Level base rate
        levelKsuid:
          type: string
          title: levelKsuid
    AreaRateSaveError:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
          title: Employee ID
        areaRateId:
          type: integer
          format: int32
          title: Area Rate ID
        areaId:
          type: integer
          format: int32
        message:
          type: string
      title: Save Area Rate error details
    AreaRateSaveRequest:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
          title: Employee ID
        areaRateId:
          type: integer
          format: int32
          title: Area Rate ID
        areaRate:
          $ref: '#/components/schemas/AreaRateAreaRateData'
      title: Save Area Rate request
    modelPayRuleOverride:
      type: object
      properties:
        payRuleId:
          type: integer
          format: int32
        value:
          type: number
          format: double
    AreaRateBatchSaveRequest:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/AreaRateSaveRequest'
      title: Batch Save Area Rate request
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
