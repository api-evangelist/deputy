openapi: 3.2.0
info:
  title: Deputy V2 Leave Rules API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Rules
paths:
  /management/v2/leave-rules/toil:
    get:
      operationId: LeaveRuleV2Controller_ListToilLeaveRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRulesListToilLeaveRulesResponse'
      tags:
      - Leave Rules
      summary: List toil leave rules
      description: List toil leave rules.
components:
  schemas:
    LeaveRulesTOILLeaveRuleData:
      type: object
      properties:
        name:
          type: string
        id:
          type: integer
          format: int32
    LeaveRulesListToilLeaveRulesResponse:
      type: object
      properties:
        success:
          type: boolean
        leaveRules:
          type: array
          items:
            $ref: '#/components/schemas/LeaveRulesTOILLeaveRuleData'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
