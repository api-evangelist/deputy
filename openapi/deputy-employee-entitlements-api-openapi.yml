openapi: 3.2.0
info:
  title: Deputy V2 Employee Entitlements API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employee Entitlements
paths:
  /management/v2/leave-entitlements:get-by-employees:
    post:
      summary: Get employee entitlements by employeeIDs
      operationId: LeaveEntitlementsV2Controller_GetEmployeeEntitlementsByEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveEntitlementsGetEmployeeEntitlementsByEmployeesResponse'
      tags:
      - Employee Entitlements
      description: Get employee entitlements by employeeIDs.
components:
  schemas:
    LeaveEntitlementsGetEmployeeEntitlementsByEmployeesResponse:
      type: object
      properties:
        success:
          type: boolean
        employeeEntitlements:
          type: array
          items:
            $ref: '#/components/schemas/modelEmployeeEntitlement'
      title: Get employee entitlements by employeeIDs response
    modelEmployeeEntitlement:
      type: object
      properties:
        employeeId:
          type: string
        leaveRuleIds:
          type: array
          items:
            type: integer
            format: int32
      title: Employee Entitlement
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
