openapi: 3.2.0
info:
  title: Deputy V2 Leave Accrual API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Accrual
paths:
  /management/v2/leave-accrual/agreed-hours-recalculation:preview:
    post:
      operationId: LeaveAccrualV2Controller_agreedHoursRecalculationPreview
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveAccrualAgreedHoursRecalculationPreviewResponse'
      tags:
      - Leave Accrual
      summary: Agreed hours recalculation preview
      description: Agreed hours recalculation preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveAccrualAgreedHoursRecalculationPreviewRequest'
  /management/v2/leave-accrual/release-for-hire-date:
    post:
      operationId: LeaveAccrualV2Controller_releaseForHireDate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveAccrualReleaseForHireDateResponse'
      tags:
      - Leave Accrual
      security:
      - APIToken: []
      summary: Release for hire date
      description: Release for hire date.
components:
  schemas:
    LeaveAccrualAgreedHoursRecalculationPreviewResponse:
      type: object
      properties:
        success:
          type: boolean
        employeeEligibilities:
          type: array
          items:
            $ref: '#/components/schemas/LeaveAccrualEmployeeRecalculationEligibility'
    LeaveAccrualEligibleRecalculationPolicy:
      type: object
      properties:
        policyId:
          type: string
        policyName:
          type: string
    LeaveAccrualReleaseForHireDateResponse:
      type: object
      properties:
        success:
          type: boolean
      title: ReleaseForHireDate response
    LeaveAccrualEmployeeRecalculationEligibility:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
        eligiblePolicies:
          type: array
          items:
            $ref: '#/components/schemas/LeaveAccrualEligibleRecalculationPolicy'
    LeaveAccrualAgreedHoursRecalculationPreviewRequest:
      type: object
      properties:
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
