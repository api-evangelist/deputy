openapi: 3.2.0
info:
  title: Deputy V2 Employee Profile API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employee Profile
paths:
  /management/v2/employee-profile/{id}:
    get:
      summary: Retrieve employee profile by given Id
      operationId: EmployeeProfileV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Employee Profile
      description: Retrieve employee profile by given Id.
  /management/v2/employee-profile:by-ids-and-custom-filters:
    post:
      summary: Retrieve employee profiles by IDs and custom filters
      operationId: EmployeeProfileV2Controller_retrieveEmployeeProfileByIdsAndCustomFiltersRequest
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileRetrieveEmployeeProfileByIdsAndCustomFiltersResponse'
      tags:
      - Employee Profile
      description: Retrieve employee profiles by IDs and custom filters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeProfileRetrieveEmployeeProfileByIdsAndCustomFiltersRequest'
  /management/v2/employees-profile:
    get:
      summary: Retrieve list of employee profile
      description: Supports searching by name, company, active status, role, and other fields using the filters parameter.
      operationId: EmployeeProfileV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileListResponse'
      parameters:
      - name: filters
        description: "Filter employees by field values. Format: filters[]={fieldName}:{value}\nMultiple filters can be combined. Use the 'op' parameter to specify AND (default) or OR operation.\n\nAND filter example (default): \n```\nGET /api/management/v2/employees-profile?filters[]=active:1&filters[]=company:10\n```\nReturns active employees from company 10 (both conditions must match)\n\nOR filter example: \n```\nGET /api/management/v2/employees-profile?filters[]=role:5&filters[]=role:6&op=OR\n```\nReturns employees with role 5 OR 6 (either condition matches)\n\nAvailable filterable fields:\n- id: Employee ID\n- company: Company ID\n- first_name: Employee first name\n- last_name: Employee last name\n- display_name: Employee display name\n- gender: Gender\n- user_id: User ID\n- active: Active status (boolean: use 1 for true, 0 for false)\n- termination_date: Termination date\n- position: Position\n- role: Role ID"
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        description: "Controls how multiple filters are combined. Default is AND (all filters must match).\nValid values: \"AND\", \"OR\"\n- AND: All filter conditions must match (default behavior)\n- OR: Any filter condition can match. Example with AND (default):\n\n```\nGET /api/management/v2/employees-profile?filters[]=active:1&filters[]=company:10\n```\n\nExample with OR: \n\n```\nGET /api/management/v2/employees-profile?filters[]=role:5&filters[]=role:6&op=OR\n```"
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        description: 'Pagination cursor from a previous response. Base64 encoded value that points to the position in the result set for the next page.

          Use this value in subsequent requests to fetch the next page of results.'
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: Maximum number of employee profiles to return in a single response. Used for pagination.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: orderBy
        description: Field name to sort results by. The field name can be mapped through a column mapper if needed.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Employee Profile
components:
  schemas:
    modelGenderType:
      type: string
      enum:
      - DEFAULT_GENDER
      - PREFER_NOT_TO_SAY
      - MALE
      - FEMALE
      - NON_BINARY
      default: DEFAULT_GENDER
    EmployeeProfileRetrieveEmployeeProfileByIdsAndCustomFiltersResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelEmployeeProfileBasic'
        nextCursor:
          type: string
    EmployeeProfileRetrieveEmployeeProfileByIdsAndCustomFiltersRequest:
      type: object
      properties:
        filters:
          type: array
          items:
            type: string
        op:
          type: string
        cursor:
          type: string
        limit:
          type: integer
          format: int32
        employeeIds:
          type: array
          items:
            type: string
        mainLocations:
          type: array
          items:
            type: string
        employmentTypes:
          type: array
          items:
            type: string
    v2modelEmployeeProfile:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Employee ID
        companyId:
          type: string
          format: int64
          title: Employee company ID
        firstName:
          type: string
          title: Employee first name
        lastName:
          type: string
          title: Employee last name
        displayName:
          type: string
          title: Employee display name
        contactId:
          type: string
          format: int64
          title: Employee contact
        dateOfBirth:
          type: string
          title: Employee date of birth
        gender:
          $ref: '#/components/schemas/modelGenderType'
          title: Employee gender
        userId:
          type: string
          format: int64
          title: Employee user ID
        active:
          type: boolean
          title: Employee active
        startDate:
          type: string
          title: Employee start date
        terminationDate:
          type: string
          title: Employee termination date
        role:
          type: string
          format: int64
          title: Employee role
        allowAppraisal:
          type: boolean
          title: Employee allow_appraisal
        historyId:
          type: string
          format: int64
          title: Employee history_id
        creator:
          type: string
          format: int64
          title: Employee creator
        createdAt:
          type: string
          format: date-time
          title: Timestamp of when the employee was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp of when the employee was last modified
        photoUrl:
          type: string
          title: Employee photo url
      title: Employee Profile
    EmployeeProfileListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelEmployeeProfile'
        nextCursor:
          type: string
          description: Cursor to fetch the next page of results. Base64 encoded value. Present only if more results are available. Empty string if this is the last page.
      title: Get list of employee profile response
    modelEmployeeProfileBasic:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Employee ID
        companyId:
          type: string
          format: int64
          title: Employee company ID
        firstName:
          type: string
          title: Employee first name
        lastName:
          type: string
          title: Employee last name
        displayName:
          type: string
          title: Employee display name
        userId:
          type: string
          format: int64
          title: Employee user ID
        photoUrl:
          type: string
          title: Employee photo url
        mainLocation:
          type: string
          title: Main location
        employmentType:
          type: string
          title: Employment type
        email:
          type: string
          title: Email
    EmployeeProfileGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelEmployeeProfile'
      title: Get employee profile response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
