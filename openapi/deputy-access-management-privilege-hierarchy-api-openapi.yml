openapi: 3.2.0
info:
  title: Deputy V2 Access Management Privilege Hierarchy API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Access Management Privilege Hierarchy
paths:
  /access-management/v2/privilege-hierarchy:
    get:
      operationId: AccessManagementV2Controller_GetPrivilegeHierarchy
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementGetPrivilegeHierarchyResponse'
      tags:
      - Access Management Privilege Hierarchy
      security:
      - APIToken: []
      summary: Get privilege hierarchy
      description: Get privilege hierarchy.
components:
  schemas:
    modelPrivilegeGroup:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/modelGenericPrivilege'
    AccessManagementGetPrivilegeHierarchyResponse:
      type: object
      properties:
        success:
          type: boolean
        privilegeCategories:
          type: array
          items:
            $ref: '#/components/schemas/modelPrivilegeCategory'
      title: Response to get the privilege hierarchy
    v2modelPrivilege:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        callouts:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/modelPrivilegeDependency'
    modelPrivilegeCategory:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/modelPrivilegeGroup'
    modelPrivilegeDependencyCondition:
      type: object
      properties:
        privilege:
          type: string
        is:
          type: boolean
          title: What the state of the condition privilege is required to be for the dependency to be required
    modelGenericPrivilege:
      type: object
      properties:
        collection:
          $ref: '#/components/schemas/modelPrivilegeCollection'
        privilege:
          $ref: '#/components/schemas/v2modelPrivilege'
    modelPrivilegeCollection:
      type: object
      properties:
        title:
          type: string
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/modelGenericPrivilege'
    modelPrivilegeDependency:
      type: object
      properties:
        privilege:
          type: string
        when:
          $ref: '#/components/schemas/modelPrivilegeDependencyCondition'
          title: If no when is provided, the dependency is always required
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
