openapi: 3.2.0
info:
  title: Deputy V2 Plan Downgrade Job API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Plan Downgrade Job
paths:
  /v2/subscriptions/product/job-plan-downgrade:
    post:
      summary: Calls the downgrading job
      operationId: ProductSubscriptionDowngradeJobV2Controller_PlanDowngradeJob
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSubscriptionDowngradeJobResponse'
      tags:
      - Plan Downgrade Job
      description: Calls the downgrading job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSubscriptionDowngradeJobRequest'
components:
  schemas:
    ProductSubscriptionDowngradeJobRequest:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PlanDowngradePayload'
    PlanDowngradePayload:
      type: object
      properties:
        fromPlan:
          type: integer
          format: int32
        toPlan:
          type: integer
          format: int32
        downgradedAt:
          type: string
          format: date-time
    ProductSubscriptionDowngradeJobResponse:
      type: object
      properties:
        success:
          type: boolean
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
