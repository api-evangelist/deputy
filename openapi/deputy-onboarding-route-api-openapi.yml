openapi: 3.2.0
info:
  title: Deputy V2 Onboarding Route API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Onboarding Route
paths:
  /onboarding/v2/dashboard/routes/{key}:
    put:
      operationId: OnboardingDashboardV2Controller_UpdateOnboardingRoute
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingDashboardUpdateOnboardingRouteResponse'
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      tags:
      - Onboarding Route
      summary: Update onboarding route
      description: Update onboarding route.
components:
  schemas:
    OnboardingDashboardUpdateOnboardingRouteResponse:
      type: object
      properties:
        key:
          type: string
        display:
          $ref: '#/components/schemas/modelRouteDisplay'
    modelRouteDisplay:
      type: string
      enum:
      - EXPANDED
      - COLLAPSED
      - HIDDEN
      default: EXPANDED
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
