openapi: 3.2.0
info:
  title: Deputy V2 Timesheet Get Pay Suggestion API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Timesheet Get Pay Suggestion
paths:
  /tsa/v2/timesheets/{id}:get-pay-suggestion:
    post:
      summary: Get Pay Suggestion
      description: Get the pay suggestion for a specific timesheet.
      operationId: TsaV2Controller_getPaySuggestion
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaGetPaySuggestionResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Get Pay Suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetPaySuggestionRequestPaySuggestionRequestBody'
components:
  schemas:
    GetPaySuggestionResponsePaySuggestionResponseBody:
      type: object
      properties:
        payReturns:
          type: array
          items:
            $ref: '#/components/schemas/tenanttsav2modelPayReturn'
        cost:
          type: number
          format: float
    GetPaySuggestionRequestPaySuggestionRequestBody:
      type: object
      properties:
        setProperties:
          $ref: '#/components/schemas/TsaTimesheetPropertyRequest'
        setChildTimesheets:
          $ref: '#/components/schemas/TsaTimesheetChildrenRequest'
    tenanttsav2modelPayReturn:
      type: object
      properties:
        payRuleId:
          type: integer
          format: int32
        hours:
          type: number
          format: float
        cost:
          type: number
          format: float
    modelTimesheetBreak:
      type: object
      properties:
        duration:
          type: integer
          format: int32
        startTimeOffset:
          type: integer
          format: int32
        breakType:
          $ref: '#/components/schemas/tenanttsav2modelBreakType'
    TsaTimesheetPropertyRequest:
      type: object
      properties:
        startTime:
          type: string
          format: int64
          description: unix epoch timestamp, seconds
        endTime:
          type: string
          format: int64
          description: unix epoch timestamp, seconds
        operationalUnitId:
          type: integer
          format: int32
          description: operational unit (area) ID
        setBreaks:
          $ref: '#/components/schemas/TsaTimesheetBreaksRequest'
        employeeId:
          type: integer
          format: int32
        leaveRuleId:
          type: integer
          format: int32
          description: leave rule (leave type) ID
        employeeComment:
          type: string
          description: employee comment for the timesheet
    tenanttsav2modelBreakType:
      type: string
      enum:
      - NO_TYPE
      - MEAL_BREAK
      - REST_BREAK
      default: NO_TYPE
    TsaChildTimesheetRequest:
      type: object
      properties:
        operationalUnitId:
          type: integer
          format: int32
        startTime:
          type: string
          format: int64
        endTime:
          type: string
          format: int64
    TsaTimesheetChildrenRequest:
      type: object
      properties:
        childTimesheets:
          type: array
          items:
            $ref: '#/components/schemas/TsaChildTimesheetRequest'
    TsaTimesheetBreaksRequest:
      type: object
      properties:
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/modelTimesheetBreak'
          description: passing an empty array here will delete all breaks for the timesheet.
        totalDurationMealBreak:
          type: integer
          format: int32
          description: total duration of meal break in minutes
    TsaGetPaySuggestionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GetPaySuggestionResponsePaySuggestionResponseBody'
        success:
          type: boolean
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
