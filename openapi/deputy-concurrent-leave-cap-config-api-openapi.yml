openapi: 3.2.0
info:
  title: Deputy V2 Concurrent Leave Cap Config API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Concurrent Leave Cap Config
paths:
  /management/v2/concurrent-leave-cap:
    get:
      summary: Get concurrent leave cap config
      operationId: ConcurrentLeaveCapConfigV2Controller_GetConcurrentLeaveCapConfig
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcurrentLeaveCapConfigGetConcurrentLeaveCapConfigResponse'
      tags:
      - Concurrent Leave Cap Config
      description: Get concurrent leave cap config.
components:
  schemas:
    v2modelConcurrentLeaveCapConfig:
      type: object
      properties:
        enabled:
          type: boolean
        excludedLeaveRules:
          type: array
          items:
            $ref: '#/components/schemas/modelConcurrentLeaveCapConfigLeaveRule'
        defaultRule:
          $ref: '#/components/schemas/modelConcurrentLeaveCapRule'
        overrideRules:
          type: array
          items:
            $ref: '#/components/schemas/modelConcurrentLeaveCapRule'
        version:
          type: integer
          format: int32
        actorUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
    modelConcurrentLeaveCapRuleLocation:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    modelConcurrentLeaveCapRule:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/modelConcurrentLeaveCapRuleLocation'
        maxPeople:
          type: integer
          format: int32
        blockType:
          $ref: '#/components/schemas/modelBlockType'
    ConcurrentLeaveCapConfigGetConcurrentLeaveCapConfigResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelConcurrentLeaveCapConfig'
      title: Get concurrent leave cap config response
    modelBlockType:
      type: string
      enum:
      - UNKNOWN_BLOCK
      - HARD_BLOCK
      - SOFT_BLOCK
      - HARD_NO_OVERRIDE
      default: UNKNOWN_BLOCK
    modelConcurrentLeaveCapConfigLeaveRule:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
