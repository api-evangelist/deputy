components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token or Deputy Permanent Token.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://once.deputy.com/my/oauth/login
          tokenUrl: https://once.deputy.com/my/oauth/access_token
          scopes:
            longlife_refresh_token: Extended session
  schemas:
    Company:
      type: object
      properties:
        Id:
          type: integer
        Portfolio:
          type: integer
        Code:
          type: string
          maxLength: 6
        Active:
          type: boolean
        ParentCompany:
          type: integer
        CompanyName:
          type: string
          maxLength: 200
        TradingName:
          type: string
          maxLength: 32
        BusinessNumber:
          type: string
          maxLength: 32
        CompanyNumber:
          type: string
          maxLength: 64
        IsWorkplace:
          type: boolean
        IsPayrollEntity:
          type: boolean
        PayrollExportCode:
          type: string
          maxLength: 255
        Address:
          type: integer
        Contact:
          type: integer
        Creator:
          type: integer
        Created:
          type: string
          format: date-time
        Modified:
          type: string
        ParentCompanyObject:
          type: object
        AddressObject:
          type: object
        ContactObject:
          type: object
      required:
      - Id
      - Code
      - CompanyName
      - IsWorkplace
      - IsPayrollEntity
      - Modified
    QueryRequest:
      type: object
      description: V1 Resource search payload. All fields optional; an empty body returns the first page of results.
      properties:
        search:
          type: object
          description: Map of search clauses keyed by an arbitrary id (e.g. `s1`, `s2`). Each clause filters one field.
          additionalProperties:
            type: object
            required:
            - field
            - data
            - type
            properties:
              field:
                type: string
                description: Field name to filter on (e.g. `Id`, `Employee`).
              data:
                description: Comparison value. Type depends on the field.
              type:
                type: string
                description: Comparison operator.
                enum:
                - eq
                - ne
                - gt
                - lt
                - ge
                - le
                - is
                - is not
                - in
                - not in
                - starts
                - contains
        sort:
          type: object
          description: Map of field name → `asc` or `desc`.
          additionalProperties:
            type: string
            enum:
            - asc
            - desc
        start:
          type: integer
          minimum: 0
          default: 0
          description: Pagination offset (0-indexed).
        max:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: Max records per page (server caps at 500).
        join:
          type: array
          items:
            type: string
          description: Related ORMs to expand inline (e.g. `["EmployeeObject"]`).
      example:
        search:
          s1:
            field: Id
            data: 1
            type: ge
        max: 100
    Category:
      type: object
      properties:
        Id:
          type: integer
        Category:
          type: string
          maxLength: 32
        Group:
          type: string
          maxLength: 64
        SortOrder:
          type: integer
        Stafflog:
          type: boolean
        System:
          type: boolean
        Creator:
          type: integer
        Created:
          type: string
          format: date-time
        Modified:
          type: string
      required:
      - Id
      - Category
      - SortOrder
      - Stafflog
      - Modified
    Address:
      type: object
      properties:
        Id:
          type: integer
        ContactName:
          type: string
          maxLength: 255
        UnitNo:
          type: string
          maxLength: 16
        StreetNo:
          type: string
          maxLength: 24
        SuiteNo:
          type: string
          maxLength: 24
        PoBox:
          type: string
          maxLength: 24
        Street1:
          type: string
          maxLength: 255
        Street2:
          type: string
          maxLength: 255
        City:
          type: string
          maxLength: 64
        State:
          type: string
          maxLength: 64
        Postcode:
          type: string
          maxLength: 16
        Country:
          type: integer
        Phone:
          type: string
          maxLength: 64
        Notes:
          type: string
        Format:
          type: integer
        Saved:
          type: boolean
        Creator:
          type: integer
        Created:
          type: string
          format: date-time
        Modified:
          type: string
        Verified:
          type: string
      required:
      - Id
      - Modified
    CompanyPeriod:
      type: object
      properties:
        Id:
          type: integer
        Start:
          type: integer
        DateStart:
          type: string
          format: date-time
        End:
          type: integer
        DateEnd:
          type: string
          format: date-time
        Company:
          type: integer
        PayPeriod:
          type: integer
        Creator:
          type: integer
        Created:
          type: string
          format: date-time
        Modified:
          type: string
        CompanyObject:
          type: object
        PayPeriodObject:
          type: object
      required:
      - Id
      - Start
      - End
      - Company
      - PayPeriod
      - Modified
    Employee:
      type: object
      properties:
        Id:
          type: integer
        Company:
          type: integer
        FirstName:
          type: string
          maxLength: 64
        LastName:
