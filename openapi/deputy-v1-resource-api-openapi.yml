        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/Address/BULK:
    post:
      tags:
      - Address
      summary: Bulk create/update Address
      description: Accepts an array of records. Each record is processed independently.
      operationId: bulkAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
