openapi: 3.2.0
info:
  title: Deputy V2 Leave Migration API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Migration
paths:
  /management/v2/leave-migration/balance:override-to-migration:
    post:
      operationId: LeaveMigrationV2Controller_overrideBalanceToMigration
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveMigrationBalanceOverrideToMigrationResponse'
      tags:
      - Leave Migration
      summary: Override balance to migration
      description: Override balance to migration.
  /management/v2/leave-migration/leave-balances:export:
    post:
      summary: Export leave balance data
      operationId: LeaveMigrationV2Controller_exportLeaveBalances
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveMigrationExportLeaveBalancesResponse'
      tags:
      - Leave Migration
      description: Export leave balance data.
  /management/v2/leave-migration/leave-extensions:
    get:
      summary: Get soft deleted leave extension data
      operationId: LeaveMigrationV2Controller_getSoftDeletedLeaveExtensions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveMigrationGetSoftDeletedLeaveExtensionsResponse'
      tags:
      - Leave Migration
      description: Get soft deleted leave extension data.
  /management/v2/leave-migration/leave-rules:export:
    post:
      summary: Export leave rules data
      operationId: LeaveMigrationV2Controller_exportLeaveRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveMigrationExportLeaveRulesResponse'
      tags:
      - Leave Migration
      description: Export leave rules data.
  /management/v2/leave-migration/start:
    post:
      summary: Start migration
      operationId: LeaveMigrationV2Controller_start
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveMigrationStartResponse'
      tags:
      - Leave Migration
      description: Start migration.
  /management/v2/leave-migration/status:
    get:
      summary: Get migration status
      operationId: LeaveMigrationV2Controller_getStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveMigrationGetStatusResponse'
      tags:
      - Leave Migration
      description: Get migration status.
    put:
      summary: Set migration status (internal use only)
      operationId: LeaveMigrationV2Controller_setStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveMigrationSetStatusResponse'
      tags:
      - Leave Migration
      description: Set migration status (internal use only).
components:
  schemas:
    LeaveMigrationExportLeaveRulesResponse:
      type: object
      properties:
        success:
          type: boolean
        url:
          type: string
      title: ExportLeaveRules response
    LeaveMigrationStartResponse:
      type: object
      properties:
        success:
          type: boolean
      title: Start response
    LeaveExtensionAccrueMode:
      type: string
      enum:
      - UNKNOWN_MODE
      - ACCRUE_AND_DEDUCT
      - DEDUCT_ONLY
      default: UNKNOWN_MODE
    LeaveMigrationExportLeaveBalancesResponse:
      type: object
      properties:
        success:
          type: boolean
        url:
          type: string
      title: ExportLeaveBalances response
    v2modelLeaveExtension:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: id of the leave extension
        leaveRuleId:
          type: integer
          format: int32
          title: id of the leave rule used in the leave extension
        leaveRuleName:
          type: string
          title: leave rule name
        accrueMode:
          $ref: '#/components/schemas/LeaveExtensionAccrueMode'
          title: accrual mode of the leave extension
        hourlyAccrualRate:
          type: number
          format: float
          title: hourly accrual rate of the leave extension
        location:
          type: string
          title: indicates location- this can be the location id, null or all
        isOnForAllLocations:
          type: boolean
          title: indicates if this leave extension applies to all locations
    LeaveMigrationSetStatusResponse:
      type: object
      properties:
        success:
          type: boolean
      title: SetStatus response
    LeaveMigrationGetStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelLeaveMigrationStatus'
      title: GetStatus response
    LeaveMigrationGetSoftDeletedLeaveExtensionsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelLeaveExtension'
      title: GetSoftDeletedLeaveExtension response
    LeaveMigrationBalanceOverrideToMigrationResponse:
      type: object
      properties:
        success:
          type: boolean
    modelMigrationStatus:
      type: string
      enum:
      - UNKNOWN
      - NOT_REQUIRED
      - NOT_ELIGIBLE
      - NOT_STARTED
      - IN_PROGRESS
      - COMPLETED
      - FAILED
      default: UNKNOWN
    modelLeaveMigrationStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/modelMigrationStatus'
        isOngoing:
          type: boolean
        isForceMigrated:
          type: boolean
      title: Leave Migration Status
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
