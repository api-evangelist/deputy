openapi: 3.2.0
info:
  title: Deputy V2 Me Tab API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Me Tab
paths:
  /me/v2/also-working:
    get:
      summary: Retrieve my colleagues that are also working
      operationId: MeV2Controller_getAlsoWorking
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2AlsoWorkingResponse'
      parameters:
      - name: startDate
        in: query
        required: false
        schema:
          type: string
      - name: endDate
        in: query
        required: false
        schema:
          type: string
      - name: dailyLimit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Me Tab
      description: Retrieve my colleagues that are also working.
components:
  schemas:
    v2AlsoWorkingResponseData:
      type: object
      properties:
        date:
          type: string
        employees:
          type: array
          items:
            $ref: '#/components/schemas/AlsoWorkingResponseEmployeeProfile'
    v2AlsoWorkingResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2AlsoWorkingResponseData'
    AlsoWorkingResponseEmployeeProfile:
      type: object
      properties:
        id:
          type: integer
          format: int32
        displayName:
          type: string
        photoUrl:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
