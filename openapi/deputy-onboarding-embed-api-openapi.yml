openapi: 3.2.0
info:
  title: Deputy V2 Onboarding Embed API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Onboarding Embed
paths:
  /onboarding/v2/embed/status:
    get:
      summary: Get the status of the embed onboarding flow with the list of tasks and the next…
      operationId: OnboardingDashboardV2Controller_GetEmbedOnboardingStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingDashboardGetEmbedOnboardingStatusResponse'
      tags:
      - Onboarding Embed
      description: Get the status of the embed onboarding flow with the list of tasks and the next step.
  /onboarding/v2/embed:action:
    post:
      summary: Perform an action on an embed onboarding task
      operationId: OnboardingDashboardV2Controller_PerformEmbedOnboardingAction
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingDashboardPerformEmbedOnboardingActionResponse'
      tags:
      - Onboarding Embed
      description: Perform an action on an embed onboarding task.
components:
  schemas:
    embedEmbedOnboardingTask:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/embedEmbedOnboardingTaskName'
          title: The embed onboarding task name
        isCompleted:
          type: boolean
          title: Whether the task has been completed or not
        sortOrder:
          type: integer
          format: int32
          description: Sort order for displaying the task in FE.
        completedAt:
          type: string
          format: date-time
          title: The time when the task was completed
      title: Details of a single embed onboarding task
    embedEmbedOnboardingStatus:
      type: object
      properties:
        isCompletedOnboarding:
          type: boolean
          title: Whether all onboarding tasks are complete
        nextStep:
          $ref: '#/components/schemas/embedEmbedOnboardingTaskName'
          title: The next step in the onboarding flow
        onboardingTasks:
          type: array
          items:
            $ref: '#/components/schemas/embedEmbedOnboardingTask'
          title: The tasks in the onboarding flow, sorted by a predefined sort order
      title: The status for a new embed business
    embedEmbedOnboardingTaskName:
      type: string
      enum:
      - UNKNOWN
      - SCHEDULING_RULES
      - CREATE_SHIFT
      - PUBLISH_ROSTER
      - DISCOVER_EMPLOYEE_EXPERIENCE
      - INVITE_EMPLOYEES
      - SETUP_PAY_RULES
      - APPROVE_TIMESHEETS
      - SEND_TIMESHEETS_TO_PAYROLL
      default: UNKNOWN
      description: "- UNKNOWN: The task is unknown\n - SCHEDULING_RULES: Set up scheduling rules (e.g location configuration)\n - CREATE_SHIFT: Create a shift\n - PUBLISH_ROSTER: Publish a roster\n - DISCOVER_EMPLOYEE_EXPERIENCE: Discover employee experience\n - INVITE_EMPLOYEES: Invite employees\n - SETUP_PAY_RULES: Set up pay rules\n - APPROVE_TIMESHEETS: Approve timesheets\n - SEND_TIMESHEETS_TO_PAYROLL: Send timesheets to payroll"
      title: Valid embed onboarding tasks
    OnboardingDashboardPerformEmbedOnboardingActionResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          $ref: '#/components/schemas/embedEmbedOnboardingStatus'
    OnboardingDashboardGetEmbedOnboardingStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          $ref: '#/components/schemas/embedEmbedOnboardingStatus'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
