openapi: 3.2.0
info:
  title: Deputy V2 Leave Pay Rules API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Pay Rules
paths:
  /management/v2/leave-pay-rules:count-overtime-pay-rules-by-leave-rule-id:
    get:
      operationId: LeavePayRulesV2Controller_countOvertimePayRulesByLeaveRuleId
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeavePayRuleCountPayRulesByLeaveRuleIdResponse'
      parameters:
      - name: leaveRuleId
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Leave Pay Rules
      summary: Count overtime pay rules by leave rule ID
      description: Count overtime pay rules by leave rule ID.
components:
  schemas:
    LeavePayRuleCountPayRulesByLeaveRuleIdResponse:
      type: object
      properties:
        success:
          type: boolean
        payRuleCount:
          type: integer
          format: int32
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
