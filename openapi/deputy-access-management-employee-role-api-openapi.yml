openapi: 3.2.0
info:
  title: Deputy V2 Access Management Employee Role API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Access Management Employee Role
paths:
  /access-management/v2/roles/{roleId}:
    get:
      operationId: AccessManagementV2Controller_GetEmployeeRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementGetEmployeeRoleResponse'
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: int64
      tags:
      - Access Management Employee Role
      security:
      - APIToken: []
      summary: Get employee role
      description: Get employee role.
components:
  schemas:
    tenantauthv2modelEmployeeRole:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Unique identifier of the role
        name:
          type: string
          title: Name of the role
        ranking:
          type: integer
          format: int32
          title: Ranking of the role
        require2fa:
          type: boolean
          title: Whether 2FA is required for this role
        reportsTo:
          type: integer
          format: int32
          title: Unique identifier of the role that this role reports to
        alsoReportsTo:
          type: array
          items:
            type: integer
            format: int32
          title: Unique identifiers of the roles that this role also reports to
        employeeCount:
          type: integer
          format: int32
          title: '[read-only] Number of employees assigned to this role'
        permissionCount:
          type: integer
          format: int32
          title: '[read-only] Number of permissions assigned to this role'
        privilegeNames:
          type: array
          items:
            type: string
          title: Privileges assigned to this role
        lastUpdatedAt:
          type: string
          format: date-time
          title: Last modification time of the role
        operations:
          $ref: '#/components/schemas/modelEmployeeRoleOperations'
          title: Operations that can be performed on the Role
        acceptsReportees:
          type: boolean
          title: Indicates if the Role can be included in another role's "report to" or "also reports to" list
      title: Role is assigned to employees and has permissions
    AccessManagementGetEmployeeRoleResponse:
      type: object
      properties:
        success:
          type: boolean
        role:
          $ref: '#/components/schemas/tenantauthv2modelEmployeeRole'
      title: Response to get an employee role
    modelEmployeeRoleOperations:
      type: object
      properties:
        view:
          type: boolean
          title: Indicates if the Role can be viewed
        edit:
          type: boolean
          title: Indicates if the Role can be edited
        delete:
          type: boolean
          title: Indicates if the Role can be deleted
        duplicate:
          type: boolean
          title: Indicates if the Role can be duplicated
        viewHistory:
          type: boolean
          title: Indicates if the History of the Role can be viewed
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
