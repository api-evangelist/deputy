openapi: 3.2.0
info:
  title: Deputy V2 Employee Onboarding Usage API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employee Onboarding Usage
paths:
  /employee/v2/hr/onboarding/usage/count-remaining-promo-usages:
    get:
      operationId: EmployeeOnboardingUsageV2Controller_getRemainingPromoUsages
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeOnboardingUsageGetCountRemainingPromoUsagesResponse'
      tags:
      - Employee Onboarding Usage
      security:
      - APIToken: []
      summary: Get remaining promo usages
      description: Get remaining promo usages.
components:
  schemas:
    EmployeeOnboardingUsageGetCountRemainingPromoUsagesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/EmployeeOnboardingUsageGetCountRemainingPromoUsagesResponseData'
    EmployeeOnboardingUsageGetCountRemainingPromoUsagesResponseData:
      type: object
      properties:
        count:
          type: integer
          format: int32
        freeRemaining:
          type: integer
          format: int32
        maxFreeAllowed:
          type: integer
          format: int32
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
