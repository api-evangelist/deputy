openapi: 3.2.0
info:
  title: Deputy V2 Timesheet Attestation API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Timesheet Attestation
paths:
  /tsa/v2/timesheets/{id}:cancel-dispute-attestation:
    post:
      summary: Cancel dispute particular timesheet
      description: Cancel dispute attestation timesheet.
      operationId: TsaV2Controller_cancelDisputeAttestation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaCancelDisputeAttestationResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Attestation
  /tsa/v2/timesheets/{id}:confirm-attestation:
    post:
      summary: confirm particular timesheet
      description: Confirm attestation timesheet.
      operationId: TsaV2Controller_confirmAttestation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaConfirmAttestationResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Attestation
  /tsa/v2/timesheets/{id}:dispute-attestation:
    post:
      summary: Dispute particular timesheet
      description: Dispute attestation timesheet.
      operationId: TsaV2Controller_disputeAttestation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaDisputeAttestationResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Attestation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeAttestationRequestDisputeAttestationRequestBody'
  /tsa/v2/timesheets/{id}:resolve-disputed-attestation:
    post:
      summary: Resolve Disputed Attestation
      description: Resolve disputed attestation timesheet for managers.
      operationId: TsaV2Controller_resolveDisputedAttestation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaResolveDisputedAttestationResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Timesheet Attestation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDisputedAttestationRequestResolveDisputedAttestationRequestBody'
components:
  schemas:
    ConfirmAttestationResponseConfirmAttestationResponseBody:
      type: object
      properties:
        status:
          type: string
    ResolveDisputedAttestationResponseResolveDisputedAttestationResponseBody:
      type: object
      properties:
        status:
          type: string
    TsaResolveDisputedAttestationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ResolveDisputedAttestationResponseResolveDisputedAttestationResponseBody'
        success:
          type: boolean
    DisputeAttestationRequestDisputeAttestationRequestBody:
      type: object
      properties:
        reason:
          type: string
    TsaConfirmAttestationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ConfirmAttestationResponseConfirmAttestationResponseBody'
        success:
          type: boolean
    TsaDisputeAttestationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DisputeAttestationResponseDisputeAttestationResponseBody'
        success:
          type: boolean
    ResolveDisputedAttestationRequestResolveDisputedAttestationRequestBody:
      type: object
      properties:
        reason:
          type: string
    TsaCancelDisputeAttestationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CancelDisputeAttestationResponseCancelDisputeAttestationResponseBody'
        success:
          type: boolean
    CancelDisputeAttestationResponseCancelDisputeAttestationResponseBody:
      type: object
      properties:
        status:
          type: string
    DisputeAttestationResponseDisputeAttestationResponseBody:
      type: object
      properties:
        status:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
