openapi: 3.2.0
info:
  title: Deputy V1 My Location API
  version: 1.0.0
  description: 'Generated reference for Deputy''s legacy V1 `/supervise/` (supervisor-level operations) and `/my/` (authenticated-employee operations) endpoints.


    Enumerated statically from router classes under `deputy-webapp/app/api/v1/routers/Super*Router.php` and `My*Router.php`. V1 is in maintenance mode — new integrations should prefer V2.


    This spec covers only the `/my/*` routes. The sibling family is in a separate ReadMe spec.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
tags:
- name: Location
  description: V1 /my/location/* endpoints
paths:
  /my/location/all:
    get:
      tags:
      - Location
      summary: GET Location / all
      operationId: my_location__all_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
  /my/location/geo/{latitude}/{longitude}:
    get:
      tags:
      - Location
      summary: GET Location / :longitude
      operationId: my_location__geo_latitude_longitude_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: latitude
        in: path
        required: true
        schema:
          type: string
      - name: longitude
        in: path
        required: true
        schema:
          type: string
  /my/location/geo/{latitude}/{longitude}/flag/{flag}:
    get:
      tags:
      - Location
      summary: GET Location / :flag
      operationId: my_location__geo_latitude_longitude_flag_flag_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: latitude
        in: path
        required: true
        schema:
          type: string
      - name: longitude
        in: path
        required: true
        schema:
          type: string
      - name: flag
        in: path
        required: true
        schema:
          type: string
  /my/location/pending-approval/QUERY:
    post:
      tags:
      - Location
      summary: POST Location / QUERY
      operationId: my_location__pending_approval_query_post
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /my/location/{intCompanyId}:
    get:
      tags:
      - Location
      summary: GET Location / (:intCompanyId)?
      operationId: my_location__intcompanyid__get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: intCompanyId
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+$
  /my/location/{intCompanyId}/allowed-kiosk-auth-modes:
    get:
      tags:
      - Location
      summary: GET Location / allowed kiosk auth modes
      operationId: my_location__intcompanyid_allowed_kiosk_auth_modes_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: intCompanyId
        in: path
        required: true
        schema:
          type: integer
          pattern: ^\d+
  /my/location/{intCompanyId}/weather:
    get:
      tags:
      - Location
      summary: GET Location / weather
      operationId: my_location__intcompanyid_weather_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: intCompanyId
        in: path
        required: true
        schema:
          type: integer
          pattern: ^\d+
  /my/location/{intCompanyId}/weather/{date}:
    get:
      tags:
      - Location
      summary: GET Location / :date
      operationId: my_location__intcompanyid_weather_date_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: intCompanyId
        in: path
        required: true
        schema:
          type: integer
          pattern: ^\d+
      - name: date
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9]{4}\-[0-9]{1,2}\-[0-9]{1,2}'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token or Deputy Permanent Token.
x-provenance:
  method: harvested
  publisher: Deputy
  source: https://developer.deputy.com/openapi/deputy-v1-my-api.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
