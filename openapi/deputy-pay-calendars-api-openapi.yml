openapi: 3.2.0
info:
  title: Deputy V2 Pay Calendars API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Pay Calendars
paths:
  /management/v2/pay-calendars:
    get:
      summary: Retrieve list of pay calendars
      operationId: PayCalendarV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCalendarsListResponse'
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Pay Calendars
      description: Retrieve list of pay calendars.
    post:
      summary: Create pay calendar
      operationId: PayCalendarV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCalendarsCreateResponse'
      tags:
      - Pay Calendars
      description: Create pay calendar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelPayCalendar'
  /management/v2/pay-calendars/{id}:
    get:
      summary: Retrieve a pay calendar by id
      operationId: PayCalendarV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCalendarsGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      tags:
      - Pay Calendars
      description: Retrieve a pay calendar by id.
    put:
      summary: Update pay calendar
      operationId: PayCalendarV2Controller_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCalendarsUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Pay Calendars
      description: Update pay calendar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelPayCalendar'
  /management/v2/pay-calendars/{id}/employees:
    get:
      summary: Retrieve list of employees assigned to a pay calendar
      operationId: PayCalendarV2Controller_listAssignedEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCalendarsListAssignedEmployeesResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - name: businessId
        in: query
        required: false
        schema:
          type: string
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Pay Calendars
      description: Retrieve list of employees assigned to a pay calendar.
  /management/v2/pay-calendars/{id}/pay-periods:
    get:
      summary: Retrieve list of employees assigned to a pay calendar
      operationId: PayCalendarV2Controller_listPayPeriods
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCalendarsListPayPeriodsResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - name: minStartDate
        description: Min start date as YYYY-MM-DD.
        in: query
        required: false
        schema:
          type: string
      - name: maxStartDate
        description: Max start date as YYYY-MM-DD.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Pay Calendars
      description: Retrieve list of employees assigned to a pay calendar.
  /management/v2/pay-calendars/{id}:assign:
    post:
      summary: Assign pay calendar to employees
      operationId: PayCalendarV2Controller_assignEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCalendarsAssignEmployeesResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      tags:
      - Pay Calendars
      description: Assign pay calendar to employees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayCalendarsAssignEmployeesRequest'
  /management/v2/pay-calendars/{id}:deactivate:
    post:
      summary: Deactivate a pay calendar by id
      operationId: PayCalendarV2Controller_deactivate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCalendarsDeactivateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      tags:
      - Pay Calendars
      description: Deactivate a pay calendar by id.
  /management/v2/pay-calendars:searchEmployees:
    get:
      summary: Retrieve list of employees assigned to a pay calendar
      operationId: PayCalendarV2Controller_searchAssignedEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayCalendarsSearchAssignedEmployeesResponse'
      parameters:
      - name: businessId
        in: query
        required: false
        schema:
          type: string
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Pay Calendars
      description: Retrieve list of employees assigned to a pay calendar.
components:
  schemas:
    PayCalendarsDeactivateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: string
    v2modelPayCalendar:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: '[read-only] Unique ID of Pay calendar'
        name:
          type: string
          title: Name ID of Pay calendar
        status:
          type: integer
          format: int32
          title: Status  of Pay calendar
        startDate:
          type: string
          title: Start Date of Pay calendar
        frequency:
          $ref: '#/components/schemas/PayCalendarPayCalendarFrequency'
          title: Frequency of Pay calendar
        paymentDate:
          type: string
          title: Payment Date of Pay calendar
        arrears:
          type: string
          format: int64
          title: Arrears of Pay calendar
        businessNumber:
          type: string
          title: Business Number attached to Pay Calendar
        creator:
          type: string
          format: int64
          title: '[read-only] ID of Creator of Pay calendar'
        externalId:
          type: string
          title: '[read-only] ID from External Source of Pay calendar'
        businessId:
          type: string
          title: Business ID of the business associated with the Pay Calendar
        hasLinkedEmployees:
          type: boolean
          title: '[read-only] Whether any active employees are linked to this pay calendar'
        createdAt:
          type: string
          format: date-time
          title: '[read-only] Created Date of Pay calendar'
        modifiedAt:
          type: string
          format: date-time
          title: '[read-only] Modified Date of Pay calendar'
    PayCalendarsAssignEmployee:
      type: object
      properties:
        employeeId:
          type: string
          format: int64
        locationId:
          type: string
          format: int64
    PayCalendarsAssignEmployeesResponse:
      type: object
      properties:
        success:
          type: boolean
    EmployeesByPayCalendarMainAgreement:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: MainAgreement ID
        employmentTypeId:
          type: integer
          format: int32
          title: Employment Type
    PayCalendarsCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelPayCalendar'
    PayCalendarsListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelPayCalendar'
        nextCursor:
          type: string
    PayCalendarsUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelPayCalendar'
    modelEmployeesByPayCalendar:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Employee Id
        firstName:
          type: string
          title: First name
        lastName:
          type: string
          title: Last name
        displayName:
          type: string
          title: Preferred name the employee goes by
        location:
          $ref: '#/components/schemas/modelEmployeesByPayCalendarLocation'
          title: Main Location Id
        payCalendar:
          $ref: '#/components/schemas/modelEmployeesByPayCalendarPayCalendar'
          title: Pay Calendar Id
        mainAgreement:
          $ref: '#/components/schemas/EmployeesByPayCalendarMainAgreement'
          title: MainAgreement
        photoUrl:
          type: string
          title: Thumbnail photo URL
      title: Employees by pay calendar
    PayCalendarsListAssignedEmployeesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelEmployeesByPayCalendar'
        totalCount:
          type: string
          format: int64
        nextCursor:
          type: string
    PayCalendarsAssignEmployeesRequest:
      type: object
      properties:
        id:
          type: string
          format: int64
        data:
          type: array
          items:
            $ref: '#/components/schemas/PayCalendarsAssignEmployee'
        filter:
          $ref: '#/components/schemas/PayCalendarsAssignEmployeesFilter'
        businessId:
          type: string
    PayCalendarPayCalendarFrequency:
      type: string
      enum:
      - NONE
      - WEEKLY
      - FOUR_WEEKLY
      - FORTNIGHTLY
      - TWICE_MONTHLY
      - MONTHLY
      - QUARTERLY
      default: NONE
    PayCalendarsAssignEmployeesFilter:
      type: object
      properties:
        employmentTypes:
          type: array
          items:
            $ref: '#/components/schemas/PayCalendarsEmploymentType'
        locationIds:
          type: array
          items:
            type: string
            format: int64
        payCalendarIds:
          type: array
          items:
            type: string
            format: int64
        employeeDisplayName:
          type: string
    modelEmployeesByPayCalendarPayCalendar:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: PayCalendar ID
        name:
          type: string
          title: PayCalendar name
    PayCalendarsEmploymentType:
      type: string
      enum:
      - NONE
      - EMPLOYEE
      - CONTRACTOR
      default: NONE
    modelPayPeriodByPayCalendar:
      type: object
      properties:
        startDate:
          type: string
          title: Pay Period Start Date
        endDate:
          type: string
          title: Pay Period End Date
    modelEmployeesByPayCalendarLocation:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Primary location ID of employee
        name:
          type: string
          title: Primary location of employee
    PayCalendarsGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelPayCalendar'
    PayCalendarsSearchAssignedEmployeesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelEmployeesByPayCalendar'
        nextCursor:
          type: string
    PayCalendarsListPayPeriodsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelPayPeriodByPayCalendar'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
