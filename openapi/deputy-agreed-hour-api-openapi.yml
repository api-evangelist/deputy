openapi: 3.2.0
info:
  title: Deputy V2 Agreed Hour API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Agreed Hour
paths:
  /management/v2/agreed_hour/employee/{employeeId}:
    post:
      summary: Get an Employee's Agreed Hours by Version
      operationId: AgreedHourServiceV2Controller_getCurrentAgreedHour
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourGetResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Get an Employee's Agreed Hours by Version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreedHourCurrentRequestData'
  /management/v2/agreed_hour/{employeeId}:
    get:
      summary: Get an Employee's Agreed Hours
      operationId: AgreedHourServiceV2Controller_getAgreedHour
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourGetResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Get an Employee's Agreed Hours.
    post:
      summary: Set an Employee's Agreed Hours
      description: Note that agreedHour.details.weeks is required but can be an empty array
      operationId: AgreedHourServiceV2Controller_createAgreedHour
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourPostResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreedHourPostRequest'
  /management/v2/agreed_hour/{employeeId}/{version}:
    get:
      summary: Get an Employee's Agreed Hours by Version
      operationId: AgreedHourServiceV2Controller_getAgreedHourVersion
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourGetResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Get an Employee's Agreed Hours by Version.
  /management/v2/agreed_hour:batchUpdate:
    post:
      summary: Set multiple Employees' Agreed Hours
      description: Set one Agreed Hour for multiple Employees. Note that agreedHour.details.weeks is required but can be an empty array
      operationId: AgreedHourServiceV2Controller_batchUpdateAgreedHour
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourBatchUpdateResponse'
      tags:
      - Agreed Hour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreedHourBatchUpdateRequest'
  /management/v2/agreed_hour:listCommonAreas:
    post:
      summary: Get Common Areas by Employee Ids
      description: 'Get all common areas of the given Employees by Ids NOTE: Will only returned shared areas'
      operationId: AgreedHourServiceV2Controller_getAreasByEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourGetAreasResponse'
      tags:
      - Agreed Hour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreedHourGetAreasRequest'
  /management/v2/agreed_hours:
    post:
      summary: Search for Employees' Agreed Hours in particular status
      operationId: AgreedHourServiceV2Controller_getAgreedHoursByStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourSearchResponse'
      tags:
      - Agreed Hour
      description: Search for Employees' Agreed Hours in particular status.
  /management/v2/agreed_hours/archive/{employeeId}/{version}:
    post:
      summary: Archive an Employee's Agreed Hours version with reason
      operationId: AgreedHourServiceV2Controller_archiveAgreedHourVersionWithReason
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourArchiveResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Archive an Employee's Agreed Hours version with reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreedHourArchiveWithReasonRequestData'
  /management/v2/agreed_hours/audit/{employeeId}:
    post:
      summary: Audit for an Employee's Agreed Hours for a time period
      operationId: AgreedHourServiceV2Controller_auditAgreedHours
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourAuditResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Audit for an Employee's Agreed Hours for a time period.
  /management/v2/agreed_hours/configuration/employee_approval/{employeeId}:
    post:
      summary: Check if an Employee's Agreed Hours needs approval
      operationId: AgreedHourServiceV2Controller_getAgreedHoursEmployeeApprovalConfiguration
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourEmployeeApprovalConfigurationResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Check if an Employee's Agreed Hours needs approval.
  /management/v2/agreed_hours/configuration/general/{employeeId}:
    get:
      summary: Get an Employee's Agreed Hours configuration
      operationId: AgreedHourServiceV2Controller_getAgreedHoursGeneralConfiguration
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourGetConfigurationResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Get an Employee's Agreed Hours configuration.
  /management/v2/agreed_hours/consent-records/{recordId}:
    get:
      summary: Get an Employee's Agreed Hours Consent Records by RecordId
      operationId: AgreedHourServiceV2Controller_getConsentRecords
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourConsentRecordsResponse'
      parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Get an Employee's Agreed Hours Consent Records by RecordId.
  /management/v2/agreed_hours/consent/{employeeId}/{version}:
    post:
      summary: Consent to Agreed Hours for an Employee
      operationId: AgreedHourServiceV2Controller_consentEmployeeAgreedHours
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourConsentResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Consent to Agreed Hours for an Employee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreedHourConsentRequestData'
  /management/v2/agreed_hours/diff/{employeeId}/{baseVersion}/{targetVersion}:
    get:
      summary: Diff Agreed Hours for an Employee
      operationId: AgreedHourServiceV2Controller_diffEmployeeAgreedHours
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourDiffResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: baseVersion
        in: path
        required: true
        schema:
          type: string
      - name: targetVersion
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Diff Agreed Hours for an Employee.
  /management/v2/agreed_hours/migrate/step-two/{locationId}:
    post:
      summary: Second migration step for Employees' Agreed Hours in the given location
      operationId: AgreedHourServiceV2Controller_migrateAgreedHoursStepTwo
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourMigrateStepTwoResponse'
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Agreed Hour
      description: Second migration step for Employees' Agreed Hours in the given location.
  /management/v2/agreed_hours/notify/{employeeId}/{version}:
    post:
      summary: Notify an Employee of their Agreed Hours
      operationId: AgreedHourServiceV2Controller_notifyEmployeeAgreedHours
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourEmployeeNotificationResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Notify an Employee of their Agreed Hours.
  /management/v2/agreed_hours/{employeeId}:
    post:
      summary: Search for an Employee's Agreed Hours for a time period
      operationId: AgreedHourServiceV2Controller_searchAgreedHours
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourSearchResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Search for an Employee's Agreed Hours for a time period.
  /management/v2/agreed_hours/{employeeId}/{version}:
    delete:
      summary: Deletes/Archives Agreed Hours for an Employee
      operationId: AgreedHourServiceV2Controller_deleteEmployeeAgreedHours
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreedHourDeleteResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      tags:
      - Agreed Hour
      description: Deletes/Archives Agreed Hours for an Employee.
components:
  schemas:
    modelAgreedHourDetails:
      type: object
      properties:
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/modelAgreedHourWeek'
          title: ''
    AgreedHourDiffResponse:
      type: object
      properties:
        success:
          type: boolean
        agreedHour:
          $ref: '#/components/schemas/v2modelAgreedHour'
        error:
          type: string
    AgreedHourConsentRequestData:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/modelAgreedHourStatus'
        comment:
          type: string
    AgreedHourPostRequest:
      type: object
      properties:
        employeeId:
          type: string
        agreedHour:
          $ref: '#/components/schemas/v2modelAgreedHour'
    AgreedHourGetResponse:
      type: object
      properties:
        agreedHour:
          $ref: '#/components/schemas/v2modelAgreedHour'
        error:
          type: string
    modelAgreedHourShift:
      type: object
      properties:
        startTime:
          type: string
          title: ''
        endTime:
          type: string
          title: ''
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/modelBreakTime'
          title: ''
        location:
          type: integer
          format: int32
          title: ''
        area:
          type: integer
          format: int32
          title: ''
        totalHours:
          type: number
          format: float
          title: ''
        changeDetails:
          type: string
          readOnly: true
    AgreedHourDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
    AgreedHourMigrateStepTwoResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
    AgreedHourPostResponse:
      type: object
      properties:
        success:
          type: boolean
        agreedHour:
          $ref: '#/components/schemas/v2modelAgreedHour'
        error:
          type: string
    modelAgreedHourStatus:
      type: string
      enum:
      - UNKNOWN
      - PENDING
      - ACCEPTED
      - DECLINED
      - FORCED
      default: UNKNOWN
    AgreedHourWeekWeekIndex:
      type: string
      enum:
      - UNSPECIFIED
      - ONE
      - TWO
      - THREE
      - FOUR
      default: UNSPECIFIED
    AgreedHourGetConfigurationResponse:
      type: object
      properties:
        configuration:
          $ref: '#/components/schemas/tenantagreed_hoursv2modelConfiguration'
        error:
          type: string
    ConsentConsentStatus:
      type: string
      enum:
      - PENDING
      - ACCEPTED
      - DECLINED
      - CANCELLED
      - OVERRIDDEN_ACCEPTED
      default: PENDING
    AgreedHourArchiveWithReasonRequestData:
      type: object
      properties:
        changesReason:
          $ref: '#/components/schemas/WorkPeriodChangesReason'
        comment:
          type: string
    modelBreakTimeBreakType:
      type: string
      enum:
      - NO_BREAK
      - MEAL
      - REST
      default: NO_BREAK
    modelAgreedHourWeek:
      type: object
      properties:
        week:
          $ref: '#/components/schemas/AgreedHourWeekWeekIndex'
          title: ' `json:"week"`'
        days:
          type: array
          items:
            $ref: '#/components/schemas/modelAgreedHourDay'
          title: ''
    AuditResponseAgreedHourWithConsentRecords:
      type: object
      properties:
        agreedHour:
          $ref: '#/components/schemas/v2modelAgreedHour'
        consentRecords:
          type: array
          items:
            $ref: '#/components/schemas/modelConsent'
    modelAgreedHourDay:
      type: object
      properties:
        day:
          type: integer
          format: int32
          title: ''
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/modelAgreedHourShift'
          title: ''
    WorkPeriodCycle:
      type: string
      enum:
      - WEEKLY
      - TWO_WEEK
      - FOUR_WEEK
      default: WEEKLY
    ConfigurationNeedsEmployeeApproval:
      type: string
      enum:
      - NEVER
      - ALWAYS
      - CONDITIONAL
      default: NEVER
    modelShiftTypeConsentMetadata:
      type: object
      properties:
        comment:
          type: string
        extras:
          type: object
          additionalProperties:
            type: string
    AgreedHourEmployeeApprovalConfigurationResponse:
      type: object
      properties:
        needsApproval:
          type: boolean
        error:
          type: string
        details:
          type: string
    AgreedHourAuditResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditResponseAgreedHourWithConsentRecords'
        error:
          type: string
    AgreedHourSearchResponse:
      type: object
      properties:
        agreedHour:
          type: array
          items:
            $ref: '#/components/schemas/v2modelAgreedHour'
        error:
          type: string
        currentVersion:
          type: string
    modelWorkPeriodDayOfWeek:
      type: string
      enum:
      - SUNDAY
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
      default: SUNDAY
    AgreedHourGetAreasResponse:
      type: object
      properties:
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AgreedHourArea'
        error:
          type: string
    AgreedHourBatchUpdateRequest:
      type: object
      properties:
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
          description: One or more numeric employee IDs
        agreedHour:
          $ref: '#/components/schemas/v2modelAgreedHour'
    WorkPeriodChangesReason:
      type: string
      enum:
      - UNDEFINED
      - REQUESTED_BY_EMPLOYEE
      - BONA_FIDE
      - OTHER
      default: UNDEFINED
    modelBreakTime:
      type: object
      properties:
        breakType:
          $ref: '#/components/schemas/modelBreakTimeBreakType'
          title: ''
        breakDuration:
          type: string
          description: e.g. `00:30` for a 30 minute break, `01:05` for a 1 hour 5 minute break.
          title: ''
        startBreakTime:
          type: string
          description: Formatted 24-hour time e.g. `10:00` or `14:30`
          title: ''
        endBreakTime:
          type: string
          description: Formatted 24-hour time e.g. `10:00` or `14:30`
          title: ''
        changeDetails:
          type: string
          readOnly: true
    AgreedHourConsentResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
    ConsentConsentRecordType:
      type: string
      enum:
      - SHIFT
      - TIMESHEET
      - REGULAR_SCHEDULE
      default: SHIFT
    modelConsent:
      type: object
      properties:
        id:
          type: string
        recordId:
          type: string
        recordType:
          $ref: '#/components/schemas/ConsentConsentRecordType'
        transactionId:
          type: string
        employeeId:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ConsentConsentStatus'
        description:
          type: string
        metadata:
          $ref: '#/components/schemas/modelShiftTypeConsentMetadata'
        creator:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    AgreedHourCurrentRequestData:
      type: object
      properties:
        isBaseline:
          type: boolean
        date:
          type: string
          format: date-time
    AgreedHourArea:
      type: object
      properties:
        id:
          type: integer
          format: int32
        operationalUnitName:
          type: string
        company:
          type: integer
          format: int32
        companyName:
          type: string
        trainingModuleIds:
          type: array
          items:
            type: integer
            format: int32
    tenantagreed_hoursv2modelConfiguration:
      type: object
      properties:
        behaviour:
          $ref: '#/components/schemas/ConfigurationBehaviour'
          title: Which legislation to use
        needsEmployeeApproval:
          $ref: '#/components/schemas/ConfigurationNeedsEmployeeApproval'
          title: Do we need to send new Agreed Hours/Regular schedule for employees approval
    AgreedHourEmployeeNotificationResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
    AgreedHourConsentRecordsResponse:
      type: object
      properties:
        consentRecords:
          type: array
          items:
            $ref: '#/components/schemas/modelConsent'
        error:
          type: string
    modelWorkPeriod:
      type: object
      properties:
        cycle:
          $ref: '#/components/schemas/WorkPeriodCycle'
          title: ''
        dayOfWeek:
          $ref: '#/components/schemas/modelWorkPeriodDayOfWeek'
          title: ''
        startDate:
          type: string
          format: date-time
          description: Must refer to a day of the week matching `dayOfWeek`, otherwise an error occurs.
          title: ''
        startCycleDate:
          type: string
          format: date-time
          title: ''
        endCycleDate:
          type: string
          format: date-time
          title: ''
        endDate:
          type: string
          format: date-time
          title: ''
        baselineDate:
          type: string
          format: date-time
          title: ''
        baselineComment:
          type: string
          title: ''
        changesReason:
          $ref: '#/components/schemas/WorkPeriodChangesReason'
          title: ''
        metadata:
          type: string
          title: ''
      title: WorkPeriod model
    ConfigurationBehaviour:
      type: string
      enum:
      - AGREED_HOURS
      - FWW_REGULAR_BASELINE
      - FWW_MEDIAN_HOURS
      - VERSIONED_AGREED_HOURS
      default: AGREED_HOURS
    AgreedHourGetAreasRequest:
      type: object
      properties:
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
    AgreedHourBatchUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        successfulEmployeeIds:
          type: array
          items:
            type: integer
            format: int64
        failedEmployeeIds:
          type: array
          items:
            type: integer
            format: int64
    v2modelAgreedHour:
      type: object
      properties:
        threshold:
          type: number
          format: float
          title: ''
        applyThreshold:
          type: boolean
          title: ''
        workPeriod:
          $ref: '#/components/schemas/modelWorkPeriod'
          title: ''
        details:
          $ref: '#/components/schemas/modelAgreedHourDetails'
          title: ''
        workingDaysPerCycle:
          type: number
          format: float
          title: ''
        status:
          $ref: '#/components/schemas/modelAgreedHourStatus'
          title: ''
        statusDate:
          type: string
          format: date-time
          title: ''
        statusChangedById:
          type: integer
          format: int32
          title: ''
          readOnly: true
        comment:
          type: string
          title: ''
        version:
          type: string
          title: ''
          readOnly: true
        createdAt:
          type: string
          format: date-time
          title: ''
          readOnly: true
        archivedAt:
          type: string
          format: date-time
          title: ''
          readOnly: true
        recordId:
          type: string
          title: ''
          readOnly: true
        creatorEmployeeProfileId:
          type: string
          title: ''
          readOnly: true
        creatorEmployeeDisplayName:
          type: string
          title: ''
          readOnly: true
        creatorEmployeeProfilePic:
          type: string
          title: ''
          readOnly: true
        effectiveDate:
          type: string
          title: ''
    AgreedHourArchiveResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
