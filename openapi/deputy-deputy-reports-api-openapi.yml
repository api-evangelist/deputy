openapi: 3.2.0
info:
  title: Deputy V2 Deputy Reports API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Deputy Reports
paths:
  /management/v2/reports/RS_TS_VARIANCE/export:
    post:
      summary: Retrieve a export schedule vs timesheet vs sales report (via background job)
      operationId: ReportV2Controller_exportScheduleTimesheetSales
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportScheduleTimesheetSalesResponse'
      tags:
      - Deputy Reports
      description: Retrieve a export schedule vs timesheet vs sales report (via background job).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportExportScheduleTimesheetSalesRequest'
  /management/v2/reports/report:
    post:
      operationId: ReportV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericReportCreateResponse'
      tags:
      - Deputy Reports
      summary: Create
      description: Create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericReportCreateRequestData'
  /management/v2/reports/url/{reportType}/{id}:
    post:
      operationId: ReportV2Controller_url
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericReportUrlResponse'
      parameters:
      - name: reportType
        in: path
        required: true
        schema:
          type: string
          enum:
          - UNDEFINED_REPORT_TYPE
          - FWW_PAY_PREMIUMS
          - FWW_SHIFT_CHANGE_CONSENT
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Deputy Reports
      summary: Url
      description: Url.
  /management/v2/reports/{reportType}:
    get:
      operationId: ReportV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericReportListResponse'
      parameters:
      - name: reportType
        in: path
        required: true
        schema:
          type: string
          enum:
          - UNDEFINED_REPORT_TYPE
          - FWW_PAY_PREMIUMS
          - FWW_SHIFT_CHANGE_CONSENT
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Deputy Reports
      summary: List
      description: List.
components:
  schemas:
    GenericReportCreateRequestData:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        fwwPayPremiums:
          $ref: '#/components/schemas/modelFwwPayPremiumsCreateRequest'
        fwwShiftChangeConsent:
          $ref: '#/components/schemas/modelFwwShiftChangeConsentCreateRequest'
    GenericReportListResponseReport:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/GenericReportReportStatus'
        contentType:
          type: string
        error:
          type: string
        fwwPayPremium:
          $ref: '#/components/schemas/modelFwwPayPremiumsItem'
        fwwShiftChangeConsent:
          $ref: '#/components/schemas/modelFwwShiftChangeConsentItem'
    modelFwwPayPremiumsCreateRequest:
      type: object
      properties:
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
    GenericReportReportStatus:
      type: string
      enum:
      - UNDEFINED_REPORT_STATUS
      - PROCESSING
      - COMPLETED
      - FAILED
      default: UNDEFINED_REPORT_STATUS
    GenericReportCreateResponse:
      type: object
      properties:
        success:
          type: boolean
    modelFwwShiftChangeConsentItem:
      type: object
      properties:
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
    ReportExportScheduleTimesheetSalesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ReportExportScheduleTimesheetSalesResponseData'
      title: Export ScheduleTimesheetSales report response
    modelFwwShiftChangeConsentCreateRequest:
      type: object
      properties:
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
    ReportExportScheduleTimesheetSalesRequest:
      type: object
      properties:
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        areaIds:
          type: array
          items:
            type: integer
            format: int32
        startDate:
          type: string
        endDate:
          type: string
      title: Export ScheduleTimesheetSales report request
    GenericReportUrlResponse:
      type: object
      properties:
        success:
          type: boolean
        url:
          type: string
    GenericReportListResponse:
      type: object
      properties:
        success:
          type: boolean
        reports:
          type: array
          items:
            $ref: '#/components/schemas/GenericReportListResponseReport'
        nextCursor:
          type: string
    modelFwwPayPremiumsItem:
      type: object
      properties:
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
    ReportExportScheduleTimesheetSalesResponseData:
      type: object
      properties:
        jobId:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
