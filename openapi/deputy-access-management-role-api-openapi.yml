openapi: 3.2.0
info:
  title: Deputy V2 Access Management Role API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Access Management Role
paths:
  /access-management/v2/roles:
    get:
      summary: List all available roles
      operationId: AccessManagementV2Controller_ListRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementListRoleResponse'
      tags:
      - Access Management Role
      security:
      - APIToken: []
      description: List all available roles.
    post:
      summary: Create a new role
      operationId: AccessManagementV2Controller_CreateRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementCreateRoleResponse'
      tags:
      - Access Management Role
      security:
      - APIToken: []
      description: Create a new role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessManagementCreateRoleRequest'
  /access-management/v2/roles/{roleId}:
    delete:
      operationId: AccessManagementV2Controller_DeleteRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementDeleteRoleResponse'
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Access Management Role
      security:
      - APIToken: []
      summary: Delete role
      description: Delete role.
    put:
      operationId: AccessManagementV2Controller_UpdateRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2AccessManagementUpdateRoleResponse'
      parameters:
      - name: roleId
        description: Role ID (required)
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Access Management Role
      security:
      - APIToken: []
      summary: Update role
      description: Update role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2AccessManagementUpdateRoleRequest'
components:
  schemas:
    tenantauthv2modelEmployeeRole:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Unique identifier of the role
        name:
          type: string
          title: Name of the role
        ranking:
          type: integer
          format: int32
          title: Ranking of the role
        require2fa:
          type: boolean
          title: Whether 2FA is required for this role
        reportsTo:
          type: integer
          format: int32
          title: Unique identifier of the role that this role reports to
        alsoReportsTo:
          type: array
          items:
            type: integer
            format: int32
          title: Unique identifiers of the roles that this role also reports to
        employeeCount:
          type: integer
          format: int32
          title: '[read-only] Number of employees assigned to this role'
        permissionCount:
          type: integer
          format: int32
          title: '[read-only] Number of permissions assigned to this role'
        privilegeNames:
          type: array
          items:
            type: string
          title: Privileges assigned to this role
        lastUpdatedAt:
          type: string
          format: date-time
          title: Last modification time of the role
        operations:
          $ref: '#/components/schemas/modelEmployeeRoleOperations'
          title: Operations that can be performed on the Role
        acceptsReportees:
          type: boolean
          title: Indicates if the Role can be included in another role's "report to" or "also reports to" list
      title: Role is assigned to employees and has permissions
    v2AccessManagementUpdateRoleRequest:
      type: object
      properties:
        roleId:
          type: integer
          format: int32
          title: Role ID (required)
        name:
          type: string
          title: Role name (required, must be unique)
        reportsTo:
          type: integer
          format: int32
          title: Reports To role ID (required, 0 for top-level)
        alsoReportsTo:
          type: array
          items:
            type: integer
            format: int32
          title: Also Reports To role IDs (optional)
        require2fa:
          type: boolean
          title: Whether 2FA is required for this role
        privileges:
          type: array
          items:
            type: string
          title: Privileges to assign to the role
      title: Request to update an employee role
    modelEmployeeRoleOperations:
      type: object
      properties:
        view:
          type: boolean
          title: Indicates if the Role can be viewed
        edit:
          type: boolean
          title: Indicates if the Role can be edited
        delete:
          type: boolean
          title: Indicates if the Role can be deleted
        duplicate:
          type: boolean
          title: Indicates if the Role can be duplicated
        viewHistory:
          type: boolean
          title: Indicates if the History of the Role can be viewed
    AccessManagementDeleteRoleResponse:
      type: object
      properties:
        success:
          type: boolean
      title: Response for deleting an employee role
    AccessManagementCreateRoleRequest:
      type: object
      properties:
        name:
          type: string
          title: Name of the role (required, must be unique)
        reportsTo:
          type: integer
          format: int32
          title: Role ID that this role reports to (required)
        alsoReportsTo:
          type: array
          items:
            type: integer
            format: int32
          title: 'Optional: Role IDs that this role also reports to'
        require2fa:
          type: boolean
          title: Whether 2FA is required for this role (defaults to false)
        privilegesFrom:
          type: integer
          format: int32
          title: 'Optional: Role ID to copy privileges from (for duplicating roles)'
      title: Request to create a new role
    v2AccessManagementUpdateRoleResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        role:
          $ref: '#/components/schemas/tenantauthv2modelEmployeeRole'
      title: Response for updating an employee role
    AccessManagementCreateRoleResponse:
      type: object
      properties:
        success:
          type: boolean
        role:
          $ref: '#/components/schemas/tenantauthv2modelEmployeeRole'
        error:
          type: string
      title: Response for creating a role
    AccessManagementListRoleResponse:
      type: object
      properties:
        success:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/tenantauthv2modelEmployeeRole'
      title: Response to list all available roles
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
