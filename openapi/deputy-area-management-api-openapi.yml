openapi: 3.2.0
info:
  title: Deputy V2 Area Management API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Area Management
paths:
  /management/v2/areas-management:
    get:
      summary: List data based on employee id
      operationId: AreaManagementV2Controller_listByEmployeeId
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaManagementListByEmployeeIdResponse'
      parameters:
      - name: employeeId
        in: query
        required: false
        schema:
          type: string
      tags:
      - Area Management
      description: List data based on employee id.
components:
  schemas:
    v2modelAreaManagement:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Area Management ID
        employeeId:
          type: integer
          format: int32
          title: Employee ID
        areaId:
          type: integer
          format: int32
          title: Area ID
      title: Area management
    AreaManagementListByEmployeeIdResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelAreaManagement'
      title: Get Area management by employee response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
