openapi: 3.2.0
info:
  title: Deputy Employee API
  version: 1.0.0
  description: 'Operations tagged Employee across 2 of this provider''s published API definitions: deputy-v1-resource-api.json, deputy-v1-supervise-api.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
tags:
