openapi: 3.2.0
info:
  title: Deputy V2 Schedule Template API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: ScheduleTemplate
paths:
  /management/v2/schedule/template:
    post:
      summary: save a template
      operationId: ScheduleTemplateV2Controller_createTemplate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplateCreateTemplateResponse'
      tags:
      - ScheduleTemplate
      description: save a template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleTemplateCreateTemplateRequestData'
  /management/v2/schedule/template:bulkDelete:
    post:
      summary: bulk delete templates
      operationId: ScheduleTemplateV2Controller_bulkDeleteTemplate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplateBulkDeleteTemplateResponse'
      tags:
      - ScheduleTemplate
      description: bulk delete templates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleTemplateBulkDeleteTemplateRequestData'
  /management/v2/schedule/template:load:
    post:
      operationId: ScheduleTemplateV2Controller_loadTemplate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplateLoadTemplateResponse'
      tags:
      - ScheduleTemplate
      summary: Load template
      description: Load template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelLoadTemplatePayload'
components:
  schemas:
    ScheduleTemplateBulkDeleteTemplateResponse:
      type: object
      properties:
        success:
          type: boolean
          title: Success flag
        metadata:
          $ref: '#/components/schemas/ScheduleTemplateBulkDeleteTemplateResponseMetadata'
    modelLoadTemplatePayload:
      type: object
      properties:
        templateIds:
          type: array
          items:
            type: integer
            format: int32
        viewType:
          $ref: '#/components/schemas/modelViewType'
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        targetDate:
          type: string
          title: target date to load template, formatted as "YYYY-MM-DD" for example "2020-01-01"
        areaIds:
          type: array
          items:
            type: integer
            format: int32
          title: optional area ids
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
          title: optional employee ids
    ScheduleTemplateCreateTemplateRequestData:
      type: object
      properties:
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        shiftIds:
          type: array
          items:
            type: integer
            format: int32
        name:
          type: string
        description:
          type: string
        viewType:
          $ref: '#/components/schemas/modelViewType'
        start:
          type: string
          title: template start datetime, format ISO8601 eg 2012-12-18T13:45:00+01:00
        end:
          type: string
          title: template start datetime, format ISO8601 eg 2012-12-18T13:45:00+01:00
        override:
          type: boolean
          title: override with the same name, default false
        areaIds:
          type: array
          items:
            type: integer
            format: int32
          title: optional area ids
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
          title: optional employee ids
    modelViewType:
      type: string
      enum:
      - DAILY
      - DAILY_EMP
      - WEEKLY
      - WEEKLY_EMPLOYEE
      - FORTNIGHTLY
      - FORTNIGHTLY_EMP
      - MONTHLY_EMPLOYEE
      - FOURWEEKLY_EMP
      - MONTHLY
      default: DAILY
    ScheduleTemplateCreateTemplateResponse:
      type: object
      properties:
        success:
          type: boolean
    ScheduleTemplateLoadTemplateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/LoadTemplateResponseLoadResponseData'
    LoadTemplateResponseLoadResponseData:
      type: object
      properties:
        correlationId:
          type: string
        jobId:
          type: string
    ScheduleTemplateBulkDeleteTemplateResponseMetadata:
      type: object
      properties:
        deletedCount:
          type: integer
          format: int32
          title: Number of templates successfully deleted
        deletedIds:
          type: array
          items:
            type: integer
            format: int32
          title: IDs that were successfully deleted
        failedIds:
          type: array
          items:
            type: integer
            format: int32
          title: IDs that failed to delete (for partial failure scenarios)
      title: Metadata about the bulk delete operation
    ScheduleTemplateBulkDeleteTemplateRequestData:
      type: object
      properties:
        templateIds:
          type: array
          items:
            type: integer
            format: int32
          title: Array of template IDs to delete
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
