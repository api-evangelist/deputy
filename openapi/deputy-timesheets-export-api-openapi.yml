openapi: 3.2.0
info:
  title: Deputy V2 Timesheets Export API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Timesheets Export
paths:
  /management/v2/timesheets:export:
    post:
      summary: Export timesheets
      operationId: TimesheetsV2Controller_export
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsAsyncResponse'
      tags:
      - Timesheets Export
      description: Export timesheets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelTimesheetExport'
components:
  schemas:
    TimesheetsAsyncResponse:
      type: object
      properties:
        success:
          type: boolean
    v2modelTimesheetExport:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
          title: location to export (will be ignored if isAllLocations is true)
        start:
          type: string
          title: timesheet start time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        end:
          type: string
          title: timesheet end time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        markAsPaid:
          type: boolean
          title: mark each timesheet as paid
        label:
          type: string
          title: label to identify the export
        isAllLocations:
          type: boolean
          title: export all locations (ignores locationId)
      title: Request to perform a timesheet export for a location
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
