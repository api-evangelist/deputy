openapi: 3.2.0
info:
  title: Deputy Timesheets API
  version: '1.0'
  description: 'Operations tagged Timesheets across 2 of this provider''s published API definitions: deputy-deputy-openapi.yml, deputy-v2-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{install}.{geo}.deputy.com/api
  variables:
    install:
      default: ''
    geo:
      default: ''
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
tags:
- name: Timesheets
paths:
  /v1/supervise/timesheet/end:
    post:
      tags:
      - Timesheets
      summary: Stop an employees timesheet(ClockOff)
      description: Stop an employees timesheet (Clock Off)
      operationId: Stopanemployeestimesheet(ClockOff)
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/StopanemployeestimesheetClockOffRequest'
              - example:
                  intTimesheetId: 65
                  intMealbreakMinute: 0
            example:
              intTimesheetId: 65
              intMealbreakMinute: 0
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/timesheet/pause:
    post:
      tags:
      - Timesheets
      summary: Pause or unpause employees timesheet (take a break/finish break)
      description: Pause or unpause employees time sheet (take a break/finish break)
      operationId: Pauseorunpauseemployeestimesheet(takeabreak/finishbreak)
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/StopanemployeestimesheetClockOffRequest'
              - example:
                  intTimesheetId: 65
                  intMealbreakMinute: 0
            example:
              intTimesheetId: 65
              intMealbreakMinute: 0
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/timesheet/start:
    post:
      tags:
      - Timesheets
      summary: Start an employees timesheet(ClockOn)
      description: Start an employees timesheet (Clock On)
      operationId: Startanemployeestimesheet(ClockOn)
      parameters: []
      requestBody:
        description: Employee ID
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/StartanemployeestimesheetClockOnRequest'
              - description: Employee ID
        required: false
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /v1/supervise/timesheet/{timesheetid}/details:
    get:
      tags:
      - Timesheets
      summary: View a timesheet by id
      operationId: Viewatimesheetbyid
      parameters:
      - name: timesheetid
        in: path
        description: The timesheet id record
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          headers: {}
          content: {}
      deprecated: false
      security:
      - httpBearer: []
    servers:
    - url: https://{install}.{geo}.deputy.com/api
      variables:
        install:
          default: ''
        geo:
          default: ''
  /management/v2/timesheets:
    get:
      summary: Retrieve list of timesheets
      operationId: TimesheetsV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsListResponse'
      parameters:
      - name: start
        description: format ISO8601 eg 2024-06-25T13:45:00+01:00.
        in: query
        required: false
        schema:
          type: string
      - name: end
        description: format ISO8601 eg 2024-06-25T13:45:00+01:00.
        in: query
        required: false
        schema:
          type: string
      - name: employeeId
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: locationIds
        in: query
        required: false
        schema:
          type: string
      - name: inProgress
        in: query
        required: false
        schema:
          type: boolean
      - name: orderBy
        description: 'Sort by field with direction, e.g., "start DESC", "id ASC", "createdAt DESC"

          Currently supporting id, start, end, createdAt.'
        in: query
        required: false
        schema:
          type: string
      - name: excludeLeave
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Timesheets
      description: Retrieve list of timesheets.
      security:
      - ApiToken: []
    post:
      summary: Create a new timesheets
      operationId: TimesheetsV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsCreateResponse'
      tags:
      - Timesheets
      description: Create a new timesheets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tenanttimesheetv2modelTimesheet'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /management/v2/timesheets/{id}:
    get:
      summary: Retrieve timesheets data by given Id
      operationId: TimesheetsV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Timesheets
      description: Retrieve timesheets data by given Id.
      security:
      - ApiToken: []
    delete:
      summary: Delete an existing timesheets
      operationId: TimesheetsV2Controller_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Timesheets
      description: Delete an existing timesheets.
      security:
      - ApiToken: []
    put:
      summary: Update an existing in progress timesheets
      operationId: TimesheetsV2Controller_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsActionResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Timesheets
      description: Update an existing in progress timesheets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelUpdateTimesheetRequest'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /management/v2/timesheets/{id}:auto-end:
    post:
      summary: End a timesheet without children, automatically calculates children from roster…
      operationId: TimesheetsV2Controller_autoEndTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsActionResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Timesheets
      description: 'End a timesheet without children, automatically calculates children from roster

        Only requires timesheet ID. All other data (start, end, children, meal breaks) are calculated automatically.'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /management/v2/timesheets/{id}:end:
    post:
      summary: End a timesheet
      operationId: TimesheetsV2Controller_end
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsActionResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Timesheets
      description: End a timesheet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelEndTimesheetRequest'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /management/v2/timesheets:pause:
    post:
      operationId: TimesheetsV2Controller_pause
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsPauseResponse'
      tags:
      - Timesheets
      summary: Pause
      description: Pause.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelPauseTimesheetRequest'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /management/v2/timesheets:start:
    post:
      summary: Start a timesheet
      operationId: TimesheetsV2Controller_start
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetsActionResponse'
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
      tags:
      - Timesheets
      description: Start a timesheet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelStartTimesheetRequest'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /timesheet-export/v2/summary-by-rate:get:
    post:
      summary: Fetch a summary grouped and sorted by rate
      operationId: TimesheetExportV2Controller_getRateSummary
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetExportRateSummaryResponse'
      tags:
      - Timesheets
      description: Fetch a summary grouped and sorted by rate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetExportSummaryRequest'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /timesheet-export/v2/summary:get:
    post:
      summary: Fetch a summary by filtering timesheets given filters
      operationId: TimesheetExportV2Controller_getSummary
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetExportSummaryResponse'
      tags:
      - Timesheets
      description: Fetch a summary by filtering timesheets given filters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimesheetExportSummaryRequest'
      security:
      - ApiToken: []
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
components:
  schemas:
    StartanemployeestimesheetClockOnRequest:
      title: StartanemployeestimesheetClockOnRequest
      required:
      - intOpunitId
      - intEmployeeId
      type: object
      properties:
        intOpunitId:
          type: integer
          format: int32
          description: The id of the location the area the timesheet is for
        intEmployeeId:
          type: integer
          format: int32
          description: The id record of the employee for who the timesheet is for
    StopanemployeestimesheetClockOffRequest:
      title: StopanemployeestimesheetClockOffRequest
      required:
      - intTimesheetId
      - intMealbreakMinute
      type: object
      properties:
        intTimesheetId:
          type: integer
          format: int32
          description: Record id of the timesheet to stop
        intMealbreakMinute:
          type: integer
          format: int32
          description: Number of minutes taken as a meal break in the timesheet period
    TimesheetExportRateSummaryResponse:
      type: object
      properties:
        rateSummaries:
          type: array
          items:
            $ref: '#/components/schemas/modelRateSummary'
    TimesheetExportSummaryResponse:
      type: object
      properties:
        totalEmployees:
          type: integer
          format: int32
        totalTimesheets:
          type: integer
          format: int32
        totalHours:
          type: string
        totalCost:
          type: string
          title: Total cost formatted as 123.4567
        summarizedTimesheets:
          type: array
          items:
            $ref: '#/components/schemas/modelSummarizedTimesheet'
        summarizedPayCycles:
          type: array
          items:
            $ref: '#/components/schemas/modelSummarizedTimesheet'
        startDate:
          type: string
          title: Start Date - YYYY-MM-DD
        endDate:
          type: string
          title: End Date - YYYY-MM-DD
    modelBreak:
      type: object
      properties:
        slotType:
          $ref: '#/components/schemas/modelSlotType'
          title: type of slot
        start:
          type: integer
          format: int32
          title: can start break after seconds passed after shift start
        end:
          type: integer
          format: int32
          title: can end break after seconds passed after shift start
        state:
          $ref: '#/components/schemas/modelBreakState'
          title: Break state
        canStartEarly:
          type: boolean
          title: '[Deprecated] can employee start break early, override shift template'
        canEndEarly:
          type: boolean
          title: '[Deprecated] can employee end break early, override shift template'
        isMandatory:
          type: boolean
          title: '[Deprecated] is it mandatory to take this break, override shift template'
        type:
          $ref: '#/components/schemas/tenantsharedv2modelBreakType'
          title: type of break
        typeLabel:
          type: string
          title: break type name in config
        startDateTime:
          type: string
          title: format ISO8601 eg 2024-06-25T13:45:00+01:00
        endDateTime:
          type: string
          title: format ISO8601 eg 2024-06-25T13:45:00+01:00
    modelBreakState:
      type: string
      enum:
      - NOT_START
      - IN_PROGRESS
      - FINISHED
      - DURATION_ONLY
      - DURATION_FINISHED
      default: NOT_START
      title: Break States
    modelRateSummaryPayRule:
      type: object
      properties:
        id:
          type: integer
          format: int32
    modelMultiListField:
      type: object
      properties:
        value:
          type: array
          items:
            type: string
    modelDateRange:
      type: object
      properties:
        startDate:
          type: string
          title: Start Date - YYYY-MM-DD
        endDate:
          type: string
          title: End Date - YYYY-MM-DD
    modelPauseTimesheetRequest:
      type: object
      properties:
        breakId:
          type: integer
          format: int32
          title: index of schedule break
        breakAction:
          $ref: '#/components/schemas/modelBreakAction'
        employeeId:
          type: integer
          format: int32
    modelPayCenters:
      type: object
      properties:
        payCenterIds:
          type: array
          items:
            type: integer
            format: int32
    modelValidationFlag:
      type: string
      enum:
      - VALIDATION_FLAG_NONE
      - VALIDATION_FLAG_GENERIC_ERROR
      - VALIDATION_FLAG_DIFFERS_FROM_ROSTER
      - VALIDATION_FLAG_SHORTER_THAN_ROSTER
      - VALIDATION_FLAG_LONGER_THAN_ROSTER
      - VALIDATION_FLAG_NO_MEALBREAK
      - VALIDATION_FLAG_SHORTER_MEALBREAK
      - VALIDATION_FLAG_LONGER_MEALBREAK
      - VALIDATION_FLAG_LATE_MEALBREAK
      - VALIDATION_FLAG_INSUFFICIENT_MEALBREAK
      - VALIDATION_FLAG_OUTSIDE_GEO_BOUNDARIES
      - VALIDATION_FLAG_SHIFT_PLAN_ISSUES
      - VALIDATION_FLAG_NO_START_PHOTO
      - VALIDATION_FLAG_NO_END_PHOTO
      - VALIDATION_FLAG_PHOTO_DOES_NOT_MATCH
      - VALIDATION_FLAG_CLOSED_BY_SYSTEM
      - VALIDATION_FLAG_SHORTER_REST_BREAK
      - VALIDATION_FLAG_SHORTER_MEAL_BREAK
      - VALIDATION_FLAG_MISSED_SCHEDULE_BREAK
      - VALIDATION_FLAG_ATTESTATION_PREVENT_CLOCK_IN
      - VALIDATION_FLAG_ATTESTATION_NOTIFY_MANAGER
      default: VALIDATION_FLAG_NONE
    tenantsharedv2modelBreakType:
      type: string
      enum:
      - MEAL_BREAK
      - REST_BREAK
      default: MEAL_BREAK
      title: Break Type
    modelCompanyPeriods:
      type: object
      properties:
        companyPeriodIds:
          type: array
          items:
            type: integer
            format: int32
          title: Company Period IDs
    modelFileField:
      type: object
      properties:
        value:
          type: integer
          format: int32
    modelStartTimesheetRequest:
      type: object
      properties:
        recordIP:
          type: boolean
        areaId:
          type: integer
          format: int32
        employeeComment:
          type: string
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/tenantsharedv2modelCustomField'
        fileId:
          type: integer
          format: int32
        employeeId:
          type: integer
          format: int32
        geoLocation:
          $ref: '#/components/schemas/modelGeoLocation'
    TimesheetsListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/tenanttimesheetv2modelTimesheet'
        nextCursor:
          type: string
    tenantsharedv2modelCustomField:
      type: object
      properties:
        id:
          type: string
          format: int64
        booleanField:
          $ref: '#/components/schemas/modelBooleanField'
        stringField:
          $ref: '#/components/schemas/modelStringField'
        listField:
          $ref: '#/components/schemas/modelListField'
        multiListField:
          $ref: '#/components/schemas/modelMultiListField'
        fileField:
          $ref: '#/components/schemas/modelFileField'
          title: file id
        employeeVisible:
          type: boolean
    SummaryFiltersEmployeeSelectionMode:
      type: string
      enum:
      - EMPLOYEE_SELECTION_MODE_UNKNOWN
      - INCLUDE
      - EXCLUDE
      default: EMPLOYEE_SELECTION_MODE_UNKNOWN
    modelRateSummaryLeaveRule:
      type: object
      properties:
        id:
          type: integer
          format: int32
    modelEndTimesheetRequest:
      type: object
      properties:
        recordIP:
          type: boolean
        start:
          type: string
          title: timesheet start time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        end:
          type: string
          title: timesheet end time, format ISO8601 eg 2012-12-18T13:45:00+01:00
        employeeComment:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/modelChildTimesheet'
        mealBreakSlots:
          type: array
          items:
            $ref: '#/components/schemas/modelMealBreak'
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/tenantsharedv2modelCustomField'
        geoLocation:
          $ref: '#/components/schemas/modelGeoLocation'
        fileId:
          type: integer
          format: int32
        areaId:
          type: integer
          format: int32
    modelSummaryFilters:
      type: object
      properties:
        companyPeriods:
          $ref: '#/components/schemas/modelCompanyPeriods'
        payCalendar:
          $ref: '#/components/schemas/modelPayCalendarOption'
        dateRange:
          $ref: '#/components/schemas/modelDateRange'
        locations:
          $ref: '#/components/schemas/modelLocations'
        payCenters:
          $ref: '#/components/schemas/modelPayCenters'
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
        employeeSelectionMode:
          $ref: '#/components/schemas/SummaryFiltersEmployeeSelectionMode'
    TimesheetsDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
    tenanttimesheetv2modelTimesheet:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Timesheets ID
        employeeId:
          type: integer
          format: int32
          title: Employee ID
        employeeHistoryId:
          type: integer
          format: int32
          title: Employee History ID
        employeeAgreementId:
          type: integer
          format: int32
          title: Employee Agreement ID
        start:
          type: string
          format: date-time
          title: Timesheets start time
        end:
          type: string
          format: date-time
          title: Timesheets end time
        mealBreak:
          type: number
          format: float
          title: Meal Break in minutes
        mealBreakSlots:
          type: array
          items:
            $ref: '#/components/schemas/modelBreak'
          title: Break Slots
        slots:
          type: string
          title: Slot
        totalTime:
          type: number
          format: float
          title: Total Time
        totalTimeInvoiced:
          type: number
          format: float
          title: Total Time Invoiced
        cost:
          type: number
          format: float
          title: Cost
        shiftId:
          type: integer
          format: int32
          title: Shift ID
        comments:
          type: array
          items:
            type: string
          title: Timesheet Comments
        isDisputed:
          type: boolean
          title: Is Disputed
        isTimeApproved:
          type: boolean
          title: Is Time Approved
        approvedById:
          type: integer
          format: int32
