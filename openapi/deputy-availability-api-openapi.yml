openapi: 3.2.0
info:
  title: Deputy V2 Availability API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Availability
paths:
  /management/v2/availability/{id}:
    get:
      operationId: AvailabilityV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Availability
      summary: Get
      description: Get.
    delete:
      operationId: AvailabilityV2Controller_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: dayOfWeek
        in: query
        required: false
        schema:
          type: string
      tags:
      - Availability
      summary: Delete
      description: Delete.
  /management/v2/availability:list:
    post:
      operationId: AvailabilityV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityListResponse'
      tags:
      - Availability
      summary: List
      description: List.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityListRequestData'
components:
  schemas:
    modelEmployeeAvailability:
      type: object
      properties:
        employee:
          type: integer
          format: int32
        lastModifiedAt:
          type: string
        canAddAvailability:
          type: boolean
        hasSetUpAvailability:
          type: boolean
        oneOff:
          type: array
          items:
            $ref: '#/components/schemas/modelOneOffAvailability'
        dateOfMonthRecurrences:
          type: array
          items:
            $ref: '#/components/schemas/modelDateOfMonthRecurrenceAvailability'
        weekdayRecurrences:
          type: array
          items:
            $ref: '#/components/schemas/modelWeekdayRecurrenceAvailability'
        timeZone:
          type: string
      title: Contains the availability data for a specific employee
    AvailabilityGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelEmployeeAvailability'
    modelDateOfMonthRecurrenceAvailability:
      type: object
      properties:
        date:
          type: integer
          format: int32
        availability:
          type: array
          items:
            $ref: '#/components/schemas/modelAvailabilityDetail'
      title: Contains recurrence availability details
    AvailabilityListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelEmployeeAvailability'
    modelRecurrenceDetail:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
        frequency:
          type: string
        interval:
          type: integer
          format: int32
        weekOfTheMonth:
          type: integer
          format: int32
        isEndingSoon:
          type: boolean
      title: Details of a specific availability or unavailability
    modelOneOffAvailability:
      type: object
      properties:
        date:
          type: string
        availability:
          type: array
          items:
            $ref: '#/components/schemas/modelAvailabilityDetail'
      title: Contains one-off availability details
    AvailabilityListRequestData:
      type: object
      properties:
        employees:
          type: array
          items:
            type: integer
            format: int32
        start:
          type: string
        end:
          type: string
    AvailabilityDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
    modelAvailabilityDetail:
      type: object
      properties:
        id:
          type: integer
          format: int32
        tag:
          type: string
        kind:
          type: string
        start:
          type: string
        end:
          type: string
        comment:
          type: string
        isAllDay:
          type: boolean
        isOvernight:
          type: boolean
        recurrenceDetail:
          $ref: '#/components/schemas/modelRecurrenceDetail'
      title: Details of a specific availability or unavailability
    modelWeekdayRecurrenceAvailability:
      type: object
      properties:
        dayOfWeek:
          type: string
        availability:
          type: array
          items:
            $ref: '#/components/schemas/modelAvailabilityDetail'
      title: Contains recurrence availability details
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
