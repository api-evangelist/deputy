openapi: 3.2.0
info:
  title: Deputy V2 Get Employee Role Ids with 2FA Enforced API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Get Employee Role Ids with 2FA Enforced
paths:
  /business-setting/v2/get-employee-role-ids-with-2fa-enforced:
    get:
      operationId: BusinessSettingV2Controller_getEmployeeRoleIDsWithTwoFAEnforced
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSettingGetEmployeeRoleIDsWithTwoFAEnforcedResponse'
      tags:
      - Get Employee Role Ids with 2FA Enforced
      security:
      - APIToken: []
      summary: Get employee role I ds with two FA enforced
      description: Get employee role I ds with two FA enforced.
components:
  schemas:
    v2BusinessSettingRole:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    BusinessSettingGetEmployeeRoleIDsWithTwoFAEnforcedResponse:
      type: object
      properties:
        success:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/v2BusinessSettingRole'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
