openapi: 3.2.0
info:
  title: Deputy V2 Timesheet Batch Forecast API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Timesheet Batch Forecast
paths:
  /tsa/v2/timesheets:batch-forecast:
    post:
      summary: Batch Approve Time for Timesheet
      description: Bulk action trigger forecast
      operationId: TsaV2Controller_batchForecastTimesheet
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsaAsyncResponse'
      tags:
      - Timesheet Batch Forecast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsaTimesheetBatchRequest'
components:
  schemas:
    TsaTimesheetBatchRequest:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/TimesheetBatchRequestQuery'
    TsaAsyncResponse:
      type: object
      properties:
        success:
          type: boolean
        operationId:
          type: string
        locks:
          type: array
          items:
            $ref: '#/components/schemas/OperationLock'
    TimesheetBatchRequestQuery:
      type: object
      properties:
        dateFrom:
          type: string
        dateTo:
          type: string
        operationalUnitIds:
          type: array
          items:
            type: integer
            format: int32
        includeAllLocations:
          type: boolean
        approvalStatus:
          $ref: '#/components/schemas/TimesheetBatchRequestApprovalStatus'
        employeeIds:
          type: array
          items:
            type: integer
            format: int32
        includeAllEmployees:
          type: boolean
        timesheetIds:
          type: array
          items:
            type: integer
            format: int32
        includeAllTimesheets:
          type: boolean
        issueStatus:
          $ref: '#/components/schemas/TimesheetBatchRequestIssueStatus'
        rosterIds:
          type: array
          items:
            type: integer
            format: int32
    TimesheetBatchRequestIssueStatus:
      type: string
      enum:
      - ISSUES_INCLUDED
      - ISSUES_ONLY
      - ISSUES_EXCLUDED
      default: ISSUES_INCLUDED
    OperationLock:
      type: object
      properties:
        kind:
          type: string
        ids:
          type: object
          additionalProperties:
            type: boolean
    TimesheetBatchRequestApprovalStatus:
      type: string
      enum:
      - ANY
      - PENDING
      - TIME_APPROVED
      - PAY_APPROVED
      default: ANY
      title: the enum names must match TimesheetBatchQuery.php enums, e.g. ANY, PENDING, ISSUES_EXCLUDED etc
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
