openapi: 3.2.0
info:
  title: Deputy V2 Get all visible employee roles API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Get all visible employee roles
paths:
  /business-setting/v2/get-all-visible-employee-roles:
    get:
      operationId: BusinessSettingV2Controller_getAllVisibleEmployeeRoles
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSettingGetAllVisibleEmployeeRolesResponse'
      tags:
      - Get all visible employee roles
      security:
      - APIToken: []
      summary: Get all visible employee roles
      description: Get all visible employee roles.
components:
  schemas:
    v2BusinessSettingRole:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    BusinessSettingGetAllVisibleEmployeeRolesResponse:
      type: object
      properties:
        success:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/v2BusinessSettingRole'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
