openapi: 3.2.0
info:
  title: Deputy V2 Leave Audit Log API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Audit Log
paths:
  /management/v2/leave-audit-log/employees/{employeeId}/policies/{policyId}:
    get:
      operationId: LeaveAuditLogV2Controller_listLogs
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveAuditLogListAuditLogsResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: policyId
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      tags:
      - Leave Audit Log
      summary: List logs
      description: List logs.
components:
  schemas:
    modelLeaveLogActor:
      type: object
      properties:
        name:
          type: string
          title: name of the employee
        status:
          $ref: '#/components/schemas/modelLeaveLogActorStatus'
          title: employee status
      title: Leave Log Actor
    ProRataProRataUnit:
      type: string
      enum:
      - UNKNOWN_PRO_RATA_UNIT
      - PRO_RATA_UNIT_DAY
      - PRO_RATA_UNIT_MONTH
      default: UNKNOWN_PRO_RATA_UNIT
    modelLeaveLogEntryTimesheet:
      type: object
      properties:
        timesheetId:
          type: string
          title: The timesheet Id of the accrual, deduction or revert
        timesheetHours:
          type: number
          format: double
          title: The timesheet hours of the accrual, deduction or revert
        startedAt:
          type: string
          format: date-time
          title: The timestamp in UTC of the hours were worked or leave was taken
        timeZone:
          type: string
          title: The name of time zone in which the start and end of the timesheet should be interpreted, e.g. Australia/Melbourne
      title: Leave Log Timesheet
    modelLeaveLogActorStatus:
      type: string
      enum:
      - NOT_FOUND
      - ARCHIVED
      - ACTIVE
      default: NOT_FOUND
    modelFixedReleaseDetails:
      type: object
      properties:
        fullTimeAmount:
          type: number
          format: float
        isProRatedRelease:
          type: boolean
        proRata:
          $ref: '#/components/schemas/modelProRata'
    modelProRata:
      type: object
      properties:
        denominator:
          $ref: '#/components/schemas/ProRataProRataUnit'
    LeaveAuditLogListAuditLogsResponse:
      type: object
      properties:
        success:
          type: boolean
        entries:
          type: array
          items:
            $ref: '#/components/schemas/modelLeaveLogEntry'
        nextCursor:
          type: string
    LeaveLogEntryLogType:
      type: string
      enum:
      - LOG_UNKNOWN_TYPE
      - LOG_MANUAL_MOD
      - LOG_HOURS_WORKED
      - LOG_DEDUCTION
      - LOG_FIXED_RELEASE
      - LOG_AGREED_HOURS
      - LOG_REVERT_ACCRUAL
      - LOG_REVERT_DEDUCTION
      - LOG_BALANCE_RESET
      - LOG_ROLLOVER_WITH_CAP
      - LOG_POLICY_ASSIGNED
      - LOG_POLICY_REMOVED
      - LOG_TIMESHEET_RECALCULATED
      - LOG_HOURS_WORKED_SINCE_THRESHOLD_OVERRIDDEN
      - LOG_ROLLOVER_FULL
      - LOG_TOIL_HOURS_WORKED
      - LOG_TOIL_REVERT_ACCRUAL
      - LOG_TOIL_TIMESHEET_RECALCULATED
      default: LOG_UNKNOWN_TYPE
      title: Log Type
    modelLeaveLogEntry:
      type: object
      properties:
        time:
          type: string
          format: date-time
          title: Timestamp of the entry (RFC3339 format)
        description:
          type: string
          title: Leave log description
        amount:
          type: number
          format: float
          title: Amount accrued or deducted
        balance:
          type: number
          format: float
          title: Running balance of the associated leave policy
        actor:
          $ref: '#/components/schemas/modelLeaveLogActor'
          title: Actor of the action which created the leave log
        timesheet:
          $ref: '#/components/schemas/modelLeaveLogEntryTimesheet'
          title: Timesheet log content of the leave log
        isRecalculation:
          type: boolean
          title: Whether the leave log is a recalculation
        accrualRateDetails:
          type: string
          title: Details about hourly/toil accrual rates
        logType:
          $ref: '#/components/schemas/LeaveLogEntryLogType'
          title: Log type of the leave log
        fixedReleaseDetails:
          $ref: '#/components/schemas/modelFixedReleaseDetails'
          title: Fixed release details
        agreedHoursDetails:
          $ref: '#/components/schemas/modelAgreedHoursDetails'
          title: Agreed hours details
      title: Leave Log Entry
    modelAgreedHoursDetails:
      type: object
      properties:
        fullTimeAmount:
          type: number
          format: float
        isProRatedRelease:
          type: boolean
        proRata:
          $ref: '#/components/schemas/modelProRata'
        averageHoursPerWeek:
          type: number
          format: float
        averageDaysPerWeek:
          type: number
          format: float
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
