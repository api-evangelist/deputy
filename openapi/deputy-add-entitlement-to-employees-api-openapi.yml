openapi: 3.2.0
info:
  title: Deputy V2 Add Entitlement To Employees API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Add Entitlement To Employees
paths:
  /management/v2/leave-entitlements:bulk-add:
    post:
      summary: Bulk assigning leave rule to employees
      operationId: LeaveEntitlementsV2Controller_AddLeaveEntitlementToEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveEntitlementsAddLeaveEntitlementToEmployeesResponse'
      tags:
      - Add Entitlement To Employees
      description: Bulk assigning leave rule to employees.
components:
  schemas:
    LeaveEntitlementsAddLeaveEntitlementToEmployeesResponse:
      type: object
      properties:
        success:
          type: boolean
      title: Bulk assigning leave rule to employees response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
