openapi: 3.2.0
info:
  title: Deputy V2 Area Profile API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Area Profile
paths:
  /management/v2/areas:
    get:
      summary: List all existing areas with filtering capabilities
      description: Supports searching by name, location ID, active status, and other fields using the filters parameter.
      operationId: AreaProfileV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaProfileListResponse'
      parameters:
      - name: filters
        description: 'Filter areas by field values. Format: filters[]={fieldName}:{value}

          Multiple filters can be combined. Use the ''op'' parameter to specify AND (default) or OR operation.


          AND filter example (default):


          ```

          GET /api/management/v2/areas?filters[]=isActive:1&filters[]=locationId:1

          ```

          Returns active areas in location with ID 1 (both conditions must match)


          OR filter example:


          ```

          GET /api/management/v2/areas?filters[]=locationId:1&filters[]=locationId:2&op=OR

          ```

          Returns areas in location 1 OR location 2 (either condition matches)


          Available filterable fields:

          - id: Area ID

          - name: Area name

          - locationId: Location ID

          - isActive: Active status (boolean: use 1 for true, 0 for false)

          - parentId: Parent area ID

          - workType: Work type

          - isOnRoster: Appears on roster (boolean: use 1 for true, 0 for false)'
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      - name: op
        description: 'Controls how multiple filters are combined. Default is AND (all filters must match).

          Valid values: "AND", "OR"

          - AND: All filter conditions must match (default behavior)

          - OR: Any filter condition can match. Example with AND (default):


          ```

          GET /api/management/v2/areas?filters[]=isActive:1&filters[]=locationId:1

          ```


          Example with OR:


          ```

          GET /api/management/v2/areas?filters[]=locationId:1&filters[]=locationId:2&op=OR

          ```'
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        description: 'Pagination cursor from a previous response. Base64 encoded value that points to the position in the result set for the next page.

          Use this value in subsequent requests to fetch the next page of results.'
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: Maximum number of area profiles to return in a single response. Used for pagination.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: excludeSoft
        description: When set to 1, excludes soft-deleted areas (areas in the deputec_trash table where orm = "DeputecOperationalUnit"). When 0 or not set, includes all areas.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: shiftIds
        description: 'Optional shift IDs for permission bypass. When provided, checks if the requesting employee

          has open shift invitations or cross-location shift assignments, and bypasses normal area

          permission checks accordingly. Supports multiple shift IDs.'
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      tags:
      - Area Profile
    post:
      summary: Create a new area
      operationId: AreaProfileV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaProfileCreateResponse'
      tags:
      - Area Profile
      description: Create a new area.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelAreaProfile'
  /management/v2/areas/employee:trained:
    post:
      summary: Fetch list of areas that an employee is trained in
      operationId: AreaProfileV2Controller_listEmployeeTrained
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaProfileEmployeeTrainedResponse'
      tags:
      - Area Profile
      description: Fetch list of areas that an employee is trained in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaProfileEmployeeTrainedRequest'
  /management/v2/areas/in-use:
    post:
      summary: Fetch list of areas that being used in timesheet or roster
      operationId: AreaProfileV2Controller_listAreaInUse
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaProfileAreaInUseResponse'
      tags:
      - Area Profile
      description: Fetch list of areas that being used in timesheet or roster.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaProfileAreaInUseRequest'
  /management/v2/areas/{id}:
    get:
      summary: Retrieve area by given Id
      operationId: AreaProfileV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaProfileGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Area Profile
      description: Retrieve area by given Id.
    delete:
      summary: Delete an area
      operationId: AreaProfileV2Controller_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaProfileDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Area Profile
      description: Delete an area.
    put:
      summary: Update an existing area
      operationId: AreaProfileV2Controller_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaProfileUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Area Profile
      description: Update an existing area.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelAreaProfile'
components:
  schemas:
    AreaProfileEmployeeTrainedRequest:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        shiftId:
          type: integer
          format: int32
        filterAssignedAreas:
          type: boolean
    AreaProfileCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelAreaProfile'
      title: Create Area response
    AreaProfileListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelAreaProfile'
        nextCursor:
          type: string
          description: Cursor to fetch the next page of results. Base64 encoded value. Present only if more results are available. Empty string if this is the last page.
      title: Get Areas response
    AreaProfileEmployeeTrainedResponseData:
      type: object
      properties:
        areas:
          type: array
          items:
            type: integer
            format: int32
    AreaProfileAreaInUseResponseData:
      type: object
      properties:
        areaId:
          type: integer
          format: int32
        usedInTimesheet:
          type: boolean
        usedInRoster:
          type: boolean
    v2modelAreaProfile:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Area ID
        name:
          type: string
          title: Area name
        locationId:
          type: integer
          format: int32
          title: Location ID
        parentId:
          type: integer
          format: int32
          title: Parent ID
        workType:
          type: string
          title: Area work type
        isActive:
          type: boolean
          title: If Area is active
        exportCode:
          type: string
          title: Area export code
        addressId:
          type: integer
          format: int32
          title: Area address ID
        contactId:
          type: integer
          format: int32
          title: Area contact ID
        rosterSortOrder:
          type: integer
          format: int32
          title: Sort order of area in roster
        isOnRoster:
          type: boolean
          title: If Area appears on roster
        color:
          type: string
          title: Assigned Area color
        areaType:
          $ref: '#/components/schemas/modelAreaType'
          title: Area type
        createdById:
          type: integer
          format: int32
          title: Employee ID of who created the shift
        createdAt:
          type: string
          format: date-time
          title: Timestamp when the Area was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp when the Area was modified
        address:
          $ref: '#/components/schemas/tenantlocationv2modelAddress'
          title: Address object
        geo:
          $ref: '#/components/schemas/modelAreaProfileLocationGeo'
      title: Area profile
    AreaProfileAreaInUseRequest:
      type: object
      properties:
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        areaIds:
          type: array
          items:
            type: integer
            format: int32
    AreaProfileEmployeeTrainedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AreaProfileEmployeeTrainedResponseData'
    modelAreaProfileLocationGeo:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    modelAreaType:
      type: string
      enum:
      - DEFAULT_AREA
      - AREA_WITH_GEO
      default: DEFAULT_AREA
    AreaProfileGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelAreaProfile'
      title: Get Area profile response
    AreaProfileAreaInUseResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/AreaProfileAreaInUseResponseData'
    AreaProfileUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelAreaProfile'
      title: Update Area response
    AreaProfileDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      title: Delete Area response
    tenantlocationv2modelAddress:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Address Id
        street:
          type: string
          title: Street address line
        state:
          type: string
          title: 'State code, e.g: ''CA'' for California or ''NSW'' for New South Wales'
        postcode:
          type: string
          title: Postcode
        country:
          type: string
          title: 'Country code, e.g: ''US'' for the United States of America, ''AU'' for Australia'
        verifiedAt:
          type: string
          format: date-time
          title: Timestamp of when the address was last verified
        note:
          type: string
          title: Note
        print:
          type: string
          title: '[read-only] Print address in a single line string'
      title: Address data as response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
