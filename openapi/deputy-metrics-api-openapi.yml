openapi: 3.2.0
info:
  title: Deputy V2 Metrics API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Metrics
paths:
  /v2/metrics:
    post:
      summary: Upsert metrics
      operationId: MetricsV2Controller_upsert
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsUpsertResponse'
      tags:
      - Metrics
      description: Upsert metrics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsUpsertRequest'
  /v2/metrics/budget:status:
    post:
      summary: check budget status
      operationId: MetricsV2Controller_checkBudgetStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsBudgetStatusResponse'
      tags:
      - Metrics
      description: check budget status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsBudgetStatusRequest'
  /v2/metrics/delete:
    post:
      summary: Delete metrics
      operationId: MetricsV2Controller_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsDeleteResponse'
      tags:
      - Metrics
      description: Delete metrics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsDeleteRequest'
  /v2/metrics/download:
    get:
      summary: Download metrics
      operationId: MetricsV2Controller_download
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsDownloadResponse'
      parameters:
      - name: areas
        description: comma separate area ids, e.g. "1,2".
        in: query
        required: false
        schema:
          type: string
      - name: types
        description: comma separate types, e.g. "Sales,CustomType".
        in: query
        required: false
        schema:
          type: string
      - name: startYMD
        description: 'start date, format: YYYYMMDD.'
        in: query
        required: false
        schema:
          type: string
      - name: endYMD
        description: 'end date, format: YYYYMMDD.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Metrics
      description: Download metrics.
  /v2/metrics/raw:
    get:
      summary: Get raw metrics
      operationId: MetricsV2Controller_getRaw
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsRawResponse'
      parameters:
      - name: start
        description: Start timestamp.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: end
        description: End timestamp.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: areas
        description: comma separate string, e.g. "1,2".
        in: query
        required: false
        schema:
          type: string
      - name: types
        description: comma separate types, e.g. "Sales,CustomType".
        in: query
        required: false
        schema:
          type: string
      - name: references
        description: comma separate string, e.g. "ref1,ref2".
        in: query
        required: false
        schema:
          type: string
      tags:
      - Metrics
      description: Get raw metrics.
  /v2/metrics:bulk:
    post:
      summary: Upsert metrics asynchronously
      operationId: MetricsV2Controller_upsertBulk
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsUpsertResponse'
      tags:
      - Metrics
      description: Upsert metrics asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsUpsertRequest'
components:
  schemas:
    modelBudgetStatusResponseData:
      type: object
      properties:
        date:
          type: string
        budget:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/modelBudgetStatus'
    modelBudgetStatus:
      type: string
      enum:
      - WITHIN_BUDGET
      - OVER_BUDGET
      default: WITHIN_BUDGET
    MetricsDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
    MetricsRawResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelMetric'
    MetricsUpsertRequest:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelMetric'
    MetricsUpsertResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelMetric'
    MetricsBudgetStatusRequest:
      type: object
      properties:
        start:
          type: string
          format: int64
          title: Start timestamp
        end:
          type: string
          format: int64
          title: End timestamp
        areas:
          type: array
          items:
            type: integer
            format: int32
    MetricsDownloadResponse:
      type: object
      properties:
        success:
          type: boolean
        resources:
          type: array
          items:
            type: string
          title: Download urls
    v2modelState:
      type: string
      enum:
      - ACTUAL
      - PLAN
      - FORECAST
      - BUDGET
      default: ACTUAL
    MetricsDeleteRequest:
      type: object
      properties:
        type:
          type: string
          title: Type, e.g. "Sales"
        start:
          type: string
          format: int64
          title: Start timestamp
        end:
          type: string
          format: int64
          title: End timestamp
        areas:
          type: array
          items:
            type: integer
            format: int32
          title: List of area ids
    modelMetric:
      type: object
      properties:
        timestamp:
          type: string
          format: int64
          title: Timestamp
        employee:
          type: integer
          format: int32
          title: Employee id
        area:
          type: integer
          format: int32
          title: Area id
        type:
          type: string
          title: Type
        reference:
          type: string
          title: Reference
        value:
          type: number
          format: double
          title: Value
        state:
          $ref: '#/components/schemas/v2modelState'
          title: State
        location:
          type: integer
          format: int32
          title: Location id
        id:
          type: string
          title: Id
        created:
          type: string
          title: 'Creation datetime, format: YYYY-MM-DDTHH:MM:SSZ'
        modified:
          type: string
          title: 'Modified datetime, format: YYYY-MM-DDTHH:MM:SSZ'
        payload:
          type: string
          title: Payload
      title: Metric
    MetricsBudgetStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        type:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelBudgetStatusResponseData'
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
