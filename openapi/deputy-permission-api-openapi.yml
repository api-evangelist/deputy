openapi: 3.2.0
info:
  title: Deputy V2 Permission API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Permission
paths:
  /v2/permissions:
    get:
      operationId: PermissionV2Controller_getPermissions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPermissionResponse'
      tags:
      - Permission
      summary: Get permissions
      description: Get permissions.
  /v2/permissions/{privilegeName}/employees:
    get:
      operationId: PermissionV2Controller_getEmployeeIdsWithPrivilege
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeIdsWithPrivilegeResponse'
      parameters:
      - name: privilegeName
        in: path
        required: true
        schema:
          type: string
      tags:
      - Permission
      summary: Get employee IDs with privilege
      description: Get employee IDs with privilege.
  /v2/permissions/{privilegeName}/users:
    get:
      operationId: PermissionV2Controller_getUserIdsWithPrivilege
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserIdsWithPrivilegeResponse'
      parameters:
      - name: privilegeName
        in: path
        required: true
        schema:
          type: string
      tags:
      - Permission
      summary: Get user IDs with privilege
      description: Get user IDs with privilege.
components:
  schemas:
    GetUserIdsWithPrivilegeResponse:
      type: object
      properties:
        success:
          type: boolean
        ids:
          type: array
          items:
            type: string
            format: int64
    GetPermissionResponse:
      type: object
      properties:
        success:
          type: boolean
        permissions:
          type: array
          items:
            type: string
    GetEmployeeIdsWithPrivilegeResponse:
      type: object
      properties:
        success:
          type: boolean
        ids:
          type: array
          items:
            type: string
            format: int64
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
