components:
  schemas:
    TaskSetup:
      type: object
      properties:
        Id:
          type: integer
        GroupId:
          type: integer
        Type:
          type: integer
        Parent:
          type: integer
        Question:
          type: string
          maxLength: 255
        Default:
          type: string
          maxLength: 255
        SortOrder:
          type: integer
        Schedule:
          type: integer
        OnYes:
          type: string
        OnNo:
          type: string
        RenderFunc:
          type: string
        Active:
          type: boolean
        AvailableAfter:
          type: string
        RepeatIfNotCompleted:
          type: boolean
        Time:
          type: string
        Section:
          type: string
          maxLength: 255
        Priority:
          type: string
          maxLength: 64
        Helptext:
          type: string
        SupercedePrev:
          type: boolean
        Colour:
          type: string
          maxLength: 16
        OnStart:
          type: string
        OnSubmit:
          type: string
        Duration:
          type: integer
        Creator:
          type: integer
        Created:
          type: string
          format: date-time
        Modified:
          type: string
        Group:
          type: object
        ScheduleObject:
          type: object
      required:
      - Id
      - GroupId
      - Type
      - Parent
      - Question
      - OnYes
      - OnNo
      - RenderFunc
      - SupercedePrev
      - Creator
      - Created
      - Modified
    QueryRequest:
      type: object
      description: V1 Resource search payload. All fields optional; an empty body returns the first page of results.
      properties:
        search:
          type: object
          description: Map of search clauses keyed by an arbitrary id (e.g. `s1`, `s2`). Each clause filters one field.
          additionalProperties:
            type: object
            required:
            - field
            - data
            - type
            properties:
              field:
                type: string
                description: Field name to filter on (e.g. `Id`, `Employee`).
              data:
                description: Comparison value. Type depends on the field.
              type:
                type: string
                description: Comparison operator.
                enum:
                - eq
                - ne
                - gt
                - lt
                - ge
                - le
                - is
                - is not
                - in
                - not in
                - starts
                - contains
        sort:
          type: object
          description: Map of field name → `asc` or `desc`.
          additionalProperties:
            type: string
            enum:
            - asc
            - desc
        start:
          type: integer
          minimum: 0
          default: 0
          description: Pagination offset (0-indexed).
        max:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: Max records per page (server caps at 500).
        join:
          type: array
          items:
            type: string
          description: Related ORMs to expand inline (e.g. `["EmployeeObject"]`).
      example:
        search:
          s1:
            field: Id
            data: 1
            type: ge
        max: 100
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token or Deputy Permanent Token.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://once.deputy.com/my/oauth/login
          tokenUrl: https://once.deputy.com/my/oauth/access_token
          scopes:
            longlife_refresh_token: Extended session
