  /resource/TaskSetup/BULK:
    post:
      tags:
      - TaskSetup
      summary: Bulk create/update TaskSetup
      description: Accepts an array of records. Each record is processed independently.
      operationId: bulkTaskSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
