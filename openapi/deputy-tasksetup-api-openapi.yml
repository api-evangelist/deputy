openapi: 3.2.0
info:
  title: Deputy V1 Resource Task Setup API
  version: 1.0.0
  description: 'Generated, comprehensive reference for Deputy''s legacy V1 `/resource/{Object}` API.


    V1 is in maintenance mode — new integrations should prefer the V2 API. This spec covers the reflection-based routing pattern declared in `deputy-webapp/app/api/v1/routers/ResourceRouter.php`, enumerated over every ORM class registered in `DeputecApplication::$arrSystems` in `app/prepend.inc.php`.


    Resources support create/update/delete only if they also appear in `$arrSystemsAPIEditable` — read-only resources expose GET / QUERY / INFO / PREDICT / HISTORY only.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: TaskSetup
  description: Operations on the TaskSetup resource
paths:
  /resource/TaskSetup:
    get:
      tags:
      - TaskSetup
      summary: List TaskSetup records
      description: Returns TaskSetup records the authenticated caller is permitted to see. For large tables prefer POST /QUERY with pagination.
      operationId: listTaskSetup
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskSetup'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
    post:
      tags:
      - TaskSetup
      summary: Create a TaskSetup
      operationId: createTaskSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
