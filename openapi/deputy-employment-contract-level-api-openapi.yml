openapi: 3.2.0
info:
  title: Deputy V2 Employment contract level API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employment contract level
paths:
  /management/v2/compliance/level:
    post:
      operationId: EmploymentContractLevelV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelCreateResponse'
      tags:
      - Employment contract level
      summary: Create
      description: Create.
  /management/v2/compliance/level/{id}:
    get:
      operationId: EmploymentContractLevelV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelGetByIdResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Employment contract level
      summary: Get
      description: Get.
    put:
      operationId: EmploymentContractLevelV2Controller_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Employment contract level
      summary: Update
      description: Update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelUpdateDetail'
  /management/v2/compliance/level/{id}/employees:
    get:
      operationId: EmploymentContractLevelV2Controller_getEmployeesByLevelId
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelGetEmployeesByLevelIdResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      tags:
      - Employment contract level
      summary: Get employees by level ID
      description: Get employees by level ID.
  /management/v2/compliance/level:batch-save:
    post:
      operationId: EmploymentContractLevelV2Controller_batchSave
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelBatchSaveResponse'
      tags:
      - Employment contract level
      summary: Batch save
      description: Batch save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelBatchSaveRequest'
components:
  schemas:
    modelGenderType:
      type: string
      enum:
      - DEFAULT_GENDER
      - PREFER_NOT_TO_SAY
      - MALE
      - FEMALE
      - NON_BINARY
      default: DEFAULT_GENDER
    LevelGetByIdResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelContractLevel'
    LevelBatchSaveResponse:
      type: object
      properties:
        success:
          type: boolean
        requiresConfirmation:
          type: boolean
    LevelCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelContractLevel'
    LevelGetEmployeesByLevelIdResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelEmployeeProfile'
    LevelUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
    LevelUpdateDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        baseRate:
          type: number
          format: float
        exportCode:
          type: string
    LevelBatchSaveRequest:
      type: object
      properties:
        contractId:
          type: integer
          format: int64
        levels:
          type: array
          items:
            $ref: '#/components/schemas/LevelUpdateDetail'
        confirmCustomisation:
          type: boolean
      title: Endpoint responsible for updating a list of Levels, including creating/editing/deleting levels
    modelContractLevel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        levelKsuid:
          type: string
        contractId:
          type: integer
          format: int64
        baseRate:
          type: string
        crIds:
          type: array
          items:
            type: string
        exportCode:
          type: string
    v2modelEmployeeProfile:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Employee ID
        companyId:
          type: string
          format: int64
          title: Employee company ID
        firstName:
          type: string
          title: Employee first name
        lastName:
          type: string
          title: Employee last name
        displayName:
          type: string
          title: Employee display name
        contactId:
          type: string
          format: int64
          title: Employee contact
        dateOfBirth:
          type: string
          title: Employee date of birth
        gender:
          $ref: '#/components/schemas/modelGenderType'
          title: Employee gender
        userId:
          type: string
          format: int64
          title: Employee user ID
        active:
          type: boolean
          title: Employee active
        startDate:
          type: string
          title: Employee start date
        terminationDate:
          type: string
          title: Employee termination date
        role:
          type: string
          format: int64
          title: Employee role
        allowAppraisal:
          type: boolean
          title: Employee allow_appraisal
        historyId:
          type: string
          format: int64
          title: Employee history_id
        creator:
          type: string
          format: int64
          title: Employee creator
        createdAt:
          type: string
          format: date-time
          title: Timestamp of when the employee was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp of when the employee was last modified
        photoUrl:
          type: string
          title: Employee photo url
      title: Employee Profile
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
