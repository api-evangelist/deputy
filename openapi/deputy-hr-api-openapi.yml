    get:
      operationId: HrExportV2Controller_exportHrData
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrExportExportHrDataResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Hr
      security:
      - OAuth2ScopedAuthenticator: []
      summary: Export HR data
      description: Export HR data.
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /hr/v2/employees/{employeeId}/pay-details/export:
    get:
      operationId: HrExportV2Controller_exportHrPayDetailsData
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrExportExportHrPayDetailsDataResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Hr
      security:
      - OAuth2ScopedAuthenticator: []
      summary: Export HR pay details data
      description: Export HR pay details data.
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /hr/v2/onboarding/bulk-export:
    get:
      operationId: HrExportV2Controller_exportHrBulkData
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrExportExportHrBulkDataResponse'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Hr
      security:
      - OAuth2ScopedAuthenticator: []
      summary: Export HR bulk data
      description: Export HR bulk data.
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
