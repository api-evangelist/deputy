openapi: 3.2.0
info:
  title: Deputy Hr API
  version: '1.0'
  description: 'Operations tagged Hr across 2 of this provider''s published API definitions: deputy-v2-api.json, deputy-v2-scoped-api.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Hr
paths:
  /hr/v2/employees/{employeeId}/onboarding/{actionName}:
    put:
      operationId: HrOnboardingActionV2Controller_perform
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrOnboardingActionHrOnboardingActionResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: actionName
        in: path
        required: true
        schema:
          type: string
      tags:
      - Hr
      security:
      - APIToken: []
      summary: Perform
      description: Perform.
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /hr/v2/employees/{employeeId}/onboarding/export:
    get:
      operationId: HrExportV2Controller_exportHrData
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrExportExportHrDataResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Hr
      security:
      - OAuth2ScopedAuthenticator: []
      summary: Export HR data
      description: Export HR data.
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /hr/v2/employees/{employeeId}/pay-details/export:
    get:
      operationId: HrExportV2Controller_exportHrPayDetailsData
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrExportExportHrPayDetailsDataResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Hr
      security:
      - OAuth2ScopedAuthenticator: []
      summary: Export HR pay details data
      description: Export HR pay details data.
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
  /hr/v2/onboarding/bulk-export:
    get:
      operationId: HrExportV2Controller_exportHrBulkData
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrExportExportHrBulkDataResponse'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Hr
      security:
      - OAuth2ScopedAuthenticator: []
      summary: Export HR bulk data
      description: Export HR bulk data.
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
components:
  schemas:
    HrOnboardingActionHrOnboardingActionResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
    HrExportExportHrDataResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
    HrExportExportHrPayDetailsDataResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
    HrExportExportHrBulkDataResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
        cursor:
          type: integer
          format: int32
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
x-refined-from:
- deputy-v2-api.json
- deputy-v2-scoped-api.json
x-readme:
  explorer-enabled: true
  proxy-enabled: true
  samples-enabled: true
