info:
  title: Deputy Hr API
  version: '1.0'
  description: 'Operations tagged Hr across 2 of this provider''s published API definitions: deputy-v2-api-openapi.yml, deputy-v2-scoped-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Hr
paths:
  /hr/v2/employees/{employeeId}/onboarding/{actionName}:
    put:
      operationId: HrOnboardingActionV2Controller_perform
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrOnboardingActionHrOnboardingActionResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: actionName
        in: path
        required: true
        schema:
          type: string
      tags:
      - Hr
      security:
      - APIToken: []
      summary: Perform
      description: Perform.
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
          description: Your Deputy tenant subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
          description: 'Deputy region: au, eu, na, or deputy (AU default)'
