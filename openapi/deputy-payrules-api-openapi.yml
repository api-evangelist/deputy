openapi: 3.2.0
info:
  title: Deputy V1 Resource Pay Rules API
  version: 1.0.0
  description: 'Generated, comprehensive reference for Deputy''s legacy V1 `/resource/{Object}` API.


    V1 is in maintenance mode — new integrations should prefer the V2 API. This spec covers the reflection-based routing pattern declared in `deputy-webapp/app/api/v1/routers/ResourceRouter.php`, enumerated over every ORM class registered in `DeputecApplication::$arrSystems` in `app/prepend.inc.php`.


    Resources support create/update/delete only if they also appear in `$arrSystemsAPIEditable` — read-only resources expose GET / QUERY / INFO / PREDICT / HISTORY only.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: PayRules
  description: Operations on the PayRules resource
paths:
  /resource/PayRules:
    get:
      tags:
      - PayRules
      summary: List PayRules records
      description: Returns PayRules records the authenticated caller is permitted to see. For large tables prefer POST /QUERY with pagination.
      operationId: listPayRules
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayRules'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
    post:
      tags:
      - PayRules
      summary: Create a PayRules
      operationId: createPayRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRules'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayRules'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
    put:
      tags:
      - PayRules
      summary: Create a PayRules
      operationId: createOrReplacePayRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRules'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayRules'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/PayRules/INFO:
    get:
      tags:
      - PayRules
      summary: Get field metadata for PayRules
      description: Returns the field list, types, and associations for this resource. Useful when building integrations that need to know which fields are queryable.
      operationId: infoPayRules
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/PayRules/QUERY:
    post:
      tags:
      - PayRules
      summary: Search PayRules
      description: 'Flexible search endpoint. Body supports `search`, `sort`, `start`, `max`, and `join` clauses. Example: `{"search": {"s1": {"field": "Id", "data": 1, "type": "eq"}}}`.'
      operationId: searchPayRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayRules'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/PayRules/BULK:
    post:
      tags:
      - PayRules
      summary: Bulk create/update PayRules
      description: Accepts an array of records. Each record is processed independently.
      operationId: bulkPayRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PayRules'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayRules'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/PayRules/PREDICT:
    post:
      tags:
      - PayRules
      summary: Predict-match a PayRules record
      description: Returns the closest matching existing record for a partial payload. Used by upsert-style integrations to find an existing row before creating.
      operationId: predictPayRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
