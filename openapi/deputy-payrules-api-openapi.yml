components:
  schemas:
    PayRules:
      type: object
      properties:
        Id:
          type: integer
        PayTitle:
          type: string
          maxLength: 255
        RemunerationType:
          type: integer
        RemunerationBy:
          type: integer
        AnnualSalary:
          type: number
          format: double
        HourlyRate:
          type: number
          format: double
        IsMultiplier:
          type: boolean
        MultiplierValue:
          type: number
          format: double
        MultiplierBaseRate:
          type: integer
        MinimumType:
          type: integer
        MaximumType:
          type: integer
        MinimumValue:
          type: number
          format: double
        MaximumValue:
          type: number
          format: double
        MinimumShiftLength:
          type: string
        MaximumShiftLength:
          type: string
        AdvancedCalculation:
          type: string
        IsExported:
          type: boolean
        UnitValue:
          type: number
          format: double
        Schedule:
          type: integer
        RecommendWith:
          type: integer
        DexmlScript:
          type: integer
        DexmlScriptParam:
          type: string
        PeriodType:
          type: integer
        PayPortionRule:
          type: integer
        PayrollCategory:
          type: string
          maxLength: 255
        Comment:
          type: string
        RateType:
          type: integer
        RateTag:
          type: string
          maxLength: 255
        Creator:
          type: integer
        Created:
          type: string
          format: date-time
        Modified:
          type: string
        CtId:
          type: string
          maxLength: 27
        CrId:
          type: string
          maxLength: 27
        StpClass:
          type: string
          maxLength: 255
        StpCode:
          type: string
          maxLength: 10
        MultiplierBaseRateObject:
          type: object
        ScheduleObject:
          type: object
        DexmlScriptObject:
          type: object
      required:
      - Id
      - PayTitle
      - RemunerationType
      - RemunerationBy
      - IsExported
      - Modified
    QueryRequest:
      type: object
      description: V1 Resource search payload. All fields optional; an empty body returns the first page of results.
      properties:
        search:
          type: object
          description: Map of search clauses keyed by an arbitrary id (e.g. `s1`, `s2`). Each clause filters one field.
          additionalProperties:
            type: object
            required:
            - field
            - data
            - type
            properties:
              field:
                type: string
                description: Field name to filter on (e.g. `Id`, `Employee`).
              data:
                description: Comparison value. Type depends on the field.
              type:
                type: string
                description: Comparison operator.
                enum:
                - eq
                - ne
                - gt
                - lt
                - ge
                - le
                - is
                - is not
                - in
                - not in
                - starts
                - contains
        sort:
          type: object
          description: Map of field name → `asc` or `desc`.
          additionalProperties:
            type: string
            enum:
            - asc
            - desc
        start:
          type: integer
          minimum: 0
          default: 0
          description: Pagination offset (0-indexed).
        max:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: Max records per page (server caps at 500).
        join:
          type: array
          items:
            type: string
          description: Related ORMs to expand inline (e.g. `["EmployeeObject"]`).
      example:
        search:
          s1:
            field: Id
            data: 1
            type: ge
        max: 100
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token or Deputy Permanent Token.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://once.deputy.com/my/oauth/login
          tokenUrl: https://once.deputy.com/my/oauth/access_token
          scopes:
            longlife_refresh_token: Extended session
