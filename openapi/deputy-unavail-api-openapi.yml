          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api/v1
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
  /supervise/unavail/{intEmployeeId}:
    get:
      tags:
      - Unavail
      summary: GET Unavail / (:intEmployeeId)?
      operationId: supervise_unavail__intemployeeid__get
