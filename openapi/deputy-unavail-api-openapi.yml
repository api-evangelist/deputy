openapi: 3.2.0
info:
  title: Deputy Unavail API
  version: 1.0.0
  description: 'Operations tagged Unavail across 2 of this provider''s published API definitions: deputy-openapi.json, deputy-v1-supervise-api.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
tags:
- name: Unavail
  description: V1 /my/unavail/* endpoints
paths:
  /my/unavail:
    post:
      tags:
      - Unavail
      summary: Create or update Unavail
      operationId: my_unavail__post
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api/v1
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
  /my/unavail/{startDate}/{endDate}:
    get:
      tags:
      - Unavail
      summary: GET Unavail / )?(:endDate)?
      operationId: my_unavail__startdate_enddate__get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: startDate
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9]{2,4}\-[0-9]{1,2}\-[0-9]{1,2}'
      - name: endDate
        in: path
        required: true
        schema:
          type: string
          pattern: '[0-9]{2,4}\-[0-9]{1,2}\-[0-9]{1,2}'
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api/v1
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
  /my/unavail/{unavailId}:
    put:
      tags:
      - Unavail
      summary: PUT Unavail / :unavailId
      operationId: my_unavail__unavailid_put
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: unavailId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
    delete:
      tags:
      - Unavail
      summary: DELETE Unavail / :unavailId
      operationId: my_unavail__unavailid_delete
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
      parameters:
      - name: unavailId
        in: path
        required: true
        schema:
          type: integer
          pattern: \d+
    servers:
    - url: https://{subdomain}.{region}.deputy.com/api/v1
      description: Deputy tenant
      variables:
        subdomain:
          default: your-subdomain
        region:
          default: deputy
          enum:
          - au
          - eu
          - na
          - deputy
  /supervise/unavail:
