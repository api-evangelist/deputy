openapi: 3.2.0
info:
  title: Deputy V2 Shifts API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Shifts
paths:
  /management/v2/shifts:
    get:
      summary: Retrieve list of shifts
      operationId: ScheduleShiftV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftListResponse'
      parameters:
      - name: start
        description: 'Filters shifts starting at or after this time. Format: ISO8601 datetime (e.g., "2023-03-11T13:45:00+11:00"). Default: 7 days ago from today.'
        in: query
        required: false
        schema:
          type: string
      - name: end
        description: 'Filters shifts starting before this time (exclusive). Format: ISO8601 datetime (e.g., "2023-03-11T18:45:00+11:00"). Default: today at 00:00:00.'
        in: query
        required: false
        schema:
          type: string
      - name: employee
        description: Mandatory field. Filters shifts for a specific employee ID.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: timesheet
        description: Not implemented.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: published
        description: "Filters shifts by published status (PUBLISHED, UNPUBLISHED, etc.).\n\n - NOT_SPECIFIED: Not specified\n - TRUE: Published\n - ALL: Both published and unpublished\n - FALSE: Unpublished only"
        in: query
        required: false
        schema:
          type: string
          enum:
          - NOT_SPECIFIED
          - 'TRUE'
          - ALL
          - 'FALSE'
          default: NOT_SPECIFIED
      - name: cursor
        description: Pagination cursor from a previous response. Used to fetch the next page of results.
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: Maximum number of shifts to return in a single response. Used for pagination.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: expandMetadata
        description: If true, includes additional metadata such as custom field definitions.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Shifts
      description: Retrieve list of shifts.
    post:
      summary: Create a new shift
      description: Creates a new shift with the provided data. This is a synchronous API that returns the created shift immediately upon completion. The shift must include required fields such as start/end times, employee and area. Optional override settings can be provided to bypass normal validation rules.
      operationId: ScheduleShiftV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftCreateResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestCreateData'
  /management/v2/shifts/bids:status:
    post:
      summary: decline a shift
      operationId: ScheduleShiftV2Controller_declineShift
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftDeclineShiftResponse'
      tags:
      - Shifts
      description: decline a shift.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftDeclineShiftRequestData'
  /management/v2/shifts/copy/job/{jobId}:
    get:
      summary: Get copy status
      description: Gets the status of a copy operation. The copy status includes information about the copy operation such as the number of shifts copied, the number of shifts failed to copy, and the number of shifts pending copy.
      operationId: ScheduleShiftV2Controller_getCopyStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftCopyStatusResponse'
      parameters:
      - name: jobId
        description: The job ID returned from the copy operation.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Shifts
  /management/v2/shifts/open/pending-approvals:
    post:
      summary: Get pending approval open shifts
      description: Retrieves open shifts that are pending approval. Returns shifts along with their associated bids and metadata. Supports filtering by location mode, date range, and pagination. Can return count-only results for performance.
      operationId: ScheduleShiftV2Controller_getPendingApprovalOpenShifts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftOpenShiftPendingApprovalsResponse'
      parameters:
      - name: countOnly
        description: 'DEPRECATED: This field is ignored. Full data is always returned regardless of this value.'
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftOpenShiftPendingApprovalsRequestData'
  /management/v2/shifts/{id}:
    get:
      summary: Retrieve shift data by given Id
      operationId: ScheduleShiftV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftGetResponse'
      parameters:
      - name: id
        description: The ID of the shift to retrieve.
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: expandMetadata
        description: If true, includes additional metadata such as locations, areas, and employee profiles.
        in: query
        required: false
        schema:
          type: boolean
      - name: viewContext
        description: "Determines the context of the viewer, affecting what data is returned and permissions checked.\n\n - EMPLOYEE: Employee context - returns data visible as an employee.\n - MANAGER: Manager context - returns full manager-level data and permissions."
        in: query
        required: false
        schema:
          type: string
          enum:
          - EMPLOYEE
          - MANAGER
          default: EMPLOYEE
      tags:
      - Shifts
      description: Retrieve shift data by given Id.
    delete:
      summary: Delete an existing shift
      operationId: ScheduleShiftV2Controller_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Shifts
      description: Delete an existing shift.
    put:
      summary: Update an existing shift
      operationId: ScheduleShiftV2Controller_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Shifts
      description: Update an existing shift.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequestUpdateData'
  /management/v2/shifts/{id}/bids:statusCounts:
    get:
      summary: get the bid count for each status
      operationId: ScheduleShiftV2Controller_getBidsStatusCounts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftGetBidsStatusCountsResponse'
      parameters:
      - name: id
        description: The ID of the shift to retrieve.
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: expandMetadata
        description: If true, includes additional metadata such as locations, areas, and employee profiles.
        in: query
        required: false
        schema:
          type: boolean
      - name: viewContext
        description: "Determines the context of the viewer, affecting what data is returned and permissions checked.\n\n - EMPLOYEE: Employee context - returns data visible as an employee.\n - MANAGER: Manager context - returns full manager-level data and permissions."
        in: query
        required: false
        schema:
          type: string
          enum:
          - EMPLOYEE
          - MANAGER
          default: EMPLOYEE
      tags:
      - Shifts
      description: get the bid count for each status.
  /management/v2/shifts/{id}/history:
    get:
      summary: Get shift history
      operationId: ScheduleShiftV2Controller_history
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftHistoryResponse'
      parameters:
      - name: id
        description: The ID of the shift to retrieve.
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: expandMetadata
        description: If true, includes additional metadata such as locations, areas, and employee profiles.
        in: query
        required: false
        schema:
          type: boolean
      - name: viewContext
        description: "Determines the context of the viewer, affecting what data is returned and permissions checked.\n\n - EMPLOYEE: Employee context - returns data visible as an employee.\n - MANAGER: Manager context - returns full manager-level data and permissions."
        in: query
        required: false
        schema:
          type: string
          enum:
          - EMPLOYEE
          - MANAGER
          default: EMPLOYEE
      tags:
      - Shifts
      description: Get shift history.
  /management/v2/shifts/{id}/log:
    get:
      summary: Get shift log new
      operationId: ScheduleShiftV2Controller_log
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftLogResponse'
      parameters:
      - name: id
        description: The ID of the shift to retrieve.
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: expandMetadata
        description: If true, includes additional metadata such as locations, areas, and employee profiles.
        in: query
        required: false
        schema:
          type: boolean
      - name: viewContext
        description: "Determines the context of the viewer, affecting what data is returned and permissions checked.\n\n - EMPLOYEE: Employee context - returns data visible as an employee.\n - MANAGER: Manager context - returns full manager-level data and permissions."
        in: query
        required: false
        schema:
          type: string
          enum:
          - EMPLOYEE
          - MANAGER
          default: EMPLOYEE
      tags:
      - Shifts
      description: Get shift log new.
  /management/v2/shifts/{id}/open:deleteInvitations:
    post:
      summary: delete open shift invitations
      operationId: ScheduleShiftV2Controller_deleteOpenInvitations
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftDeleteOpenInvitationsResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Shifts
      description: delete open shift invitations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftDeleteOpenInvitationsRequestData'
  /management/v2/shifts/{id}/open:invitations:
    get:
      summary: get open shift invitation list
      operationId: ScheduleShiftV2Controller_getOpenInvitations
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftGetOpenInvitationsResponse'
      parameters:
      - name: id
        description: The ID of the shift to retrieve.
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: expandMetadata
        description: If true, includes additional metadata such as locations, areas, and employee profiles.
        in: query
        required: false
        schema:
          type: boolean
      - name: viewContext
        description: "Determines the context of the viewer, affecting what data is returned and permissions checked.\n\n - EMPLOYEE: Employee context - returns data visible as an employee.\n - MANAGER: Manager context - returns full manager-level data and permissions."
        in: query
        required: false
        schema:
          type: string
          enum:
          - EMPLOYEE
          - MANAGER
          default: EMPLOYEE
      tags:
      - Shifts
      description: get open shift invitation list.
  /management/v2/shifts/{id}/open:status:
    post:
      summary: Accept/decline an open shift
      operationId: ScheduleShiftV2Controller_updateOpenShiftStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftUpdateOpenShiftStatusResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Shifts
      description: Accept/decline an open shift.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftUpdateOpenShiftStatusRequestData'
  /management/v2/shifts/{id}/open:statusCounts:
    get:
      summary: get count for each status in find replacement, open shift
      operationId: ScheduleShiftV2Controller_getOpenStatusCounts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftGetOpenStatusCountsResponse'
      parameters:
      - name: id
        description: The ID of the shift to retrieve.
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: expandMetadata
        description: If true, includes additional metadata such as locations, areas, and employee profiles.
        in: query
        required: false
        schema:
          type: boolean
      - name: viewContext
        description: "Determines the context of the viewer, affecting what data is returned and permissions checked.\n\n - EMPLOYEE: Employee context - returns data visible as an employee.\n - MANAGER: Manager context - returns full manager-level data and permissions."
        in: query
        required: false
        schema:
          type: string
          enum:
          - EMPLOYEE
          - MANAGER
          default: EMPLOYEE
      tags:
      - Shifts
      description: get count for each status in find replacement, open shift.
  /management/v2/shifts/{id}/permissions:
    get:
      summary: Get shift permissions
      description: Gets the permissions for a shift. The permissions include information about the permissions such as the ability to offer, swap, and cancel the shift.
      operationId: ScheduleShiftV2Controller_getPermissions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftShiftPermissionResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Shifts
  /management/v2/shifts/{id}/suggestions:
    post:
      summary: Get suggestions for a shift
      operationId: ScheduleShiftV2Controller_suggest
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftSuggestResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Shifts
      description: Get suggestions for a shift.
  /management/v2/shifts/{id}:calculateCost:
    post:
      summary: Get potential costs for a shift given a list of employee ids
      operationId: ScheduleShiftV2Controller_cost
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftCostResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Shifts
      description: Get potential costs for a shift given a list of employee ids.
  /management/v2/shifts:aggregated:
    get:
      summary: Retrieve an aggregated list of shifts
      operationId: ScheduleShiftV2Controller_aggregatedList
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftAggregatedListResponse'
      parameters:
      - name: start
        description: Filters shifts starting at/after start e.g. 2023-03-11T13:45:00, default -7 days from today.
        in: query
        required: false
        schema:
          type: string
      - name: end
        description: Filters shift starting before end exclusively e.g. 2023-03-11T18:45:00, default today at 00:00:00.
        in: query
        required: false
        schema:
          type: string
      - name: employee
        description: Filters shifts for an employee ID.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: timesheet
        description: Filters shifts for matched or unmatched timesheet.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: published
        description: "Filters shifts for published status.\n\n - NOT_SPECIFIED: Not specified\n - TRUE: Published\n - ALL: Both published and unpublished\n - FALSE: Unpublished only"
        in: query
        required: false
        schema:
          type: string
          enum:
          - NOT_SPECIFIED
          - 'TRUE'
          - ALL
          - 'FALSE'
          default: NOT_SPECIFIED
      - name: frequency
        description: Aggregation frequency.
        in: query
        required: false
        schema:
          type: string
          enum:
          - DAILY
          - WEEKLY
          default: DAILY
      - name: omitEmptyPeriod
        description: Omit empty periods in response array.
        in: query
        required: false
        schema:
          type: boolean
      - name: expandMetadata
        description: If true, includes additional metadata such as custom field definitions and more.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Shifts
      description: Retrieve an aggregated list of shifts.
  /management/v2/shifts:autobuild:
    post:
      summary: Auto-build shifts (Asynchronous)
      description: Automatically builds shifts based on historical patterns for specified areas and date range. Analyses past shift data to generate optimal shift templates. Returns immediately with operation ID for tracking. Use /operations/v2/operations/{id} to poll for completion.
      operationId: AutoBuildV2Controller_autobuild
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoBuildAutobuildResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoBuildAutobuildRequestData'
  /management/v2/shifts:autofill:
    post:
      summary: Auto-fill shifts (Asynchronous)
      description: Automatically assigns employees to open shifts using genetic algorithm optimization. Optimizes for cost, workload equality, coverage, and full-time hours. Returns immediately with operation ID for tracking. Use /operations/v2/operations/{id} to poll for completion.
      operationId: ScheduleShiftV2Controller_autofill
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftAutofillResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftAutofillRequestData'
  /management/v2/shifts:bulk:
    post:
      summary: Bulk create or update shifts (asynchronous)
      description: Creates or updates multiple shifts in bulk. This is an asynchronous API that returns immediately with an operation ID in the response metadata.operation.id field. Shifts without an ID will be created, while shifts with an ID will be updated. Use the operation ID to poll the /operations/v2/operations/{id} endpoint to check completion status. The operation processes upserts in the background. External IDs can be provided to track shifts from external systems. Optional override settings can bypass normal validation rules.
      operationId: ScheduleShiftV2Controller_bulkUpsert
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftBulkUpsertResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftBulkUpsertRequestUpsertData'
  /management/v2/shifts:bulkDefaults:
    post:
      summary: Get default shifts for many dates and areas
      description: Returns a default shift skeleton for every (date, area) combination in the request. Each item carries its own success flag so a single invalid input does not fail the whole call.
      operationId: ScheduleShiftV2Controller_bulkDefaults
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftBulkDefaultShiftResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDefaultShiftRequestBulkDefaultShiftRequestData'
  /management/v2/shifts:bulkDelete:
    post:
      summary: Bulk delete shifts (asynchronous)
      description: Deletes multiple shifts in bulk. This is an asynchronous API that returns immediately with an operation ID in the response metadata.operation.id field. Use the operation ID to poll the /operations/v2/operations/{id} endpoint to check completion status. The operation processes deletions in the background. Failed deletions will be reported in the operation status. Optional compliance overrides can be provided to bypass normal validation rules.
      operationId: ScheduleShiftV2Controller_bulkDelete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftBulkDeleteResponse'
      tags:
      - Shifts
  /management/v2/shifts:bulkPatch:
    post:
      summary: Bulk patch shifts (asynchronous)
      description: Partially updates multiple shifts in bulk using a patch mask. Only fields specified in the patchMask array will be updated. This is an asynchronous API that returns immediately with an operation ID in the response metadata.operation.id field. Use the operation ID to poll the /operations/v2/operations/{id} endpoint to check completion status. The operation processes patches in the background. Currently supports updating employee assignment and open shift status.
      operationId: ScheduleShiftV2Controller_bulkPatch
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftBulkPatchResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftBulkPatchRequest'
  /management/v2/shifts:bulkUpdate:
    post:
      summary: Bulk update shifts (asynchronous)
      description: Updates multiple shifts in bulk with field-level updates. Only fields specified in the fieldMasks array will be updated. This is an asynchronous API that returns immediately with an operation ID in the response metadata.operation.id field. Use the operation ID to poll the /operations/v2/operations/{id} endpoint to check completion status. The operation processes updates in the background.
      operationId: ScheduleShiftV2Controller_bulkUpdate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftBulkUpdateResponse'
      parameters:
      - name: fieldMasks
        description: Array of field masks specifying which fields should be updated. Only fields listed here will be modified.
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - EMPLOYEE
            - START
            - END
            - MEAL_BREAK
            - REST_BREAK
            - AREA
            - COMMENT
            - PUBLISH
            - OPEN
            - APPROVAL_REQUIRED
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftBulkUpdateRequestData'
  /management/v2/shifts:copy:
    post:
      summary: Copy shifts (asynchronous)
      description: 'Copies shifts to new target dates. Supports two patterns: 1) Copy by date range and areas, 2) Copy specific shift IDs. This is an asynchronous API that returns immediately with a job ID in the response data.jobId field. Use the job ID to poll the /management/v2/shifts/copy/job/{jobId} endpoint to check completion status and retrieve results. The operation processes copying in the background.'
      operationId: ScheduleShiftV2Controller_copy
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftCopyResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyRequestCopyRequestData'
  /management/v2/shifts:defaults:
    post:
      summary: Get default shifts
      description: Gets default shift skeleton object for a given date, start time, end time, and area. This is a synchronous API that returns the default shift immediately with correct breaks depending on area and shift templates. The shifts must include required fields such as start/end times, employee assignment, and area.
      operationId: ScheduleShiftV2Controller_defaults
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftDefaultShiftResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultShiftRequestDefaultShiftRequestData'
  /management/v2/shifts:delete:
    post:
      summary: Delete shift
      operationId: ScheduleShiftV2Controller_deleteWithParams
      responses:
        '200':
