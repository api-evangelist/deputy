      - Shifts
      description: Delete shift.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftDeleteShiftRequestDeleteData'
  /management/v2/shifts:getRosters:
    post:
      summary: manager to get rosters; replacement of v1 getRosters
      operationId: ScheduleShiftV2Controller_getRosters
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftListShiftResponse'
      tags:
      - Shifts
      description: manager to get rosters; replacement of v1 getRosters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRostersRequestgetRostersRequestData'
  /management/v2/shifts:link:
    post:
      summary: Link shifts
      description: Links two shifts together. This is a synchronous API that returns the linked shift immediately upon completion. The newShift must include required fields such as start/end times, employee assignment, and area. Optional override settings can be provided to bypass normal validation rules.
      operationId: ScheduleShiftV2Controller_link
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftLinkShiftResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelLinkShiftRequestData'
  /management/v2/shifts:open:
    post:
      operationId: ScheduleShiftV2Controller_getOpenShifts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftGetOpenShiftsResponse'
      tags:
      - Shifts
      summary: Get open shifts
      description: Get open shifts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftGetOpenShiftsRequestData'
  /management/v2/shifts:publish:
    post:
      summary: Publish shifts (asynchronous)
      description: Publishes shifts to make them visible to employees and optionally sends notifications. This is an asynchronous API that returns immediately with an operation ID in the response metadata.operation.operationId field. Use the operation ID to poll the /operations/v2/operations/{id} endpoint to check completion status. The publish operation marks shifts as published and sends notifications based on the specified notification mode.
      operationId: ScheduleShiftV2Controller_publish
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftPublishResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequestPublishData'
  /management/v2/shifts:resave:
    post:
      summary: Resave shifts (Asynchronous)
      description: Resaves shifts. This is a asynchronous API that returns the shifts scheduled to be resaved in the response. The operation processes resaves in the background. Currently, it doesn't return the operation status, but this should be updated.
      operationId: ScheduleShiftV2Controller_resave
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftResaveResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftResaveRequestData'
  /management/v2/shifts:split:
    post:
      description: Split a shift into multiple shifts
      operationId: ScheduleShiftV2Controller_split
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftSplitShiftResponse'
      tags:
      - Shifts
      summary: Split
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleShiftSplitShiftRequestData'
  /management/v2/shifts:validate:
    post:
      summary: Validate external shifts
      operationId: ScheduleShiftV2Controller_validateExternalShifts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftValidateExternalShiftsResponse'
      tags:
      - Shifts
      description: Validate external shifts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateExternalShiftsRequestValidateExternalShiftsData'
  /schedule/v2/me/shifts:search:
    post:
      summary: My schedule
      description: Gets the schedule for the current user. The schedule includes information about the shifts for the current user such as the shifts, the bids, and the metadata.
      operationId: ScheduleShiftV2Controller_mySchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleShiftListShiftResponse'
      tags:
      - Shifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListShiftRequestListShiftRequestData'
