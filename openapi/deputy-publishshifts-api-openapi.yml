openapi: 3.2.0
info:
  title: Deputy V2 Publish Shifts API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: PublishShifts
paths:
  /management/v2/shifts-publishing/resume/{jobId}:
    get:
      operationId: PublishShiftV2Controller_resume
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelPublishingStatus'
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
      tags:
      - PublishShifts
      summary: Resume
      description: Resume.
  /management/v2/shifts-publishing/status/{jobId}:
    get:
      summary: Request status
      operationId: PublishShiftV2Controller_status
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelPublishingStatus'
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
      tags:
      - PublishShifts
      description: Request status.
  /management/v2/shifts/publish/preview:
    post:
      summary: Get preview of shifts to be published
      description: Returns all areas with unpublished shifts (including micro shifts) for the specified date range and locations
      operationId: PublishShiftV2Controller_preview
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishPreviewPublishPreviewResponse'
      tags:
      - PublishShifts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishPreviewPreviewRequest'
components:
  schemas:
    PublishPreviewPublishPreviewResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PublishPreviewPublishPreviewData'
    PublishPreviewPublishPreviewData:
      type: object
      properties:
        microShiftsCount:
          type: integer
          format: int32
        totalShiftsCount:
          type: integer
          format: int32
        shiftsRequiringConsentCount:
          type: integer
          format: int32
        locations:
          type: array
          items:
            $ref: '#/components/schemas/PublishPreviewLocationPreview'
    LocationMode:
      type: string
      enum:
      - ALL
      - SELECTED
      default: ALL
      description: "LocationMode specifies how location filtering should be applied.\n\n - ALL: Include all locations accessible by the current user (no filtering)\n - SELECTED: Filter to only selected locations (requires locationIds to be provided)"
    PublishPreviewPreviewRequest:
      type: object
      properties:
        locationIds:
          type: array
          items:
            type: integer
            format: int32
        locationMode:
          $ref: '#/components/schemas/LocationMode'
        startDate:
          type: string
        endDate:
          type: string
        status:
          $ref: '#/components/schemas/PublishPreviewPublishPreviewStatus'
    tenantschedulev2modelProgress:
      type: object
      properties:
        items:
          type: integer
          format: int32
        processed:
          type: integer
          format: int32
    modelPublishingStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/modelPublishingStatusStatus'
        currentStage:
          type: integer
          format: int32
        totalStages:
          type: integer
          format: int32
        currentStageName:
          type: string
        progress:
          $ref: '#/components/schemas/tenantschedulev2modelProgress'
        errors:
          type: object
          additionalProperties:
            type: string
        HardBlock:
          type: boolean
        isResumable:
          type: boolean
    PublishPreviewPublishPreviewStatus:
      type: string
      enum:
      - UNPUBLISHED
      - ALL
      default: UNPUBLISHED
    modelPublishingStatusStatus:
      type: string
      enum:
      - NOT_STARTED
      - PAUSED
      - IN_PROGRESS
      - FINISHED
      default: NOT_STARTED
    PublishPreviewLocationPreview:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
        locationName:
          type: string
        areas:
          type: array
          items:
            $ref: '#/components/schemas/PublishPreviewAreaPreview'
    PublishPreviewAreaPreview:
      type: object
      properties:
        areaId:
          type: integer
          format: int32
        areaName:
          type: string
        shiftIds:
          type: array
          items:
            type: integer
            format: int32
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
