openapi: 3.2.0
info:
  title: Deputy V2 Payroll User Authorization Code API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Payroll User Authorization Code
paths:
  /management/v2/oauth/partner/{partner}/user-authorization-code:
    get:
      operationId: PayrollPartnerAuthorizationCodeV2Controller_generateAuthorizationCodeForPayrollUser
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationCodeGenerateAuthorizationCodeForPartnerUserResponse'
      parameters:
      - name: partner
        in: path
        required: true
        schema:
          type: string
      tags:
      - Payroll User Authorization Code
      summary: Generate authorization code for payroll user
      description: Generate authorization code for payroll user.
components:
  schemas:
    AuthorizationCodeGenerateAuthorizationCodeForPartnerUserResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelGenerateAuthorizationCodeForPartnerUserResponseData'
    modelGenerateAuthorizationCodeForPartnerUserResponseData:
      type: object
      properties:
        code:
          type: string
          title: OAuth code for the payroll user
      title: Get Authorization Code for Payroll User Response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
