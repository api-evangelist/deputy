openapi: 3.2.0
info:
  title: Deputy V2 Leave Location Settings API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Location Settings
paths:
  /management/v2/leave-location-settings/{locationId}:
    get:
      summary: Get Leave Location Settings
      operationId: LeaveLocationSettingsV2Controller_GetLeaveLocationSettings
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveLocationSettingsGetLeaveLocationSettingsResponse'
      parameters:
      - name: locationId
        description: Location ID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Leave Location Settings
      description: Get Leave Location Settings.
components:
  schemas:
    LeaveLocationSettingsGetLeaveLocationSettingsResponse:
      type: object
      properties:
        shouldDefaultClosedDaysToNonWorkingDays:
          type: boolean
        shouldDefaultPublicHolidaysToNonWorkingDays:
          type: boolean
        operatingHours:
          type: array
          items:
            $ref: '#/components/schemas/modelOperatingHours'
      title: Get LeaveLocationSettings response
    modelOperatingHoursDayOfWeek:
      type: string
      enum:
      - UNKNOWN
      - SUNDAY
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
      default: UNKNOWN
      title: Define an enum for days of the week
    modelOperatingHours:
      type: object
      properties:
        day:
          $ref: '#/components/schemas/modelOperatingHoursDayOfWeek'
        startTime:
          type: string
          title: The format of startTime is HH:MM
        endTime:
          type: string
          title: The format of endTime is HH:MM
      title: Leave Operating Hours
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
