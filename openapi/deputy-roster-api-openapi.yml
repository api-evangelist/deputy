openapi: 3.2.0
info:
  title: Deputy Roster API
  version: '1.0'
  description: 'Operations tagged Roster across 4 of this provider''s published API definitions: deputy-openapi.json, deputy-v1-resource-api.json, deputy-v1-supervise-api.json, deputy-v2-api.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
