          type: string
          maxLength: 255
        Published:
          type: boolean
        MatchedByTimesheet:
          type: integer
        CustomFieldData:
          type: integer
        Open:
          type: boolean
        ApprovalRequired:
          type: boolean
        ConfirmStatus:
          type: integer
        ConfirmComment:
          type: string
          maxLength: 255
        ConfirmBy:
          type: integer
        ConfirmTime:
          type: integer
        SwapStatus:
          type: integer
        SwapManageBy:
          type: integer
        ShiftTemplate:
          type: integer
        ConnectStatus:
          type: integer
        ParentId:
          type: integer
        Creator:
          type: integer
        Created:
          type: string
          format: date-time
        Modified:
          type: string
        OperationalUnitObject:
          type: object
        EmployeeObject:
          type: object
        MatchedByTimesheetObject:
          type: object
        CustomFieldDataObject:
          type: object
        ConfirmByObject:
          type: object
        SwapManageByObject:
          type: object
        ShiftTemplateObject:
          type: object
        Parent:
          type: object
        DirtyDeputecRosterLiveStateAsRoster:
          type: boolean
      required:
      - Id
      - StartTime
      - EndTime
      - Modified
    QueryRequest:
      type: object
      description: V1 Resource search payload. All fields optional; an empty body returns the first page of results.
      properties:
        search:
          type: object
          description: Map of search clauses keyed by an arbitrary id (e.g. `s1`, `s2`). Each clause filters one field.
          additionalProperties:
            type: object
            required:
            - field
            - data
            - type
            properties:
              field:
                type: string
                description: Field name to filter on (e.g. `Id`, `Employee`).
              data:
                description: Comparison value. Type depends on the field.
              type:
                type: string
                description: Comparison operator.
                enum:
                - eq
                - ne
                - gt
                - lt
                - ge
                - le
                - is
                - is not
                - in
                - not in
                - starts
                - contains
        sort:
          type: object
          description: Map of field name → `asc` or `desc`.
          additionalProperties:
            type: string
            enum:
            - asc
            - desc
        start:
          type: integer
          minimum: 0
          default: 0
          description: Pagination offset (0-indexed).
        max:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: Max records per page (server caps at 500).
        join:
          type: array
          items:
            type: string
          description: Related ORMs to expand inline (e.g. `["EmployeeObject"]`).
      example:
        search:
          s1:
            field: Id
            data: 1
            type: ge
        max: 100
    modelRoster:
      type: object
      properties:
        id:
          type: integer
          format: int32
        date:
          type: string
          title: Date in YYYY-MM-DD format e.g. "2025-10-31"
        startTime:
          type: string
          format: int64
          title: unix timestamp
        endTime:
          type: string
          format: int64
          title: unix timestamp
        mealbreakDuration:
          type: string
        mealbreakSlots:
          type: string
        note:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/RosterChildRoster'
        area:
          $ref: '#/components/schemas/tenanttsav2modelArea'
    tenanttsav2modelArea:
      type: object
      properties:
