openapi: 3.2.0
info:
  title: Deputy V1 Resource Employment Contract API
  version: 1.0.0
  description: 'Generated, comprehensive reference for Deputy''s legacy V1 `/resource/{Object}` API.


    V1 is in maintenance mode — new integrations should prefer the V2 API. This spec covers the reflection-based routing pattern declared in `deputy-webapp/app/api/v1/routers/ResourceRouter.php`, enumerated over every ORM class registered in `DeputecApplication::$arrSystems` in `app/prepend.inc.php`.


    Resources support create/update/delete only if they also appear in `$arrSystemsAPIEditable` — read-only resources expose GET / QUERY / INFO / PREDICT / HISTORY only.'
servers:
- url: https://{subdomain}.{region}.deputy.com/api/v1
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
security:
- BearerAuth: []
- OAuth2: []
tags:
- name: EmploymentContract
  description: Operations on the EmploymentContract resource
paths:
  /resource/EmploymentContract:
    get:
      tags:
      - EmploymentContract
      summary: List EmploymentContract records
      description: Returns EmploymentContract records the authenticated caller is permitted to see. For large tables prefer POST /QUERY with pagination.
      operationId: listEmploymentContract
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmploymentContract'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
    post:
      tags:
      - EmploymentContract
      summary: Create a EmploymentContract
      operationId: createEmploymentContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentContract'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentContract'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
    put:
      tags:
      - EmploymentContract
      summary: Create a EmploymentContract
      operationId: createOrReplaceEmploymentContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentContract'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentContract'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentContract/INFO:
    get:
      tags:
      - EmploymentContract
      summary: Get field metadata for EmploymentContract
      description: Returns the field list, types, and associations for this resource. Useful when building integrations that need to know which fields are queryable.
      operationId: infoEmploymentContract
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentContract/QUERY:
    post:
      tags:
      - EmploymentContract
      summary: Search EmploymentContract
      description: 'Flexible search endpoint. Body supports `search`, `sort`, `start`, `max`, and `join` clauses. Example: `{"search": {"s1": {"field": "Id", "data": 1, "type": "eq"}}}`.'
      operationId: searchEmploymentContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmploymentContract'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentContract/BULK:
    post:
      tags:
      - EmploymentContract
      summary: Bulk create/update EmploymentContract
      description: Accepts an array of records. Each record is processed independently.
      operationId: bulkEmploymentContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EmploymentContract'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmploymentContract'
        '400':
          description: Bad request
        '401':
          description: Authentication required or invalid token
        '403':
          description: Forbidden — token lacks access to this resource
        '404':
          description: Resource not found
  /resource/EmploymentContract/PREDICT:
    post:
      tags:
      - EmploymentContract
      summary: Predict-match a EmploymentContract record
      description: Returns the closest matching existing record for a partial payload. Used by upsert-style integrations to find an existing row before creating.
      operationId: predictEmploymentContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentContract'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
