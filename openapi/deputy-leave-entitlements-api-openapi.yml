openapi: 3.2.0
info:
  title: Deputy V2 Leave Entitlements API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Leave Entitlements
paths:
  /management/v2/leave-entitlements/employees/{employeeId}:
    get:
      summary: Get employee leave entitlements
      operationId: LeaveEntitlementsV2Controller_GetEmployeeLeaveEntitlements
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveEntitlementsGetEmployeeLeaveEntitlementsResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: skipPermission
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Leave Entitlements
      description: Get employee leave entitlements.
  /management/v2/leave-entitlements:bulk-add-multiple:
    post:
      operationId: LeaveEntitlementsV2Controller_AddLeaveEntitlementsToEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveEntitlementsLeaveEntitlementsBulkActionResponse'
      tags:
      - Leave Entitlements
      summary: Add leave entitlements to employees
      description: Add leave entitlements to employees.
  /management/v2/leave-entitlements:bulk-remove:
    post:
      operationId: LeaveEntitlementsV2Controller_RemoveLeaveEntitlementsFromEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveEntitlementsLeaveEntitlementsBulkActionResponse'
      tags:
      - Leave Entitlements
      summary: Remove leave entitlements from employees
      description: Remove leave entitlements from employees.
  /management/v2/leave-entitlements:bulk-set:
    post:
      operationId: LeaveEntitlementsV2Controller_SetLeaveEntitlementsByEmployees
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveEntitlementsLeaveEntitlementsBulkActionResponse'
      tags:
      - Leave Entitlements
      summary: Set leave entitlements by employees
      description: Set leave entitlements by employees.
components:
  schemas:
    v2modelLeaveEntitlements:
      type: object
      properties:
        leaveRuleIds:
          type: array
          items:
            type: integer
            format: int32
      title: Leave Entitlements
    LeaveEntitlementsGetEmployeeLeaveEntitlementsResponse:
      type: object
      properties:
        success:
          type: boolean
        leaveEntitlements:
          $ref: '#/components/schemas/v2modelLeaveEntitlements'
      title: Get employee leave entitlements response
    LeaveEntitlementsLeaveEntitlementsBulkActionResponse:
      type: object
      properties:
        success:
          type: boolean
        updatedEmployeeIds:
          type: array
          items:
            type: integer
            format: int32
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
