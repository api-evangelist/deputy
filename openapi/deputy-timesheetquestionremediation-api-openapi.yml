openapi: 3.2.0
info:
  title: Deputy V2 Timesheet Question Remediation API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: TimesheetQuestionRemediation
paths:
  /timesheet-question-remediation/v2/data-pack:
    get:
      summary: Get the presigned URL for timesheet question remediation data pack CSV file
      operationId: TimesheetQuestionRemediationV2Controller_getDataPack
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetQuestionRemediationGetDataPackResponse'
      tags:
      - TimesheetQuestionRemediation
      description: Get the presigned URL for timesheet question remediation data pack CSV file.
  /timesheet-question-remediation/v2/recalculation:
    post:
      summary: Trigger Timesheet Question Remediation Pay Recalculation
      description: Triggers pay recalculation for timesheet shift questions that require remediation.
      operationId: TimesheetQuestionRemediationV2Controller_TriggerTimesheetQuestionRemediationPayRecalculation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetQuestionRemediationTriggerTimesheetQuestionRemediationPayRecalculationResponse'
      tags:
      - TimesheetQuestionRemediation
  /timesheet-question-remediation/v2/status:
    get:
      summary: Get Timesheet Question Remediation Status
      description: Retrieves the current status of the timesheet question remediation process.
      operationId: TimesheetQuestionRemediationV2Controller_GetTimesheetQuestionRemediationStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetQuestionRemediationGetTimesheetQuestionRemediationStatusResponse'
      tags:
      - TimesheetQuestionRemediation
components:
  schemas:
    modelTimesheetQuestionRemediationStatus:
      type: object
      properties:
        statusCode:
          $ref: '#/components/schemas/TimesheetQuestionRemediationStatusTimesheetQuestionRemediationStatusCode'
        jobId:
          type: string
    TimesheetQuestionRemediationGetTimesheetQuestionRemediationStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelTimesheetQuestionRemediationStatus'
    TimesheetQuestionRemediationGetDataPackResponse:
      type: object
      properties:
        url:
          type: string
    TimesheetQuestionRemediationStatusTimesheetQuestionRemediationStatusCode:
      type: string
      enum:
      - STATUS_UNKNOWN
      - NOT_ELIGIBLE
      - NOT_STARTED
      - RUNNING
      - COMPLETED
      - FAILED
      default: STATUS_UNKNOWN
    TimesheetQuestionRemediationTriggerTimesheetQuestionRemediationPayRecalculationResponse:
      type: object
      properties:
        success:
          type: boolean
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
