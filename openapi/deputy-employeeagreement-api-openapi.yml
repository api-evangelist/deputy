components:
  schemas:
    EmployeeAgreement:
      type: object
      properties:
        Id:
          type: integer
        EmployeeId:
          type: integer
        PayPoint:
          type: integer
        EmpType:
          type: integer
        CompanyName:
          type: string
          maxLength: 32
        Active:
          type: boolean
        StartDate:
          type: string
          format: date-time
        EndDate:
          type: string
          format: date-time
        EffectiveDate:
          type: string
          format: date-time
        Contract:
          type: integer
        SalaryPayRule:
          type: integer
        ContractFile:
          type: integer
        PayrollId:
          type: string
          maxLength: 64
        PayPeriod:
          type: integer
        PayCalendarId:
          type: integer
        HistoryId:
          type: integer
        Creator:
          type: integer
        Created:
          type: string
          format: date-time
        Modified:
          type: string
        BaseRate:
          type: number
          format: double
        LevelId:
          type: integer
        AnnualSalary:
          type: number
          format: double
        JuniorRateId:
          type: integer
        Employee:
          type: object
        PayPointObject:
          type: object
        ContractObject:
          type: object
        SalaryPayRuleObject:
          type: object
        ContractFileObject:
          type: object
        PayPeriodObject:
          type: object
        PayCalendar:
          type: object
        Level:
          type: object
        JuniorRate:
          type: object
      required:
      - Id
      - EmployeeId
      - PayPoint
      - EmpType
      - Active
      - StartDate
      - PayPeriod
      - Modified
    QueryRequest:
      type: object
      description: V1 Resource search payload. All fields optional; an empty body returns the first page of results.
      properties:
        search:
          type: object
          description: Map of search clauses keyed by an arbitrary id (e.g. `s1`, `s2`). Each clause filters one field.
          additionalProperties:
            type: object
            required:
            - field
            - data
            - type
            properties:
              field:
                type: string
                description: Field name to filter on (e.g. `Id`, `Employee`).
              data:
                description: Comparison value. Type depends on the field.
              type:
                type: string
                description: Comparison operator.
                enum:
                - eq
                - ne
                - gt
                - lt
                - ge
                - le
                - is
                - is not
                - in
                - not in
                - starts
                - contains
        sort:
          type: object
          description: Map of field name → `asc` or `desc`.
          additionalProperties:
            type: string
            enum:
            - asc
            - desc
        start:
          type: integer
          minimum: 0
          default: 0
          description: Pagination offset (0-indexed).
        max:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: Max records per page (server caps at 500).
        join:
          type: array
          items:
            type: string
          description: Related ORMs to expand inline (e.g. `["EmployeeObject"]`).
      example:
        search:
          s1:
            field: Id
            data: 1
            type: ge
        max: 100
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token or Deputy Permanent Token.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://once.deputy.com/my/oauth/login
          tokenUrl: https://once.deputy.com/my/oauth/access_token
          scopes:
            longlife_refresh_token: Extended session
