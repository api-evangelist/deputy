openapi: 3.2.0
info:
  title: Deputy V2 Payroll Mobile API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Payroll Mobile
paths:
  /v2/mobile/widgets/payslips/recent:
    get:
      summary: Get widget data
      operationId: PayrollMobileV2Controller_getRecentPayslipsWidget
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentPayslipsWidgetGetRecentPayslipWidgetResponse'
      tags:
      - Payroll Mobile
      description: Get widget data.
components:
  schemas:
    modelGetRecentPayslipWidgetResponseData:
      type: object
      properties:
        showPayslipWidget:
          type: boolean
          title: Show payslip widget
        payHistory:
          $ref: '#/components/schemas/modelPayHistoryData'
          title: Pay history data
    modelPayHistoryData:
      type: object
      properties:
        redirectPath:
          type: string
          title: Redirect path
    RecentPayslipsWidgetGetRecentPayslipWidgetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelGetRecentPayslipWidgetResponseData'
      title: Get widget data response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
