openapi: 3.2.0
info:
  title: Deputy V2 Save Business Setting Config API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Save Business Setting Config
paths:
  /business-setting/v2/setting/save:
    post:
      operationId: BusinessSettingV2Controller_saveConfig
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSettingSaveSettingResponse'
      tags:
      - Save Business Setting Config
      security:
      - APIToken: []
      summary: Save config
      description: Save config.
components:
  schemas:
    BusinessSettingSaveSettingResponse:
      type: object
      properties:
        success:
          type: boolean
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
