openapi: 3.2.0
info:
  title: Deputy V2 Weather API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Weather
paths:
  /v2/weather/location-id/{locationId}/from-date/{fromDate}/to-date/{toDate}/unit/{unit}:
    get:
      summary: Retrieve daily aggregated weather data
      operationId: WeatherV2Controller_getLocationDailyAggregated
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherGetLocationDailyWeatherResponse'
      parameters:
      - name: locationId
        description: location id of the weather data
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: fromDate
        description: from date of the weather data
        in: path
        required: true
        schema:
          type: string
      - name: toDate
        description: to date of the weather data
        in: path
        required: true
        schema:
          type: string
      - name: unit
        description: measurement units E.g. Celcius or Farenheit
        in: path
        required: true
        schema:
          type: string
          enum:
          - DEFAULT_UNIT
          - METRIC
          - IMPERIAL
      tags:
      - Weather
      description: Retrieve daily aggregated weather data.
components:
  schemas:
    v2modelWeather:
      type: object
      properties:
        date:
          type: string
          title: date of the weather data
        icon:
          type: string
          title: weather icon
        temperatureMax:
          type: number
          format: float
          title: max temperature on the day
        temperatureMin:
          type: number
          format: float
          title: min temperature on the day
        apparentTemperatureHigh:
          type: number
          format: float
          title: the weather feels on the day
        temperature:
          type: number
          format: float
          title: the temperature on the day
        summary:
          type: string
          title: overall summary of the day's temperature
    WeatherGetLocationDailyWeatherResponseData:
      type: object
      properties:
        locationId:
          type: integer
          format: int32
          title: location id of the weather data
        fromDate:
          type: string
          title: from date of the weather data
        toDate:
          type: string
          title: to date of the weather data
        unit:
          $ref: '#/components/schemas/WeatherUnit'
          title: measurement units E.g. Celcius or Farenheit
        weatherByDate:
          type: array
          items:
            $ref: '#/components/schemas/v2modelWeather'
          title: list of weather records by each day of requested date range
    WeatherUnit:
      type: string
      enum:
      - DEFAULT_UNIT
      - METRIC
      - IMPERIAL
      default: DEFAULT_UNIT
    WeatherGetLocationDailyWeatherResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/WeatherGetLocationDailyWeatherResponseData'
          title: weather response data
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
