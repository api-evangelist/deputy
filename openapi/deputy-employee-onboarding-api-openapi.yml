openapi: 3.2.0
info:
  title: Deputy V2 Employee Onboarding API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employee Onboarding
paths:
  /employee/v2/hr/onboarding/status:
    get:
      operationId: EmployeeOnboardingV2Controller_listOnboardingStatus
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeOnboardingListOnboardingStatusResponse'
      tags:
      - Employee Onboarding
      security:
      - APIToken: []
      summary: List onboarding status
      description: List onboarding status.
  /management/v2/employees/{employeeId}/hr/onboarding/callback/store-onboarding-id:
    post:
      operationId: EOCallbackV2Controller_StoreOnboardingIdForEmployee
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeOnboardingCallbackStoreOnboardingIdResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Employee Onboarding
      security:
      - APIToken: []
      summary: Store onboarding ID for employee
      description: Store onboarding ID for employee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeOnboardingCallbackStoreOnboardingIdRequestData'
  /employee/v2/hr/onboarding/export:
    post:
      operationId: EmployeeOnboardingExportV2Controller_OnboardingExport
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeOnboardingExportOnboardingExportResponse'
      tags:
      - Employee Onboarding
      security:
      - APIToken: []
      summary: Onboarding export
      description: Onboarding export.
  /employee/v2/hr/onboarding/list-updated-by-date-range:
    post:
      summary: Getting all the employees for selected locations and date range
      operationId: EmployeeOnboardingExportV2Controller_ListEmployeesByDateRange
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeOnboardingExportListEmployeesByDateRangeResponse'
      tags:
      - Employee Onboarding
      security:
      - APIToken: []
      description: Getting all the employees for selected locations and date range.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeOnboardingExportListEmployeesByDateRangeRequestData'
components:
  schemas:
    EmployeeOnboardingListOnboardingStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/modelOnboardingStatus'
    modelOnboardingStatus:
      type: object
      properties:
        employeeId:
          type: string
        onboardingId:
          type: string
        status:
          $ref: '#/components/schemas/v2modelStatus'
    v2modelStatus:
      type: string
      enum:
      - TODO
      - STARTED
      - REVIEW
      - RESET
      - SUBMITTED
      - APPROVED
      - NOT_INITIATED
      default: TODO
    EmployeeOnboardingExportOnboardingExportResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelEmployeeOnboardingExport'
        error:
          type: string
    ListEmployeesByDateRangeResponseOnboardingData:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
        employeeName:
          type: string
        onboardingStatus:
          $ref: '#/components/schemas/v2modelStatus'
        locationId:
          type: integer
          format: int32
        lastModifiedAt:
          type: string
          format: date-time
    v2modelEmployeeOnboardingExport:
      type: object
      properties:
        employeeId:
          type: integer
          format: int32
          title: Employee id
        onboardingId:
          type: string
          title: Onboarding id
        onboardingData:
          type: object
          additionalProperties:
            type: string
          title: Key-value pair for Employee id and corresponding Onboarding data
      title: Employee Onboarding Export
    EmployeeOnboardingExportListEmployeesByDateRangeResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ListEmployeesByDateRangeResponseOnboardingData'
    EmployeeOnboardingCallbackStoreOnboardingIdRequestData:
      type: object
      properties:
        onboardingId:
          type: string
    EmployeeOnboardingExportListEmployeesByDateRangeRequestData:
      type: object
      properties:
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        locationIds:
          type: array
          items:
            type: integer
            format: int32
    EmployeeOnboardingCallbackStoreOnboardingIdResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
