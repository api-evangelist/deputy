openapi: 3.2.0
info:
  title: Deputy V2 Tenant User Referral API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Tenant User Referral API
paths:
  /user/v2/referrals:
    get:
      summary: Returns referral urls
      operationId: ReferralV2Controller_getReferralUrls
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralGetResponse'
      tags:
      - Tenant User Referral API
      description: Returns referral urls.
components:
  schemas:
    ReferralGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/modelReferralResponse'
    modelReferralResponse:
      type: object
      properties:
        urls:
          type: object
          additionalProperties:
            type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
