openapi: 3.2.0
info:
  title: Deputy V2 Employment Contracts API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employment Contracts
paths:
  /management/v2/employment-contracts:
    get:
      summary: List all existing Employment Contracts
      operationId: EmploymentContractsV2Controller_list
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentContractsListResponse'
      tags:
      - Employment Contracts
      description: List all existing Employment Contracts.
    post:
      summary: Create a new Employment Contract
      operationId: EmploymentContractsV2Controller_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentContractsCreateResponse'
      tags:
      - Employment Contracts
      description: Create a new Employment Contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelEmploymentContracts'
  /management/v2/employment-contracts/{id}:
    get:
      summary: Retrieve Employment Contracts by given Id
      operationId: EmploymentContractsV2Controller_get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentContractsGetResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Employment Contracts
      description: Retrieve Employment Contracts by given Id.
    delete:
      summary: Delete a Employment Contracts
      operationId: EmploymentContractsV2Controller_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentContractsDeleteResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Employment Contracts
      description: Delete a Employment Contracts.
    put:
      summary: Update an existing Employment Contracts
      operationId: EmploymentContractsV2Controller_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentContractsUpdateResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Employment Contracts
      description: Update an existing Employment Contracts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2modelEmploymentContracts'
components:
  schemas:
    modelEmploymentBasis:
      type: string
      enum:
      - UNKNOWN_BASIS
      - INDIVIDUAL
      - LABOUR_HIRE
      default: UNKNOWN_BASIS
    EmploymentContractsDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      title: Delete EmploymentContracts response
    EmploymentContractsCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelEmploymentContracts'
      title: Create EmploymentContracts response
    modelPayCycleType:
      type: string
      enum:
      - UNKNOWN_CYCLE
      - WEEKLY
      - FORTNIGHTLY
      - MONTHLY
      - EVERY_3_WEEKS
      - EVERY_4_WEEKS
      - BIMONTHLY
      default: UNKNOWN_CYCLE
    v2employee_contractsmodelEmploymentType:
      type: string
      enum:
      - UNKNOWN_TYPE
      - FULL_TIME
      - PART_TIME
      - CASUAL
      default: UNKNOWN_TYPE
    v2modelEmploymentContracts:
      type: object
      properties:
        id:
          type: integer
          format: int32
          title: Employment Contracts ID
        code:
          type: integer
          format: int32
          title: Code
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        basis:
          $ref: '#/components/schemas/modelEmploymentBasis'
          title: Basis
        category:
          $ref: '#/components/schemas/v2employee_contractsmodelEmploymentCategory'
          title: Category
        type:
          $ref: '#/components/schemas/v2employee_contractsmodelEmploymentType'
          title: Type
        conditionId:
          type: integer
          format: int32
          title: Condition ID
        payCycleType:
          $ref: '#/components/schemas/modelPayCycleType'
          title: Pay Period Type
        basePayRuleId:
          type: integer
          format: int32
          title: Base Pay Rule ID
        isStrictLeaveApproval:
          type: boolean
          title: Is Strict Leave Approval
        startAt:
          type: string
          format: date-time
          title: Employment Contracts start date and time
        endAt:
          type: string
          format: date-time
          title: Employment Contracts start date and time
        createdById:
          type: integer
          format: int32
          title: Employee ID of who created the Employment Contracts
        createdAt:
          type: string
          format: date-time
          title: Timestamp when the Employment Contracts was created
        modifiedAt:
          type: string
          format: date-time
          title: Timestamp when the Employment Contracts was modified
      title: Employment Contracts
    v2employee_contractsmodelEmploymentCategory:
      type: string
      enum:
      - UNKNOWN_CATEGORY
      - PERMANENT
      - TEMPORARY
      default: UNKNOWN_CATEGORY
    EmploymentContractsUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelEmploymentContracts'
      title: Update EmploymentContracts response
    EmploymentContractsListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/v2modelEmploymentContracts'
      title: List EmploymentContracts response
    EmploymentContractsGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelEmploymentContracts'
      title: Get  EmploymentContracts response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
