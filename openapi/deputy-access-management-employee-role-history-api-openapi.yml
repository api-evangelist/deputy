openapi: 3.2.0
info:
  title: Deputy V2 Access Management Employee Role History API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Access Management Employee Role History
paths:
  /access-management/v2/roles/{roleId}/history:
    get:
      operationId: AccessManagementV2Controller_ListEmployeeRoleHistory
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementListEmployeeRoleHistoryResponse'
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      tags:
      - Access Management Employee Role History
      security:
      - APIToken: []
      summary: List employee role history
      description: List employee role history.
components:
  schemas:
    AccessManagementListEmployeeRoleHistoryResponse:
      type: object
      properties:
        success:
          type: boolean
        changes:
          type: array
          items:
            $ref: '#/components/schemas/modelEmployeeRoleHistory'
      title: Response to list the history of an employee role
    EmployeeRoleHistoryEmployeeRoleHistoryValue:
      type: object
      properties:
        title:
          type: string
          title: The title of the value.  Only populated for multi-valued fields (i.e. alsoReportsTo and privileges)
        oldValue:
          type: string
          title: The old value of the field
        newValue:
          type: string
          title: The new value of the field
    EmployeeRoleHistoryFIELD_NAME:
      type: string
      enum:
      - FIELD_NAME_UNSPECIFIED
      - NAME
      - REQUIRE_2FA
      - REPORTS_TO
      - ALSO_REPORTS_TO
      - PRIVILEGES
      default: FIELD_NAME_UNSPECIFIED
      title: The field that was changed
    tenantauthv2modelEmployee:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Employee ID
        displayName:
          type: string
          title: Employee display name
        primaryLocation:
          $ref: '#/components/schemas/tenantauthv2modelEmployeeLocation'
          title: Primary Location
      title: Employee with basic information
    modelEmployeeRoleHistory:
      type: object
      properties:
        changedAt:
          type: string
          format: date-time
          title: The time that the change was made
        changedBy:
          $ref: '#/components/schemas/tenantauthv2modelEmployee'
          title: The employee that made the change
        fieldName:
          $ref: '#/components/schemas/EmployeeRoleHistoryFIELD_NAME'
          title: The field that was changed
        values:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeRoleHistoryEmployeeRoleHistoryValue'
          title: The values that were changed
    tenantauthv2modelEmployeeLocation:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Location ID
        name:
          type: string
          title: Location name
      title: Primary location information
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
