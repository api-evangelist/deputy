openapi: 3.2.0
info:
  title: Deputy V2 Access Management Employee API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Access Management Employee
paths:
  /access-management/v2/roles/{roleId}/employees:
    get:
      summary: Get team members by role
      operationId: AccessManagementV2Controller_ListEmployeeByRole
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessManagementListEmployeeByRoleResponse'
      parameters:
      - name: roleId
        description: Role ID
        in: path
        required: true
        schema:
          type: string
          format: int64
      - name: displayName
        description: Optional search by display name.
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: 'Optional limit for pagination (default: 20, limit: 100).'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: offset
        description: 'Optional offset for pagination (default: 0).'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Access Management Employee
      security:
      - APIToken: []
      description: Get team members by role.
components:
  schemas:
    tenantauthv2modelEmployeeLocation:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Location ID
        name:
          type: string
          title: Location name
      title: Primary location information
    AccessManagementListEmployeeByRoleResponse:
      type: object
      properties:
        success:
          type: boolean
        employees:
          type: array
          items:
            $ref: '#/components/schemas/tenantauthv2modelEmployee'
        total:
          type: integer
          format: int32
      title: Response for getting employees by role
    tenantauthv2modelEmployee:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Employee ID
        displayName:
          type: string
          title: Employee display name
        primaryLocation:
          $ref: '#/components/schemas/tenantauthv2modelEmployeeLocation'
          title: Primary Location
      title: Employee with basic information
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
