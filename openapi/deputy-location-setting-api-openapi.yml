openapi: 3.2.0
info:
  title: Deputy V2 Location Setting API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Location Setting
paths:
  /management/v2/locations/settings:fetch:
    post:
      summary: Retrieve list of location setting
      operationId: LocationSettingV2Controller_fetch
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSettingFetchResponse'
      tags:
      - Location Setting
      description: Retrieve list of location setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationSettingFetchRequestData'
  /management/v2/locations/settings:fetchKeyValue:
    post:
      summary: Retrieve list of location setting lite version
      operationId: LocationSettingV2Controller_fetchKeyValue
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSettingKeyValueFetchResponse'
      tags:
      - Location Setting
      description: Retrieve list of location setting lite version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationSettingKeyValueFetchRequestData'
components:
  schemas:
    LocationSettingKeyValueFetchResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LocationSettingKeyValueFetchResponseListSetting'
        success:
          type: boolean
      title: Get list of location setting response
    LocationSettingFetchRequestData:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int32
        keys:
          type: array
          items:
            type: string
        shiftIds:
          type: array
          items:
            type: integer
            format: int32
          description: 'Optional shift IDs for context-based filtering. When provided, can be used to apply

            permission bypass logic for cross-location shifts or open shift invitations.'
    v2modelLocationSettingKeyValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    v2modelLocationSetting:
      type: object
      properties:
        id:
          type: integer
          format: int32
        key:
          type: string
        title:
          type: string
        value:
          type: string
        category:
          type: integer
          format: int32
        type:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        displayFunc:
          type: string
        flags:
          type: integer
          format: int32
        helpText:
          type: string
        helpTextUser:
          type: string
        modifiedAt:
          type: string
    LocationSettingFetchResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LocationSettingFetchResponseListSetting'
        success:
          type: boolean
      title: Get list of location setting response
    LocationSettingKeyValueFetchResponseListSetting:
      type: object
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/v2modelLocationSettingKeyValue'
    LocationSettingFetchResponseListSetting:
      type: object
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/v2modelLocationSetting'
    LocationSettingKeyValueFetchRequestData:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int32
        keys:
          type: array
          items:
            type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
