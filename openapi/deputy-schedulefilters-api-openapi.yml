openapi: 3.2.0
info:
  title: Deputy V2 Schedule Filters API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: ScheduleFilters
paths:
  /schedule/v2/components/filters:
    post:
      summary: Get a list of all available schedule filters for locations and areas
      operationId: ScheduleFiltersV2Controller_getScheduleFilters
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleFiltersResponse'
      tags:
      - ScheduleFilters
      description: Get a list of all available schedule filters for locations and areas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleFiltersRequest'
components:
  schemas:
    ScheduleFiltersData:
      type: object
      properties:
        employmentTypes:
          type: array
          items:
            $ref: '#/components/schemas/modelfiltersEmploymentType'
        trainings:
          type: array
          items:
            $ref: '#/components/schemas/filtersTraining'
        stressProfiles:
          type: array
          items:
            $ref: '#/components/schemas/modelfiltersStressProfile'
        payRates:
          type: array
          items:
            $ref: '#/components/schemas/filtersPayRate'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/filtersAccessLevel'
        primaryLocations:
          type: array
          items:
            $ref: '#/components/schemas/filtersPrimaryLocation'
    modelfiltersStressProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    ScheduleFiltersRequest:
      type: object
      properties:
        locationIds:
          type: array
          items:
            type: integer
            format: int32
          description: Array of location IDs to filter by.
        areaIds:
          type: array
          items:
            type: integer
            format: int32
          description: Array of area IDs to filter by.
    modelfiltersEmploymentType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    filtersPayRate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    ScheduleFiltersResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ScheduleFiltersData'
    filtersTraining:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    filtersAccessLevel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      title: Role already defined in role.proto
    filtersPrimaryLocation:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
