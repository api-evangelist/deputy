openapi: 3.2.0
info:
  title: Deputy V2 Employee Standard Day API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: Employee Standard Day
paths:
  /management/v2/employees/{employeeId}/standard-day:
    get:
      operationId: EmployeeStandardDayHoursV2Controller_getEmployeeStandardDayHours
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeStandardDayGetResponse'
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Employee Standard Day
      summary: Get employee standard day hours
      description: Get employee standard day hours.
components:
  schemas:
    modelEmployeeStandardDayStandardDayCalculationMethod:
      type: string
      enum:
      - UNKNOWN_METHOD
      - AGREED_HOURS
      - DEFAULT_SHIFT
      - REFERENCE_PERIOD
      - LOCATION_DEFAULT_SHIFT
      - EMPLOYMENT_CONDITION
      - PER_EMPLOYEE_STANDARD_DAY
      default: UNKNOWN_METHOD
      title: Possible calculation methods
    v2modelEmployeeStandardDay:
      type: object
      properties:
        standardDayHours:
          type: number
          format: float
          title: Employee standard day hours
        standardDayCalcMethod:
          $ref: '#/components/schemas/modelEmployeeStandardDayStandardDayCalculationMethod'
          title: Standard day hours calculation method
        defaultStandardDayHours:
          type: number
          format: float
          title: The default value for standard day hours
    EmployeeStandardDayGetResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/v2modelEmployeeStandardDay'
      title: Get an employee standard day hours response
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
