openapi: 3.2.0
info:
  title: Deputy V2 People API
  version: '1.0'
  description: Filtered to publicly-authenticated routes only (APIAuthenticator). Scoped-OAuth routes and internal JWT routes are excluded — see the separate "Deputy V2 Scoped API" spec for scoped endpoints.
servers:
- url: https://{subdomain}.{region}.deputy.com/api
  description: Deputy tenant
  variables:
    subdomain:
      default: your-subdomain
      description: Your Deputy tenant subdomain
    region:
      default: deputy
      enum:
      - au
      - eu
      - na
      - deputy
      description: 'Deputy region: au, eu, na, or deputy (AU default)'
security:
- ApiToken: []
tags:
- name: People
paths:
  /v2/people/companies:
    get:
      summary: Get a list of Companies
      operationId: PeopleV2Controller_listCompanies
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleListCompaniesResponse'
      tags:
      - People
      description: Get a list of Companies.
  /v2/people/contracts:
    get:
      summary: Get a list of Contracts used within a Company
      operationId: PeopleV2Controller_listContracts
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleListContractsResponse'
      tags:
      - People
      description: Get a list of Contracts used within a Company.
components:
  schemas:
    PeopleCompany:
      type: object
      properties:
        Id:
          type: integer
          format: int32
        Portfolio:
          type: integer
          format: int32
        Code:
          type: string
        Active:
          type: boolean
        ParentCompany:
          type: integer
          format: int32
        CompanyName:
          type: string
        TradingName:
          type: string
        BusinessNumber:
          type: string
        CompanyNumber:
          type: string
        IsWorkplace:
          type: boolean
        IsPayrollEntity:
          type: boolean
        PayrollExportCode:
          type: string
        Address:
          type: integer
          format: int32
        Contact:
          type: integer
          format: int32
        Creator:
          type: integer
          format: int32
        Created:
          type: string
        Modified:
          type: string
    PeopleListContractsResponse:
      type: object
      properties:
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/PeopleContract'
    PeopleListCompaniesResponse:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/PeopleCompany'
    PeopleContract:
      type: object
      properties:
        Id:
          type: integer
          format: int32
        Code:
          type: string
        Name:
          type: string
        BasePayRule:
          type: integer
          format: int32
        Description:
          type: string
        EmploymentBasis:
          type: integer
          format: int32
        EmploymentCategory:
          type: integer
          format: int32
        EmploymentStatus:
          type: integer
          format: int32
        EmploymentCondition:
          type: integer
          format: int32
        StressProfile:
          type: integer
          format: int32
        StartDate:
          type: string
        EndDate:
          type: string
        PeriodType:
          type: integer
          format: int32
        File:
          type: integer
          format: int32
        StrictLeaveApproval:
          type: boolean
        Award:
          type: string
        EmploymentSubType:
          type: string
        AwardStartDate:
          type: string
        Creator:
          type: integer
          format: int32
        Created:
          type: string
        Modified:
          type: string
        PpId:
          type: string
        CountryId:
          type: integer
          format: int32
        ContractStatus:
          type: integer
          format: int32
        IsSalaryContract:
          type: boolean
        IsPayPolicy:
          type: boolean
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: OAuth
    JWTInternalToken:
      type: apiKey
      in: header
      name: Bearer
