aid: deputy

name: Deputy

description: Deputy is an API-first workforce management platform that handles employee scheduling, time and attendance tracking, timesheets,
  leave management, task delegation, and team communications for businesses with hourly workers. The platform integrates with payroll, HR, and
  point of sale systems and exposes most of its product surface area via a public REST API. The Deputy API uses OAuth 2.0 or permanent token authentication
  and provides JSON endpoints for employees, schedules, timesheets, locations, sales metrics, and more.

