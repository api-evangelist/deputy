  name: Deputy Public API
  description: REST API for managing employees, schedules, timesheets, locations, leave, tasks, and sales metrics in the Deputy workforce management
    platform. Authentication is handled via OAuth 2.0 or a permanent access token, with most endpoints living under /api/v1 and a few newer endpoints
    under /api/v2 on the customer's install subdomain.
